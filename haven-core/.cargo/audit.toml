# cargo-audit configuration
#
# Documents non-blocking RUSTSEC informational warnings (unmaintained / unsound)
# and upstream-pinned advisories in COMPILED-BUT-UNREACHED transitive crates.
# cargo-audit treats these as errors/warnings by default; ignoring them here keeps
# the CI log focused on actionable findings and forces us to revisit each one when
# bumping the upstream pin.
#
# Each ignore MUST cite: (1) why it is acceptable today, (2) what would lift it.
# Re-evaluate on every upstream bump (mdk, nostr-sdk, openmls, hpke-rs).
# cargo-audit ignores never expire, so each id also has an entry in the ledger,
# /osv-scanner.toml, carrying its owner decision and expiry
# (scripts/ci/check_ledger.sh fails an ignore without one).

[advisories]
ignore = [
  # ── Pre-existing (unchanged) ─────────────────────────────────────────────
  # Unmaintained: `instant` 0.1.x.
  # Reachable via: nostr 0.44.x ← nostr-sdk 0.44.1 ← haven-core
  # Risk: none today (instant is a thin wrapper around std::time + js-sys; no CVE).
  # Lift when: nostr-sdk drops the `instant` dependency, or we bump to the
  # successor crate (`web-time`) via an upstream MDK/nostr-sdk release.
  "RUSTSEC-2024-0384",

  # Unsound: `rand` 0.8 / 0.9 / 0.10 — `rand::rng()` is unsound when the user
  # installs a `log::Log` implementation that itself calls `rand::rng()`.
  # Reachable via: secp256k1, tungstenite, proptest, hpke-rs-libcrux.
  # Risk: none in Haven — our logger forwards to flutter_rust_bridge and never
  # invokes rand. Confirmed by code review during 2026-05-10 CI fix.
  # Lift when: rand 0.8/0.9/0.10 ship a fix, OR we audit and move all transitive
  # dependents to a fixed major.
  "RUSTSEC-2026-0097",

  # ── MDK v0.10.4 chain: no semver-compatible fix ───────────────────────────
  # Timing variability in crypto-bigint 0.5.5 (fixed only in 0.7.6, a major
  # that elliptic-curve 0.13's `^0.5` cannot select; `cargo update -p
  # crypto-bigint` locks 0 packages). Compiled under k256/p256/p384 0.13, pulled
  # by cgka-engine (k256 `schnorr`), openmls_basic_credential / openmls_rust_crypto
  # (p256, p384) and hpke-rs-rust-crypto (all three); no Haven crate names them
  # (Haven's secp256k1 keys sign through libsecp256k1, `nostr::secp256k1`).
  # Risk: none in the shipped build — no secret reaches these curves. cgka-engine
  # accepts only ciphersuite 0x0001 (engine.rs `UnsupportedCiphersuite`), so the
  # MLS signature key is Ed25519 (ed25519-dalek) and HPKE is X25519
  # (x25519-dalek); its one non-test k256 call is `schnorr::VerifyingKey::
  # from_bytes` on a peer's PUBLIC credential identity (identity.rs). At most a
  # peer's foreign-ciphersuite KeyPackage has its signature verified (public
  # key, public bytes) before key_package.rs refuses it. haven-logscan's k256 derives CI-only E2E test
  # identities on the CI host and never ships.
  # Lift when: MDK/openmls/hpke-rs move to elliptic-curve 0.14 (crypto-bigint
  # ≥0.7.6). MUST RE-AUDIT if MDK admits a P-256/P-384/secp256k1 ciphersuite or
  # signs with k256 outside tests — either puts a secret scalar on this path.
  "RUSTSEC-2026-0387",

  # libcrux-kem 0.0.9 short-seed / short-key decode panics (fixed 0.0.10).
  # In the lockfile only: hpke-rs 0.7.0 declares `hpke-rs-libcrux` (which pins
  # `libcrux-kem = "=0.0.9"`) as an optional dep behind its `libcrux` feature,
  # and Cargo locks an optional dep named by a weak feature (`hpke-rs-libcrux?/std`)
  # even when nothing enables it. Nothing does: `cargo tree --target all
  # --all-features -i hpke-rs-libcrux` prints nothing in haven-core, rust_builder
  # or soak, and cgka-engine's only OpenMLS provider is
  # `openmls_rust_crypto::RustCrypto` (provider.rs). NOT COMPILED, so unreachable.
  # Lift when: hpke-rs ships a release pinning libcrux-kem ≥0.0.10. MUST
  # RE-AUDIT if anything enables hpke-rs `libcrux` or MDK changes provider.
  "RUSTSEC-2026-0330",
  "RUSTSEC-2026-0331",
]
