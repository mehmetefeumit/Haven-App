[package]
name = "haven-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Haven - private family location sharing"
license = "MIT"

[lib]
crate-type = ["lib"]

[features]
default = []
# Enables test-only MLS storage construction (in-memory SQLCipher). DO NOT use
# in production. The Dark Matter `storage-sqlite` crate exposes
# `SqliteAccountStorage::in_memory()` as a public, un-gated constructor, so this
# feature no longer forwards to any upstream crate feature (the old
# `mdk-sqlite-storage/test-utils` is gone) — it is now a Haven-local marker that
# gates `StorageConfig::in_memory_storage()` and the two-party in-memory session
# fixtures the integration tests build on it. It also builds the scripted
# relay the forged-event tests of this crate, the FFI crate and the soak rig
# share (`relay::scripted_relay`), which is the one thing it pulls in.
test-utils = ["dep:tokio-tungstenite"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Location
geohash = "0.13"
chrono = { version = "0.4", features = ["serde"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Logging (forwarded to Flutter via flutter_rust_bridge on mobile)
log = "0.4"

# Error handling
thiserror = "2.0"

# Nostr protocol
nostr = { version = "0.44", features = ["std", "nip44"] }

# Marmot "Dark Matter" MLS stack (MDK v0.10.4, marmot-protocol/mdk).
#
# The CGKA engine (`cgka-engine`) drives an `AccountDeviceSession`
# (`cgka-session`) over SQLCipher storage (`storage-sqlite`); shared value types
# and traits live in `cgka-traits` (package `cgka-traits`, directory
# `crates/traits`); the Nostr kind-445/1059 outer-layer crypto and welcome
# gift-wrap live in `transport-nostr-peeler`; the kind-30443 KeyPackage event
# template and the classified one-relay publish (`NostrSdkRelayClient`) live in
# `transport-nostr-adapter`. Haven keeps its own relay /
# subscription / cursor plane, and `marmot-account` / `marmot-app` /
# `marmot-uniffi` are rejected (keyring / full-runtime / FFI overlap).
# `marmot-forensics` enters the graph because `cgka-session` and `cgka-engine`
# require it; no recorder is ever installed (`check_no_forensic_recorder.sh`).
#
# Pinned to the RELEASED tag v0.10.4 (`fcc85edd…`), never a master HEAD: the
# monorepo is `publish = false` and self-describes as "not semver-stable", so a
# released tag is the only acceptable supply-chain anchor. All six crates share
# ONE rev so the workspace resolves as a unit; the rev lives in
# `scripts/ci/mdk_pins.env` and `check_mdk_supply_chain.sh` /
# `check_lockfile_universe.sh` hold every Cargo root to it. OpenMLS is NOT
# declared as a production dependency: MDK pins a fork
# (`erskingardner/openmls@59e7d3b…`), and a registry openmls beside it would be
# a second MLS type universe. KeyPackage lifetimes are read from MDK's
# `KeyPackageMetadata` (`relay::maintenance::kp_lifetime`).
cgka-session = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
# `sdk` is the adapter's only feature: `NostrSdkRelayClient`, MDK's classified
# publish over a `nostr_sdk::Client` it is handed and never builds. Haven hands
# it the publish client (`RelayManager::fanout_transport`, Security Rule 16).
transport-nostr-adapter = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897", features = ["sdk"] }

# Keyring (system credential store) — declared directly so `keyring_policy` and
# the MLS storage layer (`nostr::mls::storage`) can provision the SQLCipher
# passphrase and migrate the DB-key access policy on iOS. The Dark Matter stack
# does NOT depend on keyring-core (only the rejected `marmot-account` /
# `marmot-uniffi` crates do), so this pin is now fully Haven-owned; the 1.0 bump
# is deliberately NOT required. Kept at 0.7 so it stays ONE crate instance with
# the platform store installed in rust_builder; `cargo tree -i keyring-core`
# confirms a single version.
keyring-core = "0.7"

# SQLite for local storage (circles-v2.db, tiles-v2.db, and — via
# storage-sqlite — the MLS session-v2.sqlite). libsqlite3-sys is a
# `links = "sqlite3"` crate, so exactly ONE version may exist in the graph; it
# comes from MDK's `[patch.crates-io]` git rev (SQLCipher 4.17, tracked
# exception T-LIBSQLITE-PATCH). The patch below only applies when this crate's
# requirements name the exact patched versions, hence the `=` pins; every
# Cargo root that builds haven-core repeats the `[patch]` (the roots are listed
# in scripts/ci/mdk_pins.env), because a patch is never inherited through a
# path dependency.
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }

# SQLCipher requires OpenSSL. For Android cross-compilation, we must bundle OpenSSL
# since Android NDK doesn't include OpenSSL headers.
libsqlite3-sys = { version = "=0.38.1", features = ["bundled-sqlcipher-vendored-openssl"] }

# Async runtime (required by MDK)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "time"] }

# `cgka_traits::peeler::TransportPeeler` is declared with `#[async_trait]`, so
# Haven's own implementation of it (`nostr::mls::retention`) must desugar the
# same way. Already resolved at 0.1.x through cgka-traits, so naming it here
# unifies rather than widening the dependency graph (check_mdk_supply_chain.sh).
async-trait = "0.1"

# Nostr relay communication
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44", "nip59"] }

# Blossom (BUD-02/BUD-11) profile-picture upload + download are hand-rolled over
# `reqwest` directly (see `src/profile/blossom.rs`). The `nostr-blossom` crate
# was dropped: its `upload_blob` accepts only HTTP 200 and rejects the `201
# Created` a spec-compliant server returns for a NEW blob (BUD-02), which broke
# fresh uploads. Hand-rolling the BUD-02 PUT + BUD-11 kind-24242 auth (the
# migration plan's D9 contingency) removes that foot-gun and shrinks the
# dependency surface. The auth event is built with the pinned `nostr` crate and
# STANDARD base64 (the encoding deployed servers accept).

# Direct reqwest for the capped, streaming, anti-SSRF profile-picture UPLOAD +
# DOWNLOAD. `default-features = false` + `rustls-tls` + `stream` keeps the rustls
# 0.23 + ring + webpki-roots stack haven-core already ships — zero `aws-lc-*`
# (the NDK cross-compile trap). Do NOT move to reqwest 0.13 / rustls-no-provider
# — it would fork the TLS backend. Verify with `cargo tree -i reqwest` / `-i
# rustls` and `grep -c aws-lc Cargo.lock` after any bump.
reqwest = { version = "=0.12", default-features = false, features = ["rustls-tls", "stream"] }

# URL parsing/validation for the Blossom upload server + picture-download paths.
# Re-exported by `nostr` (`nostr::Url == url::Url`), declared directly so the
# profile module can name `url::Url` in its public signatures and Wave 3 (FFI)
# can construct one. Unifies with nostr's `url` (2.5) — no new transitive stack,
# no aws-lc.
url = "2"

# Async utilities
futures = "0.3"

# The server half of `relay::scripted_relay`, compiled only with `test-utils`
# (never in a shipped build: that feature is a compile error without debug
# assertions). Already in the graph at 0.26 through nostr-relay-pool's
# async-wsocket: zero new crates.
tokio-tungstenite = { version = "0.26", optional = true, default-features = false, features = ["handshake"] }

# Unicode text handling for the member directory (`src/directory`): NFKD +
# combining-mark detection for the search fold, grapheme-cluster segmentation
# for the display sanitizer's length cap.
#
# `unicode-normalization` already resolves at 0.1.25 through `nostr 0.44.7`
# (`cargo tree -i unicode-normalization`), so naming it here unifies rather than
# widening the dependency graph — same posture as `hmac` / `async-trait`.
#
# `unicode-segmentation` is a genuine ADDITION, and the only one this work
# makes. It carries no dependencies of its own and comes from the same
# maintainers as `unicode-normalization`. It is here because a display name is
# capped in GRAPHEME CLUSTERS, not chars: `char`-counting splits a flag emoji
# between its two regional indicators and a Devanagari conjunct from its
# matra, and there is no correct hand-rolled shortcut — UAX #29 needs the
# Extend / Prepend / SpacingMark / Regional_Indicator / Extended_Pictographic
# tables, which is precisely what this crate is. Neither
# `unicode-normalization` nor `std` segments.
#
# General categories are deliberately NOT taken from a crate: see
# `src/directory/format_chars.rs` for why the `Cf` table is spelled out.
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

# Secure memory handling
zeroize = { version = "1.8", features = ["derive"] }

# Constant-time comparisons (for timing attack prevention)
subtle = "2.5"

# Cryptography
rand = "0.8"
sha2 = "0.10"
# Keyed PRF for the profile-plane relay assignment (HMAC-SHA256 rendezvous
# weights, `profile::assignment`). Already present transitively at 0.12.1 via
# openmls_rust_crypto / hkdf / pbkdf2, so naming it here unifies rather than
# widening the dependency graph (check_mdk_supply_chain.sh).
hmac = "0.12"

# NOTE: the direct `chacha20poly1305` dependency was removed in DM-2. Its only
# Haven consumer was the legacy REV-1 non-destructive content-type peek
# (`nostr::mls::peek_crypto`), which the Dark Matter peeler's public
# `peel_group_message` supersedes; that module is deleted. The kind-445
# outer-layer AEAD now lives entirely inside `transport-nostr-peeler`, which
# still pulls `chacha20poly1305` transitively on the workspace `0.10` line
# (`cargo tree -i chacha20poly1305` must still show a single version).

# Image processing (avatar pipeline: decode/strip/downscale/re-encode).
#
# The Dark Matter MLS stack has NO `image` dependency (unlike the old mdk-core,
# which pulled `image` with `["jpeg","png","webp","gif"]` and forced the `gif`
# codec in via feature unification). `image` is now Haven's OWN dependency with a
# minimal codec set. The decode-bomb defense does NOT rely on codec feature
# gating (an upstream could still re-enable codecs through unification): it rests
# on (a) an explicit pre-decode byte-size cap and (b) an explicit format
# allowlist enforced in `avatar::image` BEFORE any bytes reach the decoder.
# `default-features = false` drops `rayon` and the heavier avif/exr codecs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
# HTTP mocking for the Blossom upload/download unit tests (M6, next wave).
mockito = "1.2"
# A loopback TLS server for the one Blossom test that proves no TLS session
# of one request is resumed by the next (`no_tls_session_outlives_its_request`).
# The versions and the ring provider haven-core already ships through reqwest;
# no default features, so no `aws-lc-*` enters the lockfile. Dev-only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The key that server's certificate is signed with, made when the test runs:
# no private key is committed (`check_no_committed_secrets.sh`). The ring
# rustls already locks. Dev-only.
ring = { version = "0.17", default-features = false, features = ["alloc"] }
# Property-based testing
proptest = "1.5"
# Temporary directories for tests
tempfile = "3.10"
# EXIF parser — used ONLY in avatar tests to assert that the re-encode
# pipeline structurally strips all EXIF/GPS metadata (and as a positive
# control that the crafted test input *does* carry EXIF before stripping).
kamadak-exif = "0.5"
# In-process Nostr relay for hermetic live-sync engine integration tests
# (proves the persistent receive engine connects, subscribes, receives, routes,
# and processes real `kind:445` events over a real socket). Dev-only.
nostr-relay-builder = "0.44"
# `#[tokio::test]` (the lib's tokio omits `macros`) + a publisher `Client` for
# the live-sync engine integration test. `net`/`io-util` are for the catch-up
# tests' TCP front doors (`ColdFirstConnect`): both reach the test binary anyway
# — `net` via feature unification with the lib, `io-util` transitively through
# nostr-sdk — so they are declared here to say so, not to add anything. An
# undeclared feature that arrives by unification disappears without warning the
# day a dependency stops asking for it. `test-util` is what `start_paused = true`
# needs: a timing assertion measured against a live socket races the handshake,
# so every one of them runs on pure futures under a paused clock instead.
# Dev-only.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "test-util",
] }
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44", "nip59"] }
# OpenMLS itself, for the tests that need what no MDK API exposes:
# `ratchet_forward_distance_e2e` drives a group directly (the sender-ratchet
# exhaustion boundary cannot be walked through the engine's send path, which
# re-scans every retained message per send, so 1000 sends is quadratic, and no
# MDK API exposes a signer), and the KeyPackage tests build packages off the
# engine's path (`kp_pre_migration_profile`, `kp_lifecycle_e2e`,
# `helpers/twin_key_packages.rs`). The exact fork rev and features MDK's
# workspace pins, so the dev graph stays ONE MLS universe with the engine's
# (`check_lockfile_universe.sh`); dev-only, so it never ships.
openmls = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
openmls_rust_crypto = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_basic_credential = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
# A bare WebSocket relay for `relay_pool_expiry_drop_point`, which must serve an
# expired event (NIP-40 relays and `nostr-relay-builder` refuse to). Already in
# the graph at 0.26 via `nostr-relay-pool`'s async-wsocket: zero new crates.
# `handshake` is the server-side accept, declared rather than inherited.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Enable test-utils feature for integration tests
haven-core = { path = ".", features = ["test-utils"] }

# MDK's SQLCipher 4.17 amalgamation (`mdk/Cargo.toml` `[patch.crates-io]`),
# repeated here because a git dependent never inherits its patches. Tracked
# exception T-LIBSQLITE-PATCH; removed when a crates.io libsqlite3-sys carries
# SQLCipher >= 4.17 and MDK drops its patch.
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "5ae7fdf83085c595fd54f977b3a56ccacabaf16b" }

# SQLCipher's C code and the MLS crypto would otherwise run at -O0 under every
# test; haven-core itself stays at the dev opt-level, so coverage is unaffected.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Not `assert_eq!`: it prints the collection on failure, and a panic names no
# identifier (Security Rule 15).
assert_is_empty = "allow"

# Coverage Configuration
# Run coverage locally with:
#   cargo install cargo-llvm-cov  (one-time setup)
#   cargo llvm-cov --open         (run tests + view HTML report)
#   cargo llvm-cov --lcov         (generate lcov.info for CI/tools)
# CI enforces 80% minimum line coverage
