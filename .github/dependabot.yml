# Dependabot configuration for Haven.
#
# Encodes the project's "sweet-spot" dependency policy:
#   - security advisories: 0-day cooldown (bypass)
#   - patch (z): 7-day cooldown
#   - minor (y): 14-day cooldown
#   - major (X): 30-day cooldown + manual review (we do not auto-merge majors)
#
# Rationale: balances inheriting security fixes against day-zero supply-chain
# risk. Aligned with Snyk's 21-day default and Datadog's 7-day floor; both
# would have blocked the major 2024-2025 supply-chain incidents (axios, s1ngularity).
#
# Major-version PRs are intentionally allowed but grouped separately; humans must
# read changelogs (especially for crypto/MLS-adjacent crates) before merging.
#
# Every pull request runs the whole CI suite (~66 jobs). On 2026-11-22 every
# ecosystem opened at once — about 45 pull requests in six minutes — and the
# queue starved for most of a day. So each ecosystem runs on its own weekday,
# and none holds more than five pull requests open; what must move together is
# grouped into one pull request, and a bump that needs code Dependabot cannot
# write (a migration, a regenerated table or bridge) is ignored until a human
# does it. Dependabot's `ignore` also holds back security updates for what it
# names; dependency-audit (audit.yml) still reports every advisory against them.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust: every Cargo root, in one entry so a group spans them all.
  # haven/rust_builder's lockfile is the resolution that SHIPS inside the app;
  # the tooling crates run on every E2E and soak lane. rust_builder and
  # tooling/soak path-depend on haven-core, tooling/logscan and
  # tooling/e2e/local-relay, and Dependabot re-locks only the directories it
  # bumps: dependabot-lockfile-sync.yml re-locks the rest on the pull request.
  # The crates check_lockfile_universe.sh holds to haven-core's exact source
  # (MDK, OpenMLS, SQLCipher, nostr) move only with a deliberate MDK bump in
  # scripts/ci/mdk_pins.env; auto-PRs would conflict with the pin.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directories:
      - "/haven-core"
      - "/haven/rust_builder"
      - "/tooling/soak"
      - "/tooling/logscan"
      - "/tooling/e2e/local-relay"
      - "/tooling/e2e/local-blossom"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
      # Security advisories always bypass cooldown — no entry needed; this is
      # Dependabot's documented default behavior for `security-updates`.
    # A dependency joins the FIRST group it matches, so the groups that must
    # move as one come before the catch-alls.
    groups:
      # The credential store: rust_builder installs the platform store that
      # haven-core's keyring_policy reads through keyring-core, so the stores
      # and the core move together.
      keyring-stack:
        applies-to: version-updates
        patterns:
          - "keyring-core"
          - "*-native-keyring-store"
          - "zbus-secret-service-keyring-store"
        update-types: ["minor", "patch"]
      # RustCrypto's hash traits: sha2, hmac and digest share `digest`'s
      # major, so one alone does not compile against the others.
      rustcrypto-hashes:
        applies-to: version-updates
        patterns:
          - "sha2"
          - "hmac"
          - "digest"
        update-types: ["minor", "patch"]
      # NEVER in a patch group: haven-core's invisible-character table is
      # enumerated by hand from one Unicode release, and
      # `the_table_is_re_enumerated_when_the_unicode_data_moves`
      # (haven-core/src/directory/invisible.rs) fails until a human re-derives
      # it on this pull request when either crate moves to a new release.
      unicode-data:
        applies-to: version-updates
        patterns:
          - "unicode-normalization"
          - "unicode-segmentation"
      # Patch updates can land together — low review burden.
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      # Minor updates grouped per ecosystem area for focused review.
      crypto-and-protocol:
        applies-to: version-updates
        patterns:
          - "mdk-*"
          - "nostr*"
          - "openmls*"
          - "rustls*"
          - "rustls-webpki"
          - "ring"
          - "hpke-rs*"
          - "libcrux*"
          - "zeroize*"
          - "subtle"
          - "secp256k1*"
        update-types: ["minor", "patch"]
      # Whatever no group above takes: one pull request per dependency across
      # every root that declares it, not one per root (tokio arrived as four
      # on 2026-11-22).
      by-dependency:
        applies-to: version-updates
        group-by: dependency-name
    ignore:
      - dependency-name: "rusqlite"
      - dependency-name: "libsqlite3-sys"
      - dependency-name: "nostr*"
      - dependency-name: "openmls*"
      - dependency-name: "cgka-*"
      - dependency-name: "storage-sqlite"
      - dependency-name: "transport-nostr-*"
      # Majors that need a code migration Dependabot cannot write: ignored
      # until a human migrates them. Remove an entry once its migration lands.
      #   keyring 1.x: the store constructors and CredentialStoreApi changed
      #     (android `Store::from_ndk_context` is gone; rust_builder/src/api.rs).
      - dependency-name: "keyring-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*-native-keyring-store"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zbus-secret-service-keyring-store"
        update-types: ["version-update:semver-major"]
      #   sha2 0.11 / hmac 0.13 / digest 0.11: openmls and hkdf still pin
      #     hmac 0.12, and the new traits need call-site changes.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major"]
      - dependency-name: "digest"
        update-types: ["version-update:semver-major"]
      #   rand 0.10: `rand::rngs::OsRng`, which haven-core seeds from, moved.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      #   k256 0.14: `PublicKey::to_encoded_point` is gone
      #     (tooling/logscan/src/seed.rs).
      - dependency-name: "k256"
        update-types: ["version-update:semver-major"]
      # The bridge's Rust crate, its Dart package and the generated bindings
      # (stamped with the version, held by check_generated_bridge_pinned.sh)
      # move in one commit through ./scripts/regenerate_frb.sh; Dependabot can
      # bump neither half alone without breaking the build.
      - dependency-name: "flutter_rust_bridge"

  # ---------------------------------------------------------------------------
  # Flutter (haven app)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pub"
    directory: "/haven"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      flutter-secure-storage-stack:
        applies-to: version-updates
        patterns:
          - "flutter_secure_storage*"
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades require dedicated migration work — humans, not Dependabot.
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "very_good_analysis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "latlong2"
        update-types: ["version-update:semver-major"]
      # Moves with its Rust crate through ./scripts/regenerate_frb.sh; see the
      # cargo entry.
      - dependency-name: "flutter_rust_bridge"

  # ---------------------------------------------------------------------------
  # Android (haven/android): the libraries the app module declares itself —
  # CameraX and zxing-cpp for the QR scanner, AppCompat/transition/exif for
  # uCrop — the Gradle plugins and the Gradle wrapper. Flutter plugins' own
  # Gradle dependencies move with the plugin's pub release (the "pub" entry
  # above); the vendored third_party/geolocator_android is held to its latest
  # upstream release by scripts/ci/check_vendored_current.sh instead.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/haven/android"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      # The Android Gradle plugin names the minimum Gradle it runs on, so a
      # plugin bump arrives with the wrapper it needs (AGP 9.5 needs Gradle
      # 9.6 or later). Before patch-updates, so a patch of either rides here.
      android-build:
        applies-to: version-updates
        patterns:
          - "com.android.*"
          - "gradle-wrapper"
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      # The scanner's camera stack moves as one: its artifacts share a version.
      camerax:
        applies-to: version-updates
        patterns:
          - "androidx.camera:*"
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # Actions take only a flat cooldown: Dependabot rejects the semver-*-days
    # keys for this ecosystem, and one rejected key stops every update above.
    cooldown:
      default-days: 14
    groups:
      actions-patches:
        applies-to: version-updates
        update-types: ["patch", "minor"]
