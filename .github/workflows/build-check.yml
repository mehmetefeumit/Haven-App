# Reusable workflow: debug-build verification.
#
# Proves the app builds end-to-end with the Rust core on every mobile target.
# These are build proofs (plus, on the arm64 leg, the Android JVM unit tests,
# which need this Gradle build): they catch Gradle/Xcode/cargokit/FFI wiring
# breaks that the unit-test lanes cannot see.
#
#   - Android: one job per ABI (arm64, arm, x64). Each architecture gets its
#     own runner because a combined multi-ABI build has exhausted a default
#     runner's disk.
#   - iOS: debug build, no codesign.
#
# # Why these jobs pass no HAVEN_LIVE_SYNC
#
# `liveSyncEnabled` is `bool.fromEnvironment('HAVEN_LIVE_SYNC', defaultValue:
# true)`, and scripts/ci/check_live_sync_define_declared.sh requires every
# workflow job that builds the app to DECLARE which receive path it compiles —
# an omission elsewhere means "nobody decided" (CI_HARDENING_BACKLOG.md A7).
# These jobs are the exception the guard names explicitly: their entire purpose
# is to prove that the artifact SHIPPED to users builds, and the shipped
# artifact passes no define, so its receive path is whatever
# live_sync_provider.dart's `defaultValue` says it is. Pinning a literal here
# would decouple the verified build from the one-line rollback lever that
# defaultValue IS (docs/M11_ROLLOUT.md §8, pinned by check 14b of
# check_m7_native_wake_guards.sh): a rollback would flip production while these
# jobs kept compiling — and kept proving — the abandoned path. So the choice is
# still declared, just declared as "the default, deliberately":
#
#   HAVEN_LIVE_SYNC-INTENT: production-default
#
# The guard allows that token in this file and in release-build.yml only; any
# other workflow reaching for it has to edit the guard's allowlist, which is a
# reviewable act rather than a silent omission.

name: Build Check

on:
  workflow_call:

jobs:
  android:
    name: Android (${{ matrix.arch }})
    # HAVEN_LIVE_SYNC-INTENT: production-default — see the header. This job
    # builds what ships, and what ships passes no define.
    runs-on: ubuntu-latest
    # A job cap, because the dependency-fetch steps below have one and a step
    # cap inside an uncapped job cannot be ordered against anything
    # (check_e2e_step_timeout_ordering.sh C3); without it a wedged build runs to
    # GitHub's six-hour default. MEASURED worst 17.9 min across 12 CI runs (2026-09-19..21,
    # all three ABIs; worst leg run 35524002720). 45 leaves room for a cold build
    # that also spends the whole classified-retry budget in
    # scripts/ci/build_apk_with_retry.sh and still dies naming itself.
    timeout-minutes: 45
    strategy:
      # One architecture failing must not cancel the other two — each arch is
      # an independent signal.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust-target: aarch64-linux-android
            flutter-platform: android-arm64
          - arch: arm
            rust-target: armv7-linux-androideabi
            flutter-platform: android-arm
          - arch: x64
            rust-target: x86_64-linux-android
            flutter-platform: android-x64
    defaults:
      run:
        working-directory: haven

    steps:
      # Runs BEFORE checkout (the job-default `haven` working directory does
      # not exist yet), reclaiming the disk the multi-GB debug build needs.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/lib/android/sdk/system-images

      - name: Checkout
        uses: actions/checkout@v6

      # Must match toolchainVersion in haven/android/gradle/gradle-daemon-jvm.properties.
      # If they diverge, Gradle re-downloads JDK 21 (~200 MB) on every CI run.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core
          key: android-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # This run's Gradle dependency set, resolved once and proved complete
      # offline by android-gradle-deps.yml (the job this one `needs:`), so the
      # build below runs with HAVEN_GRADLE_OFFLINE=1 and never meets the
      # network: a Plugin Portal blip failed lanes at the build when each
      # resolved its own (CI runs 45142774793, 45012283370). Before Setup
      # Flutter, which pins the Flutter version the set was resolved with. Not
      # `continue-on-error`: a lane without its set cannot build, and says so
      # here (scripts/ci/check_gradle_build_hardened.sh).
      - name: Fetch this run's Gradle dependencies
        timeout-minutes: 7  # sized in android-gradle-deps.yml
        uses: actions/download-artifact@v6
        with:
          name: gradle-deps
          path: ${{ runner.temp }}/gradle-deps

      - name: Install this run's Gradle dependencies
        timeout-minutes: 2
        run: bash ../scripts/ci/gradle_deps.sh unpack "${RUNNER_TEMP}/gradle-deps"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.HAVEN_FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Offline, from the run's set: a gap in it fails once, named as the deps
      # job's, and disk/OOM fail at once, so neither is retried into a green
      # build (scripts/ci/build_apk_with_retry.sh). Before the set, Maven
      # Central rate-limits on the shared runner IP lost legs here (CI run
      # 30732662493's `arm`).
      - name: Build APK (${{ matrix.arch }})
        env:
          HAVEN_GRADLE_OFFLINE: "1"
        run: ../scripts/ci/build_apk_with_retry.sh ${{ matrix.flutter-platform }}

      # The JVM unit tests of the Android boot/update resume rule
      # (app/src/test/.../BootResumeTest.kt, JUnit 4, test-only): the one check
      # that runs ResumeRule.kt's decision and its preference reads. JVM code,
      # so one ABI is enough. The build above generated gradlew and compiled
      # the Kotlin; the same target platform (`--gradle-task` passes it as
      # `-Ptarget-platform`) keeps Flutter's tasks up to date, and cargokit's
      # Rust build hangs off native-lib merging, which a unit test does not
      # reach. Offline like the build: JUnit is in the run's set, because
      # havenResolveAll resolves the unit-test classpaths with the rest.
      - name: Android JVM unit tests
        if: matrix.arch == 'arm64'
        timeout-minutes: 15
        env:
          HAVEN_GRADLE_OFFLINE: "1"
        run: ../scripts/ci/build_apk_with_retry.sh --gradle-task ${{ matrix.flutter-platform }} :app:testDebugUnitTest

      # Security Rule 15: SQLCipher's native logger is compiled out of what we
      # build, whatever directory cargokit ran cargo from.
      - name: Probe the APK for SQLCipher's logger
        run: |
          unzip -q -o build/app/outputs/flutter-apk/app-debug.apk 'lib/*/librust_lib_haven.so' -d "${RUNNER_TEMP}/apk-lib"
          bash ../scripts/ci/check_sqlcipher_logger_omitted.sh "${RUNNER_TEMP}/apk-lib/lib"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-${{ matrix.arch }}
          path: haven/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    name: iOS
    # HAVEN_LIVE_SYNC-INTENT: production-default — see the header. This job
    # builds what ships, and what ships passes no define.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: haven

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --debug --no-codesign

      # Security Rule 15: see the Android job's probe.
      - name: Probe the iOS build for SQLCipher's logger
        run: bash ../scripts/ci/check_sqlcipher_logger_omitted.sh build/ios/iphoneos/Runner.app
