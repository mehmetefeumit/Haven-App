# Release build: produces key-injected, obfuscated release artifacts.
#
# Triggered ONLY by version tags (v*) and manual dispatch — NEVER on PRs, so the
# Stadia key and signing secrets never touch PR/debug builds. Both builds go
# through scripts/build_release.sh, which injects STADIA_API_KEY (from the repo
# secret, via the env path so the key never appears in argv/logs), forces
# --obfuscate --split-debug-info, runs the no-committed-secrets guard, and sets
# HAVEN_RELEASE_WRAPPER=1 so the Gradle release gate passes.
#
# Every job that builds, signs, uploads or publishes needs both `gate` (ci.yml
# passed on this commit) and `dependency-audit` (audit.yml in full mode, run
# fresh here on every event, because a verdict recorded at merge cannot see an
# advisory published since), directly or through another job;
# scripts/ci/check_ci_verdict.sh holds that. Android signing is a job of its
# own (android-sign), so the job that compiles third-party code never holds the
# keystore, and only android-publish can write to the repository. Every action
# is pinned to a commit SHA, and no job that holds a secret restores a cache:
# nothing checks what a restore puts on disk (see HAVEN_GRADLE_CACHE-EXEMPT).
#
# # Why neither job passes HAVEN_LIVE_SYNC
#
# scripts/ci/check_live_sync_define_declared.sh makes every workflow job that
# builds the app declare which receive path it compiles, because
# `liveSyncEnabled` is `bool.fromEnvironment('HAVEN_LIVE_SYNC', defaultValue:
# true)` and an omitted define is indistinguishable from an unmade decision
# (CI_HARDENING_BACKLOG.md A7). These jobs build the RELEASE artifact, and the
# release artifact's receive path must come from live_sync_provider.dart's
# `defaultValue` — that const is the documented one-line rollback lever
# (docs/M11_ROLLOUT.md §8, pinned by check 14b of
# check_m7_native_wake_guards.sh). A literal define here would quietly outrank
# it: flipping the default back to false would change nothing about what
# actually ships. The decision is therefore declared as "take the default":
#
#   HAVEN_LIVE_SYNC-INTENT: production-default
#
# Required repository secret:
#   STADIA_API_KEY              Stadia Maps tile API key
# Android signing (the android-sign job only; required on a tag, and a manual
# run without them signs and publishes nothing):
#   ANDROID_KEYSTORE_BASE64     base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           signing key alias
#   ANDROID_KEY_PASSWORD        signing key password
# iOS TestFlight (the ios job; provision certs once via the "iOS Certificates"
# workflow before the first tagged release — see haven/DEVELOPMENT.md):
#   MATCH_GIT_URL                 https URL of the private Match certs repo
#   MATCH_PASSWORD                passphrase that decrypts the stored certs
#   MATCH_GIT_BASIC_AUTHORIZATION base64 of "<github-user>:<PAT>" (read access here)
#   APPLE_TEAM_ID                 Apple Developer Team ID (10 chars)
#   ASC_KEY_ID                    App Store Connect API key id
#   ASC_ISSUER_ID                 App Store Connect API issuer id
#   ASC_KEY_P8_BASE64             base64 of the App Store Connect .p8 private key

name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default: every job gets a read-only GITHUB_TOKEN; only the
# android-publish job overrides to `contents: write` for the GitHub Release.
# This pins downstream token scope (notably the zapstore job, which holds the
# Nostr publisher key) independent of the repo's default-permissions setting.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Release gate: the tagged commit MUST have passed the deterministic checks
  # before any signed artifact is produced or uploaded — without this gate a
  # tag pushed onto a red/unverified commit shipped straight to TestFlight. The
  # checks are ci.yml's rust-check, cross-check, coverage and repo-guards jobs,
  # and this job reads the verdict ci.yml's push to main recorded for this exact
  # commit (scripts/ci/check_ci_verdict.sh) rather than running them again: a
  # tag's cache scope holds nothing, so the redo was a cold rebuild of what main
  # had just proved, and it ran past its 60-minute bound on v0.1.13. Main's run
  # is also the stronger proof, because its repo-guards ratchets the privacy
  # manifest against the previous tip, which a tag run cannot. A tag must
  # therefore point at the tip of a push to main. If that commit's gate jobs
  # are still running this job waits for them; a later push to main cancels
  # them, and the gate then fails until they are re-run. The emulator E2E lanes are
  # deliberately NOT part of this gate: their AVD nondeterminism must never
  # block a release of an already-green commit, so they stay the PR/nightly
  # functional signal. The dependency audit is the exception that runs again:
  # see dependency-audit below.
  # ---------------------------------------------------------------------------
  gate:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    # The script's own deadline is 90 minutes.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require ci.yml's gate jobs to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check_ci_verdict.sh --sha "${GITHUB_SHA}"

  # A fresh audit of every committed lockfile, with the upstream-advisory
  # watcher and the ledger's liveness rule that only `full` mode runs. Never
  # replayed from ci.yml's verdict: an advisory published between the merge
  # and the tag must stop the release.
  dependency-audit:
    name: Dependency audit (fresh)
    uses: ./.github/workflows/audit.yml
    with:
      mode: full
    permissions:
      contents: read

  android:
    name: Android release (per-ABI APKs)
    # HAVEN_LIVE_SYNC-INTENT: production-default — see the header. The shipped
    # APK's receive path is live_sync_provider.dart's defaultValue, not a
    # value this workflow chooses.
    #
    # HAVEN_GRADLE_CACHE-EXEMPT: this job builds the artifact that ships, and an
    # unverified cache is not an input a release build should take to save one
    # cold build per release. Nothing here would check what a restore put on
    # disk: there is no haven/android/gradle/verification-metadata.xml (Gradle
    # dependency verification is off), so a poisoned `~/.gradle/caches/modules-2`
    # can substitute a dependency into the one build whose output users install
    # (the distribution itself is pinned by gradle-wrapper.properties'
    # distributionSha256Sum, so `~/.gradle/wrapper` is no longer the hole). The
    # E2E lanes take that trade because they ship nothing; this job does not.
    # It still gets the widened in-Gradle 429 window from
    # haven/android/gradle.properties (5 tentatives, 2 s doubling backoff),
    # which is the only retry on this path: scripts/build_release.sh calls
    # `flutter build` itself rather than going through
    # scripts/ci/build_apk_with_retry.sh, so a transient here is a human
    # re-run of the tag, not an in-job recovery. Revisit only once both
    # checksums are pinned and verified. The same reasoning keeps the cargo
    # and pub caches out (no rust-cache, flutter-action `cache: false`).
    #
    # This job holds no signing secret: with no haven/android/key.properties
    # the build falls back to the debug key, exactly as a dry run always did,
    # and android-sign replaces that signature. Any of the hundreds of
    # packages this job compiles and runs could otherwise read the keystore.
    needs: [gate, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: haven
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/lib/android/sdk/system-images

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: false

      # --enforce-lockfile: the release ships exactly the pubspec.lock that
      # audit.yml scanned, with every package's content hash checked. When a
      # Flutter stable bump moves the versions flutter_test / integration_test
      # pin, this fails until a PR regenerates haven/pubspec.lock on that stable.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      # No Gradle dependency cache here, on purpose — see the
      # HAVEN_GRADLE_CACHE-EXEMPT reason on this job. This build resolves its
      # dependencies and its Gradle distribution from the network every time,
      # because that is the only path anything upstream is in a position to
      # authenticate.

      # Version is single-sourced from the trigger: the git tag (vX.Y.Z -> X.Y.Z)
      # gives the marketing version; the run number gives a unique build number.
      # A manual (workflow_dispatch) run has no tag, so BUILD_NAME stays unset and
      # the build falls back to pubspec.yaml's version:.
      - name: Build release APKs
        env:
          STADIA_API_KEY: ${{ secrets.STADIA_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then export BUILD_NAME="${GITHUB_REF_NAME#v}"; fi
          bash ../scripts/build_release.sh apk

      # Security Rule 15: no APK ships with SQLCipher's native logger compiled in.
      # unzip -d creates only the last directory of its target, hence the mkdir.
      - name: Probe each APK for SQLCipher's logger
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            out="${RUNNER_TEMP}/apk-lib/$(basename "${apk}" .apk)"
            mkdir -p "${out}"
            unzip -q -o "${apk}" 'lib/*/librust_lib_haven.so' -d "${out}"
            bash ../scripts/ci/check_sqlcipher_logger_omitted.sh "${out}/lib"
          done

      # Debug-signed by Gradle's fallback; android-sign replaces the signature.
      # A manual run without the keystore secrets leaves only this artifact.
      #
      # NOTE: the app-*-release.apk glob is contractually tied to
      # scripts/build_release.sh apk producing --split-per-abi outputs; changing the
      # ABI-split scheme means updating the globs here, in android-sign and in
      # android-publish, AND zapstore.yaml's `match` together.
      - name: Upload debug-signed APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haven-release-android-debug-signed
          path: haven/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug symbols (de-obfuscation)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haven-release-android-symbols
          path: haven/build/symbols
          retention-days: 90

  # Re-signs the build job's APKs with the release key, on a runner that has
  # built nothing: apksigner and zipalign come from the runner image's Android
  # SDK, and the checkout holds only the one script and the README it checks
  # the published fingerprint against. scripts/ci/sign_android_release.sh says
  # what apksigner does to the debug signature and what each APK must pass.
  android-sign:
    name: Android release signing
    needs: [gate, dependency-audit, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A tagged release MUST be release-signed. A debug-signed APK on the public
      # Release would be signed with the universal androiddebugkey (public password
      # "android"), defeating update authentication and trapping early installers
      # behind an uninstall-to-migrate wall (which wipes their encrypted identity/
      # circles). A manual run without the secrets is a dry run that signs and
      # publishes nothing.
      - name: Require the release keystore on a tag
        id: keystore
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "${HAS_KEYSTORE}" == true ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            echo "::error::No release keystore configured (the ANDROID_KEYSTORE_* repository secrets)."
            echo "Refusing to publish a tagged release that would be DEBUG-signed."
            exit 1
          else
            echo "::notice::No release keystore configured: this run signs and publishes nothing. The debug-signed APKs are in the haven-release-android-debug-signed artifact."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout the signing script
        if: steps.keystore.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/sign_android_release.sh
            README.md
          sparse-checkout-cone-mode: false

      - name: Download debug-signed APKs
        if: steps.keystore.outputs.present == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: haven-release-android-debug-signed
          path: ${{ runner.temp }}/debug-signed

      - name: Sign and verify with the release key
        if: steps.keystore.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci/sign_android_release.sh "${RUNNER_TEMP}/debug-signed" "${RUNNER_TEMP}/signed"

      # SHA-256 sidecars so sideload users can verify integrity (the signing-cert
      # fingerprint published in the README verifies authenticity; these verify the
      # download). One per split APK, named <apk>.sha256.
      - name: Checksum APKs
        if: steps.keystore.outputs.present == 'true'
        run: |
          cd "${RUNNER_TEMP}/signed"
          for apk in app-*-release.apk; do
            sha256sum "${apk}" > "${apk}.sha256"
          done
          ls -la

      - name: Upload Android artifacts
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haven-release-android
          path: |
            ${{ runner.temp }}/signed/app-*-release.apk
            ${{ runner.temp }}/signed/app-*-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      # The script deletes it on exit; this also covers a cancelled step. The
      # name is sign_android_release.sh's KEYSTORE_NAME.
      - name: Delete the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/haven-release.jks" "${RUNNER_TEMP}/haven-release.jks.crt"

  # The linchpin: attach the signed per-ABI APKs (+ checksums) to a real GitHub
  # Release so Obtainium and Zapstore can pull them. The GitHub Release is the
  # canonical Android channel: Obtainium and Zapstore both PULL from it (not from
  # Actions artifacts, which are auth-gated and expire). The de-obfuscation
  # symbols are NOT attached publicly (a separate private artifact) so the
  # obfuscation map is never handed to attackers. Tag pushes only — a manual
  # workflow_dispatch has no tag and must not publish a Release.
  android-publish:
    name: Publish GitHub Release
    needs: [gate, dependency-audit, android-sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # contents: write lets the built-in GITHUB_TOKEN create the GitHub Release
    # and attach the signed APKs. Least-privilege: only this job gets write, and
    # it holds no other secret.
    permissions:
      contents: write
    steps:
      - name: Checkout the ledger
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/release_ledger_notes.sh
            osv-scanner.toml
          sparse-checkout-cone-mode: false

      - name: Download signed APKs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: haven-release-android
          path: ${{ runner.temp }}/signed

      # The body lists every advisory this release ships acknowledged, with the
      # day each acknowledgement expires; softprops puts it above the generated
      # notes.
      - name: Write release notes (acknowledged advisories)
        run: bash scripts/ci/release_ledger_notes.sh osv-scanner.toml > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Haven ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # v*-beta.N / v*-rc.N (any tag containing '-') -> pre-release, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/signed/app-*-release.apk
            ${{ runner.temp }}/signed/app-*-release.apk.sha256

  ios:
    name: iOS release (TestFlight)
    # HAVEN_LIVE_SYNC-INTENT: production-default — see the header. The shipped
    # IPA's receive path is live_sync_provider.dart's defaultValue, not a
    # value this workflow chooses.
    #
    # The signing assets and the App Store Connect key are in this job (iOS
    # signs inside Xcode's export), so, as in android, it restores no cache:
    # no rust-cache, flutter-action `cache: false`, and the gems installed
    # frozen from the committed Gemfile.lock rather than from bundler-cache.
    needs: [gate, dependency-audit]
    # Pin macos-15 (GA) rather than macos-latest: macos-latest is mid-migration
    # to macos-26 (started 2026-06-15), so the SDK it provides is ambiguous.
    # macos-15 ships Xcode 26.x (up to 26.3, the newest that runs on macOS 15).
    runs-on: macos-15
    env:
      BUNDLE_FROZEN: 'true'
    defaults:
      run:
        working-directory: haven
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # App Store Connect rejects uploads not built with the iOS 26 SDK (Xcode
      # 26+). The macos-15 runner DEFAULTS to Xcode 16.4 (iOS 18.5 SDK), which is
      # why an unselected build is rejected — so select Xcode explicitly instead
      # of trusting the image default. 'latest-stable' picks the newest non-beta
      # Xcode on the image (26.3 on macos-15); do NOT request 26.4+ here, as those
      # require macOS 26.
      - name: Select Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: false
          working-directory: haven/ios

      # BUNDLE_FROZEN (job env): installs exactly Gemfile.lock, checksums
      # included, and fails rather than re-resolve.
      - name: Install Fastlane (Gemfile.lock)
        working-directory: haven/ios
        run: bundle install

      # --enforce-lockfile: see the android job.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      # Install the Match-provisioned Apple Distribution cert + "match AppStore
      # com.oblivioustech.haven" profile READ-ONLY into a temporary CI keychain, and switch
      # the Runner target to manual signing so the archive can use them. Read-only:
      # it needs only the Match repo token and MATCH_PASSWORD, never the App Store
      # Connect API key. Certificates are minted by the separate "iOS Certificates"
      # workflow, never here.
      - name: Install iOS signing assets (Fastlane Match)
        working-directory: haven/ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios prepare_signing

      # Inject the (non-secret) Team ID into ExportOptions.plist from the secret so
      # the Team ID is never committed. The profile is referenced by name, so this
      # is the only per-account value the export needs.
      - name: Render ExportOptions.plist Team ID
        working-directory: haven/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: /usr/libexec/PlistBuddy -c "Set :teamID ${APPLE_TEAM_ID}" ExportOptions.plist

      # Single archive + export through the BLESSED wrapper: injects the Stadia key,
      # forces --obfuscate/--split-debug-info, runs the secret guard, compiles the
      # haven-core Rust pod for aarch64-apple-ios, and exports a SIGNED .ipa via
      # ios/ExportOptions.plist. BUILD_NUMBER = the run number -> unique & monotonic.
      - name: Build signed IPA (release wrapper)
        env:
          STADIA_API_KEY: ${{ secrets.STADIA_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then export BUILD_NAME="${GITHUB_REF_NAME#v}"; fi
          bash ../scripts/build_release.sh ipa

      # Security Rule 15: nothing reaches TestFlight with SQLCipher's native
      # logger compiled in.
      - name: Probe the archive for SQLCipher's logger
        run: bash ../scripts/ci/check_sqlcipher_logger_omitted.sh build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      - name: Upload to TestFlight
        working-directory: haven/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios upload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haven-release-ios-ipa
          path: haven/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload debug symbols (de-obfuscation)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: haven-release-ios-symbols
          path: haven/build/symbols
          retention-days: 90

  # ===========================================================================
  # PUSH fan-out. The Zapstore job depends ONLY on `android-publish`, so a
  # Zapstore failure never blocks the iOS/TestFlight job, and the GitHub Release
  # created in android-publish is already published regardless. It skips cleanly when its
  # secret is absent (forks / before the publisher key exists) by gating every
  # step on a job-level env var (secrets cannot be referenced in a job-level `if:`).
  # The pull-based channels — direct GitHub Release download and Obtainium — need
  # NO job here; they read the GitHub Release on their own cadence.
  # ===========================================================================

  # Zapstore (Nostr app store) — runs after android-publish so the GitHub Release
  # exists; `zsp` pulls the arm64-v8a APK straight from the Release (zapstore.yaml
  # metadata_sources: github + match) and signs the Nostr events with SIGN_WITH.
  # It does NOT re-sign the APK, so Zapstore stays in Haven's single signing
  # lineage. Pre-release tags (vX.Y.Z-...) publish to the 'beta' channel (handled
  # in scripts/ci/publish_zapstore.sh).
  zapstore:
    name: Publish to Zapstore
    needs: [android-publish]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    env:
      # zsp reads SIGN_WITH directly; also used to gate the steps (a bunker:// URL
      # is preferred over a raw nsec so the key never enters the runner env).
      SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
    steps:
      - name: Checkout
        if: ${{ env.SIGN_WITH != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install zsp (pinned + sha256-verified)
        if: ${{ env.SIGN_WITH != '' }}
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/zsp" \
            https://github.com/zapstore/zsp/releases/download/v0.4.11/zsp-0.4.11-linux-amd64
          # Pin the exact binary (GitHub release assets are mutable) — this job
          # holds the Nostr publisher key, so verify before executing.
          echo "e17923e9436d6cac374e6ea012ba39aa1ca247751c47f8074ba005c654d4a241  ${RUNNER_TEMP}/zsp" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/zsp"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Publish to Zapstore
        if: ${{ env.SIGN_WITH != '' }}
        env:
          # Optional: lets zsp read the release/changelog without hitting GitHub
          # API rate limits. Read-only token is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish_zapstore.sh

      - name: Skipped (no Zapstore secret)
        if: ${{ env.SIGN_WITH == '' }}
        run: echo "ZAPSTORE_SIGN_WITH not set — skipping Zapstore publish."
