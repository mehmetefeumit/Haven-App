# Reusable workflow: Android foreground-service PUBLISH runtime-proof lane
# (docs/CI_HARDENING_BACKLOG.md Workstream B, item B1).
#
# Proves that Haven actually publishes location from the Android foreground
# service while the UI is hidden AND the foreground MLS session is still live —
# the one configuration in which P0-1 says publishing is dead — and that it does
# so the way POWER_EFFICIENCY_PLAN.md phase P2a says it does. What the
# orchestrator asserts, in order (its own header carries the full reasoning):
#
#   1. the drive delivered a REAL pause and the handoff COMPLETED
#   2. the FGS isolate acquired an MLS session (Rule 14) — a POSITIVE marker,
#      not the absence of a failure one
#   3. it published to >= 1 circle              (count PARSED, not grepped)
#   4. the publish came from the SAME OS process as the foreground that handed
#      off — without which a START_STICKY restart passes 2 and 3 proving nothing
#   5. `dumpsys location`: ONE long-interval platform request, no 1 m filter,
#      no `minUpdateInterval=`, no unattributed one-shot
#   6. `dumpsys power`: the scoped `Haven:publish` lock stays inside its own
#      ceiling; the plugin's permanent lock (P2a keeps it) is held throughout
#   7. the cadence is delivery-driven and spaced by the registered interval
#   8. publishing survives the no-fix chain under `dumpsys deviceidle force-idle`
#
# There is deliberately NO relay-side corroboration step. An earlier revision
# compared strfry's log line count before and after; it could not fail (the
# FGS's own connect plus strfry's expiry cron guarantee new lines) and it added
# nothing (`Published to N` is reached only after `publish_with_retry` returns,
# which happens only on a relay OK-ack — Security Rule 13). A gate that cannot
# fail was removed rather than kept as decoration.
#
# # Why a SEPARATE workflow (not a new e2e-integration.yml target)
#
# run-integration-tests.sh / run-single-avd-scenario.sh force-stop + uninstall
# between targets. `am force-stop` kills the foreground service and releases the
# foreground MLS session — destroying the exact contention this lane exists to
# observe. This lane instead keeps the app alive after the drive
# (`--keep-app-running`) and never `am kill`s it. The backgrounding is delivered
# from INSIDE the drive (a real `AppLifecycleState.paused` while the tree is
# still mounted), not by a HOME keypress afterwards: `flutter_test` unmounts the
# widget tree on a passing test, so by the time the drive exits there is no
# lifecycle observer left to receive one.
#
# # Why this is not covered by e2e-background-catchup.yml
#
# That lane exercises the WorkManager CATCH-UP worker: receive-only, separate
# process, and its `go_cold` helper kills the app before waking it. Different
# mechanism, opposite direction, and it deliberately removes the live foreground
# session. Before this lane, `background_location_task.dart` — the whole Android
# background-publish path — executed nowhere in CI.
#
# # Architecture mirrors e2e-background-catchup.yml
#
# Same single-AVD, build-before-boot design (the multi-GB Rust-NDK + Gradle peak
# must never coincide with a resident emulator; see docs/E2E_TROUBLESHOOTING.md).

name: E2E FGS Publish

on:
  workflow_call:

jobs:
  e2e_fgs_publish:
    name: e2e_fgs_publish
    runs-on: ubuntu-latest
    # One APK build + boot + a drive that internally holds ~200s of background
    # publish cycles and then ~332s of forced-idle no-fix chain (<=20m of drive
    # timeout). The job cap must clear the SUM of the step caps: below it, a
    # run whose every step is still inside its own cap can die here, and a
    # job-cap death skips every `if: failure()` step (e2e-android.yml states
    # the rule). So: Build FGS publish test APK 30 + Create AVD snapshot (on an
    # AVD-cache miss) 15 + the drive step 38 (derived there) + the most the
    # work no step cap bounds has taken, 3.0 min over 47 runs of this job
    # (ci.yml, 2026-07-29..09-10; 1.0 of it the failure diagnostics, run
    # 30792258968), taken as 3 = 86 -> 90.
    # job-uncapped-minutes: 3.0 (47 runs, worst 30792258968)
    timeout-minutes: 90
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # Declared EXPLICITLY rather than inherited. `liveSyncEnabled` defaults to
      # true when the define is absent, so an omitted flag reads as "we didn't
      # think about it" (CI_HARDENING_BACKLOG.md A7). B1 wants the production
      # default — the foreground holds live relay subscriptions while the FGS
      # publishes — and says so here.
      HAVEN_LIVE_SYNC: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core
          # Distinct cache key from the other E2E jobs so they don't race on one
          # entry; all build the same x86_64-linux-android target.
          key: e2e-fgs-publish-x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build the target APK BEFORE the emulator boots (build-before-boot
      # discipline). Staged at /tmp/integration-apks/<basename>.apk; the
      # --dart-define baked here MUST match the relay URL the emulator step uses
      # (the drive does not re-pass it).
      - name: Build FGS publish test APK
        working-directory: haven
        timeout-minutes: 30
        run: bash ../tooling/e2e/ci/build-integration-apks.sh
          integration_test/b1_fgs_live_foreground_test.dart

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared with the other Android E2E lanes: the AVD snapshot is
          # byte-identical (same api/arch/target/profile), so this restores the
          # snapshot they created instead of rebuilding it.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # This step's entire job is booting an emulator, and until 2026-08-03 it
        # had no bound of any kind — a wedged boot here ran to the JOB cap,
        # which SIGKILLs the runner before any if: failure() step, so the lane
        # died slow and with no artifacts. Measured across 23 successful runs
        # (ci.yml, 2026-07/08) the snapshot takes 91-130 s; 15 min is ~7x the
        # observed max, so it can only ever fire on a genuine wedge. The
        # emulator-boot-timeout below is the action's own inner bound (7 min,
        # matching the drive steps) and fires first with the action's message.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Bound the boot itself (the only thing this step does) so a wedged
          # emulator fails inside the step rather than at the step cap above.
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # All real logic lives in the checked-in orchestrator (single bash
      # invocation — the action runs each line of a multi-line `script:` in its
      # own sh -c, which would drop shell state).
      #
      # -memory 6144 for the same reason as the catch-up lane: the FGS isolate
      # boots RustLib + SQLCipher (which floods `mlock() -1 ENOMEM` under
      # pressure) ALONGSIDE the resident app and its live foreground MLS session.
      # Both sessions are held simultaneously here by design, so the peak is at
      # least as high as that lane's.
      # BOUNDS. Four of them, innermost first:
      #   14m  the drive target's own `Timeout` — the only one that fails with
      #        an attributable, test-level message.
      #   20m  the `flutter drive` (run-b1-fgs-publish.sh's B1_DRIVE_TIMEOUT),
      #        covering install + VM-service connect on top of the test body.
      #   28m  this step's inner deadline (run-with-deadline.sh below) — covers
      #        the drive PLUS the relay restart, the install and its broadcast
      #        barrier, grants, GPS seed and assertions, none of which the
      #        per-drive timeout bounds, and is the bound that actually reaps
      #        (CI_HARDENING_BACKLOG.md A8).
      #   38m  this step's timeout-minutes >= 28 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + 2 (the action's own setup and
      #        teardown, outside both: 38-102 s across the eight own-installer
      #        lanes over twelve runs, 2026-08/09 — 102 s was this lane's, in
      #        run 34511084722), a belt over the deadline.
      #
      # DEADLINE, from run-b1-fgs-publish.sh's bounded waits at their bounds,
      # in seconds:
      #   start-strfry.sh READY_TIMEOUT, the ready loop's last 1 s tick
      #     and READY_CONFIRM_SECS                             60 + 1 + 2 =   63
      #   app-install-lib.sh INSTALL_BARRIER_SECS (Phase 1)                  120
      #   DRIVE_TIMEOUT (B1_DRIVE_TIMEOUT) + DRIVE_KILL_AFTER_SECS 1200+30 = 1230
      #     (Phase 4's own broadcast barrier, BARRIER_TIMEOUT_SECS, runs
      #     inside the drive, so the drive's bound already covers it)
      #   the sampler's stop, 3 x SAMPLE_PERIOD_SECS                  3 x 5 =  15
      #                                                      = 1428 s = 23m48s
      #   + the unbounded relay, adb, install, grant, scan and oracle work,
      #     ~3 min: e2e-android.yml's allowance, kept because the sick device
      #     that pushes the waits above to their bounds is the one that slows
      #     adb (the own-installer lanes spent under 40 s on it in run
      #     34511084722)
      #                                                      = 26m48s, in 28m.
      # Sizing evidence: this lane is new (2026-08-02) and has no green run
      # yet, so the base number came from the FAILED runs, where the step ran
      # 5.2-12.1 min (14 runs) — none of which reached the forced-idle phase.
      # That phase adds 332 s (5.5 min) of hold, so a full green run should sit
      # near 17-18 min and 28m is ~1.6x that. Revise against p95 once this lane
      # has green history.
      - name: Run the FGS publish proof on the emulator
        timeout-minutes: 38
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 6144
          disable-animations: true
          # Bound the boot (which happens BEFORE `script:` runs, and is
          # therefore outside the deadline below).
          emulator-boot-timeout: 420
          script: bash tooling/e2e/ci/run-with-deadline.sh 28m "e2e-fgs-publish drive" -- bash tooling/e2e/ci/run-b1-fgs-publish.sh /tmp/integration-apks/b1_fgs_live_foreground_test.apk integration_test/b1_fgs_live_foreground_test.dart

      - name: Capture host + emulator diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/b1-logs
          adb reconnect offline || true
          timeout 60 adb wait-for-device || true
          {
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l (after reconnect attempt) ==="
            adb devices -l || true
            echo
            echo "=== running services (app slice) ==="
            adb shell dumpsys activity services com.oblivioustech.haven || true
            echo
            echo "=== appops location slice ==="
            adb shell cmd appops get com.oblivioustech.haven || true
          # `.log`, not `.txt`: this file is written AFTER the orchestrator's
          # EXIT trap has already scanned, and the scanner's directory walk
          # only picks up `*.log`. A `.txt` here would be uploaded unscanned.
          } > /tmp/b1-logs/diag.log 2>&1 || true
          # Scan what this step just wrote (Security Rule 6). Withhold rather
          # than upload on a hit, matching the orchestrator's containment.
          # rc 1 (a real leak) and rc 3 (absent/unreadable/empty log) are kept
          # apart deliberately: both fail the step, but only a leak justifies
          # destroying the diag. If the redirection above produced nothing —
          # a full disk is the realistic cause on this lane — the honest
          # marker is "never written", not "withheld because it leaked".
          diag_scan_rc=0
          bash tooling/e2e/ci/scan-logs-for-secrets.sh /tmp/b1-logs/diag.log \
            || diag_scan_rc=$?
          if [ "${diag_scan_rc}" -eq 1 ]; then
            rm -f /tmp/b1-logs/diag.log
            echo "diag withheld: secret-leak guard tripped" > /tmp/b1-logs/DIAG_LEAK.txt
            exit 1
          elif [ "${diag_scan_rc}" -ne 0 ]; then
            echo "diag unscannable (rc=${diag_scan_rc}): absent, unreadable or empty" \
              > /tmp/b1-logs/DIAG_UNSCANNABLE.txt
            echo "ERROR: diag log could not be scanned (rc=${diag_scan_rc})." >&2
            exit 1
          fi

      # if: always() so a green run still surfaces the publish counts and the
      # ACCESS_BACKGROUND_LOCATION spike-probe read-back as recorded evidence.
      - name: Upload FGS publish artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-fgs-publish-${{ github.run_id }}
          path: |
            /tmp/b1-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
