# P0-1 GATING EXPERIMENT — manual only.
#
# TEMPORARY. Delete this workflow, `tooling/e2e/ci/run-p0-1-session-probe.sh`,
# `haven/integration_test/p0_1_session_probe_test.dart`, and the probe in
# `background_location_task.dart` once the answer is recorded in
# `docs/P0_1_FGS_SESSION_PLAN.md` §2.
#
# Answers one question that stands in front of a multi-week refactor: does the
# Rule-14 MLS guard survive the death of the main Flutter isolate? If it does,
# the fix plan's routing design cannot use a cold-start fallback and the
# architecture must change.
#
# `workflow_dispatch` only — deliberately NOT wired into ci.yml. It is an
# experiment, not a regression test: it toggles a global developer setting
# ("Don't keep activities") and either outcome is a successful run, so it has no
# business gating a push. Run it, read the verdict, record it, delete it.

name: P0-1 Session Probe (manual)

on:
  workflow_dispatch:

jobs:
  p0_1_session_probe:
    name: p0_1_session_probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # The probe is compiled out without this; the runner fails loudly if the
      # ARMED marker never appears, so a forgotten define cannot read as a
      # verdict.
      HAVEN_P0_1_PROBE: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core
          key: p0-1-session-probe-x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build before the emulator boots (build-before-boot discipline). The
      # probe define must be baked in — `flutter drive` does not re-pass
      # dart-defines.
      - name: Build the probe APK
        working-directory: haven
        timeout-minutes: 30
        run: |
          flutter build apk --debug \
            --target-platform android-x64 \
            --target=integration_test/p0_1_session_probe_test.dart \
            --dart-define=HAVEN_E2E_RELAY="${HAVEN_E2E_RELAY}" \
            --dart-define=HAVEN_P0_1_PROBE=true
          mkdir -p /tmp/integration-apks
          cp build/app/outputs/flutter-apk/app-debug.apk \
            /tmp/integration-apks/p0_1_session_probe_test.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # `disable-animations: false` — the runner toggles
      # `always_finish_activities` itself and restores it in its EXIT trap; a
      # cached AVD must not be left with that setting on.
      - name: Run the probe on the emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 6144
          disable-animations: false
          script: bash tooling/e2e/ci/run-p0-1-session-probe.sh /tmp/integration-apks/p0_1_session_probe_test.apk integration_test/p0_1_session_probe_test.dart

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p0-1-session-probe-${{ github.run_id }}
          path: |
            /tmp/p0-1-probe-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
