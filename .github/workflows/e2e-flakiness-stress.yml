# Active flake-stress workflow (backlog CI-5).
#
# Runs the consolidated functional flow (`e2e_combined.dart`) N times on
# a single AVD and FAILS the build if ANY single iteration fails. This
# is the ACTIVE counterpart to the report-only e2e-flakiness.yml
# monitor: that workflow tallies historical pass/fail from the Actions
# API and never fails; THIS one provokes flakiness on demand / nightly
# and turns red the moment an iteration fails, so an intermittent
# regression is caught proactively rather than discovered weeks later in
# the aggregate.
#
# Triggers:
#   - workflow_dispatch: run on demand with a configurable iteration
#     count (default 10).
#   - schedule (nightly): the standing safety net — re-stresses the full
#     flow every night so a freshly introduced flake surfaces within a
#     day instead of at the next manual run.
#
# Architecture mirrors e2e-android.yml (single AVD, APK built BEFORE the
# emulator boots so the multi-GB Rust-NDK + Gradle peak never coincides
# with a resident emulator — the historical lost-runner cause; see
# docs/E2E_TROUBLESHOOTING.md). The N-iteration loop, with a fresh
# hermetic strfry relay reset PER iteration, lives in the checked-in
# tooling/e2e/ci/run-flake-stress.sh; nothing about the e2e_android job
# is touched.

name: E2E Flakiness Stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to run e2e_combined (fails on any single failure)."
        required: false
        default: "10"
  schedule:
    # Nightly at 04:00 UTC — off-peak, and distinct from the weekly
    # report-only monitor (Mondays 06:00) and the weekly dependency
    # audit, so the heavy stress run doesn't pile onto another job.
    - cron: '0 4 * * *'

# Don't pile nightly + a manual dispatch on top of each other; a new run
# cancels an in-progress one for the same workflow.
concurrency:
  group: e2e-flakiness-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake_stress:
    name: flake_stress
    runs-on: ubuntu-latest
    # The loop is N x one e2e_combined drive (the ~12-minute e2e_combined
    # ceiling bounds its main scenario) plus a relay reset per iteration.
    # Healthy that is ~6 min an iteration (the stress step's sizing evidence
    # below), so the default N=10 fits with slack for boot, the build, and
    # resets. It does not cover the worst case, and no job GitHub allows could:
    # an iteration's own is run-single-avd-scenario.sh's sum (stated at its
    # CONNECT_WATCHDOG_SECS) at this lane's 20m drive, 2 x (300 + 5 + 120 + 5)
    # + 1200 + 30 + 120 barrier + 20 Wi-Fi + 120 route = 2350 s = 39m10s (each
    # retry restores the app its failed attempt's teardown uninstalled), so ten
    # are ~392 minutes of bounded waits — past 360 before the 11.0-13.7 minutes
    # of steps ahead of the loop (8 nightly runs, 2026-09). The stress step's
    # 289m deadline is what reaps a degraded loop, or a dispatch with too many
    # `iterations`, by name.
    #
    # The job cap must clear the SUM of the step caps: below it, a run whose
    # every step is still inside its own cap can die here, and a job-cap death
    # skips every `if: failure()` step (e2e-android.yml states the rule). That
    # sum is Build the runtime log scanner 10 + Build E2E test APK 22 +
    # Provision the Android SDK 11 (derived in that script) + Create AVD
    # snapshot (on an AVD-cache miss) 15 + the stress step 299 (derived
    # there) + the most the work no step cap bounds has taken, 2.2 min over all
    # 96 runs of this job (2026-06-08..09-11; 1.0 of it Setup Flutter, run
    # 32446197604) = 359.2 -> 360, which is also GitHub's ceiling on a hosted
    # job: this cap cannot rise, so a step cap raised here must come off
    # another. The build step gave the 3 minutes its sum first needed (sized
    # there); the stress step gave the scanner build its 10, and then the 11
    # this lane's SDK provisioning needs, going 310 -> 299 (deadline 300m ->
    # 289m) — at ~6 min an iteration the default loop is under an hour, so
    # 289m still reaps a degraded loop and nothing else; the snapshot step has
    # never run in this job (96 of 96 runs restored the AVD cache), so there is
    # no measurement to trim it by.
    # job-uncapped-minutes: 2.2 (96 runs, worst 32446197604)
    timeout-minutes: 360
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # Receive path, DECLARED — and this lane is the one where the inherited
      # value was actively wrong (CI_HARDENING_BACKLOG.md A7).
      #
      # `liveSyncEnabled` is `bool.fromEnvironment('HAVEN_LIVE_SYNC',
      # defaultValue: true)`. This lane never passed the define, so since the
      # M11 Phase-B flip it silently compiled the LIVE build and ran the ten
      # M11 live-sync scenarios on top of the main + FE-2 flow — while every
      # number in this file is derived from the POLL path: the job envelope
      # cites "the ~12-minute e2e_combined ceiling", and each iteration's drive
      # is bounded by run-single-avd-scenario.sh's default DRIVE_TIMEOUT of 20m.
      # e2e-android.yml's flag-on lane needs HAVEN_DRIVE_TIMEOUT=28m and a 51m
      # outer wrapper for exactly that suite, so the budget here was ~8 minutes
      # short of the work being asked for, ten times a night. Nightly evidence
      # (run 30733446211): iterations report "+15 -1"/"+14 -2" — the LIVE test
      # count — failing on `[MapShell] live-sync start error: ... an MLS
      # session is already open on this database (Rule 14)`, and the schedule
      # has been red on roughly 8 of the last 12 nights.
      #
      # "false" is what this lane's stated design asks for: it exists to stress
      # the SAME flow the PR gate runs (its header: "Architecture mirrors
      # e2e-android.yml"), and e2e-android's default — the variant ci.yml and
      # e2e-nightly.yml call with no `with:` — is live_sync=false. No coverage
      # is lost: the live suite is a required PR gate in its own right
      # (ci.yml's "E2E Core Flow (Android, live-sync)"), sized for it. Stressing
      # the live path is a separate lane, not a silent default: at its 28m drive
      # one iteration's worst case is 1150 + 1680 = 2830 s = 47m10s
      # (run-single-avd-scenario.sh's sum), and ten of those (~472 min) do not
      # fit this job's 360-minute envelope.
      HAVEN_LIVE_SYNC: "false"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      # workflow_dispatch supplies inputs.iterations; schedule does not,
      # so fall back to 10. run-flake-stress.sh validates this is a
      # positive integer and caps it.
      FLAKE_ITERATIONS: ${{ github.event.inputs.iterations || '10' }}
      # The runtime log scanner (tooling/logscan) is wired into this lane. The
      # runner reads the flag: it seals the run's needle manifest and runs every
      # captured log through tooling/e2e/ci/scan-logs.sh before echoing or
      # keeping any of it. No recording proxy runs here, so the needles are the
      # host-known constants of tooling/e2e/ci/host-needles.sh (the `host`
      # profile): the fixed role seeds, the role and canary coordinates and the
      # canary name stems.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/logscan
          # Distinct cache key so this lane doesn't race e2e_android /
          # e2e_integration on the same cache entry.
          key: e2e-flake-stress-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (same reasoning as the APK build below). Capped
      # so a cargo stall fails fast; the cap is a term of the job cap's sum
      # above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      # The needle directory is rotated BEFORE any drive: a manifest left by an
      # earlier run on a reused runner would be reused as this run's (the
      # host-profile gate reuses the manifest already at its out path).
      # Owner-only, because what lands there is every identifier the run
      # declares, verbatim.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build the e2e_combined APK ONCE before the emulator boots (same
      # target every iteration). Same OOM-avoidance contract as
      # e2e-android.yml: the build peak must not coincide with a
      # resident emulator. The --dart-define baked here MUST match the
      # relay URL the drive step uses (value is compiled into the APK).
      - name: Build E2E test APK
        working-directory: haven
        # 22, where e2e-android.yml's identical build has 25: this job's cap is
        # GitHub's ceiling, so the 3 minutes its sum needed came from here
        # (derived at the job cap). Across all 96 runs of this job the build
        # took at most 16.9 min (run 27185662815, June) and nothing since July
        # over 12.8, so 22 is 5 minutes over the worst it has ever taken.
        timeout-minutes: 22
        run: |
          # --target-platform android-x64: the AVD is x86_64 (see arch below), so
          # x64 is the only ABI it runs. Matches every other E2E lane; omitting it
          # builds the heavy debug Rust lib for all three ABIs (cargokit auto-adds
          # the targets), wasting build time and runner disk. No effect on what is
          # tested — the suite runs on the x64 AVD.
          flutter build apk \
            --debug \
            --target-platform android-x64 \
            --target=integration_test/e2e/e2e_combined.dart \
            --dart-define=HAVEN_E2E_RELAY="${HAVEN_E2E_RELAY}" \
            --dart-define=HAVEN_LIVE_SYNC="${HAVEN_LIVE_SYNC}"
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/scenario.apk
          ls -lh /tmp/scenario.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Install and VERIFY every SDK package the emulator action needs, before
      # its FIRST use below. The action installs them itself, with bare
      # `sdkmanager --install` calls tried once and checked by nothing: in CI
      # run 35524002720 the emulator's download failed, the action stopped,
      # and the last thing it printed was its teardown's "could not connect to
      # TCP port 5554" — a message about the emulator, from a job that ran no
      # test.
      # Unconditional, deliberately — the AVD cache holds `~/.android/avd/*`
      # only, so a cache HIT still needs the emulator binary and the system
      # image. The arguments MUST equal the api-level/target/arch of every
      # emulator step in this job (check_android_sdk_provisioned.sh). Once the
      # packages are present the action's own installs are no-ops (5 s).
      # The cap is the script's worst case, 9.5 min (its 360 s budget + the one
      # 180 s attempt that can start inside it + that attempt's 30 s emulator
      # probe), plus the step's own startup, rounded up.
      - name: Provision the Android SDK
        timeout-minutes: 11
        run: bash tooling/e2e/ci/provision-android-sdk.sh 34 google_apis x86_64

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared snapshot key (identical api/arch/target/profile) so
          # this lane restores the snapshot the other E2E lanes built.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # This step's entire job is booting an emulator, and until 2026-08-03 it
        # had no bound of any kind — a wedged boot here ran to the JOB cap,
        # which SIGKILLs the runner before any if: failure() step, so the lane
        # died slow and with no artifacts. Measured across 23 successful runs
        # (ci.yml, 2026-07/08) the snapshot takes 91-130 s; 15 min is ~7x the
        # observed max, so it can only ever fire on a genuine wedge. The
        # emulator-boot-timeout below is the action's own inner bound (7 min,
        # matching the drive steps) and fires first with the action's message.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Bound the boot itself (the only thing this step does) so a wedged
          # emulator fails inside the step rather than at the step cap above.
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # Drive e2e_combined N times with a fresh relay per iteration. The
      # APK was built above, so no Gradle runs here. STRFRY_IMAGE is
      # forwarded so the per-iteration relay resets inside
      # run-flake-stress.sh pull the same pinned image.
      #
      # BOUNDS. Three of them, innermost first:
      #   20m  per-iteration `flutter drive` (run-single-avd-scenario.sh's
      #        default HAVEN_DRIVE_TIMEOUT; this lane is poll-path, so the
      #        default applies).
      #  289m  this step's inner deadline (run-with-deadline.sh below) — the
      #        AGGREGATE bound over the whole iteration loop, and the only one
      #        that reliably reaps (CI_HARDENING_BACKLOG.md A8).
      #  299m  this step's timeout-minutes = 289 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + margin; 360m job cap above.
      # Sizing evidence: 8 successful nightly runs put the DEFAULT 10-iteration
      # loop at p50 43.7 / max 59.4 min (~6 min/iteration). 289m is ~5x that.
      # It was 300/310 until the SDK provisioning step was added: 360 is
      # GitHub's ceiling for a hosted job, so the job cap above could not
      # absorb the new step's 11 and this step gave them, the way that comment
      # says a step cap raised in this job must be paid for.
      # NOTE the iteration count is a workflow input (default 10, script cap
      # 1000): at ~6 min/iteration this deadline covers ~48 iterations, the
      # same exposure the 299m step cap already had. A deliberately long
      # stress run needs all three numbers raised together.
      - name: Stress-run e2e_combined on the emulator
        timeout-minutes: 299
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # STRFRY_IMAGE is set HERE (not at job level) because the
          # per-iteration relay resets inside run-flake-stress.sh need
          # it in the environment. FLAKE_ITERATIONS is already a
          # job-level env var, so it is inherited by this step's process
          # (and the action's script) without re-declaration — same way
          # the job-level HAVEN_E2E_RELAY reaches the script.
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Bound the boot (which happens BEFORE `script:` runs, and is
          # therefore outside the deadline below).
          emulator-boot-timeout: 420
          # Single bash invocation — the action runs each line of a
          # multi-line script: in its own sh -c, dropping loop state.
          #
          # The iteration count is rendered into the command at
          # workflow-evaluation time via the `${{ env.FLAKE_ITERATIONS }}`
          # GitHub expression (NOT a `${SHELL_VAR}`), so the literal
          # number is substituted into the script string before the
          # action runs it — this does not rely on the action's subshell
          # inheriting the job-level env var. run-flake-stress.sh still
          # validates the value is a positive integer and caps it.
          script: bash tooling/e2e/ci/run-with-deadline.sh 289m "e2e-flakiness-stress loop" -- bash tooling/e2e/ci/run-flake-stress.sh "${{ env.FLAKE_ITERATIONS }}" integration_test/e2e/e2e_combined.dart

      # `if: always()` and `.log`, not `.txt`: the scan step below runs on every
      # outcome short of a cancellation and refuses an absent file, and the
      # scanner's directory walk only ever picks up `*.log` — a `.txt` here
      # would be the one uploaded path the guard cannot see.
      - name: Capture host + emulator diagnostics
        if: always()
        run: |
          {
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l ==="
            adb devices -l || true
            echo
            echo "=== adb shell dumpsys meminfo com.oblivioustech.haven ==="
            adb shell dumpsys meminfo com.oblivioustech.haven || true
            echo
            echo "=== top (1 sample) ==="
            top -bn1 | head -40 || true
          } > /tmp/diag.log 2>&1

      # Where each uploaded log is scanned, and by what. The failed iterations'
      # logcat, drive and relay logs go through the runner's log-privacy gate
      # (HAVEN_LOGSCAN above): tooling/e2e/ci/scan-logs.sh — the key-material
      # floor AND the identifier scanner, against the manifest sealed from the
      # host needles — deleting them on a leak, before any drive log is echoed.
      # The relay log is dumped BY THE RUNNER, per failed iteration, out of the
      # live container; a step here could only ever read a container this
      # script's own EXIT trap has already removed, which is why this job no
      # longer collects one (it uploaded a line of docker error text under the
      # relay name until CI run 35280144455 measured the same defect in the
      # sibling lanes). What is left is scanned HERE, against the SAME
      # manifest, by the same wrapper: the host diagnostics as a `diag` sink (a
      # one-line floor, no plant requirement). Scan-before-upload, as its OWN step on
      # every outcome short of a cancellation: a leak (rc 1) deletes every
      # scanned file and fails the lane even on an otherwise green run, so the
      # upload finds nothing to publish; an unscannable log (rc 3), a broken
      # guard (rc 2) or an unmet floor (rc 4) fails it and leaves the files as
      # they are. The standard guard condition (not `always()`) is what lets
      # docs/privacy/privacy_invariants.json cite this step as the runtime
      # scanner's enforcing run.
      # /tmp/flake-logs/ was gated by run-flake-stress.sh (typed by name,
      # against the same manifest).
      - name: Scan captured logs for secrets before upload
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          rc=0
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest /tmp/haven-soak/needles/*.needles.json \
            --sink diag=/tmp/diag.log \
            --report /tmp/logscan-report-upload.ndjson || rc=$?
          exit "${rc}"

      # run-flake-stress.sh copies each FAILED iteration's logcat +
      # drive log under /tmp/flake-logs/iter-<n>.* and dumps that
      # iteration's relay log beside them as strfry.iter-<n>.log, so the
      # failing iteration's evidence survives. An all-green run leaves the
      # directory empty on purpose (nothing flaked, so there is nothing to
      # preserve); if: always() so the diagnostics still upload.
      - name: Upload flake-stress artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-flake-stress-${{ github.run_id }}
          path: |
            /tmp/flake-logs/
            /tmp/diag.log
          retention-days: 14
          if-no-files-found: ignore

      # The sealed manifest holds the run's identifiers verbatim. It is never
      # uploaded (check_wire_proxy_test_only.sh) and does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
