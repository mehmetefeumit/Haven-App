# Reusable workflow: Rust checks
# Verifies formatting, linting, and tests for both Rust crates:
#   - haven-core: the protocol/crypto library (pure Rust)
#   - haven/rust_builder: the flutter_rust_bridge FFI surface
#
# Both must pass clippy individually. Until 2026-05-24, rust_builder
# was not clippy-checked, which masked a `too_many_arguments` issue
# on `CircleManagerFfi::create_circle` surfaced during the E2E Phase
# 0 work. Adding rust_builder here closes that gap.

name: Rust Check

on:
  workflow_call:

jobs:
  haven-core:
    name: haven-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haven-core

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core

      - name: Check formatting
        run: cargo fmt --check

      # `--all-targets`, matching the rust_builder job below. Bare `cargo clippy`
      # selects --lib/--bins only, so this crate's `#[cfg(test)]` modules and its
      # 20 `tests/*.rs` integration targets were never linted — 123 findings had
      # accumulated there, including 24 discarded `#[must_use]` `StopOutcome`s
      # (a discarded `TimedOut` reports a drain that did not happen).
      #
      # `--all-targets` also pulls in dev-dependencies, which turns on the
      # `test-utils` feature — so it lints the `#[cfg(feature = "test-utils")]`
      # lib surface (e.g. `SessionManager::new_unencrypted`) that bare clippy
      # never compiles either.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `set -o pipefail` so `tee` cannot mask a failing cargo exit code —
      # GitHub's default shell is `bash -e {0}`, which does NOT set it.
      - name: Run tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "${RUNNER_TEMP}/haven-core-cargo-test.log"

      # `cargo test` prints "21 ignored" and exits 0. Nothing asserted that
      # number, and the reporter never names the tests, so a keyring- or
      # Blossom-gated proof could stop running with no trace but a digit. The
      # gate reconciles the run's real skip list against
      # scripts/ci/expected_test_skips.txt: an undeclared skip fails, and so
      # does a declaration whose test is gone (a stale allowance is its own
      # false green).
      - name: No undeclared test skips
        run: bash ../scripts/ci/check_no_undeclared_skips.sh cargo haven-core "${RUNNER_TEMP}/haven-core-cargo-test.log"

      # Release builds disable `debug_assertions`, so a production path that
      # accidentally calls a `#[cfg(any(test, debug_assertions))]`-gated method
      # compiles under `cargo test`/dev `cargo check` but FAILS the real release
      # build (cargokit / build_release.sh). Catch that class of break here.
      - name: Release build (no debug_assertions)
        run: cargo build --release --lib

  rust-builder:
    name: rust_builder (FFI surface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haven/rust_builder

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key so this job and haven-core don't fight
          # over a shared snapshot.
          workspaces: haven/rust_builder
          key: rust-builder

      - name: Check formatting
        run: cargo fmt --check

      # `--all-targets` so `#[cfg(test)]` code is COMPILED and linted here.
      # Bare `cargo clippy` selects --lib/--bins only, so before this the FFI
      # test modules were never type-checked by CI at all — a test that did not
      # even compile would still have gone green.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The FFI boundary's own tests. Nothing in CI executed them before, which
      # left the Rule 4/6/8 `Debug`-redaction oracles
      # (circle_member_ffi_debug_redacts_keys_and_name,
      # profile_metadata_debug_redacts_the_picture_hash,
      # location_message_result_ffi_debug_redacts_secrets,
      # ffi_relay_event_debug_is_presence_only) and the M10 logout-wipe tests
      # decorative. coverage.yml's rust job is `working-directory: haven-core`
      # and does NOT reach this crate.
      - name: Run tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "${RUNNER_TEMP}/rust-builder-cargo-test.log"

      # All five of this crate's `#[ignore]`d tests are the real-OS-keyring
      # twins of FFI tests that run in-memory. If one of the in-memory ones ever
      # acquires an `#[ignore]` too, the pair collapses to nothing — and the
      # only signal would be "5 ignored" becoming "6 ignored".
      - name: No undeclared test skips
        run: bash ../../scripts/ci/check_no_undeclared_skips.sh cargo rust_builder "${RUNNER_TEMP}/rust-builder-cargo-test.log"
