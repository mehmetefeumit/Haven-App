# On-demand live-sync (flag-on) E2E.
#
# The per-commit CI (ci.yml) now runs the flag-on lanes on EVERY push/PR via its
# dedicated `e2e-android-live-sync` / `e2e-ios-live-sync` jobs (promoted once the
# flag-on path proved green end-to-end). This workflow is retained as a manual
# convenience: trigger it (Actions -> "E2E Live-Sync (on-demand)" -> Run
# workflow) to re-run JUST the flag-on lanes on any branch without waiting for
# the full CI fleet.
#
# It builds the SAME e2e_combined.dart with `--dart-define=HAVEN_LIVE_SYNC=true`
# so the live-sync scenarios run against the persistent engine (they
# self-skip on the poll-path lanes, which ci.yml still runs separately to keep
# the HAVEN_LIVE_SYNC-off rollback path proven — it is no longer the production
# default, which has been live-sync ON since M11 Phase B).
#
# It reuses the SAME reusable lanes ci.yml calls (e2e-android.yml /
# e2e-ios.yml, via their `live_sync` input), so there is exactly one definition
# of each lane and the flag-on run cannot drift from the poll-path run.
name: E2E Live-Sync (on-demand)

on:
  workflow_dispatch:

jobs:
  # The run's Android Gradle dependency set, which every Android lane needs and
  # builds offline from (android-gradle-deps.yml). Its failure skips them and
  # reddens `verdict`.
  gradle-deps:
    name: Android Gradle Dependencies
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-gradle-deps.yml

  e2e-android-live:
    name: E2E Core Flow (Android, live-sync)
    needs: [gradle-deps]
    uses: ./.github/workflows/e2e-android.yml
    with:
      live_sync: true

  e2e-ios-live:
    name: E2E Core Flow (iOS, live-sync)
    uses: ./.github/workflows/e2e-ios.yml
    with:
      live_sync: true

  # Red unless every job above succeeded: a lane skipped because the Gradle
  # dependency job failed is not a passed lane (scripts/ci/check_all_jobs_passed.sh).
  verdict:
    name: All jobs passed
    if: always()
    needs:
      - gradle-deps
      - e2e-android-live
      - e2e-ios-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Every job this run needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci/check_all_jobs_passed.sh --judge
