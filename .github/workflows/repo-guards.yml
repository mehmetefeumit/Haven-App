# Reusable workflow: repository guards.
#
# All of Haven's fast, deterministic policy/privacy/correctness invariants,
# consolidated into ONE job. Every step is a pure grep/bash check over the
# checked-out tree — no Flutter/Rust toolchain, no emulator. Each guard runs
# even if an earlier guard failed, so a single red run reports EVERY violated
# guard, not just the first.
#
# "The whole job costs seconds" is what this line used to say, and it stopped
# being true well before the privacy-invariant gate arrived: measured
# sequentially the job is a few MINUTES, dominated by pre-existing wire-oracle
# self-tests. No figure is written down here on purpose — it would go stale on
# the next guard added, which is the mistake install_git_hooks.sh made. The
# job carries an explicit timeout instead, because it now also makes one
# network call (the ratchet's baseline fetch).
#
# The guards. Scripts are the single source of truth for what each check
# enforces — see each script's header; this index says only why the check is
# here. It is NOT one entry per step: a guard with fixtures contributes two
# steps (its enforcing run and its `--self-test`) under one entry, and the
# `tooling/e2e/ci` harness self-tests are indexed as a single group. Every
# `scripts/ci/check_*.sh` invoked below has an entry.
#
#   Committed-secrets scan            scripts/ci/check_no_committed_secrets.sh
#     The Stadia Maps API key (or any UUID-shaped secret) must never be
#     committed; the gitignored dart-define secrets file must stay untracked;
#     tiles.dart must keep injecting the key at compile time.
#
#   Map tile provider policy          scripts/ci/check_tile_provider.sh
#     The raw OpenStreetMap endpoint must never become the released default
#     tile source (OSMF tile usage policy).
#
#   Tile cache keeps no secrets       scripts/ci/check_no_tile_cache_secrets.sh
#     The encrypted tile cache must not persist or log the Stadia API key: no
#     api_key/url column in the Rust tile layer, no value-interpolating log::
#     call on a tile URL, and Dart tile logs stay presence-only (runtimeType).
#     NOTE: this guard existed, passed, and was wired to NOTHING until
#     2026-07-31 — it is the tile half of Security Rule 6/10.
#
#   Public-profile privacy boundaries scripts/ci/check_profile_privacy_boundaries.sh
#     The public Nostr profile module (kind-0 + Blossom) must stay inside its
#     privacy boundary: global Image.network ban, no circle/group tokens in
#     profile paths, no circle/MLS/mdk imports inside the profile module (key
#     separation), kind-0 construction confined to the profile module,
#     HTTPS-only Blossom, the retraction no-op gate, the §1.7 fetch-union
#     invariant, no batched kind-0 filter, CSPRNG-only inside the module, no
#     NIP-65 relay list for the profile plane (what SECURITY.md P3 cites as its
#     enforcement), and the Dart/Rust fallback-relay mirror. This entry listed
#     the first six alone until 2026-08-13, six checks after that stopped being
#     true; the script's header carries the authoritative enumeration and
#     deliberately restates no count.
#
#   Member-directory privacy          scripts/ci/check_member_directory_privacy.sh
#     The local member directory is a contact list: everyone this device shares
#     a circle with, plus everyone it shared one with in the last three days.
#     It turns into a social graph if a row can be attributed to a circle, into
#     a permanent record if the purge stops running, and it outlives identity
#     deletion if a second copy lands outside the SQLCipher database that
#     logout deletes. The module's own tests pin the column list, the three-day
#     constant and the DELETE; this guard covers only what those tests cannot
#     see — a second writer or a companion 'directory' table, an ALTER on a
#     migration path a fresh open never takes, the directory API being wired up
#     without its purge, and a sidecar in Rust, Dart or native code. Plan: docs/MEMBER_PICKER_PLAN.md §6.1 / §10 D3 / §13.
#
#   Profile-relay override single site scripts/ci/check_profile_override_single_site.sh
#     The kind-0 plane's test-only relay override is install-once, so a second
#     call site throws and the winner depends on call order — which is how
#     e2e_profile broke on both platforms in CI run 30753193231, under a comment
#     asserting the invariant this now enforces.
#
#   Android INTERNET permission       scripts/ci/check_internet_permission.sh
#     The production manifest must keep android.permission.INTERNET — it is
#     the relay receive path; a release without it ships silently broken.
#
#   App-wide FLAG_SECURE              scripts/ci/check_flag_secure_app_wide.sh
#     Haven blocks screenshots everywhere in the app on Android. FLAG_SECURE is
#     a WINDOW flag, so the per-Activity `setFlags` this replaced protected
#     MainActivity and nothing else — including `UCropActivity`, a
#     dependency's Activity that renders the user's picked photo full-screen.
#     The guard is a union: HavenApplication.onCreate registers the lifecycle
#     callbacks, onActivityCreated SETS (never clears) the flag, no Activity
#     sets it in isolation, and the manifest still names the Application class —
#     because with that attribute gone every other link is intact and runs
#     never.
#
#   iOS app-switcher blur             scripts/ci/check_ios_privacy_blur.sh
#     The iOS half of the same protection. iPhone cannot block capture, so
#     what Haven does there is blur the app-switcher preview — six lines of
#     AppDelegate.swift that were backed by nothing at all. Delete them and
#     every other gate stays green. Union: installed on
#     applicationWillResignActive (the switcher card is on screen while the
#     app is still FOREGROUND, so didEnterBackground is too late), covering
#     the window with a real .systemMaterial blur, removed and re-armed only on
#     applicationDidBecomeActive, and no UIApplicationSceneManifest in
#     Info.plist (adopting scenes stops UIKit calling any of those callbacks,
#     leaving every other link intact and executing never).
#
#   Background-wake invariants        scripts/ci/check_m7_native_wake_guards.sh
#     Static correctness invariants of the Android WorkManager + iOS
#     SLC/BGTask background wakes (DartPluginRegistrant order, RebootReceiver
#     intent-filter, BGTask identifier parity, teardown-channel separation,
#     iOS-safe registration gate, wake-path intent re-check). The runtime
#     proofs live in the E2E background catch-up lane; this covers only what
#     a static check can prove.
#     Check 9b is the odd one out: it keeps the app free of analytics,
#     crash-reporting and advertising code the way check 9 keeps it free of
#     push. It refuses such a dependency
#     in every position that reaches a build — pubspec (direct AND dev), the
#     transitive pubspec.lock, both Cargo manifests and lockfiles, every
#     haven/android build file, AndroidManifest components, Info.plist keys,
#     PrivacyInfo.xcprivacy, a Podfile when present, and the config files whose
#     mere presence is an SDK. Names in dependency POSITIONS, never free text,
#     so prose explaining the ban stays legal. It cannot see a hand-rolled
#     http.post of usage data, an SDK vendored inside another plugin's own
#     native artifact, or a coordinate assembled from variables; what it does
#     make impossible is scanning nothing, which is why it fails on a missing
#     or reshaped manifest and prints the file and position counts it read.
#
#   iOS background publish            scripts/ci/check_ios_background_publish.sh
#     The invariants that keep iOS background location PUBLISHING alive (and
#     keep opt-out users suspended). ONE STREAM OWNER PER PLATFORM: Info.plist
#     `location` background mode, exactly one geolocator call site (Android),
#     exactly one `positions(` call site and one native EventChannel subscriber
#     (iOS). The iOS session settings are no longer AppleSettings fields — they
#     are CoreLocation properties on Haven's own
#     `HavenLocationStreamHandler.swift`, and each pin moved with the behaviour:
#     `pausesLocationUpdatesAutomatically = false` and
#     `distanceFilter = kCLDistanceFilterNone` set once for BOTH profiles (the
#     opt-out arm's 1 m filter is retired by design — the 16.4 delivery rule
#     requires no filter of the one session, and the battery lever is now the
#     accuracy tier); EXACTLY TWO accuracy values ever assigned, because a
#     third, coarser one re-creates the suspension shape; the background
#     capability derived from the listen argument on one line and never a
#     literal, so it stays a pure function of the user's toggle from Dart to
#     CoreLocation; the background-start refusal pushed through the event SINK
#     (a RETURNED FlutterError never reaches the stream); one
#     `startUpdatingLocation()` site; only Best-profile fixes cached, and that
#     cache dropped on cancel and on demand. Plus the tier policy: under
#     CONFIRMED Always no activity session and the indicator off, under
#     When-In-Use / provisional Always / iOS 17 the When-In-Use posture, the
#     release of that session gated on `applicationState != .background`, the
#     diagnostics observer re-running the policy rather than only setting a
#     flag, and `disarm()` UNCONDITIONAL. Plus the C4 disable-while-paused
#     watcher and its opt-out release, presence-only location logging, the
#     AppDelegate wiring ORDER, the relaunch region coupled to SLC, and the
#     four project.pbxproj references without which the Swift file compiles
#     nowhere and fails as a MissingPluginException Dart reads as "no native
#     handler". Its `--self-test` runs as its own step: NO Swift unit test runs
#     in this CI at all, and the other function-shaped checks pin invariants
#     nothing behavioural can observe — a session whose only symptom is "iOS
#     suspended the app" hours later and off-device, a branch that only runs
#     while the process is PAUSED (and `MapShell` cannot be pumped at all), and
#     a region that can only ever fire after a real termination (owner
#     checklist, docs/M7_BACKGROUND_SHARING.md §6 item 2b) — so a rotted guard
#     would take those invariants with it in silence. Every fixture is a
#     mutation that leaves the file compiling and reading correctly, including
#     a GUTTED function body and the fully-commented-out anti-vacuity case.
#
#   Location access gate ordering     scripts/ci/check_location_access_gate.sh
#     No stored coordinate may outlive the user's location access. The
#     geolocator service caches the stream's latest fix (168 s of servable
#     exposure), and only STATEMENT ORDER stops that cache — and the
#     iOS-backgrounded last-known shortcut — from being served ahead of the
#     permission/provider gate, which is where they used to sit. Also pins:
#     every denial CLEARS the cache instead of merely refusing the call; the
#     gate never raises a permission prompt while backgrounded (iOS defers it
#     and geolocator never resolves the future); the gate reads the granted
#     ACCURACY, the only signal for a Precise-Location/FINE downgrade that
#     checkPermission still calls whileInUse; and the per-circle publish
#     chain bounds each link, since a hung future raises no error for
#     catchError to catch.
#
#   Estimate integrity                scripts/ci/check_estimate_integrity.sh
#     There is no hardware for the power programme (POWER_EFFICIENCY_PLAN.md
#     §2.5), so every battery figure in this tree is an output of estimation
#     model E (§6.5a) and none may read as a measurement. Enforced twice by a
#     manual sweep before this guard existed, and an adversarial review found
#     three whole classes both sweeps had missed — including the two a numeric
#     grep can never see: a zero-cost verdict ("no new battery cost") and a
#     directional claim ("the dominant iOS drain", which model E's own finding
#     2 contradicts). Also refuses a measurement whose named instrument is
#     gone: `config.rs` cited a real-relay p50/p99 for weeks after that suite
#     became a DELETED-WITH-SUBJECT tombstone. Its two checks have DIFFERENT
#     roots, deliberately: the attribution check reads code and CI only (in
#     `docs/` the model is the subject and its per-phase table is thirty figures
#     in six rows, which the sentence unit cannot grade — 54 findings there,
#     37 inside that section, and the rest are mentions of a unit rather than
#     claims in it: a column heading, a formula, a start-of-charge band), while the
#     citation check also reads `docs/`, where it caught the same tombstoned
#     suite cited twice in M11_ROLLOUT.md. See the script header for both, and
#     for why the exemption allowlist is now empty.
#
#   Publish rotation fairness         scripts/ci/check_publish_rotation_fairness.sh
#     The multi-circle round-robin queue is rewound in exactly ONE place — a
#     statement of `build()`, not merely somewhere inside it — the survivor
#     merge stays in `_syncCircles`' own body BELOW the empty-roster guard, and
#     the tick reads the roster with a lookup, never `_circles[key]!`. The first
#     two are pure statement PLACEMENT: clearing on pause REWOUND the queue every
#     background round trip and re-served the same `updated_at DESC` head
#     forever (11 of 13 circles), while reconciling against an emission of
#     nothing RE-PHASES it — `circlesProvider` degrades every roster-read failure
#     to `[]`. The third is one character: the queue outlives an emptied roster
#     on purpose, so a bang makes a designed state a crash, and because
#     `JitteredScheduler._fire` swallows and re-arms, every later tick throws
#     while the sharing banner stays green. Behavioural tests cover all three;
#     this is the reorder half, which two mutations previously survived.
#
#   Locale stays device-local         scripts/ci/check_locale_privacy.sh
#     The app language must remain a local preference and never be referenced
#     from the service layer (nothing locale-shaped may reach a relay).
#
#   Epoch-repair isolation            scripts/ci/check_epoch_repair_isolation.sh
#     The epoch-rotation repair authors an MLS commit, so it must run only on
#     the foreground service layer (Rule 14 / gate 5) and must never be driven
#     by a timer — the user-facing copy and INV-E-NO-PERIODIC-REKEY both promise
#     keys change on a membership change or an explicit repair, never
#     periodically.
#
#   No exporter-label override        scripts/ci/check_no_exporter_label_override.sh
#     The transport-nostr-peeler's with_exporter_label hook is the only local
#     lever that can downgrade the kind-445 exporter derivation away from
#     "marmot/group-event"; Haven's Rust source must never name it.
#
#   Inner location kind is pinned     scripts/ci/check_inner_location_kind.sh
#     The inner MLS-tunnelled location rumor's kind is the dispatch token every
#     other Marmot client in the circle renders on. At kind 9 — MDK's chat
#     message — Haven's coordinates arrived in co-members' chat clients as chat
#     bubbles. Pins the constant at 25442, requires the send path to name it
#     rather than a literal, and bans building any Marmot/MDK/NIP-01-allocated
#     kind from a bare number. The privacy manifest's rule 13 declares the
#     TOKEN and cannot see the constant's value; this is the other half.
#
#   No event-timestamp cursor advance scripts/ci/check_no_event_timestamp_cursor_advance.sh
#     A sync cursor may never be advanced from an inbound event's `created_at`
#     (unauthenticated, remotely chosen, and poisoning it strands every event
#     below the new REQ floor). The deleted Dart/FFI group-cursor advance stays
#     deleted, and no FFI entry point may name the bare `group_445` stream.
#
#   Relay pool options                scripts/ci/check_engine_client_options.sh
#     Two pools with opposite duty cycles, neither allowed to adopt the
#     other's options. The PUBLISH pool holds no standing REQ, so it sends no
#     keepalive, never self-reconnects and sleeps between bursts — every
#     registration must pass `publish_relay_options()`, because a bare
#     `Client::add_relay` ORs `PING` back onto an already-pooled relay and the
#     pinger reads that flag live. The ENGINE pool exists to hold a standing
#     REQ on a socket carrying nothing else, so it KEEPS its ping and never
#     sleeps; it also must not enable nostr-sdk's `verify_subscriptions`,
#     which discards the stored events a REQ replays before nostr-relay-pool
#     registers that REQ's filter — silently, while the EOSE still advances
#     the cursor past them (the filter is re-checked in
#     `live_sync::supervisor::plane_wants_event` instead, where no such window
#     exists). Only a guard can hold either half: the dropped events are
#     probabilistic, and the wasted radio wakes only show up as battery, hours
#     later and off-device.
#     The same script also holds the background BURST, for the same reason —
#     every way it breaks is silent. Its close path must drain and
#     `note_delivery_gap` before it disconnects (a `forget_*` there drops an
#     un-applied hold-back the next burst's EOSE then skips past; a `shutdown()`
#     instead of a `disconnect()` empties the pool and the next burst's
#     subscribe fails with the opaque "no relays"), and no standing REQ may be
#     opened from the burst entry point. On the bridge side, each of the seven
#     `LiveSyncFfi` burst-lifecycle methods must FORWARD to the core method of
#     the same name and take no decision of its own: `rust_builder` has no test
#     that constructs a `LiveSyncFfi` and the Dart tests drive a fake, so a body
#     replaced by `Ok(())` — a pause that never pauses, a backlog wait that
#     always answers "settled" — compiles and passes every suite. Reachability,
#     not text: a guarded early return leaves the required call present and
#     dead. And the two `#[frb(sync)]` session reads must answer from `SESSION`
#     and carry no panic token, because a sync FFI read unwinds into Dart and
#     `unwrap_used`/`expect_used` are restriction lints this repo does not
#     enable.
#
#   Generated bridge pinned           scripts/ci/check_generated_bridge_pinned.sh
#     The flutter_rust_bridge-generated files are the one place a value's Rust
#     meaning and its Dart meaning are written twice, and nothing in the repo
#     compares them: `cargo check` types each half separately, no test crosses
#     the bridge, `FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH` is derived from
#     `api.rs` rather than from the generated content, and no job regenerates
#     and diffs. Inverting one discriminant of `BacklogOutcomeFfi` — whose two
#     values mean "every endpoint replayed, safe to encrypt" and "promises
#     nothing" — makes every background burst read a real timeout as settled
#     and publish at a stale epoch, with clippy, the tests and every other
#     guard green. This gate pins each generated file's sha256 and the codegen
#     version stamped in its header; `scripts/regenerate_frb.sh` is the only
#     writer of the pins, and it regenerates first.
#
#   Clock-skew policy parity          scripts/ci/check_clock_skew_policy_parity.sh
#     The device-clock skew policy lives authoritatively in Rust and is
#     mirrored in Dart across an FFI with no shared source of truth. If the
#     wire token drifts, Dart silently stops recognising a fast-clock
#     rejection and the failure goes invisible again with nothing else red.
#
#   Publish-jitter fraction parity    scripts/ci/check_publish_jitter_fraction_parity.sh
#     The ±40% publish-cadence jitter spread lives authoritatively in Rust
#     (`PUBLISH_INTERVAL_JITTER_FRACTION_BP`) and is mirrored in Dart as the
#     hard-coded endpoints `kLocationPublishMinInterval`/`kLocationPublishMaxInterval`.
#     Narrowing or widening the Rust fraction alone — constant and pinning
#     test moved together, correctly — leaves every existing gate green while
#     the Dart constants become false documentation of the sampled window.
#
#   Delta-alphabet parity             scripts/ci/check_delta_alphabet_parity.sh
#     The observable whole-second `created_at` delta alphabet is quoted in the
#     privacy manifest (four prose sites), in SECURITY.md and in
#     `constants/location.dart`, and its truth is the literal tables in
#     `publish_stagger_test.dart`. Nothing compared the two: all four manifest
#     sites were mutated from the account bound's `{2,3,4}` to the burst cap's
#     `{2,3}` — one circle past anything the app admits — and
#     `check_privacy_invariants.sh` exited 0, because its rules check that
#     symbols, tests, guards and anchors EXIST, never that a quoted figure
#     matches the code.
#
#   MDK supply-chain shape            scripts/ci/check_mdk_supply_chain.sh
#     haven-core/Cargo.lock must hold exactly the five Dark Matter crates —
#     no forbidden uniffi/app/account/QUIC/agent crates, no legacy mdk-*
#     crates, and a single libsqlite3-sys version.
#
#   Session-busy marker is log-only   scripts/ci/check_session_busy_marker_not_routed.sh
#     The Rule-14 "an MLS session is already open" marker must never drive a
#     decision — Haven's FFI errors interpolate remote-authored text, so a
#     substring test over them is a remote control channel. Callers ask the
#     registry (`is_session_live` / `isSessionLive`) instead.
#
#   MLS session single owner          scripts/ci/check_mls_session_single_owner.sh
#     `CircleManagerFfi.newInstance` may appear in exactly three files — one per
#     isolate that legitimately owns a session — the UI isolate's one must
#     latch the pause-time handoff, or the foreground service can never take
#     the session it was handed, and no opener file may release fewer handles
#     than it opens: only `dispose()` drops the Rust LIVE_SESSIONS claim, so one
#     missed release refuses every later open in EVERY isolate for the life of
#     the process. That count is a floor; the per-exit-path matching is the
#     analyzer lint `haven/test/lints/mls_session_handle_release_test.dart`,
#     which runs in the Flutter lane because it needs a toolchain this job
#     deliberately has none of.
#
#   Teardown drain budget derivation  scripts/ci/check_teardown_drain_budget.sh
#     The Dart `kBackgroundTeardownDrainBudget` — how long the Android
#     foreground service's `onDestroy` waits for an in-flight location publish,
#     and the number `handoverTimeout` is derived from — must stay equal to ONE
#     relay publish attempt in Rust (`CONNECTION_TIMEOUT + DEFAULT_TIMEOUT`).
#     Two languages, no shared header: drift is silent either way, costing a
#     routinely-abandoned publish or a user waiting out a teardown that already
#     finished.
#
#   Live-sync restart budget derivation  scripts/ci/check_live_sync_restart_budget.sh
#     The Dart `kLiveSyncRestartBudget` bounds one `ensureRunning()` — the only
#     periodic recovery the live-sync receive plane has, since MapShell arms its
#     next self-heal from that future's completion. It is the engine's own
#     stop+start bound (`RELAY_LIFECYCLE_OP_TIMEOUT_SECS`,
#     `SUBSCRIBE_CONNECT_WAIT_SECS`), so the two per-op magnitudes must stay
#     mirrored across the FFI — and the initializer must literally name them, so
#     a hardcoded budget with the right number still fails. It also pins the
#     resume re-anchor's throttle (`kLocationPublishOverlapGuard`) against
#     `GROUP_RESUBSCRIBE_BUFFER_SECS`: raise the Rust buffer and re-anchors
#     become wasted 7-day inbox replays, raise the Dart guard and resumes
#     silently lose the one repair a relay-`CLOSED` REQ has.
#
#   No key logging                    scripts/ci/check_no_key_logging.sh
#     Security Rule 6 at the SOURCE. `scan-logs-for-secrets.sh` matches seven
#     secret shapes over captured runtime logs, so it can only catch material a
#     lane executed, at a level the build let through, in a shape somebody
#     anticipated — a `Zeroizing<[u8; 32]>` rendered by a `{:?}` is none of
#     those. This reads every `log::`/`print`/`dbg!` and every
#     `debugPrint`, extracts ONLY the interpolated expressions (never the
#     message prose), and classifies them per identifier. It also pins the
#     `keyring_core` → Off filter for every logger backend `init_app` installs:
#     keyring-core logs the credential's `Debug` at DEBUG, and filtering it on
#     Android alone left the Apple unified log unfiltered.
#
#   Secret fields are zeroized        scripts/ci/check_secret_fields_zeroized.sh
#     Security Rule 7 as a scan rather than a list. The compile-time proof in
#     `zeroization_security.rs` is the strongest possible statement about the
#     two types on it and says nothing about the next one; it never grew past
#     two while the tree grew to five secret-bearing types. This flags any raw
#     byte/string field whose name — or whose STRUCT's name, which is the only
#     secret-shaped name `ProfileRelaySalt { bytes }` has — reads as secret
#     material and is neither `Zeroizing`-wrapped nor inside a `ZeroizeOnDrop`
#     struct.
#
#   Liveness port single owner        scripts/ci/check_liveness_port_single_owner.sh
#     Only the UI isolate may call initCommunicationPort(), and it must also
#     install the liveness responder — a second caller silently steals the port
#     and makes the foreground service reclaim a healthy session.
#
#   E2E publish-before-apply          scripts/ci/check_e2e_publish_before_apply.sh
#     An integration test that calls createCircle() must also resolve the
#     staged create (confirmPublished / publishFailed, Security Rule 13).
#     Skipping it pins the group in MDK's PendingPublish, where every inbound
#     kind-445 buffers forever and the scenario fails on the receive path with
#     nothing pointing back at the create.
#
#   Handoff convergence sees a fork   scripts/ci/check_e2e_handoff_convergence_oracle.sh
#     When the admin leaves a 3-member circle both remaining peers auto-commit
#     her SelfRemove, so a fork leaves them on the SAME epoch number with the
#     SAME member set — the two things e2e_combined's handoff gate used to
#     check. DM-4b invalidated that reasoning without touching the code, and
#     the lane stayed green only because a try/catch-swallowed "non-gating"
#     probe happened to converge the loser as a side effect; when a dropped
#     relay socket ate that probe the fork reached Phase 6 and the leave
#     timed out (run 32688074045). The guard pins the current-epoch
#     cross-decrypt that actually distinguishes one branch from two.
#
#   Background delivery is asserted   scripts/ci/check_m7_background_delivery_assertion.sh
#     The e2e-background-catchup lane must prove a background wake RECEIVED a
#     peer location, not merely that it booted. Its `M7_REQUIRE_DECRYPT`
#     switch defaulted to 0 and was set in no workflow, so for its whole life
#     the lane proved bootstrap under a name that said delivery. The guard
#     pins the workflow setting it, the runner still hard-failing, the CI-only
#     dispatcher arming the ws:// opt-in in the cold process AND delegating to
#     the production wake body, every m7_worker_* target registering it, and —
#     the privacy half — that no ws:// opt-in or HAVEN_E2E define ever appears
#     in the shipped worker library.
#
#   Live-sync define is declared      scripts/ci/check_live_sync_define_declared.sh
#     Every workflow job that BUILDS the app must say which receive path it
#     compiles. `liveSyncEnabled` is `bool.fromEnvironment('HAVEN_LIVE_SYNC',
#     defaultValue: true)` and the value is baked in at build time, so a lane
#     that omits the define does not build something neutral — it builds the
#     live-sync engine, chosen by nobody, under whatever name the lane carries.
#     build-check.yml and release-build.yml are the two allowlisted exceptions
#     (they build the SHIPPED artifact, whose path must come from defaultValue,
#     the M11 §8 rollback lever) and declare that intent with a token instead.
#     The guard also pins that the shared build wrappers keep FORWARDING the
#     define, since a workflow can declare a value the funnel silently drops.
#
#   E2E timeout ordering              scripts/ci/check_e2e_step_timeout_ordering.sh
#     Every emulator/simulator lane must stay bounded from the inside out:
#     inner deadline < step `timeout-minutes` < job `timeout-minutes`. The
#     order is what decides whether a hang produces a usable red. Our own
#     inner deadline names the lane and lets the step's if: failure()
#     diagnostics run; GitHub's step cap does NOT reliably reap the emulator
#     action's backgrounded subtree; and the job cap SIGKILLs the runner
#     before any diagnostic step, so a job-cap death is slow AND evidence-free.
#     The guard also fails an inoperative bound — a step cap equal to its job
#     cap, or a per-drive timeout set above the wrapper that would preempt it.
#
#   Skip-manifest self-test           scripts/ci/check_no_undeclared_skips.sh
#     The guard that fails a run when a test SKIPS without being declared in
#     scripts/ci/expected_test_skips.txt. THIS gate must parse real test
#     output, so it runs where the tests do — rust-check.yml for both cargo
#     crates, coverage.yml for `flutter test`; only its hermetic --self-test
#     belongs in this toolchain-free job. That self-test is what stops the
#     parser rotting into a vacuous pass: an extractor matching nothing would
#     otherwise report "0 skips, all declared" forever. Its integration-test
#     counterpart below reads SOURCE, not output, so that one really enforces
#     here.
#
#   Integration-test skip hatches     tooling/e2e/ci/drive-log-lib.sh
#     Enforcing (--check-manifest), not a self-test: every markTestSkipped()
#     under haven/integration_test/ must be declared in
#     tooling/e2e/expected_drive_skips.txt, and every declaration must still
#     match a call site. It exists because such a skip is INVISIBLE to the
#     driver — Result.skipped satisfies isPassing, so the on-device reporter
#     files it under `passed` and integrationDriver() exits 0. The runtime
#     half (matching the reason text in a drive log) lives in the lane
#     runners; this static half is what stops a hatch being added quietly. It
#     also rejects any static `skip:` there, because the ABSENCE of one is the
#     premise that lets a lane read a non-zero `~N` column as a lost proof —
#     asserted here rather than argued in prose.
#
#   Coverage-floors self-test         scripts/ci/check_coverage_floors.sh
#     The guard that enforces a MINIMUM COVERAGE PER PATH, plus a ratchet that
#     fails when a path has outgrown its declared floor. It has to read a real
#     lcov report, so it runs where coverage is produced — coverage.yml, once
#     per stack — and only its hermetic --self-test belongs in this
#     toolchain-free job. That self-test is what stops the guard decaying into
#     a rubber stamp: its fixtures pin that a path below its floor fails, that
#     a floor set to the exact measured value still passes, that a path which
#     climbed past floor+margin fails ASKING FOR A RAISE, that a 100% path
#     pinned below 100 ratchets (the margin rule can never fire there — there
#     is no 103%), and that an entry matching no file fails. That last one is
#     the skip manifest's lesson applied to coverage: a stale floor measures
#     nothing, so it can never be below itself, and would sit green forever.
#
#   Coverage-floor pin rule           scripts/ci/check_coverage_floors.sh --lint
#     The manifest checked against its OWN rule — floor = floor(measured) - 2,
#     or exactly 100 — using each row's recorded `# measured N%` provenance.
#     Purely static, so unlike the enforcing run it belongs here. It exists
#     because the rule was not being applied: three rows had been hand-
#     tightened to 0.06, 0.14 and 0.72 points of headroom, turning floors into
#     tripwires, and the first of them reddened CI when unrelated work moved an
#     aggregate by seven hundredths of a point. Also catches duplicate rows and
#     rows with no recorded measurement — a floor nobody can re-derive is a
#     floor nobody can review.
#
#   Coverage lcov filter self-test    scripts/ci/filter_lcov.sh
#     The single implementation of which files the Flutter 50% gate and every
#     Flutter floor are computed from. It was two implementations (lcov globs
#     in the workflow, awk in the local gate) that nothing compared, and they
#     did differ. A bug here moves every Flutter coverage number at once, so
#     its fixtures pin each exclusion and pin that an empty or fully-excluded
#     report is reported as a broken filter rather than as 0%.
#
#   Coverage lcov aggregate self-test scripts/ci/check_lcov_aggregate.sh
#     The implementation of the AGGREGATE percentage both stacks are gated on.
#     It replaced `very_good_coverage@v3` and an inline `bc` pipeline, so it is
#     now the only thing enforcing the Flutter 50% threshold — and its
#     self-test ran nowhere in CI until 2026-08-09, only in the local pre-push
#     gate. A gate whose own fixtures never run in CI is the shape this job
#     exists to prevent: the inline version it replaced failed OPEN on an empty
#     report (`echo " < 80" | bc -l` writes a syntax error to stderr and
#     nothing to stdout, and `(( ))` on an empty string is false), printing
#     "meets threshold" and exiting 0. Its fixtures pin that an empty, absent
#     or fully-excluded report fails as a BROKEN REPORT rather than passing.
#
#   E2E harness self-tests            tooling/e2e/ci/*.sh --self-test
#     The bash guards embedded in the E2E tooling must not silently rot: the
#     connect-flake retry predicate must never retry a genuine test failure,
#     the secret-leak log scanner must catch planted key material, and the iOS
#     retry classifier + first-test watchdog must admit exactly one
#     infrastructure signature and refuse everything else — including an empty
#     or absent log, where "no evidence" must not read as "flake". The relay
#     liveness grader belongs to the same group even though it never runs in
#     CI: it runs on the owner's laptop over a hardware capture, months apart,
#     and a hardware campaign is the one place a rotted oracle would be
#     believed. Its step below carries the standing caveat that the plan's
#     re-based CI liveness gate ALSO wants this grader run over a lane's own
#     relay export, and that that export step has not been built — so the
#     self-test here is not, and must never be quoted as, a liveness result.
#
#   Wire-journal closed-world oracle  tooling/e2e/ci/check-wire-journal.sh
#     The one guard here whose SUBJECT is a data file: `tooling/e2e/
#     wire_allowlist.json` enumerates every event kind Haven may put on a relay
#     and every tag name each kind may carry, and anything absent from it is
#     forbidden. That inverts the forbid-list it replaces, under which a new
#     kind, a new tag, or an MDK-introduced field reached a relay in silence.
#     Only the self-test runs in this job — the oracle itself runs in the E2E
#     lanes, over the journal the recording proxy writes. What the self-test
#     protects is the oracle's ability to FAIL: every assertion in it is a set
#     operation over a file that may be absent, empty or truncated, so without
#     fixtures proving each of those is its own failure class, a green verdict
#     would carry no information at all.
#
#   Wire correlation oracle           tooling/e2e/ci/check-wire-correlation.sh
#     The layer under the closed-world one. That file asks which kinds and
#     which tag NAMES appear; this one asks what the VALUES are and how events
#     relate — two circles publishing in the same second, a REQ filter wider
#     than the accepted multiplexed `#h` shape, a second `h` inside one event,
#     a `g`/`alt` fingerprint, a gift wrap distinguishable from an ordinary
#     NIP-17 one, and an event reaching a relay outside its kind's pool. None
#     of those is visible to a union-level tag allow-list. Again only the
#     self-test runs here; the oracle runs in the E2E lanes. Its fixtures are
#     mostly anti-vacuity: every invariant carries a precondition, and a
#     precondition that never fires is how a privacy check comes to certify a
#     sample it never had.
#
#   Wire content-canary oracle        tooling/e2e/ci/check-wire-canaries.dart
#     The third wire oracle, and the only one that asserts over CONTENT rather
#     than structure: it plants values the run knows — a circle name, a
#     petname, a coordinate — and requires them to be absent from every frame
#     in every encoding. That is the check that survives a new MDK field or an
#     unanticipated serialization, neither of which any allow-list sees.
#     Only the self-test runs here. What it protects is the pair of properties
#     that make the verdict mean anything: the oracle must CATCH a planted
#     canary and must CLEAR a clean journal, and every way it could report a
#     pass without having looked — absent, empty, uncovered or lossily
#     previewed journal, unreadable manifest, or a run that recorded carriers
#     while never confirming a plant took — must be its own non-zero code.
#
#   Wire proxy stays test-only          scripts/ci/check_wire_proxy_test_only.sh
#     The recorder that produces that journal captures FULL event JSON,
#     ciphertext, and REQ filters carrying long-term identity pubkeys, each line
#     mapped to a named relay endpoint. It must exist for the harness and be
#     unreachable from the shipped app, so: no production tree may name it, no
#     shipped manifest may depend on the crate, no workflow may upload the raw
#     `.ndjson` (CI artifacts outlive the runner by days on a public repo — the
#     redacted summary is what a lane uploads), that summary must keep being
#     scanned for secrets before it can become one, and every `pub fn record*`
#     must return plain `u64`. That last one is the load-bearing invariant, not
#     a style rule: a recorder with an error channel hands every call site a
#     failure it can propagate into the connection pump, which is the
#     instrument breaking the product.
#
#   Wire oracles are reached by a lane scripts/ci/check_wire_oracle_lane_reachable.sh
#     The POSITIVE counterpart to the guard above, and the only thing standing
#     between the three wire oracles and instance 11 of the recurring failure
#     mode: every green result they produce today comes from their own
#     `--self-test`, and none has ever read a journal from a real run. A lane
#     instruments itself by starting the recording proxy, and four links have
#     to hold or the oracles report CLEAN over nothing — the relay URL must
#     name the PROXY's port and not the relay's (the quietest break: starting
#     the proxy is the visible edit, re-pointing the URL is the one-line change
#     elsewhere in the file), the proxy must be stopped under `if: always()`
#     (a leaked instance holds its journal claim and the next start refuses, so
#     the first red run disables recording for every run after it), an oracle
#     must run after both the proxy start AND a drive, and the `--sentinel` the
#     oracle anchors on must be the same string the drive is handed via
#     `--dart-define=HAVEN_WIRE_SENTINEL` — following the chain into the
#     harness script, because that is where the Android and iOS lanes build.
#     Expectations are derived FROM the repo (the population is every job that
#     starts a hermetic relay), the unwired set is pinned by EQUALITY so that
#     excusing a lane is a reviewable act and a lane LOSING its wiring reds,
#     and ZERO wired lanes fails loudly rather than passing for want of
#     anything to check.
#
#   Wire-reachability guard self-test scripts/ci/check_wire_oracle_lane_reachable.sh --self-test
#     The guard above reasons about absence, which is the one thing a green
#     verdict cannot demonstrate, so its fixtures carry the proof: each of the
#     four links has a lane that breaks exactly it, each anti-vacuity route has
#     a fixture that must be BROKEN rather than clean, and both false-positive
#     directions (a correctly wired lane, an explicitly exempted one) must
#     pass. Two of them exist because the guard's own first draft got them
#     wrong: a sentinel variable both halves name and NOBODY sets is trivially
#     "the same string" (the empty one), and a `--dart-define` that appears
#     only in `check-wire-journal.sh`'s DOC COMMENT would have satisfied link 4
#     in every lane, since every wired lane invokes that oracle.
#
#   Identity-delete prefs residue     scripts/ci/check_identity_delete_prefs_residue.sh
#     `identityAdvancedDeleteBody` promises deleting the identity removes ALL
#     circle data. `haven.security.pending_leaves` (the public nostr_group_id
#     of every circle being left), the background publish-history timestamps,
#     and a stranded pre-Dark-Matter legacy MLS key all survived a delete
#     before this landed, because nothing ever asked "does EVERY
#     SharedPreferences key have a deliberate fate here". This guard discovers
#     every SharedPreferences key constant by USAGE (not naming convention, so
#     it is not fooled by the `flutter_secure_storage` identity-key literal or
#     the isolate-liveness ping/pong Map keys, both also named `*Key`) and
#     requires each to be either cleared on the delete path or on an explicit,
#     reasoned keep-list — so a key added tomorrow forces a decision instead of
#     silently becoming residue.
#
#   Privacy invariants                scripts/ci/check_privacy_invariants.sh
#     The headline gate of Workstream E. `docs/privacy/privacy_invariants.json`
#     joins each user-facing privacy CLAIM to the code implementing it and the
#     test or guard proving it; this re-derives every row from the tree, so a
#     renamed test, an unwired guard or a deleted warning fails instead of
#     leaving the manifest asserting a world that no longer exists. It is the
#     one guard that CITES the others, which is why it runs last — and why it
#     refuses a citation satisfied only by a `--self-test` invocation: a
#     self-test proves the guard's fixtures pass and says nothing about this
#     repository. Its ratchet compares against the commit the change is built
#     on and forces any weakening to be named in the diff; CI cannot judge
#     whether a downgrade is justified, only make it visible. Contract and
#     known gaps: `docs/privacy/README.md`.
#
#   Advisory-finding anchors          scripts/ci/check_ai_finding_anchors.sh
#     Infrastructure for the advisory AI review (privacy-invariants-ai-review
#     .yml), never an enforcing run here. It re-checks that every finding the
#     model reports really appears at the file:line it cites, and DEMOTES the
#     ones that do not — so a hallucination degrades to a labelled non-finding
#     instead of being published as verified. Only its fixtures can prove that
#     still works, since its subject is another workflow's behaviour.
#
#   Manifest-author diff bound        scripts/ci/check_manifest_author_diff.sh
#     The blast-radius bound on the weekly Manifest Author job: if the model's
#     proposal touches anything outside `docs/privacy/`, the job fails and
#     opens no PR. Same shape as above — fixtures are the only proof, and the
#     one that matters is an untracked scratch file, which `git diff` cannot
#     see.
#
#   Runner-loss re-run gate           scripts/ci/rerun_runner_losses.sh
#     rerun-runner-losses.yml re-runs a failed job when its log carries the
#     line the RUNNER writes as it is being taken down (CI run 32672237999).
#     Nothing about that is enforceable from the tree — the subject is another
#     workflow's behaviour — so the fixtures are the whole proof, and they are
#     adversarial by design: a genuine test failure, a job-level timeout, a
#     step-level timeout, a concurrency cancellation, an unreadable log and the
#     signature merely QUOTED in a step's output must each stay red, the
#     signature must exist in exactly one file, and driving the orchestrator
#     with stubbed `gh`/`curl` must re-run one job out of a mixed run and not
#     the other. Widening any of that turns a bounded re-run into the blanket
#     retry tooling/e2e/ci/ios-flake-lib.sh exists to refuse.

name: Repo Guards

on:
  workflow_call:

jobs:
  guards:
    name: Static checks
    runs-on: ubuntu-latest
    # Generous against the measured few minutes, but far below GitHub's 6-hour
    # default: a hung guard (or a baseline fetch that never returns) should
    # surface as a bounded red, not burn a runner for the afternoon.
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      # xmllint (libxml2-utils) is pre-installed on ubuntu-latest, but ensure it
      # so the XML-comment-safe manifest/plist checks never depend on the image.
      # Braced group so the install only runs when xmllint is actually missing.
      - name: Ensure xmllint
        run: xmllint --version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }

      # Same doctrine as xmllint above: jq ships on ubuntu-latest, but the ARB
      # and privacy-manifest checks parse JSON rather than grep it, so ensure it
      # instead of depending on the image.
      - name: Ensure jq
        run: jq --version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }

      # The one non-bash guard in this job. `check-wire-canaries.dart` is a
      # plain Dart program with no package dependencies — it imports
      # `dart:convert`/`math`/`typed_data` and one relative library — so it
      # needs an SDK but no `pub get` and no Flutter. setup-dart is ~10 s,
      # which is why the canary self-test can live here with the other
      # invariants instead of behind the coverage job's toolchain.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Every guard below carries the same `if:` — run whenever checkout
      # succeeded, even if an earlier guard failed — so one red run reports the
      # full set of violations instead of stopping at the first.

      - name: Committed-secrets scan
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_committed_secrets.sh

      - name: Map tile provider policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_tile_provider.sh

      - name: Tile cache keeps no secrets
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_tile_cache_secrets.sh

      - name: Public-profile privacy boundaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_profile_privacy_boundaries.sh

      - name: Member-directory privacy boundaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_member_directory_privacy.sh

      # The guard above reasons at statement level over SQL embedded in Rust,
      # and both of its own first-draft bugs were extractor bugs that a green
      # tree hid: a `tr -s '[:space:]'` squeeze folded the newlines the `;`
      # split had just produced, handing every rule ONE chunk containing the
      # whole file. Its fixtures therefore pin each rule against a real
      # violation AND against prose naming every forbidden token, because a
      # source scan that matches documentation instead of code is this repo's
      # recorded failure mode. The retention-coupling fixtures pin both
      # directions of the arming rule: nothing wired is not a violation, and a
      # purge named only in a comment does not count as wired.
      - name: Member-directory guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_member_directory_privacy.sh --self-test

      - name: Android INTERNET permission
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_internet_permission.sh

      - name: FLAG_SECURE covers every Activity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_flag_secure_app_wide.sh

      # The guard above is four greps and a brace-slicer over Kotlin, so its
      # fixtures pin one mutation per link — a registration moved out of
      # onCreate, a registration left only in the KDoc, a callback that stopped
      # setting the flag, a `clearFlags` exemption, a per-Activity copy, a
      # dropped `android:name` — plus both false-positive directions and the
      # anti-vacuity floor, without which a renamed source directory would
      # report a clean tree forever. Two of them earned their keep immediately:
      # the guard's first draft ran its method slice to EOF on Kotlin's
      # expression-body form (`= Unit`), silently widening a check bound to
      # onActivityCreated into a check on the whole file.
      - name: App-wide FLAG_SECURE guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_flag_secure_app_wide.sh --self-test

      - name: iOS app-switcher privacy blur
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ios_privacy_blur.sh

      # Every interesting mutation here leaves the file compiling and reading
      # correctly: the overlay installed but transparent, the add moved one
      # callback later, the removal moved one callback earlier, or the handle
      # never re-nil'd — which blurs the FIRST backgrounding and no later one,
      # with nothing on screen ever looking wrong. So the fixtures pin one per
      # link plus both false-positive directions. The runaway that matters here
      # is not a slice reaching EOF but one that stays brace-BALANCED by
      # swallowing the next method — the Swift form of the trap that widened
      # the FLAG_SECURE guard's own first draft.
      - name: iOS app-switcher blur guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ios_privacy_blur.sh --self-test

      - name: Background-wake invariants
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_native_wake_guards.sh

      # Check 9b's ban is a name scan, and a name scan dies two ways: it stops
      # matching (a renamed manifest, a reshaped dependencies: block) or it
      # matches prose (the words "analytics" and "crash" appear in comments,
      # usage descriptions and identifiers all over this repo). The fixtures
      # pin one violation per arrival path, both false-positive directions,
      # and every anti-vacuity floor — a scan with nothing to read must be red,
      # never green.
      - name: Background-wake guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_native_wake_guards.sh --self-test

      - name: iOS background publish
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ios_background_publish.sh

      # Its function-shaped checks pin invariants nothing behavioural can see.
      # Two of them cover Swift that NO test in this CI ever executes — the
      # location stream handler's session shape and the session handler's tier
      # policy — and the rest cover a CoreLocation session whose only symptom is
      # "iOS suspended the app" hours later, a branch that runs only while the
      # process is paused, and a relaunch region that can only fire after a real
      # termination. A rotted guard would take all of them with it silently, so
      # the fixture count is pinned by EQUALITY: a floor would let a deleted
      # fixture hide under the slack.
      - name: iOS background publish guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ios_background_publish.sh --self-test

      # The gate that stops a cached GPS fix outliving the consent for it is
      # enforced by nothing but statement ORDER — the permission/provider
      # checks used to sit BELOW the warm-cache and last-known shortcuts, so
      # both published coordinates the user had already revoked. Putting them
      # back is a one-line reorder that compiles, reads naturally in a diff
      # hunk, and can be made to pass the unit tests by softening one stub.
      - name: Location access gate precedes every coordinate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_location_access_gate.sh

      # The guard above is an ordering analysis over a comment-stripped view,
      # so its fixtures pin both directions and the two ways it could rot: a
      # correctly ordered service must PASS (or a guard hard-coded to fail
      # would look right on every negative fixture), a DELETED gate must fail
      # loudly rather than pass for want of an anchor, and a doc comment that
      # merely mentions the gate must not count as calling it.
      - name: Location access gate guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_location_access_gate.sh --self-test

      # A backgrounded location registration has no host-test oracle: the only
      # symptom is battery, hours later and off-device. Both invariants are one
      # reorder away from being wrong again — releasing GPS after the ownership
      # write leaves two isolates holding a client, and a release that rides a
      # provider rebuild cannot run at all while frames are off.
      - name: Backgrounded app holds no UI location registration
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_android_location_power.sh

      - name: Location power guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_android_location_power.sh --self-test

      # Every battery figure here is estimation model E's arithmetic, never a
      # measurement, and the rule saying so had no guard: `grep -rn ESTIMATED
      # scripts/ .github/` returned nothing before this step existed. Two manual
      # sweeps enforced it and an adversarial review found three classes both
      # had missed, so the sweep is now a script.
      - name: No energy claim reads as a measurement
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_estimate_integrity.sh

      # Fixtures in both directions for every shape — the eight numeric ones (a
      # discharge rate, a current, an energy, a power, a wake rate, a duty, a
      # battery delta and a before/after pair), the zero-cost verdict, the
      # directional claim, the causal assertion and the measurement verdict —
      # plus the false-positive directions that shaped them: "the dominant
      # memory consumer", "the DOMINANT generator of MLS forks", a motion
      # curve's fraction of a timeline, a jitter bound stated as a fraction of
      # the nominal interval, a coverage table's percent pair, a coverage
      # floor's percentage-point move, a logcat priority column and a plan
      # work-item id (both of which read as watts to a looser pattern), "adds no
      # distinguishing power", and a mechanism argument that names no energy
      # noun. Attribution must be ANCHORED (a bare "our estimate" fails) and
      # must REACH: the claim's own sentence or the one next to it, never two
      # sentences away, never across a blank line, and never across intervening
      # code. Every PASS fixture also asserts its own non-vacuity — the same
      # body with attribution ignored must FAIL — because a gutted PASS fixture
      # exits 0 and the count pin alone cannot see that. Plus the fail-closed
      # directions: a root that matches no file and a missing root are
      # MISCONFIGURED rather than clean, and an allowlist entry that has stopped
      # matching FAILS, because a rotted exemption is a permanent hole.
      - name: Estimate integrity guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_estimate_integrity.sh --self-test

      - name: Publish rotation is rewound only on rebuild
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_publish_rotation_fairness.sh

      # Fixtures for each way the queue loses its place. A REWIND re-serves the
      # same head deterministically (the roster is `updated_at DESC`), and is
      # what the clear does from the wrong place: added to `_cancelScheduling`
      # (the original starvation), moved to `stopScheduling`, added to the
      # empty-roster branch, or moved into `build()`'s own `ref..listen`
      # callback, where it rewinds on EVERY roster emission — a containment
      # check printed OK for that one. A RE-PHASE is what reconciling against a
      # degraded-to-empty roster does: the survivor merge hoisted above the
      # guard, the half-hoist where only the snapshot moves, and the merge
      # parked in a never-called helper with every line number left in order.
      # Plus the third placement: `_circles[key]!` in the tick, where the queue
      # deliberately outlives the roster, so a bang crashes every later tick
      # while the banner stays green — with the comment naming that trap, and
      # `_circles[key] != null`, as its false-positive directions. Braces inside
      # string literals move no brace range in either direction. Both
      # anti-vacuity directions too: no rewind at all fails (exactly-once, not
      # at-most-once); a renamed `build()`, `_syncCircles` or `_circles.isEmpty`
      # guard is MISCONFIGURED rather than clean — the shape that lets a guard
      # certify nothing after a refactor; and every PASS fixture asserts that
      # the shape it is about is still in the probe.
      - name: Publish rotation guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_publish_rotation_fairness.sh --self-test

      - name: Locale stays device-local
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_locale_privacy.sh

      - name: Epoch-repair isolation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_epoch_repair_isolation.sh

      - name: Epoch-repair isolation guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_epoch_repair_isolation.sh --self-test

      - name: No exporter-label override
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_exporter_label_override.sh

      - name: Inner location kind is pinned
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_inner_location_kind.sh

      # Fixtures for each violation class: the constant re-pointed at 9/1210/the
      # 446-452 band, a bare literal or computed kind at the rumor build, a
      # reserved kind reached through a constant — plus the false-positive
      # directions (the receive-only legacy constant, decoys in #[cfg(test)]).
      - name: Inner location kind guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_inner_location_kind.sh --self-test

      - name: No cursor advance from an event timestamp
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_event_timestamp_cursor_advance.sh

      - name: Relay pools keep the options each of them needs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_engine_client_options.sh

      # Fixtures for both directions of all TEN checks, driven through the same
      # `run_all_checks` list the enforcing run above uses — so a check unwired
      # from the production path is unwired from these fixtures too and its
      # fixtures go red, instead of certifying a check that no longer runs.
      # (They used to be two independent lists, and deleting a check from the
      # production block left every fixture green.) The clean shapes pass —
      # including the two comments that NAME `sleep_when_idle` without setting
      # it — and every mutation must fail with the message naming the check it
      # broke: the option flipped on or its pin deleted, the publish keepalive
      # restored by editing `publish_relay_options` or by deleting it, a bare
      # `add_relay` on either crate, the engine adopting
      # `ping(false)`/`sleep_when_idle`, a standing REQ back on the publish pool
      # in any of the five spellings, either allowlist marker used to wave a
      # second call through, a `forget_*`/`shutdown()` in the burst close path,
      # a standing REQ from the burst entry point, each of the seven bridge
      # forwardings swapped, gutted to a constant, bypassed by a guarded early
      # return or given a second core call, and the two sync session reads made
      # panicky, stale or constant. One fixture is structural rather than a tree
      # mutation: every `check_*` function must be invoked by `run_all_checks`,
      # so a check written and wired nowhere cannot look like coverage.
      - name: Relay pool options guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_engine_client_options.sh --self-test

      - name: Generated bridge files match their pins
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_generated_bridge_pinned.sh

      # Fixtures for each way a generated file can drift from its pin: the
      # inverted `SseEncode` discriminant on the Rust half, an edit on the Dart
      # half, a new generated file nobody pinned, a pinned file deleted, a repin
      # from a DIFFERENT codegen (the drift a byte pin alone cannot see, because
      # bytes and pin move together), the two manifests disagreeing about the
      # runtime — plus the anti-vacuity direction, a tree where the scanner
      # finds no generated file at all and must FAIL rather than pass over an
      # empty set.
      - name: Generated bridge pin guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_generated_bridge_pinned.sh --self-test

      - name: Clock-skew policy parity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_clock_skew_policy_parity.sh

      - name: Publish-jitter fraction parity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_publish_jitter_fraction_parity.sh

      # The guard above extracts both sides' declarations by pattern; the
      # fixtures below prove it still fails on the drift it exists for (the
      # fraction moved on one side alone) and does not cry wolf on a
      # consistent edit, before trusting it to gate the real files.
      - name: Publish-jitter fraction parity guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_publish_jitter_fraction_parity.sh --self-test

      - name: Delta-alphabet parity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_delta_alphabet_parity.sh

      # The reviewer's mutation, run at each of the four manifest sites plus
      # SECURITY.md, `constants/location.dart` and the code file's own doc
      # comment — including the site that states the alphabet's SIZE as an
      # English word rather than as a set, which drifts independently. Plus
      # the opposite direction, which is the one nobody touches the docs for:
      # the CODE's tables and bounds moving under prose that then quotes a
      # figure the app no longer produces. Plus both count directions, so the
      # rule is EQUALITY and not "still mentioned somewhere" — the reading
      # under which swapping one alphabet for the other passes. Plus the
      # fail-closed paths: a renamed constant, a renamed table, a moved
      # manifest entry and a gloss that lost its figure must FAIL, never pass
      # for want of something to compare. The fixture count is pinned by
      # equality at the end rather than printed, because a prose count cannot
      # tell a deleted fixture from a passing run.
      - name: Delta-alphabet parity guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_delta_alphabet_parity.sh --self-test

      - name: MDK supply-chain shape
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_mdk_supply_chain.sh

      # The Rule-14 busy marker is a LOG token. Routing on it would be
      # remotely influenceable: a circle admin controls the group's routing
      # relays, the live-sync relay gate interpolates a rejected URL into its
      # error, and redaction preserves a planted marker verbatim — so
      # `ws://host/HAVEN_E_SESSION_BUSY` could make the foreground service tear
      # down a healthy live-sync engine. Liveness comes from the registry.
      - name: Session-busy marker stays log-only
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_session_busy_marker_not_routed.sh

      # `initCommunicationPort()` TAKES OVER the isolate port name rather than
      # joining it. A second caller (the natural copy-paste when adding
      # worker->UI messaging) would route every liveness probe to an isolate
      # with no responder, so the foreground service would read the silence as a
      # dead UI isolate and force-release its live-sync session on a schedule.
      - name: Liveness port has a single owner
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_liveness_port_single_owner.sh

      # Rule 14 is enforced per PROCESS, and Android runs the UI and the
      # location foreground service as two isolates inside one. The pause-time
      # handoff is what lets the service publish, and it only holds because
      # every reopen in the UI isolate funnels through one latched chokepoint —
      # a direct `CircleManagerFfi.newInstance` anywhere else takes the session
      # straight back, which is exactly how background publishing died (P0-1).
      - name: MLS session has a single owner per isolate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_mls_session_single_owner.sh

      # The disposal half counts handle-shaped `.dispose()` calls, so it is
      # exactly as trustworthy as its fixtures: they pin that an unrelated
      # disposal cannot stand in for a session release, that a commented-out
      # release does not either, and that a file which stopped opening at all
      # is guard drift rather than a pass.
      - name: MLS session single-owner guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_mls_session_single_owner.sh --self-test

      # The other half of that handoff: how long the foreground service is
      # allowed to spend NOT letting go. The budget is one relay publish attempt
      # by definition, and the two constants that define it live on opposite
      # sides of the FFI with nothing but this to hold them together.
      - name: Teardown drain budget matches the relay attempt it derives from
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_teardown_drain_budget.sh

      # Both drift directions plus both "the constant I read is gone" cases,
      # so a guard that silently stopped comparing anything fails loudly.
      - name: Teardown drain budget guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_teardown_drain_budget.sh --self-test

      # The receive-plane counterpart: `kLiveSyncRestartBudget` bounds the one
      # periodic recovery the live-sync build has, and is the engine's own
      # stop+start bound by definition. Same two-language, no-shared-header
      # problem; drift either abandons restarts that would have succeeded or
      # stalls the backstop with a dead receive plane.
      - name: Live-sync restart budget matches the engine bounds it derives from
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_restart_budget.sh

      # Both drift directions on both constants, plus both "the constant I read
      # is gone" cases.
      - name: Live-sync restart budget guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_restart_budget.sh --self-test

      # Security Rule 6's SOURCE half. The runtime scanner it complements can
      # only see what a lane executed, at a level the build let through, in one
      # of seven anticipated shapes; a key rendered by a `{:?}` on a path no
      # lane drives is invisible to it and permanent in the source.
      - name: No key material reaches a log call
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_key_logging.sh

      # The guard above is a hand-written lexer over two languages, so it is
      # exactly as trustworthy as its fixtures. They pin both directions: the
      # secret in a placeholder, in an argument, on a continuation line and in a
      # `dbg!` must all FAIL, and the four shapes that made earlier drafts cry
      # wolf — the word "key" in prose, prose inside a multi-line literal, a
      # `wire_token()`, and `dueKeys.length` — must all pass, because a log
      # guard that flags counts is one that gets blanket-suppressed. Two more
      # pin the suppression contract (a marker with no reason, and a marker at
      # the top of a file, must NOT suppress) and two pin the anti-vacuity
      # floor, without which a renamed macro would report a clean tree forever.
      - name: Key-logging guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_key_logging.sh --self-test

      # Security Rule 7 over every struct, not the two on a hand-kept list.
      - name: Secret-shaped fields are zeroized
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_secret_fields_zeroized.sh

      # Its fixtures pin the two regressions no compile-time whitelist can see
      # (a NEW secret-bearing type with no derive; an existing `Zeroizing<>`
      # demoted to a bare container), the struct-name rule that catches
      # `ProfileRelaySalt { bytes }`, and the false-positive directions that
      # decide whether the guard survives its first run — a `pubkey`, a
      # `key_package` (published as kind 30443), and a composed field whose
      # obligation belongs to the inner type. Plus the two ways it could rot:
      # a derive drifting onto the NEXT struct, and prose that merely NAMES
      # `ZeroizeOnDrop` counting as a derive.
      - name: Zeroize guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_secret_fields_zeroized.sh --self-test

      - name: E2E publish-before-apply (staged creates resolved)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_publish_before_apply.sh

      # Equal epoch NUMBERS are not one branch: both remaining peers commit
      # the departing admin's SelfRemove, so a fork advances both by one and
      # removes Alice on both. The gate that read those two facts as
      # "converged" was sound only under the single-committer election DM-4b
      # deleted, and a lost relay socket turned the gap into a 60s Phase 6
      # timeout (run 32688074045).
      - name: Handoff convergence oracle can see a fork
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_handoff_convergence_oracle.sh

      # Fixtures pin all four terms in both directions, including the two
      # failure shapes that actually occurred: a predicate that falls back to
      # epoch equality, and a decrypt-PRESENCE check that the engine's epoch
      # lookback satisfies across branches.
      - name: Handoff convergence guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_handoff_convergence_oracle.sh --self-test

      # A switch that exists, reads plausibly, and is set nowhere is the
      # quietest way for a lane to stop proving what it is named for:
      # M7_REQUIRE_DECRYPT defaulted to 0 for its entire life, so the
      # background catch-up lane asserted bootstrap and never delivery.
      - name: Background catch-up lane asserts delivery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_background_delivery_assertion.sh

      # The guard above is a grep over four file kinds, so its fixtures pin
      # each one in both directions — including the exact regression it exists
      # for (a workflow that sets nothing), a doc comment that must not count
      # as a call, and a dispatcher that re-implements the wake instead of
      # delegating to it, which would make the lane prove the copy.
      - name: Background-delivery guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_background_delivery_assertion.sh --self-test

      # The kind-0 plane's test override is install-once, so a second call site
      # throws and the winner depends on call order. That broke e2e_profile on
      # both platforms in CI run 30753193231 — under a comment asserting the
      # invariant this now enforces.
      - name: Profile-relay override has a single install site
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_profile_override_single_site.sh

      # A poll lane that inherits live-sync is a lane whose name is wrong about
      # what it runs. e2e-flakiness-stress spent months running the M11 live
      # suite inside a poll-sized budget, red most nights, while its header said
      # it mirrored the poll lane; e2e-profile ran its two platform jobs on
      # OPPOSITE receive paths. Both were omissions, not decisions.
      - name: Live-sync define is declared, never inherited
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_define_declared.sh

      # The guard above is a grep over YAML, so it is exactly as trustworthy as
      # its patterns. The fixtures pin the two directions it can rot in: a build
      # with no declaration must fail, and a job that merely MENTIONS the flag
      # (in prose, or in a comment) must not count as having declared it.
      - name: Live-sync define guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_define_declared.sh --self-test

      # Fixture-driven, no toolchain: an undeclared skip must fail, a log
      # matching the manifest must pass, a stale manifest entry must fail, and
      # a parsed-vs-summary count disagreement must be reported as a broken
      # guard rather than as a clean run.
      - name: Skip-manifest guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_undeclared_skips.sh --self-test

      # Fixture-driven, no toolchain and no lcov: a path below its floor must
      # fail, a floor equal to the measured value must pass, a path that
      # outgrew its floor must fail naming the number to write down, a 100%
      # path pinned below 100 must ratchet, and an entry matching no file must
      # fail. The last two fixtures parse the CHECKED-IN manifest for both real
      # stacks, so a typo in scripts/ci/coverage_floors.txt is caught in this
      # seconds-long job instead of an hour into the coverage workflow.
      - name: Coverage-floors guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_coverage_floors.sh --self-test

      # Static half of the coverage gate: every floor must equal the pin rule
      # applied to its own recorded measurement. Three rows had been hand-
      # tightened past it — one to 0.06 points of headroom, which is what
      # reddened run 30964250098 when unrelated work moved an aggregate by
      # seven hundredths of a point. That verdict needed a full 11-minute
      # llvm-cov run to reach; here it costs milliseconds, and the same command
      # runs in the pre-commit hook.
      - name: Coverage-floor manifest obeys its pin rule
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_coverage_floors.sh --lint

      # The filter that decides WHICH files the 50% gate and every Flutter floor
      # are computed from. Shared by coverage.yml and the local gate, so a bug
      # here silently moves every Flutter number at once.
      - name: Coverage lcov filter self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/filter_lcov.sh --self-test

      # The AGGREGATE percentage both stacks are gated on. This script is the
      # only thing enforcing the Flutter 50% threshold since it replaced
      # very_good_coverage@v3 and an inline `bc` pipeline that failed OPEN on an
      # empty report. Its self-test ran only in the local pre-push gate until
      # now, so the one gate nobody could see decaying was the one holding the
      # threshold up.
      - name: Coverage lcov aggregate self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_lcov_aggregate.sh --self-test

      # An emulator lane with no inner deadline routes every hang to the JOB
      # cap, which SIGKILLs the runner before the if: failure() diagnostics,
      # the secret scan and the artifact upload — slow, and with no evidence.
      # Four lanes were in that state (CI_HARDENING_BACKLOG.md A8), and two
      # more carried bounds that could never fire: a per-drive timeout ABOVE
      # its own wrapper, and a step cap EQUAL to its job cap.
      - name: E2E timeout ordering (inner < step < job)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_step_timeout_ordering.sh

      # The guard above reads YAML with a purpose-built parser, so it is
      # exactly as trustworthy as that parser. The fixtures pin each check
      # against a lane shape that really occurred here, and pin the two ways
      # it could rot into a rubber stamp: a step comment that MENTIONS a
      # timeout must not count as declaring one, and a hermetic `--self-test`
      # step must not be mistaken for a simulator lane. The guard additionally
      # refuses to pass if it finds fewer lanes than the repo has, so an
      # extractor that stops matching fails loudly instead of vacuously.
      - name: E2E timeout-ordering guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_step_timeout_ordering.sh --self-test

      # The inner deadline itself. Its critical fixture is exit-code
      # PASS-THROUGH: if a genuine test failure were ever reported as 124,
      # run-relay-customization.sh's timeout-only retry would start retrying
      # real reds and a failing lane could flake green.
      - name: E2E harness self-test (inner deadline wrapper)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-with-deadline.sh --self-test

      - name: E2E harness self-test (connect-flake predicate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-single-avd-scenario.sh --self-test

      - name: E2E harness self-test (secret-leak scanner)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/scan-logs-for-secrets.sh --self-test

      - name: Build-retry predicate self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/build_apk_with_retry.sh --self-test

      # Guards the predicate that catches `flutter drive` exiting 0 on a FAILED
      # test. Its critical fixture is the verbatim run-30753193231 log in which
      # a setUpAll failure was reported to the driver as "All tests passed." —
      # if that stops being detected, every drive-based lane can go green on a
      # red suite again.
      - name: E2E harness self-test (drive-log failure predicate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/drive-log-lib.sh --self-test

      # The ENFORCING half of the same library, and the only one that can run
      # without a device. A RUNTIME skip (`markTestSkipped`) is invisible to
      # `integrationDriver()` — it records that body as a pass — and on the
      # `flutter drive` lanes even the reporter's `~N` column never moves for
      # it, so nothing downstream can notice a proof acquiring an escape route.
      # This reconciles every markTestSkipped() under haven/integration_test/
      # against tooling/e2e/expected_drive_skips.txt, where each one carries the
      # argument for why it cannot fire in the lane that drives it. Undeclared
      # hatch, stale declaration and changed reason all fail here.
      #
      # A STATIC `skip:` is the other kind, and it moves `~N` on both reporters
      # — which is exactly why it fails here too. No manifest row can describe
      # one (a row states why a guard cannot fire, and a `skip:` has no guard),
      # and its ABSENCE from the tree is the premise that entitles a lane to
      # read any non-zero `~N` as a lost proof. That premise is asserted by this
      # step, not assumed. The E2E lanes then fail on any declared reason that
      # actually appears in a drive log, so neither adding a hatch nor firing
      # one can happen quietly.
      - name: Integration-test skip hatches are declared
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/drive-log-lib.sh --check-manifest

      # Guards the B1 lane's publish-count PARSER. Its critical fixture is the
      # `Published to 0/1` line — P0-1's own signature, which a substring grep
      # would accept. If this parser ever rots into one that returns >=1 there,
      # the FGS lane goes green while background publishing is dead.
      - name: E2E harness self-test (FGS publish-count parser)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b1-fgs-publish.sh --self-test

      # Guards the B3 real-GPS lane's oracle predicates. Two critical fixtures:
      # `[b3] PUBLISHED n=0` (the publisher reporting it published to NOTHING —
      # a presence grep would call that a pass) and a `dumpsys package` dump
      # where a NEIGHBOURING permission is granted while ours is not (a bare
      # `granted=true` grep would report the location permission as held). If
      # either rots, the lane goes green on a chain that never carried a real
      # GPS fix.
      - name: E2E harness self-test (real-GPS oracle predicates)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b3-real-gps.sh --self-test

      # Guards the B6 provider-toggle lane's oracle, which is exercised END TO
      # END here rather than only per-predicate: one fixture is TODAY'S real
      # behaviour (publishes, stops, recovers, tells the user NOTHING) and must
      # be REPORTED, and its twin is the fully-fixed app and must PASS. Without
      # the second, an oracle hard-coded to red would look correct; without the
      # first, the lane would bless the silent-failure defect it exists to find.
      # Two more pin the vacuity routes: a zero baseline (it never published, so
      # "it stopped" is meaningless) and an error surface that was already up
      # before the toggle.
      - name: E2E harness self-test (provider-toggle oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b6-location-provider-toggle.sh --self-test

      # Guards the relay's pull-skip decision, which is one `if` that can strand
      # a whole lane in either direction: skip a stale TAG and the hermetic relay
      # silently changes between runs; fail to skip a digest-pinned image that is
      # already local and a lane whose egress guard is up dies on a pull it never
      # needed (CI run 31075503390). The fixtures cover both, plus the call site
      # itself — a correct predicate nothing consults is the same outage.
      - name: E2E harness self-test (strfry pull-skip)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/start-strfry.sh --self-test

      # Guards the B5 permission-revocation oracle. Two halves need pinning.
      # The RELAY half is a diff over location-event ids, and its fixtures are
      # the ones that can silently rot: a commit-only capture must yield NO
      # ids (kind 445 also carries MLS evolution traffic, which ACT 2's own
      # circle creation produces), the 64-hex `pubkey` on the same line must
      # never be harvested as an event id, and a baseline id that EXPIRED off
      # the relay must not resurface as "new". The PERMISSION half is read
      # from `dumpsys package`, where a granted neighbouring permission one
      # line up would answer for ours under a bare `granted=true` grep — and
      # `pm grant`/`pm revoke` exit 0 even when they refuse, so that read is
      # the only place a refusal is visible at all.
      - name: E2E harness self-test (permission-revocation oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b5-permission-revocation.sh --self-test

      # Guards the B8 clock-skew lane's ANTI-VACUITY parsers. The critical
      # fixture is a servo record whose read-back drift equals the full
      # requested magnitude — i.e. `date` exited 0 and the clock never moved.
      # If `jump_ok_seqs` ever rots into one that accepts it, every phase of
      # that lane runs at true time, every in-drive oracle passes, and the lane
      # reports GREEN having applied no skew at all. Two more pin the routes
      # either side of it: a missing/empty servo log must yield NO applied
      # jumps (a grep that matches nothing is how a guard becomes a no-op), and
      # a truncated capture must stay distinguishable from a clean one so "the
      # body died at phase 2" cannot read as "phases 3-4 found nothing".
      - name: E2E harness self-test (clock-skew parsers)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b8-clock-skew.sh --self-test

      # Guards the KPR lane's oracle END TO END, not only per-predicate. The
      # critical fixture is THE PRE-FIX CONDITION: a capture in which the tick
      # reported `alreadyHealthy` and the peer's re-fetch was unchanged — the
      # state the repo actually shipped in — which must be REPORTED. Its twin
      # is the healthy app, which must PASS, or an oracle hard-coded to red
      # would look correct on the first. The near-misses pin the three ways a
      # rotation can look complete and not be: rotated into a DIFFERENT `d`
      # (the old expiring package stays addressable beside the new one),
      # published but acked by NOBODY (the action names the branch that ran and
      # is chosen before the write), and an Add that succeeded while the
      # resulting group decrypts nothing. The vacuity fixtures pin the routes
      # where the lane would prove nothing while looking green: a backdate that
      # never landed on the device (`date` exits 0 having changed nothing),
      # material below the 75% point, and material already EXPIRED — which
      # re-mints through a different branch entirely.
      - name: E2E harness self-test (KeyPackage-rotation oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-kp-rotation.sh --self-test

      # Guards the B9 network-reconnect oracle. Its critical fixtures are the
      # NEGATIVE TWINS: every verdict in that lane is a positive/negative pair
      # printed by the drive, and a substring match that let
      # `OUTAGE_NOT_OBSERVED` satisfy a search for `OUTAGE_OBSERVED` would
      # report a lane that never disconnected as one that did — a green run
      # proving nothing at all. The rest pin the four vacuity routes (no
      # baseline receive, engine never running, no outage, nothing published
      # after it), the REAL FINDING case (recovery never happened, which must
      # be reported), and the healthy app (which must PASS, or an oracle
      # hard-coded to red would look correct on the finding fixture).
      - name: E2E harness self-test (network-reconnect oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b9-network-reconnect.sh --self-test

      # Egress guard (CI_HARDENING_BACKLOG C7). The kernel-side gates (rules
      # installed, a loopback probe observed, a deliberate egress to
      # 192.0.2.1 observed) can only be proven on a real runner and are
      # enforced there at install time. What belongs HERE is everything that
      # decides a VERDICT off-kernel: the CIDR matcher, the two allow-list
      # shapes that would silently turn enforce mode into a no-op (a default
      # route; an IPv6 CIDR the matcher cannot evaluate), the kernel-line
      # parser against real `iptables -j LOG` output, and all four report
      # verdicts — including the two that must NOT be confused, an empty
      # capture (rc 3, "no evidence") versus an empty EXTERNAL set (rc 0, the
      # healthy hermetic result). It also parses the checked-in
      # egress-allowlist.txt, so a broken allow-list is caught now rather than
      # on the day someone attempts the flip to enforcement.
      - name: E2E harness self-test (egress guard)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/setup-network-guard.sh --self-test

      # The iOS twin of the connect-flake predicate. Both iOS lanes hand their
      # scenario to `nick-fields/retry` with no filter, so before this the second
      # attempt was a free re-roll of ANY red — measured, 19 genuine test
      # failures were retried and only one signature (a post-build, pre-test
      # simulator launch/attach stall) ever justified it. The critical fixtures
      # are the verbatim `::error::9 tests passed, 1 failed.` log (must NOT
      # retry) and an empty/absent log (must NOT retry — the A4 lesson: no
      # evidence is not evidence of a flake).
      - name: E2E harness self-test (iOS flake classifier + retry gate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/ios-flake-lib.sh --self-test

      # …and the WIRING, which fixtures alone cannot reach: the watchdog that
      # turns a silent 30-minute hang into a classified, attributed failure has
      # to actually fire on a stall and actually leave a running suite alone.
      # Drives the real watchdog against a stubbed process, then hands its output
      # to the real classifier — so the marker the one writes and the marker the
      # other requires cannot drift apart unnoticed.
      - name: E2E harness self-test (iOS first-test watchdog)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-ios-sim-scenario.sh --self-test

      # The B7 auth-tier lane's own predicates. Its failure modes are all
      # silent-green ones that no on-device run could report: an Xcode whose
      # `simctl privacy` has no `location-always` service (the lane would grant
      # `location` twice and "pass"); two runs that observed the SAME tier
      # (every per-tier branch in the drive target still passes, having
      # discriminated nothing); and a drive that exits 0 without running either
      # test body — the tier marker is printed BEFORE the first assertion, so
      # the discrimination gate reads it and passes while `[b7] COPY_OK` and
      # `[b7] BACKGROUND_PUBLISH_OK` never appear. The fixtures pin all three,
      # plus the tier-marker parser that feeds the first two.
      - name: E2E harness self-test (iOS auth-tier discrimination gate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b7-ios-auth-tier.sh --self-test

      # The B4 iOS real-GPS lane's preflight and oracle. The fixtures that earn
      # their keep are the silent-green ones: a `simctl location` usage listing
      # WITHOUT a `set` action (the lane must refuse rather than improvise a
      # fake fix) versus an Xcode with no `location` subcommand at all (a
      # different failure, and conflating them blames Xcode for a broken probe);
      # `(0, 0)` refused as a seed, because the null island is exactly what a
      # simulator with no simulated location reports, so seeding it would make
      # the lane unable to tell a delivered fix from no fix; and a log that says
      # `1 test passed` without the `[b4] PEER_DECRYPT_MATCH` marker, which is
      # the only check that can see a drive exiting 0 without reaching its proof
      # (A3b).
      - name: E2E harness self-test (iOS real-GPS preflight + proof oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b4-ios-real-gps.sh --self-test

      # The iOS background-publish lane's host/drive HANDSHAKE — the only lane
      # whose proof depends on a second process acting mid-test. The handshake
      # rides a file the drive writes into its own sandbox, and the fixtures
      # that earn their keep are the ones no behavioural check can see: a
      # signal found in a ROTATED data container (the drive's own install
      # rotates the leaf UUID out from under any path resolved before it — CI
      # run 32618134993); a stale READY from the previous attempt cleared out
      # of EVERY container (run 32553078705 attempt 2 matched one 63 ms in);
      # each wait sweeping the root for its OWN marker, because a disarm-wait
      # that reads READY re-foregrounds the app seconds after backgrounding it
      # and the lane then measures background publishing against a foreground
      # app, green and worthless; and the app-data root being derived AND
      # validated, since skipping either silently restores the pinned-container
      # bug. Structural fixtures pin the background step, its invocation, the
      # fail-closed privacy grant, the uninstall skip, and that the signal name
      # still matches the Dart drive's.
      - name: E2E harness self-test (iOS background-publish handshake)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-ios-bg-publish.sh --self-test

      # The relay-side liveness grader for the owner-run power measurements
      # (docs/POWER_MEASUREMENT.md §3). Unlike every other oracle in this job it
      # never runs in CI — its input is a capture off a real relay, taken beside
      # a battery window on real phones — so its fixtures are the ONLY thing
      # that can tell whether it still works, and they run here for the same
      # reason the wire oracles' do.
      #
      # SAY THE QUIET PART (2026-09-03): with the hardware campaign deferred,
      # POWER_EFFICIENCY_PLAN.md §6.6 re-bases the LIVENESS gate onto this same
      # grader run over an e2e lane's own relay export — and that export step
      # DOES NOT EXIST. This self-test is still the only invocation in the tree.
      # It proves the instrument's fixtures pass and says NOTHING about any
      # build, so nobody may read this green step as a liveness result. The
      # blocker is a lane property, not an instrument one: no Android lane has a
      # publish window that is both longer than the 228 s bound and guaranteed
      # to carry the two events the grader needs, and the lane that does
      # (e2e-ios-background-publish, 396 s, >= 2 events already asserted) runs
      # the in-memory tooling/e2e/local-relay, which has no export path. What it
      # would take is itemised in POWER_EFFICIENCY_PLAN.md §5.1's LIVENESS block.
      #
      # Every battery number that campaign produces can be "improved" by
      # publishing less, and the cheapest Haven publishes nothing at all, so a
      # grader that reads a dead device as clean would certify the exact
      # regression it exists to catch. The fixtures that earn their keep are
      # therefore the false greens: a device that publishes for 30 min of a
      # declared 3 h window and then dies, and one silent for the first 2.5 h,
      # both of which look like a flawless 30 min run against the span of the
      # events actually observed; a 2-publisher circle graded as one, which
      # halves both event-count floors; and one circle split across two capture
      # files, whose seam is then graded by neither series. The rest pin that
      # "no evidence" keeps its own exit code — absent, empty, malformed,
      # commit-only and undeclared-window captures must never share the code a
      # breach gets.
      - name: E2E harness self-test (relay liveness grader)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/summarize-created-at-gaps.sh --self-test

      # The CLOSED-WORLD wire oracle (Workstream C, C2/C3/C4). Every assertion
      # it makes is a set operation, and every set operation passes over an
      # empty input — so its fixtures are almost entirely anti-vacuity ones: an
      # absent, empty, truncated, gapped or head-truncated journal must each
      # fail with its OWN exit code (the A4 lesson, "nothing to scan" reported
      # as "nothing leaked"), and a journal in which only ONE participant ever
      # transmitted must fail the meta-floor even though every kind and tag in
      # it is legitimate. Three more pin the design decisions that a later edit
      # would most plausibly "simplify" away: the same event published to two
      # relays and echoed to a subscriber must NOT trip a count assertion (sets,
      # never multisets — counts here are nondeterministic and a flaky privacy
      # oracle is a bypassed one); an optional tag legitimately absent must NOT
      # red (which is why C4 is a subset check AND a superset check rather than
      # set equality); and a violation appended ABOVE the sentinel — exactly
      # what a background wake does mid-read — must fall outside the snapshot,
      # which is the only fixture that can tell a working sentinel from an
      # inert one.
      - name: E2E harness self-test (wire-journal closed-world oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/check-wire-journal.sh --self-test

      # The VALUE layer over the same journal (Workstream C, C5.1-C5.6). The
      # oracle above asserts which kinds and which tag NAMES may appear, over
      # the UNION of a kind's events; this one reads values and the relations
      # between events, which is where the remaining linkability lives: two
      # circles sharing a created_at, a REQ filter wider than the one accepted
      # multiplexed `#h` shape, a second `h` on a single event, a `g`/`alt`
      # fingerprint, a gift wrap that is distinguishable from an ordinary
      # NIP-17 one, and an event reaching a relay outside its kind's pool.
      #
      # Its fixtures are dominated by ANTI-VACUITY cases, because every one of
      # those assertions passes over a snapshot containing none of the events
      # it reasons about — so each invariant has its own precondition and its
      # own fixture proving the precondition fires. The sharpest is C5.1's: a
      # floor of ">=2 distinct h" is satisfiable by COMMITS, which carry no
      # inner timestamp and so prove nothing about the binding the invariant
      # polices; the self-test contains the commit-only journal that must fail
      # as a META-FLOOR, and the mutation that relaxes the floor to all 445s is
      # caught by exactly that fixture. Three more pin rules that would
      # otherwise pass on a neighbour's coat-tails: a `g` tag on a NON-445 kind
      # (where C5.3 cannot also fire), a duplicated `expiration` (where the tag
      # NAME set is unchanged), and a multiplexed `#h` filter joined to a
      # SINGLE author (where neither cardinality rule fires).
      - name: E2E harness self-test (wire-journal correlation + containment oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/check-wire-correlation.sh --self-test

      # The CONTENT layer (Workstream C, C6), and the third of the three wire
      # oracles — the only one whose self-test was wired to nothing. Its two
      # siblings above assert over structure and can therefore only reject a
      # shape somebody enumerated; this one plants a value the run knows and
      # requires it to be absent in every encoding, which is what survives a
      # new MDK field or a debug path that stringifies a struct into a tag.
      #
      # Its fixtures are two-sided, because both sides can rot. A planted
      # canary must be CAUGHT (or the oracle is decorative) and a clean
      # journal must CLEAR (a privacy guard that cries wolf is one that gets
      # deleted). The rest are anti-vacuity: an absent, empty, uncovered or
      # LOSSY journal each fails with its own exit code — the lossy one
      # because the recorder renders binary with `from_utf8_lossy` BEFORE it
      # truncates, so a short binary frame arrives looking complete — a
      # mistyped manifest must fail as one of the documented five codes rather
      # than as an uncaught TypeError, and a run that recorded carriers
      # without ever confirming a plant must be a META-FLOOR. That last one is
      # the sharpest: carrier ids alone cannot tell a genuine carrier from any
      # published event id, so "the value never appeared" is free when the
      # value was never applied to anything.
      - name: E2E harness self-test (wire-journal content-canary oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: dart tooling/e2e/ci/check-wire-canaries.dart --self-test

      # The recorder that PRODUCES that journal is itself a privacy hazard: it
      # captures full event JSON, ciphertext, and REQ filters carrying identity
      # pubkeys, mapped to named endpoints. Same shape as the exporter-label ban
      # and the M7 test-hook boundary — a capability that must exist for the
      # harness and must be unreachable from the shipped app. The guard also
      # enforces the ARTIFACT decision (the raw .ndjson is never uploaded; the
      # redacted summary is) and the one property that makes the recorder safe
      # to run at all: fail-open is a property of the recorder's TYPE, not of
      # its call sites.
      - name: Wire proxy stays test-only
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_proxy_test_only.sh

      # The guard above is greps and one small YAML-block parser, so its
      # fixtures pin both directions of each check plus the three ways it could
      # rot into a rubber stamp: a .ndjson named OUTSIDE an upload step must be
      # ALLOWED (starting the recorder has to name its path), a doc comment
      # naming `unwrap()` must not count as code (the module has to be able to
      # explain why it avoids it), and a rename that leaves the signature
      # extractor matching NOTHING must fail rather than pass for want of
      # anything to check.
      - name: Wire-proxy guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_proxy_test_only.sh --self-test

      # The POSITIVE half. Everything above proves the wire instrument is
      # SAFE — unreachable from the app, and each oracle able to fail its own
      # fixtures. None of it proves the instrument is USED. The three oracle
      # steps in this job are `--self-test` invocations; that is the whole of
      # their CI presence, and it is precisely the shape
      # docs/CI_HARDENING_BACKLOG.md catalogues ten times over as "written,
      # reviewed, passes its own self-test, executes nowhere".
      #
      # So this guard asserts the chain that makes those verdicts mean
      # something: some lane starts the recorder, points the app at IT rather
      # than past it, stops it on every path, and runs an oracle over the
      # journal afterwards under the same sentinel the drive emitted. It is
      # pure bash over the workflow YAML, so it belongs here rather than in a
      # lane — and putting it in a lane would be circular anyway.
      - name: Wire oracles are reached by a lane
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_oracle_lane_reachable.sh

      # ...and its own fixtures, for the same reason every other guard in this
      # job has them: this one's entire subject is an ABSENCE, and a check that
      # has stopped matching reports every lane as compliant. The fixtures pin
      # a break of each of the four links, every route by which the guard could
      # find nothing to reason over (which must be BROKEN, a distinct exit
      # code, never a clean pass), and both false-positive directions — a
      # correctly wired lane and a declared exemption must BOTH stay green, or
      # the guard gets deleted rather than fixed.
      - name: Wire-reachability guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_oracle_lane_reachable.sh --self-test

      - name: Identity-delete prefs residue
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_identity_delete_prefs_residue.sh

      # The guard above is a hand-written extractor, so its fixtures pin the
      # regression found while writing it: a mutated-out clear left behind as
      # a comment still contains the literal `.remove(name)` text and must not
      # read as live. The rest cover the read-vs-clear distinction the whole
      # guard exists for, a stale keep-list entry, and both anti-vacuity floors
      # — zero keys found at all, and a partially-broken extractor that finds
      # some but far fewer than the real tree has.
      - name: Identity-delete residue guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_identity_delete_prefs_residue.sh --self-test

      # Both guards below are advisory-layer infrastructure, and both reason
      # about things a green verdict cannot demonstrate: that a hallucinated
      # citation is DEMOTED rather than published, and that a model edit
      # outside the manifest is REFUSED rather than proposed. Neither ever runs
      # in an enforcing mode here — their subject is another workflow's
      # behaviour — so the fixtures are the only proof they still work.
      - name: Advisory-finding anchor verifier self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ai_finding_anchors.sh --self-test

      - name: Manifest-author diff bound self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_manifest_author_diff.sh --self-test

      # The manifest is a join table between what the app PROMISES the user and
      # what makes that promise true, and nothing about a JSON file resists rot:
      # a test gets renamed, a guard stops being wired, a warning gets deleted,
      # and the manifest keeps asserting the world it was written against. This
      # re-derives every row from the tree — cited symbols, cited tests (present,
      # not `#[ignore]`d, not `skip:`ed, not in expected_test_skips.txt, no
      # `markTestSkipped` under integration_test/, and actually asserting),
      # cited guards (present AND wired in an ENFORCING run here, not merely as
      # their own --self-test), every `privacy*` string classified, every iOS
      # usage description and consent-dialog sentence classified, and every
      # event-kind construction token declared. The ratchet then compares
      # against the base ref: CI cannot judge whether weakening a guarantee is
      # justified, only force it to be stated where review sees it. The fetch
      # lives in the same step as the check because `actions/checkout` is
      # shallow — a separate step could be skipped, and a ratchet that cannot
      # read its baseline must fail, never pass. It runs LAST because it cites
      # the other guards, so every specific verdict has already printed above.
      # The baseline this step names is the commit the change is BUILT ON,
      # never the live tip of the default branch. On a pull request that is
      # `pull_request.base.sha`; on a push it is `event.before`, the PREVIOUS
      # TIP OF THE SAME BRANCH — a push to main therefore ratchets against what
      # main was a moment earlier, not against a diverged branch. Anchoring on
      # the tip was wrong twice: a tag build (release-build.yml calls this job
      # too) would fetch a main that had moved on and report every newer
      # invariant as `.deleted`, failing the release gate on a phantom
      # weakening; and on a push to main the tip IS the pushed commit, so the
      # baseline equalled HEAD and the ratchet — the thing this workstream is
      # built around — was silently vacuous on the one path that has no branch
      # protection in front of it. `event.before` fixes that: a direct push that
      # deletes an invariant is now caught.
      #
      # NAMING THE REF IS NOT OPTIONAL. The script's own default when invoked
      # with no flags is `origin/main` — precisely the live tip condemned above
      # — so every caller that cares must pass `--baseline-ref`. This step does;
      # `privacy-manifest-author.yml` does NOT, and validates its proposal
      # against main's tip on purpose (its branch is cut from that tip, so the
      # two coincide, and its proposals are additive by construction).
      # Where no base commit exists (tag, new branch, manual run) there is no
      # "change" to ratchet, so rules 1-14 run and only the comparison is
      # skipped — announced, never silent.
      - name: Privacy invariants describe this repository
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          baseline=""
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            baseline="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE:-}" \
               && "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            baseline="${PUSH_BEFORE}"
          fi
          if [[ -z "${baseline}" ]]; then
            echo "::notice::no base commit for this event (tag build, new branch or manual run) —" \
                 "running every rule, skipping only the ratchet comparison"
            bash scripts/ci/check_privacy_invariants.sh --no-ratchet
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${baseline}"
          bash scripts/ci/check_privacy_invariants.sh --baseline-ref "${baseline}"

      # The guard above is a hand-written extractor over four languages, so its
      # fixtures pin each way it could be wrong on CORRECT input as well as on
      # broken input: a PROSE `#[ignore]` comment must not read as an attribute
      # (there are five such comments in-tree), a Dart name split across
      # adjacent literals with a `\u` escape must resolve, one key may be an
      # assertion under one invariant and a disclosure under another (~24
      # strings promise and warn in one paragraph), and a decoy kind inside
      # `#[cfg(test)]` must not read as a new wire kind. The five that matter
      # most are the ones this workstream exists for: an assertion on an
      # accepted deviation, a deleted disclosure, an unwired guard, a
      # self-test-only wiring cited as proof, and a stale ratchet override.
      #
      # All of them are driven through the same `run_all_checks` list the
      # enforcing step above uses, so a check unwired from production is
      # unwired from these fixtures too and its fixtures go red. (They used to
      # be two independent lists, and had already drifted.) One fixture is
      # structural rather than a manifest mutation: every `check_*` must be in
      # that list — or, for the two that cannot run over a miniature fixture
      # tree, invoked by `main` AND carrying fixtures of its own — and `main`
      # must still drive the list, so neither a check nor the list itself can
      # be written and wired nowhere while counting as coverage.
      - name: Privacy-invariants guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_privacy_invariants.sh --self-test

      # The one guard in this job whose subject is a workflow, not the tree, so
      # its fixtures are the only thing that can catch a widened re-run rule.
      # They are hermetic: `gh` and `curl` are stubbed, nothing leaves the
      # runner. One fixture DOES read the tree — the signature must appear in
      # exactly one file — and it reads untracked files too, so a second copy
      # is caught in the commit that introduces it rather than the one after.
      - name: Runner-loss re-run gate self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
