# Reusable workflow: repository guards.
#
# All of Haven's fast, deterministic policy/privacy/correctness invariants,
# consolidated into ONE job. Every step is a pure grep/bash check over the
# checked-out tree — no Flutter/Rust toolchain, no emulator — so the whole job
# costs seconds. Each guard runs even if an earlier guard failed, so a single
# red run reports EVERY violated guard, not just the first.
#
# The guards (one step per checked-in script; scripts are the single source of
# truth for what each check enforces — see each script's header):
#
#   Committed-secrets scan            scripts/ci/check_no_committed_secrets.sh
#     The Stadia Maps API key (or any UUID-shaped secret) must never be
#     committed; the gitignored dart-define secrets file must stay untracked;
#     tiles.dart must keep injecting the key at compile time.
#
#   Map tile provider policy          scripts/ci/check_tile_provider.sh
#     The raw OpenStreetMap endpoint must never become the released default
#     tile source (OSMF tile usage policy).
#
#   Tile cache keeps no secrets       scripts/ci/check_no_tile_cache_secrets.sh
#     The encrypted tile cache must not persist or log the Stadia API key: no
#     api_key/url column in the Rust tile layer, no value-interpolating log::
#     call on a tile URL, and Dart tile logs stay presence-only (runtimeType).
#     NOTE: this guard existed, passed, and was wired to NOTHING until
#     2026-07-31 — it is the tile half of Security Rule 6/10.
#
#   Public-profile privacy boundaries scripts/ci/check_profile_privacy_boundaries.sh
#     The public Nostr profile module (kind-0 + Blossom) must stay inside its
#     privacy boundary: global Image.network ban, no circle/group tokens in
#     profile paths, no circle/MLS/mdk imports inside the profile module (key
#     separation), kind-0 construction confined to the profile module,
#     HTTPS-only Blossom, retraction no-op gate.
#
#   Android INTERNET permission       scripts/ci/check_internet_permission.sh
#     The production manifest must keep android.permission.INTERNET — it is
#     the relay receive path; a release without it ships silently broken.
#
#   Background-wake invariants        scripts/ci/check_m7_native_wake_guards.sh
#     Static correctness invariants of the Android WorkManager + iOS
#     SLC/BGTask background wakes (DartPluginRegistrant order, RebootReceiver
#     intent-filter, BGTask identifier parity, teardown-channel separation,
#     iOS-safe registration gate, wake-path intent re-check). The runtime
#     proofs live in the E2E background catch-up lane; this covers only what
#     a static check can prove.
#
#   iOS background publish            scripts/ci/check_ios_background_publish.sh
#     The unified-stream invariants that keep iOS background location
#     PUBLISHING alive (and keep opt-out users suspended): Info.plist
#     `location` background mode, exactly one geolocator stream call site,
#     AppleSettings background flags keyed off the background-sharing toggle
#     (never hardcoded), the C4 disable-while-paused watcher installed
#     outside the liveSync-gated path, presence-only location logging.
#
#   Location access gate ordering     scripts/ci/check_location_access_gate.sh
#     No stored coordinate may outlive the user's location access. The
#     geolocator service caches the stream's latest fix (168 s of servable
#     exposure), and only STATEMENT ORDER stops that cache — and the
#     iOS-backgrounded last-known shortcut — from being served ahead of the
#     permission/provider gate, which is where they used to sit. Also pins:
#     every denial CLEARS the cache instead of merely refusing the call; the
#     gate never raises a permission prompt while backgrounded (iOS defers it
#     and geolocator never resolves the future); the gate reads the granted
#     ACCURACY, the only signal for a Precise-Location/FINE downgrade that
#     checkPermission still calls whileInUse; and the per-circle publish
#     chain bounds each link, since a hung future raises no error for
#     catchError to catch.
#
#   Locale stays device-local         scripts/ci/check_locale_privacy.sh
#     The app language must remain a local preference and never be referenced
#     from the service layer (nothing locale-shaped may reach a relay).
#
#   No exporter-label override        scripts/ci/check_no_exporter_label_override.sh
#     The transport-nostr-peeler's with_exporter_label hook is the only local
#     lever that can downgrade the kind-445 exporter derivation away from
#     "marmot/group-event"; Haven's Rust source must never name it.
#
#   No event-timestamp cursor advance scripts/ci/check_no_event_timestamp_cursor_advance.sh
#     A sync cursor may never be advanced from an inbound event's `created_at`
#     (unauthenticated, remotely chosen, and poisoning it strands every event
#     below the new REQ floor). The deleted Dart/FFI group-cursor advance stays
#     deleted, and no FFI entry point may name the bare `group_445` stream.
#
#   Clock-skew policy parity          scripts/ci/check_clock_skew_policy_parity.sh
#     The device-clock skew policy lives authoritatively in Rust and is
#     mirrored in Dart across an FFI with no shared source of truth. If the
#     wire token drifts, Dart silently stops recognising a fast-clock
#     rejection and the failure goes invisible again with nothing else red.
#
#   MDK supply-chain shape            scripts/ci/check_mdk_supply_chain.sh
#     haven-core/Cargo.lock must hold exactly the five Dark Matter crates —
#     no forbidden uniffi/app/account/QUIC/agent crates, no legacy mdk-*
#     crates, and a single libsqlite3-sys version.
#
#   Session-busy marker is log-only   scripts/ci/check_session_busy_marker_not_routed.sh
#     The Rule-14 "an MLS session is already open" marker must never drive a
#     decision — Haven's FFI errors interpolate remote-authored text, so a
#     substring test over them is a remote control channel. Callers ask the
#     registry (`is_session_live` / `isSessionLive`) instead.
#
#   MLS session single owner          scripts/ci/check_mls_session_single_owner.sh
#     `CircleManagerFfi.newInstance` may appear in exactly three files — one per
#     isolate that legitimately owns a session — and the UI isolate's one must
#     latch the pause-time handoff, or the foreground service can never take
#     the session it was handed.
#
#   Liveness port single owner        scripts/ci/check_liveness_port_single_owner.sh
#     Only the UI isolate may call initCommunicationPort(), and it must also
#     install the liveness responder — a second caller silently steals the port
#     and makes the foreground service reclaim a healthy session.
#
#   E2E publish-before-apply          scripts/ci/check_e2e_publish_before_apply.sh
#     An integration test that calls createCircle() must also resolve the
#     staged create (confirmPublished / publishFailed, Security Rule 13).
#     Skipping it pins the group in MDK's PendingPublish, where every inbound
#     kind-445 buffers forever and the scenario fails on the receive path with
#     nothing pointing back at the create.
#
#   Background delivery is asserted   scripts/ci/check_m7_background_delivery_assertion.sh
#     The e2e-background-catchup lane must prove a background wake RECEIVED a
#     peer location, not merely that it booted. Its `M7_REQUIRE_DECRYPT`
#     switch defaulted to 0 and was set in no workflow, so for its whole life
#     the lane proved bootstrap under a name that said delivery. The guard
#     pins the workflow setting it, the runner still hard-failing, the CI-only
#     dispatcher arming the ws:// opt-in in the cold process AND delegating to
#     the production wake body, every m7_worker_* target registering it, and —
#     the privacy half — that no ws:// opt-in or HAVEN_E2E define ever appears
#     in the shipped worker library.
#
#   Live-sync define is declared      scripts/ci/check_live_sync_define_declared.sh
#     Every workflow job that BUILDS the app must say which receive path it
#     compiles. `liveSyncEnabled` is `bool.fromEnvironment('HAVEN_LIVE_SYNC',
#     defaultValue: true)` and the value is baked in at build time, so a lane
#     that omits the define does not build something neutral — it builds the
#     live-sync engine, chosen by nobody, under whatever name the lane carries.
#     build-check.yml and release-build.yml are the two allowlisted exceptions
#     (they build the SHIPPED artifact, whose path must come from defaultValue,
#     the M11 §8 rollback lever) and declare that intent with a token instead.
#     The guard also pins that the shared build wrappers keep FORWARDING the
#     define, since a workflow can declare a value the funnel silently drops.
#
#   E2E timeout ordering              scripts/ci/check_e2e_step_timeout_ordering.sh
#     Every emulator/simulator lane must stay bounded from the inside out:
#     inner deadline < step `timeout-minutes` < job `timeout-minutes`. The
#     order is what decides whether a hang produces a usable red. Our own
#     inner deadline names the lane and lets the step's if: failure()
#     diagnostics run; GitHub's step cap does NOT reliably reap the emulator
#     action's backgrounded subtree; and the job cap SIGKILLs the runner
#     before any diagnostic step, so a job-cap death is slow AND evidence-free.
#     The guard also fails an inoperative bound — a step cap equal to its job
#     cap, or a per-drive timeout set above the wrapper that would preempt it.
#
#   Skip-manifest self-test           scripts/ci/check_no_undeclared_skips.sh
#     The guard that fails a run when a test SKIPS without being declared in
#     scripts/ci/expected_test_skips.txt. The gate itself must parse real test
#     output, so it runs where the tests do — rust-check.yml for both cargo
#     crates, coverage.yml for `flutter test`; only its hermetic --self-test
#     belongs in this toolchain-free job. That self-test is what stops the
#     parser rotting into a vacuous pass: an extractor matching nothing would
#     otherwise report "0 skips, all declared" forever.
#
#   Coverage-floors self-test         scripts/ci/check_coverage_floors.sh
#     The guard that enforces a MINIMUM COVERAGE PER PATH, plus a ratchet that
#     fails when a path has outgrown its declared floor. It has to read a real
#     lcov report, so it runs where coverage is produced — coverage.yml, once
#     per stack — and only its hermetic --self-test belongs in this
#     toolchain-free job. That self-test is what stops the guard decaying into
#     a rubber stamp: its fixtures pin that a path below its floor fails, that
#     a floor set to the exact measured value still passes, that a path which
#     climbed past floor+margin fails ASKING FOR A RAISE, that a 100% path
#     pinned below 100 ratchets (the margin rule can never fire there — there
#     is no 103%), and that an entry matching no file fails. That last one is
#     the skip manifest's lesson applied to coverage: a stale floor measures
#     nothing, so it can never be below itself, and would sit green forever.
#
#   Coverage-floor pin rule           scripts/ci/check_coverage_floors.sh --lint
#     The manifest checked against its OWN rule — floor = floor(measured) - 2,
#     or exactly 100 — using each row's recorded `# measured N%` provenance.
#     Purely static, so unlike the enforcing run it belongs here. It exists
#     because the rule was not being applied: three rows had been hand-
#     tightened to 0.06, 0.14 and 0.72 points of headroom, turning floors into
#     tripwires, and the first of them reddened CI when unrelated work moved an
#     aggregate by seven hundredths of a point. Also catches duplicate rows and
#     rows with no recorded measurement — a floor nobody can re-derive is a
#     floor nobody can review.
#
#   Coverage lcov filter self-test    scripts/ci/filter_lcov.sh
#     The single implementation of which files the Flutter 50% gate and every
#     Flutter floor are computed from. It was two implementations (lcov globs
#     in the workflow, awk in the local gate) that nothing compared, and they
#     did differ. A bug here moves every Flutter coverage number at once, so
#     its fixtures pin each exclusion and pin that an empty or fully-excluded
#     report is reported as a broken filter rather than as 0%.
#
#   E2E harness self-tests            tooling/e2e/ci/*.sh --self-test
#     The bash guards embedded in the E2E tooling must not silently rot: the
#     connect-flake retry predicate must never retry a genuine test failure,
#     the secret-leak log scanner must catch planted key material, and the iOS
#     retry classifier + first-test watchdog must admit exactly one
#     infrastructure signature and refuse everything else — including an empty
#     or absent log, where "no evidence" must not read as "flake".
#
#   Wire-journal closed-world oracle  tooling/e2e/ci/check-wire-journal.sh
#     The one guard here whose SUBJECT is a data file: `tooling/e2e/
#     wire_allowlist.json` enumerates every event kind Haven may put on a relay
#     and every tag name each kind may carry, and anything absent from it is
#     forbidden. That inverts the forbid-list it replaces, under which a new
#     kind, a new tag, or an MDK-introduced field reached a relay in silence.
#     Only the self-test runs in this job — the oracle itself runs in the E2E
#     lanes, over the journal the recording proxy writes. What the self-test
#     protects is the oracle's ability to FAIL: every assertion in it is a set
#     operation over a file that may be absent, empty or truncated, so without
#     fixtures proving each of those is its own failure class, a green verdict
#     would carry no information at all.
#
#   Wire correlation oracle           tooling/e2e/ci/check-wire-correlation.sh
#     The layer under the closed-world one. That file asks which kinds and
#     which tag NAMES appear; this one asks what the VALUES are and how events
#     relate — two circles publishing in the same second, a REQ filter wider
#     than the accepted multiplexed `#h` shape, a second `h` inside one event,
#     a `g`/`alt` fingerprint, a gift wrap distinguishable from an ordinary
#     NIP-17 one, and an event reaching a relay outside its kind's pool. None
#     of those is visible to a union-level tag allow-list. Again only the
#     self-test runs here; the oracle runs in the E2E lanes. Its fixtures are
#     mostly anti-vacuity: every invariant carries a precondition, and a
#     precondition that never fires is how a privacy check comes to certify a
#     sample it never had.
#
#   Wire content-canary oracle        tooling/e2e/ci/check-wire-canaries.dart
#     The third wire oracle, and the only one that asserts over CONTENT rather
#     than structure: it plants values the run knows — a circle name, a
#     petname, a coordinate — and requires them to be absent from every frame
#     in every encoding. That is the check that survives a new MDK field or an
#     unanticipated serialization, neither of which any allow-list sees.
#     Only the self-test runs here. What it protects is the pair of properties
#     that make the verdict mean anything: the oracle must CATCH a planted
#     canary and must CLEAR a clean journal, and every way it could report a
#     pass without having looked — absent, empty, uncovered or lossily
#     previewed journal, unreadable manifest, or a run that recorded carriers
#     while never confirming a plant took — must be its own non-zero code.
#
#   Wire proxy stays test-only          scripts/ci/check_wire_proxy_test_only.sh
#     The recorder that produces that journal captures FULL event JSON,
#     ciphertext, and REQ filters carrying long-term identity pubkeys, each line
#     mapped to a named relay endpoint. It must exist for the harness and be
#     unreachable from the shipped app, so: no production tree may name it, no
#     shipped manifest may depend on the crate, no workflow may upload the raw
#     `.ndjson` (CI artifacts outlive the runner by days on a public repo — the
#     redacted summary is what a lane uploads), that summary must keep being
#     scanned for secrets before it can become one, and every `pub fn record*`
#     must return plain `u64`. That last one is the load-bearing invariant, not
#     a style rule: a recorder with an error channel hands every call site a
#     failure it can propagate into the connection pump, which is the
#     instrument breaking the product.

name: Repo Guards

on:
  workflow_call:

jobs:
  guards:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      # xmllint (libxml2-utils) is pre-installed on ubuntu-latest, but ensure it
      # so the XML-comment-safe manifest/plist checks never depend on the image.
      # Braced group so the install only runs when xmllint is actually missing.
      - name: Ensure xmllint
        run: xmllint --version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }

      # The one non-bash guard in this job. `check-wire-canaries.dart` is a
      # plain Dart program with no package dependencies — it imports
      # `dart:convert`/`math`/`typed_data` and one relative library — so it
      # needs an SDK but no `pub get` and no Flutter. setup-dart is ~10 s,
      # which is why the canary self-test can live here with the other
      # invariants instead of behind the coverage job's toolchain.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Every guard below carries the same `if:` — run whenever checkout
      # succeeded, even if an earlier guard failed — so one red run reports the
      # full set of violations instead of stopping at the first.

      - name: Committed-secrets scan
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_committed_secrets.sh

      - name: Map tile provider policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_tile_provider.sh

      - name: Tile cache keeps no secrets
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_tile_cache_secrets.sh

      - name: Public-profile privacy boundaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_profile_privacy_boundaries.sh

      - name: Android INTERNET permission
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_internet_permission.sh

      - name: Background-wake invariants
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_native_wake_guards.sh

      - name: iOS background publish
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_ios_background_publish.sh

      # The gate that stops a cached GPS fix outliving the consent for it is
      # enforced by nothing but statement ORDER — the permission/provider
      # checks used to sit BELOW the warm-cache and last-known shortcuts, so
      # both published coordinates the user had already revoked. Putting them
      # back is a one-line reorder that compiles, reads naturally in a diff
      # hunk, and can be made to pass the unit tests by softening one stub.
      - name: Location access gate precedes every coordinate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_location_access_gate.sh

      # The guard above is an ordering analysis over a comment-stripped view,
      # so its fixtures pin both directions and the two ways it could rot: a
      # correctly ordered service must PASS (or a guard hard-coded to fail
      # would look right on every negative fixture), a DELETED gate must fail
      # loudly rather than pass for want of an anchor, and a doc comment that
      # merely mentions the gate must not count as calling it.
      - name: Location access gate guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_location_access_gate.sh --self-test

      - name: Locale stays device-local
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_locale_privacy.sh

      - name: No exporter-label override
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_exporter_label_override.sh

      - name: No cursor advance from an event timestamp
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_event_timestamp_cursor_advance.sh

      - name: Clock-skew policy parity
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_clock_skew_policy_parity.sh

      - name: MDK supply-chain shape
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_mdk_supply_chain.sh

      # The Rule-14 busy marker is a LOG token. Routing on it would be
      # remotely influenceable: a circle admin controls the group's routing
      # relays, the live-sync relay gate interpolates a rejected URL into its
      # error, and redaction preserves a planted marker verbatim — so
      # `ws://host/HAVEN_E_SESSION_BUSY` could make the foreground service tear
      # down a healthy live-sync engine. Liveness comes from the registry.
      - name: Session-busy marker stays log-only
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_session_busy_marker_not_routed.sh

      # `initCommunicationPort()` TAKES OVER the isolate port name rather than
      # joining it. A second caller (the natural copy-paste when adding
      # worker->UI messaging) would route every liveness probe to an isolate
      # with no responder, so the foreground service would read the silence as a
      # dead UI isolate and force-release its live-sync session on a schedule.
      - name: Liveness port has a single owner
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_liveness_port_single_owner.sh

      # Rule 14 is enforced per PROCESS, and Android runs the UI and the
      # location foreground service as two isolates inside one. The pause-time
      # handoff is what lets the service publish, and it only holds because
      # every reopen in the UI isolate funnels through one latched chokepoint —
      # a direct `CircleManagerFfi.newInstance` anywhere else takes the session
      # straight back, which is exactly how background publishing died (P0-1).
      - name: MLS session has a single owner per isolate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_mls_session_single_owner.sh

      - name: E2E publish-before-apply (staged creates resolved)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_publish_before_apply.sh

      # A switch that exists, reads plausibly, and is set nowhere is the
      # quietest way for a lane to stop proving what it is named for:
      # M7_REQUIRE_DECRYPT defaulted to 0 for its entire life, so the
      # background catch-up lane asserted bootstrap and never delivery.
      - name: Background catch-up lane asserts delivery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_background_delivery_assertion.sh

      # The guard above is a grep over four file kinds, so its fixtures pin
      # each one in both directions — including the exact regression it exists
      # for (a workflow that sets nothing), a doc comment that must not count
      # as a call, and a dispatcher that re-implements the wake instead of
      # delegating to it, which would make the lane prove the copy.
      - name: Background-delivery guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_m7_background_delivery_assertion.sh --self-test

      # The kind-0 plane's test override is install-once, so a second call site
      # throws and the winner depends on call order. That broke e2e_profile on
      # both platforms in CI run 30753193231 — under a comment asserting the
      # invariant this now enforces.
      - name: Profile-relay override has a single install site
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_profile_override_single_site.sh

      # A poll lane that inherits live-sync is a lane whose name is wrong about
      # what it runs. e2e-flakiness-stress spent months running the M11 live
      # suite inside a poll-sized budget, red most nights, while its header said
      # it mirrored the poll lane; e2e-profile ran its two platform jobs on
      # OPPOSITE receive paths. Both were omissions, not decisions.
      - name: Live-sync define is declared, never inherited
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_define_declared.sh

      # The guard above is a grep over YAML, so it is exactly as trustworthy as
      # its patterns. The fixtures pin the two directions it can rot in: a build
      # with no declaration must fail, and a job that merely MENTIONS the flag
      # (in prose, or in a comment) must not count as having declared it.
      - name: Live-sync define guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_live_sync_define_declared.sh --self-test

      # Fixture-driven, no toolchain: an undeclared skip must fail, a log
      # matching the manifest must pass, a stale manifest entry must fail, and
      # a parsed-vs-summary count disagreement must be reported as a broken
      # guard rather than as a clean run.
      - name: Skip-manifest guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_no_undeclared_skips.sh --self-test

      # Fixture-driven, no toolchain and no lcov: a path below its floor must
      # fail, a floor equal to the measured value must pass, a path that
      # outgrew its floor must fail naming the number to write down, a 100%
      # path pinned below 100 must ratchet, and an entry matching no file must
      # fail. The last two fixtures parse the CHECKED-IN manifest for both real
      # stacks, so a typo in scripts/ci/coverage_floors.txt is caught in this
      # seconds-long job instead of an hour into the coverage workflow.
      - name: Coverage-floors guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_coverage_floors.sh --self-test

      # Static half of the coverage gate: every floor must equal the pin rule
      # applied to its own recorded measurement. Three rows had been hand-
      # tightened past it — one to 0.06 points of headroom, which is what
      # reddened run 30964250098 when unrelated work moved an aggregate by
      # seven hundredths of a point. That verdict needed a full 11-minute
      # llvm-cov run to reach; here it costs milliseconds, and the same command
      # runs in the pre-commit hook.
      - name: Coverage-floor manifest obeys its pin rule
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_coverage_floors.sh --lint

      # The filter that decides WHICH files the 50% gate and every Flutter floor
      # are computed from. Shared by coverage.yml and the local gate, so a bug
      # here silently moves every Flutter number at once.
      - name: Coverage lcov filter self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/filter_lcov.sh --self-test

      # An emulator lane with no inner deadline routes every hang to the JOB
      # cap, which SIGKILLs the runner before the if: failure() diagnostics,
      # the secret scan and the artifact upload — slow, and with no evidence.
      # Four lanes were in that state (CI_HARDENING_BACKLOG.md A8), and two
      # more carried bounds that could never fire: a per-drive timeout ABOVE
      # its own wrapper, and a step cap EQUAL to its job cap.
      - name: E2E timeout ordering (inner < step < job)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_step_timeout_ordering.sh

      # The guard above reads YAML with a purpose-built parser, so it is
      # exactly as trustworthy as that parser. The fixtures pin each check
      # against a lane shape that really occurred here, and pin the two ways
      # it could rot into a rubber stamp: a step comment that MENTIONS a
      # timeout must not count as declaring one, and a hermetic `--self-test`
      # step must not be mistaken for a simulator lane. The guard additionally
      # refuses to pass if it finds fewer lanes than the repo has, so an
      # extractor that stops matching fails loudly instead of vacuously.
      - name: E2E timeout-ordering guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_e2e_step_timeout_ordering.sh --self-test

      # The inner deadline itself. Its critical fixture is exit-code
      # PASS-THROUGH: if a genuine test failure were ever reported as 124,
      # run-relay-customization.sh's timeout-only retry would start retrying
      # real reds and a failing lane could flake green.
      - name: E2E harness self-test (inner deadline wrapper)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-with-deadline.sh --self-test

      - name: E2E harness self-test (connect-flake predicate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-single-avd-scenario.sh --self-test

      - name: E2E harness self-test (secret-leak scanner)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/scan-logs-for-secrets.sh --self-test

      - name: Build-retry predicate self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/build_apk_with_retry.sh --self-test

      # Guards the predicate that catches `flutter drive` exiting 0 on a FAILED
      # test. Its critical fixture is the verbatim run-30753193231 log in which
      # a setUpAll failure was reported to the driver as "All tests passed." —
      # if that stops being detected, every drive-based lane can go green on a
      # red suite again.
      - name: E2E harness self-test (drive-log failure predicate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/drive-log-lib.sh --self-test

      # Guards the B1 lane's publish-count PARSER. Its critical fixture is the
      # `Published to 0/1` line — P0-1's own signature, which a substring grep
      # would accept. If this parser ever rots into one that returns >=1 there,
      # the FGS lane goes green while background publishing is dead.
      - name: E2E harness self-test (FGS publish-count parser)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b1-fgs-publish.sh --self-test

      # Guards the B3 real-GPS lane's oracle predicates. Two critical fixtures:
      # `[b3] PUBLISHED n=0` (the publisher reporting it published to NOTHING —
      # a presence grep would call that a pass) and a `dumpsys package` dump
      # where a NEIGHBOURING permission is granted while ours is not (a bare
      # `granted=true` grep would report the location permission as held). If
      # either rots, the lane goes green on a chain that never carried a real
      # GPS fix.
      - name: E2E harness self-test (real-GPS oracle predicates)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b3-real-gps.sh --self-test

      # Guards the B6 provider-toggle lane's oracle, which is exercised END TO
      # END here rather than only per-predicate: one fixture is TODAY'S real
      # behaviour (publishes, stops, recovers, tells the user NOTHING) and must
      # be REPORTED, and its twin is the fully-fixed app and must PASS. Without
      # the second, an oracle hard-coded to red would look correct; without the
      # first, the lane would bless the silent-failure defect it exists to find.
      # Two more pin the vacuity routes: a zero baseline (it never published, so
      # "it stopped" is meaningless) and an error surface that was already up
      # before the toggle.
      - name: E2E harness self-test (provider-toggle oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b6-location-provider-toggle.sh --self-test

      # Guards the relay's pull-skip decision, which is one `if` that can strand
      # a whole lane in either direction: skip a stale TAG and the hermetic relay
      # silently changes between runs; fail to skip a digest-pinned image that is
      # already local and a lane whose egress guard is up dies on a pull it never
      # needed (CI run 31075503390). The fixtures cover both, plus the call site
      # itself — a correct predicate nothing consults is the same outage.
      - name: E2E harness self-test (strfry pull-skip)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/start-strfry.sh --self-test

      # Guards the B5 permission-revocation oracle. Two halves need pinning.
      # The RELAY half is a diff over location-event ids, and its fixtures are
      # the ones that can silently rot: a commit-only capture must yield NO
      # ids (kind 445 also carries MLS evolution traffic, which ACT 2's own
      # circle creation produces), the 64-hex `pubkey` on the same line must
      # never be harvested as an event id, and a baseline id that EXPIRED off
      # the relay must not resurface as "new". The PERMISSION half is read
      # from `dumpsys package`, where a granted neighbouring permission one
      # line up would answer for ours under a bare `granted=true` grep — and
      # `pm grant`/`pm revoke` exit 0 even when they refuse, so that read is
      # the only place a refusal is visible at all.
      - name: E2E harness self-test (permission-revocation oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b5-permission-revocation.sh --self-test

      # Guards the B8 clock-skew lane's ANTI-VACUITY parsers. The critical
      # fixture is a servo record whose read-back drift equals the full
      # requested magnitude — i.e. `date` exited 0 and the clock never moved.
      # If `jump_ok_seqs` ever rots into one that accepts it, every phase of
      # that lane runs at true time, every in-drive oracle passes, and the lane
      # reports GREEN having applied no skew at all. Two more pin the routes
      # either side of it: a missing/empty servo log must yield NO applied
      # jumps (a grep that matches nothing is how a guard becomes a no-op), and
      # a truncated capture must stay distinguishable from a clean one so "the
      # body died at phase 2" cannot read as "phases 3-4 found nothing".
      - name: E2E harness self-test (clock-skew parsers)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b8-clock-skew.sh --self-test

      # Guards the KPR lane's oracle END TO END, not only per-predicate. The
      # critical fixture is THE PRE-FIX CONDITION: a capture in which the tick
      # reported `alreadyHealthy` and the peer's re-fetch was unchanged — the
      # state the repo actually shipped in — which must be REPORTED. Its twin
      # is the healthy app, which must PASS, or an oracle hard-coded to red
      # would look correct on the first. The near-misses pin the three ways a
      # rotation can look complete and not be: rotated into a DIFFERENT `d`
      # (the old expiring package stays addressable beside the new one),
      # published but acked by NOBODY (the action names the branch that ran and
      # is chosen before the write), and an Add that succeeded while the
      # resulting group decrypts nothing. The vacuity fixtures pin the routes
      # where the lane would prove nothing while looking green: a backdate that
      # never landed on the device (`date` exits 0 having changed nothing),
      # material below the 75% point, and material already EXPIRED — which
      # re-mints through a different branch entirely.
      - name: E2E harness self-test (KeyPackage-rotation oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-kp-rotation.sh --self-test

      # Guards the B9 network-reconnect oracle. Its critical fixtures are the
      # NEGATIVE TWINS: every verdict in that lane is a positive/negative pair
      # printed by the drive, and a substring match that let
      # `OUTAGE_NOT_OBSERVED` satisfy a search for `OUTAGE_OBSERVED` would
      # report a lane that never disconnected as one that did — a green run
      # proving nothing at all. The rest pin the four vacuity routes (no
      # baseline receive, engine never running, no outage, nothing published
      # after it), the REAL FINDING case (recovery never happened, which must
      # be reported), and the healthy app (which must PASS, or an oracle
      # hard-coded to red would look correct on the finding fixture).
      - name: E2E harness self-test (network-reconnect oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b9-network-reconnect.sh --self-test

      # Egress guard (CI_HARDENING_BACKLOG C7). The kernel-side gates (rules
      # installed, a loopback probe observed, a deliberate egress to
      # 192.0.2.1 observed) can only be proven on a real runner and are
      # enforced there at install time. What belongs HERE is everything that
      # decides a VERDICT off-kernel: the CIDR matcher, the two allow-list
      # shapes that would silently turn enforce mode into a no-op (a default
      # route; an IPv6 CIDR the matcher cannot evaluate), the kernel-line
      # parser against real `iptables -j LOG` output, and all four report
      # verdicts — including the two that must NOT be confused, an empty
      # capture (rc 3, "no evidence") versus an empty EXTERNAL set (rc 0, the
      # healthy hermetic result). It also parses the checked-in
      # egress-allowlist.txt, so a broken allow-list is caught now rather than
      # on the day someone attempts the flip to enforcement.
      - name: E2E harness self-test (egress guard)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/setup-network-guard.sh --self-test

      # The iOS twin of the connect-flake predicate. Both iOS lanes hand their
      # scenario to `nick-fields/retry` with no filter, so before this the second
      # attempt was a free re-roll of ANY red — measured, 19 genuine test
      # failures were retried and only one signature (a post-build, pre-test
      # simulator launch/attach stall) ever justified it. The critical fixtures
      # are the verbatim `::error::9 tests passed, 1 failed.` log (must NOT
      # retry) and an empty/absent log (must NOT retry — the A4 lesson: no
      # evidence is not evidence of a flake).
      - name: E2E harness self-test (iOS flake classifier + retry gate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/ios-flake-lib.sh --self-test

      # …and the WIRING, which fixtures alone cannot reach: the watchdog that
      # turns a silent 30-minute hang into a classified, attributed failure has
      # to actually fire on a stall and actually leave a running suite alone.
      # Drives the real watchdog against a stubbed process, then hands its output
      # to the real classifier — so the marker the one writes and the marker the
      # other requires cannot drift apart unnoticed.
      - name: E2E harness self-test (iOS first-test watchdog)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-ios-sim-scenario.sh --self-test

      # The B7 auth-tier lane's own predicates. Its failure modes are all
      # silent-green ones that no on-device run could report: an Xcode whose
      # `simctl privacy` has no `location-always` service (the lane would grant
      # `location` twice and "pass"); two runs that observed the SAME tier
      # (every per-tier branch in the drive target still passes, having
      # discriminated nothing); and a drive that exits 0 without running either
      # test body — the tier marker is printed BEFORE the first assertion, so
      # the discrimination gate reads it and passes while `[b7] COPY_OK` and
      # `[b7] BACKGROUND_PUBLISH_OK` never appear. The fixtures pin all three,
      # plus the tier-marker parser that feeds the first two.
      - name: E2E harness self-test (iOS auth-tier discrimination gate)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b7-ios-auth-tier.sh --self-test

      # The B4 iOS real-GPS lane's preflight and oracle. The fixtures that earn
      # their keep are the silent-green ones: a `simctl location` usage listing
      # WITHOUT a `set` action (the lane must refuse rather than improvise a
      # fake fix) versus an Xcode with no `location` subcommand at all (a
      # different failure, and conflating them blames Xcode for a broken probe);
      # `(0, 0)` refused as a seed, because the null island is exactly what a
      # simulator with no simulated location reports, so seeding it would make
      # the lane unable to tell a delivered fix from no fix; and a log that says
      # `1 test passed` without the `[b4] PEER_DECRYPT_MATCH` marker, which is
      # the only check that can see a drive exiting 0 without reaching its proof
      # (A3b).
      - name: E2E harness self-test (iOS real-GPS preflight + proof oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/run-b4-ios-real-gps.sh --self-test

      # The CLOSED-WORLD wire oracle (Workstream C, C2/C3/C4). Every assertion
      # it makes is a set operation, and every set operation passes over an
      # empty input — so its fixtures are almost entirely anti-vacuity ones: an
      # absent, empty, truncated, gapped or head-truncated journal must each
      # fail with its OWN exit code (the A4 lesson, "nothing to scan" reported
      # as "nothing leaked"), and a journal in which only ONE participant ever
      # transmitted must fail the meta-floor even though every kind and tag in
      # it is legitimate. Three more pin the design decisions that a later edit
      # would most plausibly "simplify" away: the same event published to two
      # relays and echoed to a subscriber must NOT trip a count assertion (sets,
      # never multisets — counts here are nondeterministic and a flaky privacy
      # oracle is a bypassed one); an optional tag legitimately absent must NOT
      # red (which is why C4 is a subset check AND a superset check rather than
      # set equality); and a violation appended ABOVE the sentinel — exactly
      # what a background wake does mid-read — must fall outside the snapshot,
      # which is the only fixture that can tell a working sentinel from an
      # inert one.
      - name: E2E harness self-test (wire-journal closed-world oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/check-wire-journal.sh --self-test

      # The VALUE layer over the same journal (Workstream C, C5.1-C5.6). The
      # oracle above asserts which kinds and which tag NAMES may appear, over
      # the UNION of a kind's events; this one reads values and the relations
      # between events, which is where the remaining linkability lives: two
      # circles sharing a created_at, a REQ filter wider than the one accepted
      # multiplexed `#h` shape, a second `h` on a single event, a `g`/`alt`
      # fingerprint, a gift wrap that is distinguishable from an ordinary
      # NIP-17 one, and an event reaching a relay outside its kind's pool.
      #
      # Its fixtures are dominated by ANTI-VACUITY cases, because every one of
      # those assertions passes over a snapshot containing none of the events
      # it reasons about — so each invariant has its own precondition and its
      # own fixture proving the precondition fires. The sharpest is C5.1's: a
      # floor of ">=2 distinct h" is satisfiable by COMMITS, which carry no
      # inner timestamp and so prove nothing about the binding the invariant
      # polices; the self-test contains the commit-only journal that must fail
      # as a META-FLOOR, and the mutation that relaxes the floor to all 445s is
      # caught by exactly that fixture. Three more pin rules that would
      # otherwise pass on a neighbour's coat-tails: a `g` tag on a NON-445 kind
      # (where C5.3 cannot also fire), a duplicated `expiration` (where the tag
      # NAME set is unchanged), and a multiplexed `#h` filter joined to a
      # SINGLE author (where neither cardinality rule fires).
      - name: E2E harness self-test (wire-journal correlation + containment oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/check-wire-correlation.sh --self-test

      # The CONTENT layer (Workstream C, C6), and the third of the three wire
      # oracles — the only one whose self-test was wired to nothing. Its two
      # siblings above assert over structure and can therefore only reject a
      # shape somebody enumerated; this one plants a value the run knows and
      # requires it to be absent in every encoding, which is what survives a
      # new MDK field or a debug path that stringifies a struct into a tag.
      #
      # Its fixtures are two-sided, because both sides can rot. A planted
      # canary must be CAUGHT (or the oracle is decorative) and a clean
      # journal must CLEAR (a privacy guard that cries wolf is one that gets
      # deleted). The rest are anti-vacuity: an absent, empty, uncovered or
      # LOSSY journal each fails with its own exit code — the lossy one
      # because the recorder renders binary with `from_utf8_lossy` BEFORE it
      # truncates, so a short binary frame arrives looking complete — a
      # mistyped manifest must fail as one of the documented five codes rather
      # than as an uncaught TypeError, and a run that recorded carriers
      # without ever confirming a plant must be a META-FLOOR. That last one is
      # the sharpest: carrier ids alone cannot tell a genuine carrier from any
      # published event id, so "the value never appeared" is free when the
      # value was never applied to anything.
      - name: E2E harness self-test (wire-journal content-canary oracle)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: dart tooling/e2e/ci/check-wire-canaries.dart --self-test

      # The recorder that PRODUCES that journal is itself a privacy hazard: it
      # captures full event JSON, ciphertext, and REQ filters carrying identity
      # pubkeys, mapped to named endpoints. Same shape as the exporter-label ban
      # and the M7 test-hook boundary — a capability that must exist for the
      # harness and must be unreachable from the shipped app. The guard also
      # enforces the ARTIFACT decision (the raw .ndjson is never uploaded; the
      # redacted summary is) and the one property that makes the recorder safe
      # to run at all: fail-open is a property of the recorder's TYPE, not of
      # its call sites.
      - name: Wire proxy stays test-only
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_proxy_test_only.sh

      # The guard above is greps and one small YAML-block parser, so its
      # fixtures pin both directions of each check plus the three ways it could
      # rot into a rubber stamp: a .ndjson named OUTSIDE an upload step must be
      # ALLOWED (starting the recorder has to name its path), a doc comment
      # naming `unwrap()` must not count as code (the module has to be able to
      # explain why it avoids it), and a rename that leaves the signature
      # extractor matching NOTHING must fail rather than pass for want of
      # anything to check.
      - name: Wire-proxy guard self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash scripts/ci/check_wire_proxy_test_only.sh --self-test
