# Reusable workflow: Coverage testing
# Runs unit tests with coverage for both Rust and Flutter packages
# Enforces 80% minimum coverage threshold for Rust, 50% for Flutter, plus the
# per-path floors in scripts/ci/coverage_floors.txt.
#
# EVERY gate in this file is also runnable locally, as a superset, with
# `scripts/ci/check_coverage.sh` (wired as the pre-push hook). When you add a
# step here, add it there — the local gate's whole value is the claim that a
# green run locally means a green run here, and each step that exists in only
# one of the two erodes it.
#
# The measuring toolchains are PINNED (scripts/ci/coverage_toolchain.env),
# unlike every other workflow, which floats on `stable`. Coverage is a ratio
# whose denominator is instrumented lines — a property of the compiler, not of
# the tests — so a floating toolchain silently re-measures every path on
# someone else's release schedule. It did: `stable` moving 1.92 -> 1.97.1
# tripped seven per-path ratchets in one run with no code change. Compiler
# breakage still gets caught, by rust-check/flutter-check/build-check, which
# keep floating deliberately.

name: Coverage

on:
  workflow_call:

jobs:
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haven-core

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The pin lives in a checked-in file rather than inline here so the local
      # gate reads the same value; a version duplicated across a workflow and a
      # script is a version that drifts.
      - name: Read pinned coverage toolchains
        id: toolchain
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          . scripts/ci/coverage_toolchain.env
          : "${HAVEN_COVERAGE_RUST_TOOLCHAIN:?not set in scripts/ci/coverage_toolchain.env}"
          echo "rust=${HAVEN_COVERAGE_RUST_TOOLCHAIN}" >> "$GITHUB_OUTPUT"
          echo "Measuring with rustc ${HAVEN_COVERAGE_RUST_TOOLCHAIN}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haven-core

      - name: Run tests with coverage
        # Instrumented builds are materially slower: every basic block carries a
        # counter update, and the e2e targets run their tests concurrently, each
        # with its own MockRelay + LiveSyncCore, on a 2-core runner. The e2e
        # anti-vacuity waits are sized for an uninstrumented build, so in CI run
        # 31216078806 one of them expired here while the SAME test passed in the
        # uninstrumented rust-check job. Scaling those DELIVERY budgets cannot
        # mask a defect — they assert that something arrived, so a bigger budget
        # only removes a false negative — and it leaves `cargo test` untouched.
        env:
          HAVEN_TEST_WAIT_SCALE: '4'
        run: |
          cargo llvm-cov --all-features --lcov --output-path coverage.lcov \
            --ignore-filename-regex 'frb_generated'

      - name: Check coverage threshold
        run: |
          # `pipefail` so a broken llvm-cov (or a missing TOTAL line) fails the
          # pipeline instead of quietly yielding an empty COVERAGE.
          set -euo pipefail

          # Extract coverage percentage from lcov file
          COVERAGE=$(cargo llvm-cov --all-features \
            --ignore-filename-regex 'frb_generated' \
            --summary-only | grep 'TOTAL' | awk '{print $10}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"

          # A PARSE FAILURE USED TO PASS THIS GATE. With COVERAGE empty (or any
          # non-numeric text), `echo " < 80" | bc -l` writes a syntax error to
          # stderr and NOTHING to stdout; `(( ))` on an empty string evaluates
          # to 0, i.e. false, so control fell through to the else branch and the
          # job printed "✅ Coverage % meets threshold 80%" and exited 0. Every
          # way of losing the number — an llvm-cov output change, a renamed
          # TOTAL row, a build that produced no summary — therefore reported
          # SUCCESS. Validate the shape before comparing.
          case "${COVERAGE}" in
            ''|*[!0-9.]*)
              echo "::error::Could not parse a coverage percentage from llvm-cov (got: '${COVERAGE}')"
              exit 1
              ;;
          esac

          # Check if coverage meets threshold
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      # The gate above is a single AGGREGATE, and an aggregate is a budget the
      # whole crate shares: haven-core sits ~10 points over its 80% threshold,
      # which is ~2290 lines of slack — more than any one file in the crate.
      # src/nostr/mls/manager.rs, src/nostr/giftwrap.rs and all of
      # src/nostr/encryption/ could go to zero coverage together and the step
      # above would still print a green check. The floors below are the
      # per-path minimum that cannot express, enforced against the SAME lcov.
      # `!cancelled()` so a failing aggregate still reports the floors too.
      - name: Per-path coverage floors (haven-core)
        if: ${{ !cancelled() }}
        run: bash ../scripts/ci/check_coverage_floors.sh rust coverage.lcov

      - name: Generate HTML report
        run: |
          cargo llvm-cov --all-features --html \
            --ignore-filename-regex 'frb_generated'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage-report
          path: |
            haven-core/coverage.lcov
            haven-core/target/llvm-cov/html/
          retention-days: 30

  flutter-coverage:
    name: Flutter Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haven

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pinned coverage toolchains
        id: toolchain
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          . scripts/ci/coverage_toolchain.env
          : "${HAVEN_COVERAGE_FLUTTER_VERSION:?not set in scripts/ci/coverage_toolchain.env}"
          echo "flutter=${HAVEN_COVERAGE_FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Measuring with Flutter ${HAVEN_COVERAGE_FLUTTER_VERSION}"

      # Pinned for the same reason the Rust job pins rustc: `channel: stable`
      # already moved this measurement from 3.41 to 3.44.8 underneath a manifest
      # of per-path floors. Every OTHER Flutter job keeps `channel: stable` — a
      # new SDK breaking the app must still surface, just not as a coverage
      # number nobody changed.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `--file-reporter` writes a machine-readable JSON stream ALONGSIDE the
      # normal console reporter (unlike `--reporter`, which would replace it),
      # so the skip gate below gets per-test `skipped` verdicts without costing
      # a second full test run. This is the repo's only `flutter test` over the
      # whole suite — flutter-check.yml runs `flutter analyze` only — so it is
      # where the Dart half of the skip gate has to live.
      - name: Run tests with coverage
        run: >-
          flutter test --coverage
          --file-reporter=json:"${RUNNER_TEMP}/flutter-test-report.json"

      # `flutter test` prints "~22" and exits 0; nothing asserted it. Those 22
      # are the pseudo-locale overflow sweep (gated on a deliberately
      # uncommitted ARB) and three Android-only permission cases — all
      # legitimate, all previously invisible. The gate makes them declared, so a
      # NEW skip, or the disappearance of a declared one, fails the build.
      # Deliberately NOT applied to the flag-off step below: that runs two named
      # files, and a filtered run cannot prove the whole suite's skip set.
      - name: No undeclared test skips
        run: bash ../scripts/ci/check_no_undeclared_skips.sh dart flutter "${RUNNER_TEMP}/flutter-test-report.json"

      # The coverage run above passing NO --dart-define is load-bearing, not an
      # A7 omission: it is a HOST test run, not an app build, and it is the only
      # place `live_sync_provider_test`'s "defaults ON" assertion can observe the
      # compiled default. Forcing an explicit define there would turn that test
      # into a tautology and delete the proof that production ships the engine
      # ON. scripts/ci/check_live_sync_define_declared.sh therefore scopes itself
      # to app BUILD sites (`flutter build`, `flutter test integration_test/…`)
      # and never to the host suite.
      #
      # M11 Phase B: production now defaults `liveSyncEnabled` ON, so the
      # coverage run above (no --dart-define) builds the LIVE branches — the
      # engine-teardown-on-logout ordering (subscriptionService.stop() BEFORE
      # wipeAllMlsState()) and the member-location cache read path now execute in
      # that required gate. The retained short-poll FALLBACK branches
      # (`liveSyncEnabled = false`, kept ≥1 release for the one-line rollback)
      # become dead code there, so re-run the flag-sensitive unit groups with the
      # flag OFF to keep the rollback path's assertions — the poll-path
      # member-location self-exclusion and the logout ordering's engine-untouched
      # branch — executing in a required gate. (The flag-OFF e2e lanes also cover
      # the poll path at the integration level.) live_sync_provider_test is
      # deliberately NOT run here: it pins the compiled default, which is now ON.
      - name: Rollback-path flag-off unit check (retained short-poll path)
        run: >-
          flutter test
          test/providers/identity_provider_test.dart
          test/providers/location_sharing_provider_test.dart
          --dart-define=HAVEN_LIVE_SYNC=false

      # The exclusion set is defined ONCE, in a checked-in script that the local
      # gate calls too. It used to be `lcov --remove` here and a hand-written
      # awk equivalent in check_coverage.sh, with nothing comparing them — and
      # they did differ (the awk `/\/test\//` cannot match a package-relative
      # `test/foo.dart` record). Sharing the implementation also drops the
      # apt-get from the gates' critical path; lcov is now installed only for
      # the HTML report, after every gate has voted.
      - name: Remove generated files from coverage
        run: bash ../scripts/ci/filter_lcov.sh coverage/lcov.info coverage/lcov_filtered.info

      # Was `VeryGoodOpenSource/very_good_coverage@v3`, which still targets
      # Node.js 20 (deprecated June 2026, already force-run on Node 24 by the
      # runner) with no upstream release — the workflow carried a NOTE to
      # replace it "before GitHub forces Node 24", which is a plan that works
      # only if someone reads it in time. The gate is a sum over LH/LF; owning
      # it removes a dependency on a deprecated runtime AND lets the local gate
      # run the identical computation instead of a second awk of its own.
      - name: Check coverage threshold
        run: bash ../scripts/ci/check_lcov_aggregate.sh coverage/lcov_filtered.info 50 "Flutter (haven)"

      # The 50% above is an aggregate over the whole package, and the package
      # clears it (~65%) only because the widget and provider suites pay for the
      # service layer — which sat at 48.96%, i.e. BELOW the very threshold the
      # package passes. Three services are still at or near zero
      # (nostr_relay_preferences_service.dart 0.00%, nostr_relay_service.dart
      # 0.61%, background_location_task.dart 1.69% — the file P0-1 lives in) and
      # the aggregate cannot see any of it. Runs on the same filtered report the
      # gate above reads, and with `!cancelled()` so one red run reports both
      # the aggregate and the per-path verdicts.
      - name: Per-path coverage floors (haven)
        if: ${{ !cancelled() }}
        run: bash ../scripts/ci/check_coverage_floors.sh flutter coverage/lcov_filtered.info

      - name: Generate HTML report
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov_filtered.info -o coverage/html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: flutter-coverage-report
          path: |
            haven/coverage/lcov_filtered.info
            haven/coverage/html/
          retention-days: 30
