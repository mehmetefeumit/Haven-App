# Main CI orchestrator.
#
# Every job calls a reusable workflow (one file per concern); add a new check
# by creating a reusable workflow and wiring it here. The suite has five
# stages, visible in the job graph:
#
#   1. Code quality      — compile, lint, unit-test, coverage, dependency audit
#   2. Repo guards       — fast grep/bash policy + privacy invariants (one job)
#   3. Localization      — translation parity gate
#   4. E2E suites        — real app on an Android emulator / iOS simulator
#                          against hermetic Nostr relays (gated on rust only:
#                          E2E is a functional signal, not a coverage signal)
#   5. Build verification— debug builds for every mobile target
#
# All E2E lanes run in PARALLEL (each `needs:` only rust), so PR wall-clock is
# bounded by the slowest lane, not the sum.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — code quality
  # ---------------------------------------------------------------------------

  # rustfmt + clippy + tests + release-mode build for both crates
  # (haven-core and the rust_builder FFI surface).
  rust:
    name: Rust Checks
    uses: ./.github/workflows/rust-check.yml

  # `flutter analyze` (errors + warnings gate; pre-existing infos advisory).
  flutter:
    name: Flutter Checks
    uses: ./.github/workflows/flutter-check.yml

  # `cargo check` for macOS/iOS/Windows/Android targets — catches breaks in
  # #[cfg(target_os)] code that native Linux CI misses.
  cross-compile:
    name: Cross-Platform Compile
    uses: ./.github/workflows/cross-check.yml

  # Rust + Flutter unit tests with enforced coverage thresholds (80% / 50%),
  # plus the flag-off rollback-path unit re-run.
  coverage:
    name: Coverage
    uses: ./.github/workflows/coverage.yml

  # cargo-audit against the RustSec advisory DB (also runs weekly on its own).
  dependency-audit:
    name: Dependency Audit
    uses: ./.github/workflows/audit.yml

  # ---------------------------------------------------------------------------
  # Stage 2 — repo guards: every fast, deterministic policy/privacy invariant,
  # consolidated into one job (committed secrets, tile-provider policy,
  # public-profile privacy boundaries, INTERNET permission, background-wake
  # invariants, locale privacy, E2E-harness self-tests). One red run reports
  # ALL violated guards. See repo-guards.yml for the per-guard rationale.
  # ---------------------------------------------------------------------------

  guards:
    name: Repo Guards
    uses: ./.github/workflows/repo-guards.yml

  # ---------------------------------------------------------------------------
  # Stage 3 — localization: gen-l10n regeneration + cross-locale ARB parity
  # (keys / placeholders / ICU plural categories / untranslated copy). The AI
  # translation review (l10n-ai-review.yml) is a separate, advisory, PR-only
  # layer. Locale PRIVACY is enforced in Repo Guards above.
  # ---------------------------------------------------------------------------

  localization:
    name: Localization
    uses: ./.github/workflows/l10n-check.yml

  # ---------------------------------------------------------------------------
  # Stage 4 — end-to-end suites. Each lane boots the real app (Android AVD or
  # iOS simulator) against hermetic infrastructure (strfry relay, and a
  # Blossom server where profiles are involved) and drives a full user flow.
  # ---------------------------------------------------------------------------

  # The consolidated three-user core flow (onboarding, circle creation,
  # invitation, location sharing, leave) on Android. This lane runs the POLL
  # receive path — the production default while the live-sync flag is off —
  # so the retained poller keeps per-commit coverage. The live-sync scenarios
  # self-skip here and run flag-on in the dedicated lane below (both call the
  # SAME reusable lane, so the two paths cannot drift). Keep BOTH: replacing
  # this with `live_sync: true` would drop poll-path coverage before the flag
  # flips.
  e2e-android:
    name: E2E Core Flow (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-android.yml

  # Same core flow on a booted iOS simulator against a host-native relay
  # (macOS runners have no Linux Docker). Covers the iOS foreground
  # send/receive/MLS path; a simulator cannot reproduce real-device background
  # suspension (needs a real device — out of scope for hosted runners).
  e2e-ios:
    name: E2E Core Flow (iOS)
    needs: [rust]
    uses: ./.github/workflows/e2e-ios.yml

  # The same core-flow lanes built with the live-sync flag ON, so the
  # persistent relay-subscription engine path is exercised per commit
  # alongside the poll path above.
  e2e-android-live-sync:
    name: E2E Core Flow (Android, live-sync)
    needs: [rust]
    uses: ./.github/workflows/e2e-android.yml
    with:
      live_sync: true

  e2e-ios-live-sync:
    name: E2E Core Flow (iOS, live-sync)
    needs: [rust]
    uses: ./.github/workflows/e2e-ios.yml
    with:
      live_sync: true

  # The component-level integration tests (app boot, keyring, encryption
  # pipeline, member removal, admin-leave) that the consolidated core flow
  # does not cover — driven one target at a time on a single AVD with a fresh
  # relay per target.
  e2e-integration:
    name: E2E Integration Tests (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-integration.yml

  # Proves a user-customized relay set is honored, against TWO distinct
  # hermetic relays (a single relay cannot distinguish "published to custom"
  # from "published to default").
  e2e-relay-customization:
    name: E2E Relay Customization (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-relay-customization.yml

  # Runtime proof of the Android background catch-up worker: cold isolate
  # boot (Rust + keyring + SQLCipher), WorkManager job surviving a guest
  # reboot, and the pending-wipe + consent no-op gates — states no unit test
  # or static guard can reach. The orchestrator self-guards on the feature
  # flag and fails loudly if the flag is rolled back without removing this
  # entry.
  e2e-background-catchup:
    name: E2E Background Catch-up (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-background-catchup.yml

  # Runtime proof that the Android foreground service actually PUBLISHES while
  # the UI is hidden and the foreground MLS session is still live (backlog B1).
  # Distinct from the catch-up lane above, which is receive-only, runs in a
  # separate process, and kills the app before waking it — so it cannot reach
  # the Rule-14 contention that P0-1 is about. This lane asserts DELIVERY (a
  # parsed publish count plus relay-side corroboration), not just liveness.
  e2e-fgs-publish:
    name: E2E FGS Publish (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-fgs-publish.yml

  # Runtime proof of the REAL location stack (backlog B3): no
  # `locationServiceProvider` override, a VERIFIED `pm grant`, coordinates
  # injected with `adb emu geo fix`, and — the part no other lane does — the
  # coordinates a PEER decrypts asserted numerically against what was
  # injected. B1 above proves a background publish HAPPENED; this proves WHAT
  # was published, which is the difference between a live GPS path and a
  # constant.
  e2e-real-gps:
    name: E2E Real GPS (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-real-gps.yml

  # Runtime proof that a +/-6h device wall-clock jump does not silently kill
  # location sharing (backlog B8). Three subsystems ride the device clock with
  # no external reference: the kind-445 `created_at`, the 228 s NIP-40 TTL
  # derived from it, and the `since` cursor catch-up re-derives from a peer's
  # `created_at`. The hermetic relay is the one clock in the lane that does not
  # move, which is what makes the asymmetry — and therefore the assertion —
  # real rather than self-consistent.
  e2e-clock-skew:
    name: E2E Clock Skew (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-clock-skew.yml

  # The iOS twin of the lane above (backlog B4): `simctl privacy grant location`
  # + `simctl location set`, no `locationServiceProvider` override, and the same
  # numeric assertion on the coordinates a PEER decrypts. Kept as its own lane
  # rather than a job of e2e-ios.yml because the grant must land between the
  # install and the first launch — an ordering the shared iOS runner's hermetic
  # uninstall would otherwise erase.
  e2e-ios-real-gps:
    name: E2E Real GPS (iOS)
    needs: [rust]
    uses: ./.github/workflows/e2e-ios-real-gps.yml

  # OS-level location services switched OFF mid-session and back on (backlog
  # B6): `cmd location set-location-enabled false`. Distinct from B5, which
  # revokes the APP's permission and lands in `checkPermission()`'s denied
  # branches; this reaches `isLocationServiceEnabled()`, a gate that
  # `FakeLocationService` hardcodes to `true` and that therefore executed
  # nowhere in CI. The lane asserts that publishing STOPS (measuring the
  # documented 168s stale-fix tail), that the user is TOLD, and that
  # re-enabling recovers. EXPECTED RED on the "user is told" step — see the
  # workflow header.
  e2e-location-provider-toggle:
    name: E2E Location Provider Toggle (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-location-provider-toggle.yml

  # Runtime proof that revoking the APP's location permission mid-session
  # stops it publishing, and that it stays stopped (backlog B5): `pm revoke`
  # under a live sharing session, then a SECOND drive of the same target
  # against the same install. Two drives because `pm revoke` kills the app
  # process (AOSP posts `killUid(... KILL_APP_REASON_PERMISSIONS_REVOKED)`),
  # so Haven's own denied/deniedForever branches — mocked in unit tests,
  # hardcoded to `always` by `FakeLocationService` in every other scenario —
  # run only on the relaunch. The absence half is asserted off the RELAY
  # (a diff over location-event ids, polled across a bounded window), which
  # also covers the per-circle scheduler the app-side checks cannot see.
  e2e-permission-revocation:
    name: E2E Permission Revocation (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-permission-revocation.yml

  # iOS CoreLocation authorization tiers (backlog B7): the same drive target run
  # twice on one simulator, once per `xcrun simctl privacy grant` tier, with a
  # gate that fails unless the two runs OBSERVED different tiers. It asserts the
  # honest per-tier UI copy and that background publishing continues under BOTH
  # — When-In-Use is genuinely sufficient for a foreground-started background
  # session on iOS; "Always" only adds the SLC relaunch after termination. No
  # other lane grants a real CoreLocation authorization at all.
  e2e-ios-auth-tier:
    name: E2E iOS Auth Tier (When In Use vs Always)
    needs: [rust]
    uses: ./.github/workflows/e2e-ios-auth-tier.yml

  # Network loss and reconnect (backlog B9): device-wide airplane mode dropped
  # under a live session, then restored, asserting that a PEER location
  # published after the reconnect is DECRYPTED — not merely that a socket
  # reopened. Nothing in CI had ever disconnected a running Haven, so all
  # three of the live-sync engine's recovery mechanisms were unexercised: the
  # relay pool's own reconnect + filter replay, the M8 subscription-health
  # re-anchor, and MapShell's 90-150s self-heal, which is the only thing that
  # restarts an engine torn down by `_onStreamClosed`.
  e2e-network-reconnect:
    name: E2E Network Reconnect (Android)
    needs: [rust]
    uses: ./.github/workflows/e2e-network-reconnect.yml

  # The public-profile flow (kind-0 + Blossom photo) on BOTH platforms:
  # publish, resolve, merge-preserving edit, and delete→npub-fallback against
  # a real hermetic relay + Blossom server.
  e2e-profile:
    name: E2E Public Profile (Android + iOS)
    needs: [rust]
    uses: ./.github/workflows/e2e-profile.yml

  # ---------------------------------------------------------------------------
  # Stage 5 — build verification: debug builds for every mobile target
  # (Android arm64/arm/x64 + iOS), proving the Flutter + Rust + toolchain
  # wiring end-to-end.
  # ---------------------------------------------------------------------------

  build:
    name: Debug Builds
    needs: [rust, coverage, guards]
    uses: ./.github/workflows/build-check.yml
