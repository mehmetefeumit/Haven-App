# Reusable workflow: Android device-clock-skew lane
# (docs/CI_HARDENING_BACKLOG.md Workstream B, item B8 — "Clock jump +/-6h").
#
# Proves that a +/-6 h device wall-clock jump is DETECTED and SURFACED rather
# than failing silently, and MEASURES the delivery it still costs.
#
# # What this lane gates
#
#   * a fast clock's relay refusal reaches Dart as a typed device-clock fault
#     (`RelayError::DeviceClockRejected`) rather than collapsed into a generic
#     publish failure, and reaches a consumer that raises a verdict;
#   * a slow clock is inferred from peers' own timestamps read from INSIDE the
#     MLS ciphertext, keyed by authenticated member id — TWO distinct members
#     must agree, and ONE outlying peer must NOT raise the verdict;
#   * both faults reach the user, and the two say DIFFERENT things (one means
#     nothing is being shared at all, the other means the send succeeded and
#     the data was then discarded).
#
# # What this lane records but does not gate
#
# Three things ride the device clock with no external reference anywhere in
# the tree, and a jump still costs a skewed device real delivery:
#
#   1. `created_at` — the MDK peeler stamps the inner app event with
#      `now_unix_seconds()` and BINDS the outer kind-445 `created_at` to it,
#      so a skewed device signs skewed events;
#   2. the 228 s TTL — the engine derives the NIP-40 `expiration` as
#      `inner_created_at + message-retention.v1`, i.e. from the SAME skewed
#      clock, so a backdated event is born already expired;
#   3. the `since` cursor — catch-up advances the cursor to the SENDER's
#      `created_at` and re-derives the next REQ floor 60 s below it, so an
#      event minted further back is outside every subsequent window.
#
# The drive measures all three and prints them as `[b8] EVIDENCE`. They are
# recorded rather than asserted because each bottoms out in signing a
# `created_at` the device clock does not hold — clock correction — which moves
# the TTL, the cursor floor and the peeler's inner/outer binding with it and
# needs its own security analysis; the receiver-side one would additionally
# mean widening a replay defence. Same evidence-vs-finding split B1, B5, B6
# and B9 use.
#
# # Why the hermetic relay is load-bearing here
#
# The publisher and the receiver share one device clock, so jumping it moves
# BOTH and every comparison stays self-consistent — a naive version of this
# scenario is vacuous. The strfry container is the one clock in the lane that
# does not move: it runs on the CI host, and its
# `rejectEventsNewerThanSeconds = 900` (tooling/e2e/strfry.conf) judges a
# fast-clocked publish exactly as a correctly-clocked peer would, which is
# what every fast-clock oracle bottoms out in. The slow-clock half gets its
# asymmetry from TIME instead: the peer samples are sealed inside the MLS
# ciphertext at true time and only READ after the clock moves, so the sender's
# reading cannot follow the reader's clock.
#
# # Why a SEPARATE workflow
#
# The lane needs `adb root` plus a pinned `auto_time`, and it drives the
# device clock from the shell on cue from the app. No shared runner should
# learn any of that: run-single-avd-scenario.sh and run-integration-tests.sh
# force-stop and uninstall between targets, and a mid-run clock jump inside a
# shared runner would corrupt every OTHER target's timing assumptions.
#
# # Architecture mirrors e2e-fgs-publish.yml / e2e-real-gps.yml
#
# Same single-AVD, build-before-boot design (the multi-GB Rust-NDK + Gradle
# peak must never coincide with a resident emulator; docs/E2E_TROUBLESHOOTING.md).

name: E2E Clock Skew

on:
  workflow_call:

jobs:
  e2e_clock_skew:
    name: e2e_clock_skew
    runs-on: ubuntu-latest
    # One APK build + boot + a bounded drive (<=27m of step deadline). The job
    # cap must clear the SUM of the step caps: below it, a run whose every step
    # is still inside its own cap can die here, and a job-cap death skips every
    # `if: failure()` step (e2e-android.yml states the rule). So: Build
    # the runtime log scanner 10 + Build clock-skew test APK 30 + Create AVD
    # snapshot (on an AVD-cache miss) 15 + the drive step 37 (derived there) +
    # the most the work no step cap bounds has taken, 3.1 min over 33 runs of
    # this job (ci.yml, 2026-07-29..09-10; 1.6 of it Free disk space, run
    # 31507917222), taken as 4 = 96 -> 100.
    # job-uncapped-minutes: 3.1 (33 runs, worst 31507917222)
    timeout-minutes: 100
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # The runtime identifier scanner (Security Rule 15): the orchestrator
      # seals this run's needle manifest from the host-known needles
      # (tooling/e2e/ci/host-needles.sh — the fixed seeds, the role and canary
      # coordinates, the name stems), and runs every captured log through
      # tooling/e2e/ci/scan-logs.sh before echoing or keeping any of it.
      # `host`: this lane runs no recording proxy, so the host needles are the
      # whole declaration.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

      # Declared EXPLICITLY rather than inherited. `liveSyncEnabled` defaults
      # to true when the define is absent, so an omitted flag reads as "we
      # didn't think about it" (CI_HARDENING_BACKLOG.md A7).
      #
      # `false` is a deliberate choice here, not a copy. This lane's receive
      # oracle is the CURSOR-ANCHORED catch-up sweep
      # (`run_catchup_all_circles`), and the whole point of the backward-skew
      # phase is which events its `since` floor does and does not reach. A
      # standing live subscription would deliver those same events out of
      # band, on a different code path, and mask exactly the behaviour under
      # test. The live receive path is covered by the e2e-android live_sync
      # variants, which exist for that.
      HAVEN_LIVE_SYNC: "false"

      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/logscan
          # Distinct cache key from the other E2E jobs so they don't race on
          # one entry; all build the same x86_64-linux-android target.
          key: e2e-clock-skew-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (the same reasoning as the APK build below). The
      # orchestrator seals and scans with it after the drive and at exit; the
      # diagnostics step runs it over what it writes. Capped so a cargo stall
      # fails fast; the cap is a term of the job cap's sum above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build the target APK BEFORE the emulator boots (build-before-boot
      # discipline). Staged at /tmp/integration-apks/<basename>.apk; the
      # --dart-defines baked here are un-re-passable at drive time (`flutter
      # drive` does not forward them). This target reads no lane-specific
      # defines, so the SHARED builder is the right funnel — unlike B3, which
      # needs its coordinates baked in and therefore has its own.
      - name: Build clock-skew test APK
        working-directory: haven
        timeout-minutes: 30
        run: bash ../tooling/e2e/ci/build-integration-apks.sh
          integration_test/b8_clock_skew_test.dart

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared with the other Android E2E lanes: the AVD snapshot is
          # byte-identical (same api/arch/target/profile), so this restores
          # the snapshot they created instead of rebuilding it.
          #
          # `target: google_apis` is not incidental for THIS lane: it is a
          # userdebug image, so `adb root` succeeds and the wall clock is
          # writable. On `google_apis_playstore` (a user build) the orchestrator
          # fails closed in Phase 0 rather than running every phase at true
          # time and reporting a vacuous green.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # Bounded for the same reason the sibling lanes are: a wedged boot with
        # no step cap dies at the JOB cap, which SIGKILLs the runner before any
        # if: failure() step, so the lane fails slow and with no artifacts.
        # 15 min is ~7x the observed snapshot time.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # The needle directory, rotated before anything can write to it: the
      # orchestrator seals this run's manifest there, and a sidecar or manifest
      # left by an earlier run on a reused runner would be sealed or scanned in
      # its place.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      # All real logic lives in the checked-in orchestrator (single bash
      # invocation — the action runs each line of a multi-line `script:` in its
      # own sh -c, which would drop shell state).
      #
      # BOUNDS. Three of them, innermost first:
      #   20m  the `flutter drive` (the orchestrator's B8_DRIVE_TIMEOUT default;
      #        kept in the script rather than declared here so the two cannot
      #        drift). Above the drive target's own 17-minute in-test Timeout,
      #        so an overrun fails as a NAMED test rather than an anonymous
      #        kill.
      #   27m  this step's inner deadline (run-with-deadline.sh below) — covers
      #        the drive PLUS the relay restart, `adb root`, the auto_time pin,
      #        the install and its broadcast barrier, the four clock jumps and
      #        the oracle, none of which the per-drive timeout bounds, and is
      #        the bound that actually reaps (CI_HARDENING_BACKLOG.md A8).
      #   37m  this step's timeout-minutes = 27 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + 2 (the action's own setup and
      #        teardown, outside both: 38-102 s across the eight own-installer
      #        lanes over twelve runs, 2026-08/09), a belt over the deadline.
      #
      # DEADLINE, from run-b8-clock-skew.sh's bounded waits at their bounds, in
      # seconds:
      #   start-strfry.sh READY_TIMEOUT, the ready loop's last 1 s tick
      #     and READY_CONFIRM_SECS                             60 + 1 + 2 =   63
      #   app-install-lib.sh INSTALL_BARRIER_SECS                            120
      #     (taken before any clock jump; its bound runs on the host's clock)
      #   DRIVE_TIMEOUT (B8_DRIVE_TIMEOUT) + DRIVE_KILL_AFTER_SECS 1200+30 = 1230
      #     (the clock servo runs under the drive and is not waited for)
      #                                                      = 1413 s = 23m33s
      #   + the unbounded relay, `adb root` restart, adb, install, clock
      #     restore, scan and oracle work, ~3 min: e2e-android.yml's allowance,
      #     kept because the sick device that pushes the waits above to their
      #     bounds is the one that slows adb (this lane spent under 40 s on
      #     it in run 34511084722, 16 s of that on the final clock restore)
      #                                                      = 26m33s -> 27m.
      # It was 25m — the drive plus 5 for everything else, which held until
      # the install barrier.
      # Sizing evidence: the drive's own worst case is a 3-member circle setup
      # + seven publishes + four catch-up sweeps (30s each) + two banner pumps
      # + four clock rendezvous (150s each, bounded in-Dart) under a 17-minute
      # in-test Timeout. This lane has no green history yet; revise against p95
      # once it does.
      #
      # -memory 6144 matches the sibling Android lanes: RustLib + SQLCipher
      # floods `mlock() -1 ENOMEM` under pressure, and this lane holds three
      # MLS sessions at once (the publisher's and both synthetic peers').
      - name: Run the clock-skew proof on the emulator
        timeout-minutes: 37
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 6144
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash tooling/e2e/ci/run-with-deadline.sh 27m "e2e-clock-skew drive" -- bash tooling/e2e/ci/run-b8-clock-skew.sh /tmp/integration-apks/b8_clock_skew_test.apk integration_test/b8_clock_skew_test.dart

      - name: Capture host + emulator diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/b8-logs
          adb reconnect offline || true
          timeout 60 adb wait-for-device || true
          {
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l (after reconnect attempt) ==="
            adb devices -l || true
            echo
            echo "=== host vs device clock (the lane's own subject) ==="
            echo "host   $(date -u +%s)"
            echo "device $(adb shell date -u +%s 2>/dev/null | tr -dc '0-9')"
            echo
            echo "=== automatic-time settings (must both read 0) ==="
            echo "auto_time      $(adb shell settings get global auto_time 2>/dev/null | tr -d '\r')"
            echo "auto_time_zone $(adb shell settings get global auto_time_zone 2>/dev/null | tr -d '\r')"
          # `.log`, not `.txt`: this file is written AFTER the orchestrator's
          # EXIT trap has already scanned, and the scanner's directory walk
          # only picks up `*.log`. A `.txt` here would be uploaded unscanned.
          } > /tmp/b8-logs/diag.log 2>&1 || true
          # Scan what this step just wrote (Security Rules 6 and 15) with the
          # wrapper the orchestrator uses — the key-material floor AND the
          # identifier scanner, against the manifest the orchestrator sealed —
          # which withholds (deletes) the diag on a hit, matching the
          # orchestrator's containment. rc 1 (a real leak) and rc 2/3/4 (the
          # diag absent/unreadable/empty, no manifest because the run never
          # sealed one) are kept apart deliberately: both fail the step, but
          # only a leak justifies destroying the diag.
          diag_scan_rc=0
          mkdir -p /tmp/b8-logscan
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest /tmp/haven-soak/needles/*.needles.json \
            --sink diag=/tmp/b8-logs/diag.log \
            --report /tmp/b8-logscan/diag.ndjson || diag_scan_rc=$?
          if [ "${diag_scan_rc}" -eq 1 ]; then
            echo "diag withheld: log-privacy gate tripped" > /tmp/b8-logs/DIAG_LEAK.txt
            exit 1
          elif [ "${diag_scan_rc}" -ne 0 ]; then
            echo "diag uncertified (rc=${diag_scan_rc}): absent, unreadable, empty, or no manifest to scan against" \
              > /tmp/b8-logs/DIAG_UNSCANNABLE.txt
            echo "ERROR: diag log could not be scanned (rc=${diag_scan_rc})." >&2
            exit 1
          fi

      # if: always() so a green run still publishes the clock-servo records as
      # recorded evidence that the jumps really landed.
      - name: Upload clock-skew artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-clock-skew-${{ github.run_id }}
          path: |
            /tmp/b8-logs/
          retention-days: 14
          if-no-files-found: ignore

      # The manifest holds the run's declared identifiers verbatim and is never
      # uploaded (check_wire_proxy_test_only.sh); it does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
