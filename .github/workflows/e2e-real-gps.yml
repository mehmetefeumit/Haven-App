# Reusable workflow: Android REAL-GPS end-to-end lane
# (docs/CI_HARDENING_BACKLOG.md Workstream B, item B3).
#
# Proves the whole location chain with nothing faked and, crucially, asserts
# the VALUE rather than the event:
#
#   `adb emu geo fix` -> goldfish GNSS HAL -> Android LocationManager ->
#   geolocator plugin -> GeolocatorLocationService ->
#   locationPublisherProvider -> MLS encrypt -> kind-445 on a hermetic relay
#   -> a PEER's own CircleManagerFfi decrypt -> coordinates compared
#   numerically against what was injected.
#
# # What was actually missing (the premise, checked against the tree)
#
# Every multi-party scenario injects `FakeLocationService` via a
# `locationServiceProvider` override (`e2e_combined.dart:475`,
# `e2e_profile_sharing.dart:706`), so the "GPS fix" is a Dart constant.
#
# `e2e-fgs-publish` (B1) already closed HALF of the gap first: its drive
# target declines the override and its shell already seeds `adb emu geo fix`.
# But its oracle is the foreground service's `[BackgroundTask] Published to
# N/M` marker — that proves a publish HAPPENED and says nothing about WHAT
# was published — and its peer is disposed before the proof window opens. So
# a publish path that read a stale, zeroed or wrong-hemisphere fix was green
# in every lane in this repo. That is the hole this lane fills, and it is the
# reason the assertion here is on the decrypted coordinates.
#
# # Why a SEPARATE workflow (not a new e2e-integration.yml target)
#
# The lane needs three things run-integration-tests.sh does not do and should
# not learn: a VERIFIED `pm grant` (`pm grant` exits 0 even when it refuses,
# so `dumpsys package` is the gate), a continuously re-issued `adb emu geo
# fix` (a RETRY for an injection that failed to land — `geo fix` SETS the
# emulated position and the emulator streams it at 1 Hz for as long as the
# platform runs a GNSS session, CI run 34642726338), and an APK built with
# the injected coordinates baked in as
# `--dart-define`s so the drive target can assert against them.
#
# # Architecture mirrors e2e-fgs-publish.yml
#
# Same single-AVD, build-before-boot design: the multi-GB Rust-NDK + Gradle
# peak must never coincide with a resident emulator (docs/E2E_TROUBLESHOOTING
# .md).

name: E2E Real GPS

on:
  workflow_call:

jobs:
  e2e_real_gps:
    name: e2e_real_gps
    runs-on: ubuntu-latest
    # One APK build + boot + a bounded drive (<=19m of step deadline). The job
    # cap must clear the SUM of the step caps: below it, a run whose every step
    # is still inside its own cap can die here, and a job-cap death skips every
    # `if: failure()` step (e2e-android.yml states the rule). So: Build
    # the runtime log scanner 10 + Build real-GPS test APK 30 + Create AVD
    # snapshot (on an AVD-cache miss) 15 + the drive step 30 (derived there) +
    # the most the work no step cap bounds has taken, 2.9 min over 33 runs of
    # this job (ci.yml, 2026-07-29..09-10; 1.3 of it Free disk space, run
    # 32661622879), taken as 3 = 88 -> 90.
    # job-uncapped-minutes: 2.9 (33 runs, worst 32661622879)
    timeout-minutes: 90
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # The runtime identifier scanner (Security Rule 15): the orchestrator
      # seals this run's needle manifest from the host-known needles
      # (tooling/e2e/ci/host-needles.sh — the fixed seeds, the role and canary
      # coordinates, the name stems) plus the point this lane injects, and
      # runs every captured log through tooling/e2e/ci/scan-logs.sh before
      # echoing or keeping any of it. `host`: this lane runs no recording
      # proxy, so the host needles are the whole declaration.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

      # Declared EXPLICITLY rather than inherited. `liveSyncEnabled` defaults
      # to true when the define is absent, so an omitted flag reads as "we
      # didn't think about it" (CI_HARDENING_BACKLOG.md A7).
      #
      # `false` is a deliberate choice, not a copy: this lane's subject is the
      # SEND half (real GPS -> encrypt -> publish) and its oracle is a
      # synthetic peer that reads the relay through its OWN CircleManagerFfi.
      # The app's own receive path is therefore not on the path being proven,
      # and running it would only widen the lane's failure surface with a
      # subsystem whose startup has reddened lanes before. The live receive
      # path is proven by the e2e-android live_sync variants, which exist for
      # exactly that.
      HAVEN_LIVE_SYNC: "false"

      # The injected point — Christ the Redeemer, Rio de Janeiro. A public
      # landmark, chosen precisely BECAUSE it is obviously not a real user's
      # position, and chosen in the SOUTHERN + WESTERN hemispheres on purpose:
      # `adb emu geo fix` serialises through NMEA, where the hemisphere is a
      # letter rather than a sign, so a sign-dropping defect anywhere in the
      # chain fails loudly here instead of passing on a positive-quadrant
      # point. Also nowhere near B1's Dam Square or the FakeLocationService
      # sentinels, so a stray value is unmistakable.
      #
      # ONE source of truth: the build step bakes these as --dart-defines and
      # the drive step injects the same pair with `adb emu geo fix`. Changing
      # one without the other fails the lane's own assertion by construction.
      #
      # WARNING before overriding: a failing assertion prints the observed
      # coordinate into the drive log, which is uploaded as an artifact. That
      # is fine for a hardcoded landmark and NOT fine for anything derived
      # from a real device or person.
      HAVEN_B3_GEO_LAT: "-22.951916"
      HAVEN_B3_GEO_LON: "-43.210487"

      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/logscan
          # Distinct cache key from the other E2E jobs so they don't race on
          # one entry; all build the same x86_64-linux-android target.
          key: e2e-real-gps-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (the same reasoning as the APK build below). The
      # orchestrator seals and scans with it after the drive and at exit; the
      # diagnostics step runs it over what it writes. Capped so a cargo stall
      # fails fast; the cap is a term of the job cap's sum above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build BEFORE the emulator boots (build-before-boot discipline). The
      # dedicated builder bakes the relay URL, the receive path AND the
      # injected coordinates; all three are un-re-passable at drive time
      # because `flutter drive` does not forward dart-defines.
      - name: Build real-GPS test APK
        working-directory: haven
        timeout-minutes: 30
        run: bash ../tooling/e2e/ci/build-b3-real-gps-apk.sh
          integration_test/b3_real_gps_test.dart

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared with the other Android E2E lanes: the AVD snapshot is
          # byte-identical (same api/arch/target/profile), so this restores
          # the snapshot they created instead of rebuilding it.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # Bounded for the same reason the sibling lanes are: a wedged boot
        # with no step cap dies at the JOB cap, which SIGKILLs the runner
        # before any if: failure() step, so the lane fails slow and with no
        # artifacts. 15 min is ~7x the observed snapshot time.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # The needle directory, rotated before anything can write to it: the
      # orchestrator seals this run's manifest there, and a sidecar or manifest
      # left by an earlier run on a reused runner would be sealed or scanned in
      # its place.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      # All real logic lives in the checked-in orchestrator (single bash
      # invocation — the action runs each line of a multi-line `script:` in
      # its own sh -c, which would drop shell state).
      #
      # BOUNDS. Three of them, innermost first:
      #   12m  the `flutter drive` (the orchestrator's own default; kept in
      #        the script rather than declared here so the two cannot drift).
      #   19m  this step's inner deadline (run-with-deadline.sh below) —
      #        covers the drive PLUS the relay restart, the install and its
      #        broadcast barrier, the verified grants, the GPS seed and the
      #        oracle, none of which the per-drive timeout bounds, and is the
      #        bound that actually reaps (CI_HARDENING_BACKLOG.md A8).
      #   30m  this step's timeout-minutes >= 19 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + 2 (the action's own setup and
      #        teardown, outside both: 38-102 s across the eight
      #        own-installer lanes over twelve runs, 2026-08/09), a belt over
      #        the deadline.
      #
      # DEADLINE, from run-b3-real-gps.sh's bounded waits at their bounds, in
      # seconds:
      #   start-strfry.sh READY_TIMEOUT, the ready loop's last 1 s tick
      #     and READY_CONFIRM_SECS                             60 + 1 + 2 =   63
      #   app-install-lib.sh INSTALL_BARRIER_SECS                            120
      #   DRIVE_TIMEOUT (B3_DRIVE_TIMEOUT) + DRIVE_KILL_AFTER_SECS 720 + 30 = 750
      #                                                       = 933 s = 15m33s
      #   + the unbounded relay, adb, install, grant, scan and oracle work,
      #     ~3 min: e2e-android.yml's allowance, kept because the sick device
      #     that pushes the waits above to their bounds is the one that slows
      #     adb (the own-installer lanes spent under 40 s on it in run
      #     34511084722)
      #                                                       = 18m33s -> 19m.
      # It was 18m — the drive plus 6 for everything else, which held until
      # the install barrier.
      # Sizing evidence: the drive target's own worst case is ~7 min (arming
      # + a 150s fix wait + circle setup + a 120s peer-decrypt wait) under an
      # 8-minute in-test Timeout; revise against p95 once this lane has green
      # history.
      #
      # -memory 6144 matches the sibling Android lanes: RustLib + SQLCipher
      # floods `mlock() -1 ENOMEM` under pressure, and this lane holds two
      # MLS sessions (Alice's production one and the synthetic peer's) at
      # once.
      - name: Run the real-GPS proof on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 6144
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash tooling/e2e/ci/run-with-deadline.sh 19m "e2e-real-gps drive" -- bash tooling/e2e/ci/run-b3-real-gps.sh /tmp/integration-apks/b3_real_gps_test.apk integration_test/b3_real_gps_test.dart

      - name: Capture host + emulator diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/b3-logs
          adb reconnect offline || true
          timeout 60 adb wait-for-device || true
          {
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l (after reconnect attempt) ==="
            adb devices -l || true
            echo
            echo "=== location provider state ==="
            adb shell cmd location is-location-enabled || true
            echo
            echo "=== appops location slice ==="
            adb shell cmd appops get com.oblivioustech.haven || true
          # `.log`, not `.txt`: this file is written AFTER the orchestrator's
          # EXIT trap has already scanned, and the scanner's directory walk
          # only picks up `*.log`. A `.txt` here would be uploaded unscanned.
          } > /tmp/b3-logs/diag.log 2>&1 || true
          # Scan what this step just wrote (Security Rules 6 and 15) with the
          # wrapper the orchestrator uses — the key-material floor AND the
          # identifier scanner, against the manifest the orchestrator sealed —
          # which withholds (deletes) the diag on a hit, matching the
          # orchestrator's containment. rc 1 (a real leak) and rc 2/3/4 (the
          # diag absent/unreadable/empty, no manifest because the run never
          # sealed one) are kept apart deliberately: both fail the step, but
          # only a leak justifies destroying the diag.
          diag_scan_rc=0
          mkdir -p /tmp/b3-logscan
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest /tmp/haven-soak/needles/*.needles.json \
            --sink diag=/tmp/b3-logs/diag.log \
            --report /tmp/b3-logscan/diag.ndjson || diag_scan_rc=$?
          if [ "${diag_scan_rc}" -eq 1 ]; then
            echo "diag withheld: log-privacy gate tripped" > /tmp/b3-logs/DIAG_LEAK.txt
            exit 1
          elif [ "${diag_scan_rc}" -ne 0 ]; then
            echo "diag uncertified (rc=${diag_scan_rc}): absent, unreadable, empty, or no manifest to scan against" \
              > /tmp/b3-logs/DIAG_UNSCANNABLE.txt
            echo "ERROR: diag log could not be scanned (rc=${diag_scan_rc})." >&2
            exit 1
          fi

      # if: always() so a green run still surfaces the recorded deltas and the
      # verified permission dump as evidence.
      - name: Upload real-GPS artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-real-gps-${{ github.run_id }}
          path: |
            /tmp/b3-logs/
          retention-days: 14
          if-no-files-found: ignore

      # The manifest holds the run's declared identifiers verbatim and is never
      # uploaded (check_wire_proxy_test_only.sh); it does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
