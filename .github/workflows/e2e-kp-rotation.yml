# Reusable workflow: Android KeyPackage-rotation-on-the-wire lane (KPR).
#
# Proves the RECEIVING half of KeyPackage rotation — the half no existing test
# reaches:
#
#   a KeyPackage minted 70 days ago -> the production maintenance tick reads
#   its real MLS `Lifetime` off the real wire bytes and rotates -> a SEPARATE
#   participant fetches the rotated package off a hermetic relay through the
#   production discovery cascade -> that participant ADDS its owner to a circle
#   -> the owner DECRYPTS a message in the resulting group.
#
# # What was actually missing (the premise, checked against the tree)
#
# `decide_kp_maintenance` (`haven-core/src/relay/maintenance/key_package.rs`)
# now rotates at 0.75 of a package's own `Lifetime`, read through
# `kp_lifetime.rs`. That is densely covered: 21 unit tests on the lifetime
# reader, `haven-core/tests/kp_rotation_e2e.rs`, and FFI tests inside
# `haven/rust_builder/src/api.rs`.
#
# Every one of those observes the rotation from the PUBLISHER's side — what the
# decision returned, and what the publisher published. RFC 9420 puts the
# `not_before`/`not_after` check on the INVITER, so a rotation that publishes
# successfully while producing material an inviter rejects at Add time would
# pass all of them and still leave the account uninvitable. That is the hole
# this lane fills, and it is why the assertion here is that a peer's Add
# succeeds AND the resulting group decrypts.
#
# # How a 63-day threshold is testable in minutes
#
# The device wall clock is moved BACKWARDS 70 days before the first mint, then
# restored. Every part of the production path then runs for real: the mint, the
# `Lifetime` OpenMLS stamps on it, the lifetime reader, the 0.75 arithmetic,
# `now`, the publish and the relay. The only fiction is WHEN the first package
# was minted, which is exactly the variable under test.
#
# The alternatives were ruled out against the tree, not by preference:
#
#   * A FORWARD jump cannot work — `tooling/e2e/strfry.conf` sets
#     `rejectEventsNewerThanSeconds = 900` (the B8 lane leans on it as an
#     oracle), so a device 70 days ahead cannot publish at all.
#   * A short-lifetime package cannot be minted through the real path: the
#     84-day span is `Lifetime::default()` inside OpenMLS, reached via
#     `cgka-engine`'s `MlsKeyPackage::builder()`, which never calls
#     `.key_package_lifetime(...)` — and the engine REJECTS a wider range on
#     receive. Hand-building one would take the material the peer validates out
#     of the real mint path, which is the one thing this lane must not do.
#   * A test-only threshold override was rejected on this repo's own precedent
#     (`scripts/ci/check_no_exporter_label_override.sh`).
#
# The mechanism cannot produce a green run without the production code
# rotating: the pre-fix decision had no time awareness, so with every responder
# serving the slot it returned `NoOp` — `alreadyHealthy`, nothing new on the
# relay, and the peer re-fetching the byte-identical package. The lane requires
# BOTH the `rotatedExpiringMaterial` verdict AND a superseding event with
# different material in the same `d`, which are independent readings.
#
# # Why a SEPARATE workflow
#
# Two things no shared runner should learn: `adb root` with a pinned
# `auto_time` and a 70-day clock write, and a SECOND hermetic relay that
# deliberately does not serve the account's KeyPackage slot.
# run-single-avd-scenario.sh and run-integration-tests.sh force-stop and
# uninstall between targets, and a device clock 70 days in the past would
# corrupt every other target's timing assumptions on the same runner.
#
# # Architecture mirrors e2e-clock-skew.yml / e2e-real-gps.yml
#
# Same single-AVD, build-before-boot design (the multi-GB Rust-NDK + Gradle
# peak must never coincide with a resident emulator;
# docs/E2E_TROUBLESHOOTING.md).

name: E2E KeyPackage Rotation

on:
  workflow_call:

jobs:
  e2e_kp_rotation:
    name: e2e_kp_rotation
    runs-on: ubuntu-latest
    # One APK build + boot + a bounded drive (<=32m of step deadline). The job
    # cap must clear the SUM of the step caps: below it, a run whose every step
    # is still inside its own cap can die here, and a job-cap death skips every
    # `if: failure()` step (e2e-android.yml states the rule). So: Build
    # the runtime log scanner 10 + Build KeyPackage-rotation test APK 30 +
    # Provision the Android SDK 11 (derived in that script) + Create AVD
    # snapshot (on an AVD-cache miss) 15 + the drive step 42 (derived there) +
    # the most the work no step cap bounds has taken, 2.7 min over 31 runs of
    # this job (ci.yml, 2026-07-29..09-10; 1.0 of it the failure diagnostics,
    # run 31868809387), taken as 3 = 111.
    # job-uncapped-minutes: 2.7 (31 runs, worst 31868809387)
    timeout-minutes: 113
    env:
      # R1 carries the whole scenario.
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      # R2 exists only for the final phase: a responder that does NOT serve
      # Alice's KeyPackage slot, which is what makes the maintenance tick take
      # the heal branch (republish the CACHED bytes under a fresh `created_at`)
      # rather than the rotate branch. Reading both copies back is the direct
      # wire evidence that a heal moves the event timestamp and leaves the
      # package's `not_before` — and therefore the rotation clock — alone.
      HAVEN_E2E_RELAY_2: ws://10.0.2.2:7778
      # The runtime identifier scanner (Security Rule 15): the orchestrator
      # seals this run's needle manifest from the host-known needles
      # (tooling/e2e/ci/host-needles.sh — the fixed seeds, the role and canary
      # coordinates, the name stems), and runs every captured log through
      # tooling/e2e/ci/scan-logs.sh before echoing or keeping any of it.
      # `host`: this lane runs no recording proxy, so the host needles are the
      # whole declaration.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

      # Declared EXPLICITLY rather than inherited. `liveSyncEnabled` defaults
      # to true when the define is absent, so an omitted flag reads as "we
      # didn't think about it" (CI_HARDENING_BACKLOG.md A7).
      #
      # `false` is a deliberate choice here, not a copy. This lane's subject is
      # the KeyPackage maintenance decision and a peer's Add; both participants
      # drive the FFI and the relay directly, so the app's own standing
      # subscription is not on the path being proven. It would also be the one
      # subsystem asked to survive a 70-day forward wall-clock discontinuity
      # mid-run — its cursor arithmetic is derived from event `created_at` —
      # which is B8's subject, not this lane's. The live receive path is proven
      # by the e2e-android live_sync variants, which exist for that.
      HAVEN_LIVE_SYNC: "false"

      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/logscan
          # Distinct cache key from the other E2E jobs so they don't race on
          # one entry; all build the same x86_64-linux-android target.
          key: e2e-kp-rotation-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (the same reasoning as the APK build below). The
      # orchestrator seals and scans with it after the drive and at exit; the
      # diagnostics step runs it over what it writes. Capped so a cargo stall
      # fails fast; the cap is a term of the job cap's sum above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Gradle resolves the buildscript classpath over the network BEFORE it
      # compiles anything, so a cold ~/.gradle makes this lane fetch hundreds of
      # POMs — and hosted runners share egress IPs, so Maven Central rate-limits
      # a runner nobody here provoked. CI run 35622556197 job 106414462454 lost
      # a whole lane to HTTP 429 on the classpath, with NO test run, while twelve
      # sibling Android lanes built the same commit with zero 429s. A warm
      # dependency cache REMOVES those requests; the classified retry in
      # scripts/ci/build_apk_with_retry.sh is only the backstop for what is left.
      #
      # Restore-only. build-check.yml is the single writer of this key, so a lane
      # that deletes or half-fills ~/.gradle cannot publish a cache the other
      # lanes would then restore. The `restore-keys` prefix means a changed
      # dependency set still starts from the last good cache instead of cold.
      #
      # `continue-on-error` because a cache is an optimisation, and a step that
      # overruns its own `timeout-minutes` FAILS the job: without this, a slow
      # or unavailable cache service reddens a lane that would otherwise have
      # built cold and run every test.
      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('haven/android/**/*.gradle*', 'haven/rust_builder/**/*.gradle*', 'haven/android/gradle/wrapper/gradle-wrapper.properties', 'haven/pubspec.lock') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # Build BEFORE the emulator boots (build-before-boot discipline). The
      # dedicated builder bakes BOTH relay URLs and the receive path; all three
      # are un-re-passable at drive time because `flutter drive` does not
      # forward dart-defines.
      - name: Build KeyPackage-rotation test APK
        working-directory: haven
        timeout-minutes: 30
        run: bash ../tooling/e2e/ci/build-kp-rotation-apk.sh
          integration_test/kp_rotation_wire_test.dart

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Install and VERIFY every SDK package the emulator action needs, before
      # its FIRST use below. The action installs them itself, with bare
      # `sdkmanager --install` calls tried once and checked by nothing: in CI
      # run 35524002720 the emulator's download failed, the action stopped,
      # and the last thing it printed was its teardown's "could not connect to
      # TCP port 5554" — a message about the emulator, from a job that ran no
      # test.
      # Unconditional, deliberately — the AVD cache holds `~/.android/avd/*`
      # only, so a cache HIT still needs the emulator binary and the system
      # image. The arguments MUST equal the api-level/target/arch of every
      # emulator step in this job (check_android_sdk_provisioned.sh). Once the
      # packages are present the action's own installs are no-ops (5 s).
      # The cap is the script's worst case, 9.5 min (its 360 s budget + the one
      # 180 s attempt that can start inside it + that attempt's 30 s emulator
      # probe), plus the step's own startup, rounded up.
      - name: Provision the Android SDK
        timeout-minutes: 11
        run: bash tooling/e2e/ci/provision-android-sdk.sh 34 google_apis x86_64

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared with the other Android E2E lanes: the AVD snapshot is
          # byte-identical (same api/arch/target/profile), so this restores the
          # snapshot they created instead of rebuilding it.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # Bounded for the same reason the sibling lanes are: a wedged boot with
        # no step cap dies at the JOB cap, which SIGKILLs the runner before any
        # if: failure() step, so the lane fails slow and with no artifacts.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # `google_apis`, NOT `google_apis_playstore`: this lane needs
          # `adb root` to write the device clock, and only the userdebug image
          # allows it. Without a writable clock the KeyPackage under test is
          # seconds old and the whole lane is vacuous.
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      # R1 and R2 are two SEPARATE strfry instances. start-strfry.sh manages
      # exactly one relay keyed by STRFRY_CONTAINER / STRFRY_PORT /
      # STRFRY_DATA_DIR and `docker rm -f`s its own container name on start, so
      # R2 must differ in all three or starting it would destroy R1.
      # The needle directory, rotated before anything can write to it: the
      # orchestrator seals this run's manifest there, and a sidecar or manifest
      # left by an earlier run on a reused runner would be sealed or scanned in
      # its place.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Start strfry relay R1
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      - name: Start strfry relay R2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
          STRFRY_CONTAINER: strfry2
          STRFRY_PORT: "7778"
          STRFRY_DATA_DIR: /tmp/strfry2-data
        run: bash tooling/e2e/ci/start-strfry.sh

      # All real logic lives in the checked-in orchestrator (single bash
      # invocation — the action runs each line of a multi-line `script:` in its
      # own sh -c, which would drop shell state).
      #
      # BOUNDS. Three of them, innermost first:
      #   24m  the `flutter drive` (the orchestrator's own default; kept in the
      #        script rather than declared here so the two cannot drift).
      #   32m  this step's inner deadline (run-with-deadline.sh below) —
      #        covers the drive PLUS both relay restarts, the install and its
      #        broadcast barrier, the `adb root` + clock pin, the Wi-Fi
      #        disable, the backdate read-back and the oracle, none of which
      #        the per-drive timeout bounds, and is the bound that actually
      #        reaps (CI_HARDENING_BACKLOG.md A8).
      #   42m  this step's timeout-minutes = 32 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + 2 (the action's own setup and
      #        teardown, outside both: 38-102 s across the eight own-installer
      #        lanes over twelve runs, 2026-08/09, 85 s at most for this one), a
      #        belt over the deadline.
      #
      # DEADLINE, from run-kp-rotation.sh's bounded waits at their bounds, in
      # seconds:
      #   start-strfry.sh READY_TIMEOUT, the ready loop's last 1 s tick and
      #     READY_CONFIRM_SECS, for R1 and R2            2 x (60 + 1 + 2) =  126
      #   app-install-lib.sh INSTALL_BARRIER_SECS                            120
      #     (taken before the backdate; its bound runs on the host's clock)
      #   WIFI_OFF_TIMEOUT_SECS                                               20
      #   DRIVE_TIMEOUT (KPR_DRIVE_TIMEOUT) + DRIVE_KILL_AFTER_SECS 1440+30 = 1470
      #   stop_servo's wait for the servo's last pass, SERVO_POLL_SECS         1
      #                                                      = 1737 s = 28m57s
      #   + the unbounded relay, adb, `adb root` restart, install, clock,
      #     servo, scan and oracle work, ~3 min: e2e-android.yml's allowance,
      #     kept because the sick device that pushes the waits above to their
      #     bounds is the one that slows adb (the own-installer lanes spent
      #     under 40 s on it in run 34511084722)
      #                                                      = 31m57s -> 32m.
      # It was 30m — the drive plus 6 for everything else, which held until the
      # install barrier.
      # Sizing evidence: the drive target's own worst case is ~10 min
      # (bootstrap + first mint, a 180s clock rendezvous, two discovery-cascade
      # fetches, circle creation and the Welcome round trip, a 120s peer-decrypt
      # wait, and the heal phase) under a 20-minute in-test Timeout; revise
      # against p95 once this lane has green history.
      #
      # -memory 6144 matches the sibling Android lanes: RustLib + SQLCipher
      # floods `mlock() -1 ENOMEM` under pressure, and this lane holds two MLS
      # sessions at once.
      - name: Run the KeyPackage-rotation proof on the emulator
        timeout-minutes: 42
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 6144
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash tooling/e2e/ci/run-with-deadline.sh 32m "e2e-kp-rotation drive" -- bash tooling/e2e/ci/run-kp-rotation.sh /tmp/integration-apks/kp_rotation_wire_test.apk integration_test/kp_rotation_wire_test.dart

      - name: Capture host + emulator diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/kpr-logs
          # `adb` reaches PATH only through the emulator action's
          # core.addPath(<sdk>/platform-tools); when that action never ran —
          # the pre-action failure this capture exists for — every adb line
          # below was `command not found`, and `|| true` kept it silent (run
          # 35536892150). Resolve it from the SDK instead, and say in fixed
          # words which case this diag is.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "${sdk}" ]; then PATH="${sdk}/platform-tools:${PATH}"; fi
          if command -v adb >/dev/null 2>&1; then adb_state=resolved; else adb_state=absent; fi
          devices=""
          if [ "${adb_state}" = resolved ]; then
            adb reconnect offline || true
            # Materialised: `adb devices | grep -q` reports the producer's
            # SIGPIPE under pipefail, not the match.
            devices="$(adb devices 2>/dev/null || true)"
          fi
          if grep -qE '^[^[:space:]]+[[:space:]]+[a-z]+$' <<<"${devices}"; then
            device_state=present
            # Nothing to wait for when no emulator was ever started.
            timeout 60 adb wait-for-device || true
          else
            device_state=none
          fi
          {
            echo "adb: ${adb_state}"
            echo "device: ${device_state}"
            echo
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l (after reconnect attempt) ==="
            adb devices -l || true
            echo
            echo "=== device clock / auto_time state ==="
            adb shell date -u || true
            adb shell settings get global auto_time || true
            adb shell settings get global auto_time_zone || true
            echo
            echo "=== relay containers ==="
            docker ps -a --filter name=strfry || true
          # `.log`, not `.txt`: this file is written AFTER the orchestrator's
          # EXIT trap has already scanned, and the scanner's directory walk
          # only picks up `*.log`. A `.txt` here would be uploaded unscanned.
          } > /tmp/kpr-logs/diag.log 2>&1 || true
          # Scan what this step just wrote (Security Rules 6 and 15) with the
          # wrapper the orchestrator uses — the key-material floor AND the
          # identifier scanner, against the manifest the orchestrator sealed —
          # which withholds (deletes) the diag on a hit, matching the
          # orchestrator's containment. rc 1 (a real leak) and rc 2/3/4 (the
          # diag absent/unreadable/empty, no manifest because the run never
          # sealed one) are kept apart deliberately: both fail the step, but
          # only a leak justifies destroying the diag.
          diag_scan_rc=0
          mkdir -p /tmp/kpr-logscan
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest-dir /tmp/haven-soak/needles \
            --sink diag=/tmp/kpr-logs/diag.log \
            --report /tmp/kpr-logscan/diag.ndjson || diag_scan_rc=$?
          if [ "${diag_scan_rc}" -eq 1 ]; then
            echo "diag withheld: log-privacy gate tripped" > /tmp/kpr-logs/DIAG_LEAK.txt
            exit 1
          elif [ "${diag_scan_rc}" -ne 0 ]; then
            echo "diag uncertified (rc=${diag_scan_rc}): absent, unreadable, empty, or no manifest to scan against" \
              > /tmp/kpr-logs/DIAG_UNSCANNABLE.txt
            echo "ERROR: diag log could not be scanned (rc=${diag_scan_rc})." >&2
            # The scanner's own code, never 1: on this step 1 means a leak, and the
            # job summary shows nothing but the code.
            exit "${diag_scan_rc}"
          fi

      # if: always() so a green run still surfaces the servo's clock records
      # and the parsed checkpoints as evidence.
      - name: Upload KeyPackage-rotation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-kp-rotation-${{ github.run_id }}
          path: |
            /tmp/kpr-logs/
          retention-days: 14
          if-no-files-found: ignore

      # Teardown is best-effort (stop-strfry.sh always exits 0), so both relays
      # are torn down unconditionally and independently.
      # The manifest holds the run's declared identifiers verbatim and is never
      # uploaded (check_wire_proxy_test_only.sh); it does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Tear down strfry relays
        if: always()
        run: |
          bash tooling/e2e/ci/stop-strfry.sh
          STRFRY_CONTAINER=strfry2 STRFRY_DATA_DIR=/tmp/strfry2-data \
            bash tooling/e2e/ci/stop-strfry.sh
