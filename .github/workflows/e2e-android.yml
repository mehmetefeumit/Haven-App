# Reusable workflow: Android E2E functional gate.
#
# Single-AVD job driving the consolidated three-user Haven flow at
# `haven/integration_test/e2e/e2e_combined.dart`.
#
# Architecture: Alice drives the production Flutter UI on the AVD;
# Bob and Carol participate as in-process `SyntheticUser` instances
# via the Rust FFI. All three coordinate through a single hermetic
# strfry container. There is no multi-AVD orchestration.
#
# # Why one AVD
#
# The prior multi-AVD architecture (3 emulators on one runner)
# over-committed `ubuntu-latest`'s ~7 GB of usable RAM and produced
# `kswapd0`/`lmkd` thrash plus 1.8-2.7 s EGL frame times. Element-web
# (the closest precedent for multi-user E2E messaging tests on
# GitHub Actions) solves the same memory pressure by running ONE
# UI client per runner and simulating other actors in-process —
# Haven's `SyntheticUser` pattern is the direct analog. One AVD,
# one process, real MLS protocol path for all three actors.
#
# All test-only Rust hooks (relay override, in-memory keyring,
# `ws://` allow-list for loopback) are gated by `#[cfg(debug_assertions)]`
# and `flutter drive` builds in debug mode, so the release pipeline
# is unaffected.

name: E2E Android

on:
  workflow_call:
    inputs:
      live_sync:
        description: >-
          Build e2e_combined with --dart-define=HAVEN_LIVE_SYNC. true exercises
          the live-sync engine path (the PR gate opts in via ci.yml); false
          (default) keeps the retained poller path — the live-sync scenarios self-skip.
        type: boolean
        default: false
        required: false

jobs:
  # ============================================================================
  # e2e_android — single AVD; one Flutter UI process + in-process
  # synthetic peers.
  # ============================================================================
  e2e_android:
    name: e2e_android
    runs-on: ubuntu-latest
    # The main scenario self-bounds at 12 minutes (`e2e_combined.dart`
    # `_outerTestTimeout`). On the flag-on path a cold AVD (boot + Gradle +
    # onboarding settle + 5 phases) that runs long surfaces as a clean
    # assertion failure at that ceiling. On the poll path the drive's own
    # 12m bound starts earlier (reinstall, launch, connect and setUpAll come
    # first) and fires first, as the harness's named "exceeded 12m" rather
    # than the test's assertion. Either way that bounds the test, not the
    # lane: the lane's worst case — connect retries, pre-drive waits, a
    # drive that hangs after its suite — is derived at the drive step
    # below.
    #
    # This job cap sits above every step cap, and it must clear their SUM: a
    # job cap below it can SIGKILL a run whose every step is still inside its
    # own cap, and a job-cap death skips every `if: failure()` step, so the
    # lane dies anonymous. It is therefore every step cap this job can run,
    # plus the most the work no step cap bounds has taken:
    #                                                          poll / flag-on
    #   Build the runtime log scanner                            10
    #   Build E2E test APK                                       25
    #   Provision the Android SDK (derived in that script)       11
    #   Create AVD snapshot (on an AVD-cache miss)               15
    #   Start recording wire proxy                               20
    #   Run e2e_combined on the emulator (derived there; the
    #     flag-on drive adds the 10 live-sync scenarios)         45 / 61
    #   everything no step cap bounds (setup, relay start, the
    #     post-drive tail): at most 12.9 min over 149 runs of
    #     both paths of this job (ci.yml and e2e-nightly.yml,
    #     2026-07-29..09-11), 11.1 of it one Setup Flutter
    #     stall (run 30792258968)                                13
    #                                                   = 139 / 155 -> 141 / 156
    # Measured time alone is not the rule. Sized that way (14.5 min before
    # the drive + 45 + 0.3 = 59.8, so 65) a 24-minute build and a 44-minute
    # drive, each inside its own cap, would have died here.
    # job-uncapped-minutes: 12.9 (149 runs, worst 30792258968)
    timeout-minutes: ${{ inputs.live_sync && 157 || 141 }}
    env:
      # 7788, NOT the relay's own port: this lane runs the recording wire proxy
      # (tooling/e2e/ci/start-wire-proxy.sh) in front of strfry. strfry keeps
      # its port; the proxy listens on 7788 and forwards there, so every frame
      # the app and the in-process synthetic peers send is journalled on the
      # host and read post-drive by the three wire oracles below. Pointing this
      # back at the relay port is the quietest possible break — traffic still
      # flows, the journal is empty-but-valid, and all three oracles then
      # certify nothing. scripts/ci/check_wire_oracle_lane_reachable.sh pins it.
      HAVEN_E2E_RELAY: ws://10.0.2.2:7788
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      # The runtime log scanner is wired into THIS lane (the one that runs the
      # recording proxy, whose control channel carries the run's declared
      # identifiers). run-single-avd-scenario.sh reads it: after the drive it
      # seals the needle manifest and runs every captured log through
      # tooling/e2e/ci/scan-logs.sh before echoing or keeping any of it.
      HAVEN_LOGSCAN: "true"
      # `proxy`: the recorder's declaration sidecars are what the seal reads.
      # The runner would infer the same from WIRE_UPSTREAM; stated here because
      # check_logscan_wired_everywhere.sh (h) asks every proxy-starting job to
      # say so, rather than leave it to an inference a reader cannot see.
      HAVEN_LOGSCAN_PROFILE: proxy

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      # Reclaim runner disk BEFORE the Gradle/Rust build — the multi-GB
      # debug build + NDK strip has run a default runner out of space.
      # Runs after checkout because the script lives in the repo.
      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # local-relay is listed because start-wire-proxy.sh release-builds it.
          # Without it this lane cold-compiled that workspace on EVERY run, into
          # an uncached target dir, on a runner that already needs a disk-free
          # step. e2e-ios.yml has always listed both.
          workspaces: |
            haven-core
            tooling/e2e/local-relay
            tooling/logscan
          key: e2e-android-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (same reasoning as the APK build below). The
      # runner seals and scans with it after the drive; the scan step at the
      # bottom runs it over the upload-only logs. Capped so a cargo stall fails
      # fast; the cap is a term of the job cap's sum above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # ONE sentinel string, minted ONCE, read by both halves.
      #
      # The drive emits it as a wire frame (TestRelay.emitWireJournalSentinel)
      # and the host oracles anchor their snapshot at it, so a background wake
      # appending to the journal mid-read cannot land inside the sample. Both
      # halves must name the SAME string: minting it twice would produce two
      # different random tokens, and the resulting "no anchor" META-FLOOR would
      # read as a flake rather than as the wiring bug it is.
      #
      # It is minted here, above the APK build, because `flutter drive
      # --use-application-binary` cannot re-pass a --dart-define: the value is
      # COMPILED IN, exactly like HAVEN_E2E_RELAY above it. $GITHUB_ENV carries
      # the one string forward to the oracle steps at the bottom of the job.
      - name: Mint the wire-journal sentinel
        run: |
          set -euo pipefail
          echo "WIRE_SENTINEL=HAVEN_WIRE_SENTINEL:$(openssl rand -hex 16)" \
            >> "${GITHUB_ENV}"

      # Gradle resolves the buildscript classpath over the network BEFORE it
      # compiles anything, so a cold ~/.gradle makes this lane fetch hundreds of
      # POMs — and hosted runners share egress IPs, so Maven Central rate-limits
      # a runner nobody here provoked. CI run 35622556197 job 106414462454 lost
      # a whole lane to HTTP 429 on the classpath, with NO test run, while twelve
      # sibling Android lanes built the same commit with zero 429s. A warm
      # dependency cache REMOVES those requests; the classified retry in
      # scripts/ci/build_apk_with_retry.sh is only the backstop for what is left.
      #
      # Restore-only. build-check.yml is the single writer of this key, so a lane
      # that deletes or half-fills ~/.gradle cannot publish a cache the other
      # lanes would then restore. The `restore-keys` prefix means a changed
      # dependency set still starts from the last good cache instead of cold.
      #
      # `continue-on-error` because a cache is an optimisation, and a step that
      # overruns its own `timeout-minutes` FAILS the job: without this, a slow
      # or unavailable cache service reddens a lane that would otherwise have
      # built cold and run every test.
      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('haven/android/**/*.gradle*', 'haven/rust_builder/**/*.gradle*', 'haven/android/gradle/wrapper/gradle-wrapper.properties', 'haven/pubspec.lock') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # Build the test APK BEFORE the emulator boots. The Rust-NDK +
      # Gradle compile peaks at several GB; running it concurrently
      # with a booted emulator + strfry container previously lost the
      # GitHub-hosted runner mid-step (the runner died with no logs
      # and no artifacts — see docs/E2E_TROUBLESHOOTING.md). Building
      # here, with nothing else resident, keeps the build peak and
      # the emulator peak from ever coinciding. The resulting APK is
      # staged at /tmp/scenario.apk; run-single-avd-scenario.sh
      # detects it and skips its own build.
      - name: Build E2E test APK
        working-directory: haven
        # Bounds a hung build (e.g. a cargo network stall) so it
        # fails fast instead of burning toward the job cap —
        # symmetric with the drive step's timeout below.
        timeout-minutes: 25
        # HAVEN_E2E_RELAY comes from the job-level `env:` block and is
        # already exported into every `run:` step. The --dart-define
        # baked here MUST match the relay URL the drive step uses,
        # since the value is compiled into the APK (drive does not
        # re-pass it).
        #
        # `--target-platform android-x64`: the AVD is x86_64, so that is
        # the only ABI the APK will ever run on. Without this flag cargokit
        # compiles the large (debug) haven-core Rust lib for every default
        # ABI — and for a debug build it ADDS android-x86/x64 on top of
        # arm/arm64 (rust_builder/cargokit/gradle/plugin.gradle), i.e. four
        # ABIs. That multi-ABI Rust build plus the NDK `stripDebugSymbols`
        # pass exhausted the runner disk ("No space left on device").
        # x86_64-only roughly halves the native build/strip footprint and
        # the wall-clock. cargokit auto-installs any missing rustup target.
        run: |
          ../scripts/ci/build_apk_with_retry.sh android-x64 \
            --target=integration_test/e2e/e2e_combined.dart \
            --dart-define=HAVEN_E2E_RELAY="${HAVEN_E2E_RELAY}" \
            --dart-define=HAVEN_LIVE_SYNC=${{ inputs.live_sync }} \
            --dart-define=HAVEN_E2E_NO_BACKGROUND=true \
            --dart-define=HAVEN_WIRE_SENTINEL="${WIRE_SENTINEL}"
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/scenario.apk
          ls -lh /tmp/scenario.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Install and VERIFY every SDK package the emulator action needs, before
      # its FIRST use below. The action installs them itself, with bare
      # `sdkmanager --install` calls tried once and checked by nothing: in CI
      # run 35524002720 the emulator's download failed, the action stopped,
      # and the last thing it printed was its teardown's "could not connect to
      # TCP port 5554" — a message about the emulator, from a job that ran no
      # test.
      # Unconditional, deliberately — the AVD cache holds `~/.android/avd/*`
      # only, so a cache HIT still needs the emulator binary and the system
      # image. The arguments MUST equal the api-level/target/arch of every
      # emulator step in this job (check_android_sdk_provisioned.sh). Once the
      # packages are present the action's own installs are no-ops (5 s).
      # The cap is the script's worst case, 9.5 min (its 360 s budget + the one
      # 180 s attempt that can start inside it + that attempt's 30 s emulator
      # probe), plus the step's own startup, rounded up.
      - name: Provision the Android SDK
        timeout-minutes: 11
        run: bash tooling/e2e/ci/provision-android-sdk.sh 34 google_apis x86_64

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # This step's entire job is booting an emulator, and until 2026-08-03 it
        # had no bound of any kind — a wedged boot here ran to the JOB cap,
        # which SIGKILLs the runner before any if: failure() step, so the lane
        # died slow and with no artifacts. Measured across 23 successful runs
        # (ci.yml, 2026-07/08) the snapshot takes 91-130 s; 15 min is ~7x the
        # observed max, so it can only ever fire on a genuine wedge. The
        # emulator-boot-timeout below is the action's own inner bound (7 min,
        # matching the drive steps) and fires first with the action's message.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Bound the boot itself (the only thing this step does) so a wedged
          # emulator fails inside the step rather than at the step cap above.
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      - name: Start strfry relay
        env:
          # Pin to an immutable multi-arch manifest digest for
          # supply-chain reproducibility (a floating `:latest` could
          # silently change the relay's behaviour between runs).
          # `sha256:5455...` is the digest of `dockurr/strfry:1.1.0`
          # (== `:latest` as of 2026-06-07), resolved via the Docker
          # Hub registry API; see docs/E2E_TROUBLESHOOTING.md for how
          # to re-resolve and bump it. Set the `STRFRY_IMAGE` repo
          # variable to override (it wins when non-empty);
          # `start-strfry.sh` falls back to this same pinned digest
          # when the variable is unset.
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # Put the RECORDING PROXY in front of the relay, before the drive.
      #
      # It must start HERE and not later: it builds (cargo, release) and runs
      # its own `--self-test` first, both of which need the network, and the
      # drive step below installs the egress guard that rejects outbound
      # 80/443 for everything that follows inside it. Loopback is unaffected by
      # that guard, so the proxy hop (guest -> 10.0.2.2:7788 -> 127.0.0.1) is
      # untouched by it for the whole run.
      #
      # Starting does NOT fail open. Recording does (a journal that cannot be
      # written never stops traffic), but a proxy that cannot BIND leaves the
      # app pointed at a dead port, so a non-zero exit here reds the lane
      # immediately rather than producing a run whose every oracle blames the
      # scenario.
      #
      # The upstream literal lives on the start line ON PURPOSE. It is the one
      # publish target this hermetic lane has, so the oracles' `--pool`
      # arguments below are derived from it rather than restating it — and
      # check_wire_oracle_lane_reachable.sh reads every OTHER literal `ws://`
      # in this job as a relay URL that must name the proxy's LISTEN port,
      # which is precisely the mistake a second copy would look like.
      #
      # The journal path is CLAIMED by the instance in a sidecar next to its
      # pid file rather than chosen here: `HAVEN_WIRE_JOURNAL` overrides the
      # per-instance default, and a lane that hardcodes one path is a lane that
      # silently reads the wrong file the day it runs two recorders.
      #
      # The needle directory is rotated BEFORE the proxy starts, never after:
      # the proxy creates its declaration sidecar there with O_EXCL on the
      # drive's first declaration, so a file left by an earlier run on a reused
      # runner would make it refuse (or, appended to, would seal a previous
      # run's identifiers into this run's manifest), and a rotation once the
      # proxy is live would unlink the file it holds open. Owner-only, because
      # what lands there is every identifier the run declares, verbatim.
      - name: Start recording wire proxy
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json
          upstream=ws://127.0.0.1:7777; bash tooling/e2e/ci/start-wire-proxy.sh 7788 "${upstream}"
          echo "WIRE_UPSTREAM=${upstream}" >> "${GITHUB_ENV}"
          claim=/tmp/haven-wire-proxy.journalpath
          journal="$(head -n 1 "${claim}" 2>/dev/null || true)"
          if [[ -z "${journal}" ]]; then
            echo "ERROR: the wire proxy started but claimed no journal path in" >&2
            echo "       ${claim}. Every oracle below reads that sidecar, so" >&2
            echo "       continuing would run them against a path nobody wrote." >&2
            exit 1
          fi
          echo "WIRE_JOURNAL=${journal}" >> "${GITHUB_ENV}"
          echo "wire journal: ${journal}"

      # Install + grant + drive ONLY — the APK was built in the
      # "Build E2E test APK" step above, so this step does no Gradle
      # work and the emulator is the dominant memory consumer.
      #
      # CRITICAL: the reactivecircus action's `timeout-minutes` does NOT
      # reliably reap its backgrounded emulator/adb/drive subtree — a hang
      # here ran the FULL ~45 min to the 60-min JOB timeout TWICE (runs
      # 28056995601, 28065762568), and a job-timeout SIGKILL fires BEFORE
      # the `if: failure()` diagnostic + artifact steps, leaving zero logs.
      # We therefore do NOT trust `timeout-minutes`; the RELIABLE bound is
      # an explicit `timeout` wrapping the script (a plain coreutils
      # timeout, immune to the action's process handling). `timeout-
      # minutes` is only a loose belt that MUST sit above the explicit
      # inner bound PLUS this step's own emulator boot: the step also boots
      # the AVD (`emulator-boot-timeout: 420` = 7 min) before the script
      # runs, and run-with-deadline.sh's `--kill-after=60s` adds ~1 min grace,
      # and the action's own work outside both bounds (SDK/AVD setup before
      # the boot, post-boot settings, teardown) adds up to 2 min more — 42-79 s
      # across the single-AVD lanes over twelve runs (2026-08/09), past the
      # 42-57 s run 34488512808 alone showed. So the belt is
      # deadline + 1 + 7 + 2: 51 + 1 + 7 + 2 = 61 on the flag-on path and
      # 35 + 1 + 7 + 2 = 45 on the poll path, and GitHub's own step reaper can
      # never fire before the explicit deadline lets the `if: failure()`
      # diagnostics + secret scan run. The poll belt was 30 over a 16m bound
      # until A8 widened the bound to fit the harness's retry budget, then 35
      # over a 26m bound whose budget left out the harness's pre-drive waits
      # (see the script comment below).
      # scripts/ci/check_e2e_step_timeout_ordering.sh enforces this arithmetic
      # on every lane so the two numbers cannot drift apart.
      - name: Run e2e_combined on the emulator
        timeout-minutes: ${{ inputs.live_sync && 61 || 45 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Bound a hung emulator BOOT so it fails fast (≤7 min) rather
          # than stalling toward the job timeout with no diagnostics.
          emulator-boot-timeout: 420
          # Single-line `script:` — the reactivecircus action runs each
          # line of a multi-line `script:` in a separate `sh -c`, so any
          # shell state would be lost across lines; chaining with `&&`
          # keeps it one shell.
          #
          # The whole script is wrapped in an explicit `timeout` (SIGTERM
          # at the deadline below, SIGKILL 60 s later) because the action's
          # own `timeout-minutes` does not reliably reap a hung emulator/adb/
          # drive subtree (see the step comment above). A healthy run
          # finishes far inside it (sizing evidence below), so it never cuts
          # a passing run but converts ANY hang (the guard, adb install/grant,
          # or the drive) into a CLEAN step failure whose `if: failure()`
          # diagnostic + artifact steps actually run.
          #
          # The network-egress guard (reject outbound TCP 80/443) runs
          # FIRST, INSIDE this script — i.e. AFTER the action has
          # downloaded the emulator SDK and booted the AVD — so it guards
          # only the flutter-drive test run and NEVER blocks the
          # emulator's own SDK download (dl.google.com:443). Loopback /
          # strfry (7777) / Docker-bridge / ESTABLISHED stay allowed, so
          # an accidental blob-server upload during the avatar phase still
          # RSTs and fails the lane. The guard is torn down by the
          # dedicated `if: always()` step below BEFORE any step needing
          # outbound HTTPS — otherwise its own :443 reject rule would RST
          # the artifact-upload + cache-save POST steps and silently lose
          # the diagnostics.
          # Outer bound, via run-with-deadline.sh (same coreutils `timeout`,
          # plus a banner naming this lane when it fires — an anonymous rc=124
          # is what made these hangs expensive to triage).
          #
          # POLL PATH, corrected 2026-08-03 (CI_HARDENING_BACKLOG.md A8). The
          # old pair was inner DRIVE_TIMEOUT 20m under a 16m outer wrapper: the
          # inner bound could NEVER fire, so run-single-avd-scenario.sh's
          # attributable "flutter drive for X exceeded 20m" was unreachable and
          # every poll hang surfaced as a bare 124. Worse, the harness's own
          # retry budget did not fit under 16 min either, so a run that hit the
          # connect watchdog twice and then recovered was SIGKILLed
          # mid-recovery. Re-derived from measurement: 21 successful poll runs
          # (ci.yml, 2026-07/08) put the whole step at p50 4.8 / p95 5.1 / max
          # 5.1 min, so the drive itself is comfortably under 5 min, and
          # DRIVE_TIMEOUT 12m is ~2.4x that whole-step max.
          # Net effect on a plain hang: it now dies at ~13 min NAMED (the inner
          # DRIVE_TIMEOUT) instead of at 16 min anonymous.
          # Flag-on (live_sync=true) runs the 10 real live-sync scenarios on top. Their
          # measured organic runtime is ~20 min (live-sync group ~16 min + main + FE +
          # teardown), which left ZERO slack under the then-default 20 min inner
          # DRIVE_TIMEOUT (default in run-single-avd-scenario.sh): the drive was
          # SIGKILLed mid-suite (rc=124) BEFORE any per-test `timeout:` could
          # report cleanly. So the flag-on lane widens the inner DRIVE_TIMEOUT to
          # 28 min (via HAVEN_DRIVE_TIMEOUT), and the per-test `timeout:`
          # overrides inside e2e_combined.dart now have real headroom to convert
          # any single stuck scenario into a clean, named failure instead of a
          # blind SIGKILL.
          #
          # DEADLINE, both paths, by substitution into run-single-avd-scenario.sh's
          # worst case (stated at its CONNECT_WATCHDOG_SECS), in seconds:
          #                                                   poll / flag-on
          #   egress guard's G2 + G3 probe waits, each a wall-clock
          #     loop that can run one 1 s tick past PROBE_TIMEOUT, and
          #     the `nc -w 1` fallback of each probe, 2 x (15 + 1 + 1)   34
          #   INSTALL_BARRIER_SECS                                 120
          #   WIFI_OFF_TIMEOUT_SECS                                 20
          #   GUEST_NET_TIMEOUT_SECS                               120
          #   2 retried pre-connect stalls, each restoring the app the
          #     failed attempt's teardown uninstalled — a flushed fresh
          #     install — 2 x (300 + 5 + 120 + 5)                   860
          #   last attempt, DRIVE_TIMEOUT + 30 kill-after     750 / 1710
          #   the guard's `iptables -w 5` calls wait only on another
          #     xtables-lock holder, and nothing in this job touches
          #     iptables during this step (relays start in earlier steps)   0
          #                                          = 1904 s / 2864 s
          #                                          = 31m44s / 47m44s
          #   + the unbounded adb, guard and scan work, ~3 min: the figure the
          #     earlier budget carried, kept because the sick device that
          #     reaches the other bounds is the one that slows it (under 30 s
          #     on run 34488512808's healthy single-target lanes)
          #                                          = 34m44s / 50m44s
          #   -> 35m / 51m. scripts/ci/check_e2e_lane_budget.sh derives this
          #   sum from the scripts' own constants on every push (`--explain`
          #   prints it).
          # This was 2x5 + 12 + 3 = 25 inside 26m, and 2x5 + 28 + 3 = 41 inside
          # 45m: both counted only the watchdog and drive timeouts, leaving out
          # the waits before the drive and the retries' own tails, and the
          # Phase-2 install barrier is one more such wait, and so is each
          # retry's restore: a failed attempt's `flutter drive` teardown
          # uninstalls the app, so each retry puts it back through install_app,
          # with its barrier.
          script: bash tooling/e2e/ci/run-with-deadline.sh ${{ inputs.live_sync && '51m' || '35m' }} "e2e-android drive (${{ inputs.live_sync && 'live-sync' || 'poll' }})" -- bash -c 'bash tooling/e2e/ci/setup-network-guard.sh install && HAVEN_DRIVE_TIMEOUT=${{ inputs.live_sync && '28m' || '12m' }} bash tooling/e2e/ci/run-single-avd-scenario.sh integration_test/e2e/e2e_combined.dart'

      # Publish what the guard OBSERVED (CI_HARDENING_BACKLOG C7). Must run
      # BEFORE the teardown below, because the report cross-checks its parse of
      # the kernel log against the chain's own packet counters (gate G5) and a
      # flushed chain has none.
      #
      # `if: always()` and NOT best-effort: an absent or empty capture exits 3
      # and reddens the lane. A guard whose failure mode is silence has to
      # treat "no evidence" as a failure, or a lane that recorded nothing is
      # indistinguishable from a lane that observed nothing — backlog A4.
      - name: Report egress observations
        if: always()
        run: bash tooling/e2e/ci/setup-network-guard.sh report

      # Tear the egress guard down BEFORE anything that needs outbound
      # HTTPS. The guard's `REJECT ... --reject-with tcp-reset` on TCP 443
      # stays installed for the rest of the job otherwise, RSTing the
      # actions/upload-artifact + actions/cache POST steps (both upload
      # over :443) and silently dropping the very diagnostics we depend on
      # — the root reason prior failures produced NO artifact. The guard
      # has already covered the entire flutter-drive run above, so removing
      # it now costs zero coverage. Best-effort so it can never turn a run
      # red (the teardown subcommand also stops the ring-buffer follower and
      # removes the IPv6 chain, which the inline commands here never did).
      - name: Remove network egress guard
        if: always()
        run: bash tooling/e2e/ci/setup-network-guard.sh teardown || true

      # Stop the recorder BEFORE reading its journal, and on EVERY outcome.
      #
      # Before, because SIGTERM is what makes the recorder flush and print its
      # own shutdown summary ("N connection(s), N record(s) observed, N line(s)
      # written [— DEGRADED]"); an oracle reading a live journal can catch a
      # half-written final line and (correctly) call the whole run UNUSABLE.
      #
      # `if: always()` because the failure path is the one that leaks it. The
      # proxy holds a CLAIM on its journal path and the next start refuses
      # while a live instance holds the same path, so a leaked process on a
      # reused runner would silently switch recording off for every later run
      # — the first red run disabling the instrument for all of them. The
      # script is best-effort and always exits 0, so it cannot redden a green
      # run by itself.
      - name: Stop recording wire proxy
        if: always()
        run: bash tooling/e2e/ci/stop-wire-proxy.sh

      # The recorder's own account of its declaration channel, read back
      # BEFORE anything trusts the sidecars it wrote. Its shutdown summary
      # says how many declarations and canary manifests it recorded, refused
      # or lost, and whether it found a previous run's file already there. A
      # refused or lost declaration is a needle the scanner never searched
      # for — its "clean" is quieter than the run believed; a STALE sidecar is
      # a previous run's identifiers sealed into this run's manifest. Neither
      # is visible anywhere else. Counts only, so this step's log carries
      # nothing a value could ride on. Standard guard condition, not
      # `always()`: the summary is written on every outcome (the stop step is
      # `always()`), so its absence is a broken recorder or a lane that died
      # before the recorder started (a failed provisioning step, CI run
      # 35536892150). Red either way: no summary is no account of the channel.
      - name: Proxy declaration channel stayed healthy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash tooling/e2e/ci/check-proxy-sidecar-summary.sh /tmp/haven-wire-proxy.log

      # THE POINT OF ALL OF THE ABOVE: read the transcript.
      #
      # Three oracles, one journal, one sentinel. They run together in one step
      # so a single red run reports every finding instead of hiding the second
      # and third behind the first — the same reason repo-guards.yml runs its
      # guards with `if: always()` between steps.
      #
      # No `|| true` anywhere below, and no code is normalised away. The exit
      # set is CLOSED — {0,1,2,3,4} — and only 0 is a pass:
      #
      #   1 VIOLATION   a privacy finding on the wire.
      #   2 USAGE       this lane called the oracle wrong.
      #   3 UNUSABLE    the RECORDER (or the allow-list) broke. The run proves
      #                 nothing EITHER WAY — believe no result from it.
      #   4 META-FLOOR  the journal parsed but the SCENARIO proved too little:
      #                 no sentinel to anchor on, no traffic under it, a kind
      #                 published with no declared pool, a canary never planted.
      #
      # 3 and 4 reddening the lane is the entire point of the workstream: an
      # instrument that reports "I saw nothing" and a lane that reports "there
      # was nothing to see" are indistinguishable unless one of them fails.
      #
      # No `if:` — the default (`success()`) is deliberate. When the drive has
      # already failed the lane is red regardless, and a partial journal from a
      # half-run scenario would produce META-FLOOR noise that reads as a second
      # independent fault.
      - name: Wire privacy oracles
        run: |
          set -uo pipefail
          first_rc=0
          failures=""

          verdict() { # verdict <label> <rc>
            case "$2" in
              0) echo "::notice::wire oracle $1: clean" ;;
              1) echo "::error::wire oracle $1: VIOLATION (rc=1) — a privacy finding on the wire." ;;
              2) echo "::error::wire oracle $1: USAGE (rc=2) — this lane invoked the oracle wrong; the wiring is broken, not the app." ;;
              3) echo "::error::wire oracle $1: UNUSABLE (rc=3) — the recorder or its inputs broke. This run proves NOTHING either way; do not read it as a pass." ;;
              4) echo "::error::wire oracle $1: META-FLOOR (rc=4) — the journal parsed but the scenario proved too little. Not a pass." ;;
              *) echo "::error::wire oracle $1: undocumented exit code $2 — the contract is a closed set {0,1,2,3,4}; treat the oracle itself as broken." ;;
            esac
            if [[ "$2" -ne 0 ]]; then
              failures="${failures} $1(rc=$2)"
              # Worst, not first: a C2-C4 META-FLOOR (4) must not mask a C5
              # VIOLATION (1). Severity order is 1 > 4 > 3 > 2, so a real wire
              # finding always names the exit code.
              case "$2" in
                1) first_rc=1 ;;
                4) [[ "${first_rc}" -eq 1 ]] || first_rc=4 ;;
                3) [[ "${first_rc}" -eq 1 || "${first_rc}" -eq 4 ]] || first_rc=3 ;;
                *) [[ "${first_rc}" -ne 0 ]] || first_rc="$2" ;;
              esac
            fi
          }

          # The harness's sockets, removed from every assertion that accepts
          # them. `TestRelay` reaches the same proxied relay the app does, so
          # its probes are IN the journal and are NOT Haven's privacy surface.
          #
          # Exclusion now has TWO sources, and the oracles union them:
          #
          #   * SELF-DECLARATION, read out of the journal. Every TestRelay emits
          #     the proxy-intercepted sentinel VERB on every socket it opens
          #     (`TestRelay._declareHarnessSocket`), including the fresh
          #     conn_id a mid-run reconnect mints, so all three of the drive's
          #     sockets (`ctx.relay`, FE-2's, M11's) are covered with no host
          #     plumbing at all. This is what closed the gap that used to make
          #     these floors mean "the scenario transmitted" rather than "the
          #     app did" — and, more sharply, what stopped C5.1 reading two
          #     SyntheticUser peers publishing 35 ms apart over ONE multiplexed
          #     harness socket as a co-membership leak by the app.
          #   * THIS GREP, which names the socket whose ack the drive printed.
          #     Kept because it is an independent check that the recorder chain
          #     is live end to end: a missing ack means the drive never reached
          #     the proxy, and that has to be loud rather than inferred from a
          #     journal that would then be describing some other run.
          #
          # The proxy returns the emitting `conn_id` in the sentinel ack and the
          # drive prints that ack — which is the ONLY path by which the host can
          # learn the id, so this grep is a load-bearing link of the recorder
          # chain, not a convenience.
          #
          # It is NOT best-effort. A missing id would silently drop the flag and
          # leave both oracles attributing the harness's own traffic to the app,
          # which is precisely the weakness --exclude-conn exists to remove, so
          # the absence is reported LOUDLY (rc 3 — an input to the instrument
          # broke) and the oracles still run underneath it, unexcluded, so their
          # other findings are not lost behind this one. Exclusion can only ever
          # REMOVE evidence: an over-broad one fails closed on the oracles' own
          # preconditions and can never manufacture a pass.
          #
          # `tail -n 1` because the drive log ACCUMULATES retried attempts
          # (run-single-avd-scenario.sh appends each attempt with a header). Only
          # a pre-test connect flake is ever retried, so a retried attempt emits
          # no sentinel at all — but if that ever changes, the LAST ack is the
          # one belonging to the attempt whose traffic the journal ends with.
          harness_conn="$(LC_ALL=C grep -aoE 'wire-journal sentinel acked.*conn=[A-Za-z0-9_-]+' /tmp/flutter-drive.log 2>/dev/null | tail -n 1 | sed -E 's/.*conn=//' || true)"
          # `${a[@]+"${a[@]}"}`, not `"${a[@]}"`: an EMPTY array expanded under
          # `set -u` is an unbound-variable error on bash < 4.4, and this same
          # shape is used verbatim by e2e-ios.yml, whose runner ships bash 3.2.
          excl=()
          if [[ -n "${harness_conn}" ]]; then
            excl=(--exclude-conn "${harness_conn}")
            echo "::notice::harness conn_id ${harness_conn} excluded from wire attribution (TestRelay's own probes are not Haven's traffic)."
          else
            echo "::error::the harness conn_id is not in /tmp/flutter-drive.log — no '[e2e_combined] wire-journal sentinel acked … conn=<id>' line was found. Without it --exclude-conn cannot be passed, so TestRelay's own probes count toward every floor and every attribution below: a run in which the production Flutter app transmitted NOTHING could still satisfy --min-distinct-publishers 2. Either the sentinel ack never came back (the oracles will also report no anchor) or the drive's print of it changed shape; fix the channel rather than dropping the flag." >&2
            verdict "harness conn_id channel" 3
          fi

          # C2-C4 — closed-world structure (kinds, tags, frame verbs, REQ keys).
          # A participant floor is REQUIRED or the meta-floor is vacuous: this is
          # a four-actor flow (Alice on the UI; Bob, Carol and Dave in-process
          # over the FFI), so at least two identities must have transmitted and
          # at least two sockets must have carried traffic.
          #
          # Read honestly, that floor is still weaker than it looks even now
          # that every harness socket is excluded: the SyntheticUsers publish
          # real 30443/1059/445 over their own Rust-side sockets, so two
          # distinct publishers can still be two synthetic peers. What the
          # exclusion fixed is attribution — no harness traffic is counted as
          # the app's any more — not the question of WHICH non-harness device a
          # given frame came from. C5.1 is the one invariant that needs that
          # answer, and it gets it by partitioning per connection rather than by
          # naming the app; see check-wire-correlation.sh.
          rc=0
          bash tooling/e2e/ci/check-wire-journal.sh \
            --journal "${WIRE_JOURNAL}" \
            --sentinel "${WIRE_SENTINEL}" \
            --min-distinct-publishers 2 \
            --min-distinct-conns 2 \
            ${excl[@]+"${excl[@]}"} || rc=$?
          verdict "C2-C4 structural" "${rc}"

          # C5 — correlation and containment. Each pool is the set of relays a
          # KIND may reach; this lane is hermetic, so every kind's pool is the
          # single upstream the proxy forwards to. The pool names that UPSTREAM
          # and not the guest-visible listen alias because the journal records
          # `relay_url` (the endpoint behind the proxy) on every frame. Every
          # kind the closed-world allow-list admits gets a pool: a kind that is
          # published with none is a META-FLOOR, never a pass.
          #
          # C5.8 IS NOW ASSERTED, over ids the lane learns from a SIDECAR.
          #   The real MLS group id cannot be derived from the journal — its
          #   absence there is the whole assertion — and it is minted per run on
          #   the device (CircleFfi.mlsGroupId), so it has to be declared. It
          #   must NOT travel by the drive log: that file is uploaded with
          #   14-day retention AND is C6's --manifest input, and haven/
          #   integration_test/e2e/_lib/wire_canaries.dart records the standing
          #   decision that a Rule-4 value goes only through a file the lane does
          #   not upload. The sanctioned channel is the one that now exists: the
          #   drive announces each id as a proxy CONTROL frame, the proxy
          #   intercepts it (never forwarded upstream, never journalled) and
          #   appends the distinct ids to a host-side sidecar next to its pid
          #   file. The sidecar is read here and never uploaded, and the VALUES
          #   are never echoed into this step log either — a job log on a public
          #   repo is as durable a disclosure as an artifact. Only the COUNT is
          #   printed; check-wire-correlation.sh does the same (its summary line
          #   reports "N declared MLS group id(s)", and a C5.8 finding names the
          #   event id and the tag, never the needle).
          #
          #   This replaces `--mls-group-id-not-asserted`, whose whole purpose
          #   was to be deleted here. Do NOT reintroduce it as a fallback for an
          #   empty sidecar: that would convert a broken control channel into a
          #   permanently-skipped invariant that reports green. An empty or
          #   absent sidecar is a FAILURE below (and the oracle independently
          #   META-FLOORs on the same fact, since 445s are published with no id
          #   declared). The two flags are also mutually exclusive by the
          #   oracle's own argument parsing, so passing both is rc 2.
          # C5.1 needs an APPLICATION kind-445 (one carrying `expiration`) from
          # each of TWO distinct groups. On the poll path every publishLocation
          # in e2e_combined targets the one family circle — the two-circle
          # scenario lives in the M11 group, whose bodies all self-guard on
          # `if (!liveSyncEnabled) return;` — so C5.1's precondition cannot be
          # met and the whole C5 arm would META-FLOOR for a scenario-shape
          # reason rather than anything on the wire. e2e-ios.yml reached this
          # same conclusion independently; the two lanes now agree instead of
          # contradicting each other. Skipping is ANNOUNCED, not silent: a
          # reader must never have to infer from an absence which invariants a
          # green run actually exercised.
          if [[ "${{ inputs.live_sync }}" != "true" ]]; then
            echo "C5 correlation: SKIPPED on the poll path — C5.1 requires an application kind-445 from two distinct groups, which only the live-sync two-circle scenario produces. Run the live-sync variant for the C5 verdicts."
          else
          # One `--mls-group-id` per line of the sidecar. Values are NOT echoed
          # (Security Rule 4); the count is, so a reader can see the channel
          # carried something without the log carrying the id.
          # Same precedence start-wire-proxy.sh resolves the path with, in the
          # same order, so an override set for the recorder is honoured here
          # instead of silently reading the default path it stopped writing.
          mls_claim="${HAVEN_WIRE_PROXY_RUN_DIR:-/tmp}/haven-wire-proxy.mlsgroupidpath"
          # Read the path the recorder CLAIMED, exactly as the journal path is
          # read above, instead of rebuilding the default instance's filename.
          # A guessed name reads the wrong file the day a lane runs two
          # recorders, and a stale sidecar is worse than a missing one: C5.8
          # would scan for a previous plane's ids, find none, and report clean.
          mls_sidecar="$(head -n 1 "${mls_claim}" 2>/dev/null || true)"
          if [[ -z "${mls_sidecar}" ]]; then
            echo "::error::the recorder claimed no MLS-group-id sidecar (${mls_claim} absent or empty). Without it C5.8 has no ground truth for Security Rule 4."
            verdict "C5.8 mls-group-id channel" 3
            mls_sidecar="/nonexistent"
          fi
          mls_args=()
          mls_count=0
          if [[ -r "${mls_sidecar}" ]]; then
            while IFS= read -r mls_id || [[ -n "${mls_id}" ]]; do
              mls_id="${mls_id//[[:space:]]/}"
              [[ -n "${mls_id}" ]] || continue
              mls_args+=(--mls-group-id "${mls_id}")
              mls_count=$((mls_count + 1))
            done < "${mls_sidecar}"
          fi
          if [[ "${mls_count}" -eq 0 ]]; then
            echo "::error::the MLS group-id sidecar ${mls_sidecar} is absent or empty, so the drive never announced a group id through the proxy control channel. C5.8 would then scan the wire against an EMPTY set of values and could not have failed — Security Rule 4 would be reported as holding by a check that looked for nothing. This is a broken control channel (drive announcement -> proxy interception -> sidecar), not a scenario finding, and it is deliberately NOT downgraded to --mls-group-id-not-asserted: a fallback would turn this into a permanently-skipped invariant that goes green." >&2
            verdict "C5.8 mls-group-id channel" 3
          else
            echo "::notice::C5.8: ${mls_count} MLS group id(s) declared from the proxy sidecar (values withheld — Security Rule 4)."
          fi
          # ...and a non-empty needle set is not a COMPLETE one. Nothing in the
          # journal can tell a set that shrank from a run that made fewer
          # circles, so a lost declaration leaves C5.8 looking exactly as busy
          # over fewer values while every verdict stays green. The drive prints
          # a running count as it announces each circle (`_announceMlsGroupId`),
          # produced independently of the sidecar the ids themselves travel to —
          # holding the two against each other is what catches a declaration
          # that never landed, a sidecar rotated under the recorder, or a
          # scenario that stopped announcing. Counts only; the ids stay off this
          # log (Security Rule 4). `sort -n | tail -n 1` because the drive log
          # ACCUMULATES retried attempts (run-single-avd-scenario.sh appends
          # each), so the highest count is the attempt that got furthest.
          announced="$(LC_ALL=C grep -aoE 'announced MLS group id #[0-9]+' /tmp/flutter-drive.log 2>/dev/null | sed -E 's/.*#//' | sort -n | tail -n 1 || true)"
          expect=()
          if [[ -n "${announced}" ]]; then
            expect=(--expect-mls-group-ids "${announced}")
          else
            echo "::error::no '[e2e_combined] announced MLS group id #<n>' line is in /tmp/flutter-drive.log, so the number of circles this run announced is unknown and the sidecar's ${mls_count} id(s) cannot be checked for COMPLETENESS. A needle set that lost entries scans fewer circles than the run created and still reports clean, which is the one failure mode C5.8 must not have. Either the scenario stopped announcing or the drive's print of it changed shape; fix the channel rather than dropping the flag." >&2
            verdict "C5.8 announced-count channel" 3
          fi
          rc=0
          bash tooling/e2e/ci/check-wire-correlation.sh \
            --journal "${WIRE_JOURNAL}" \
            --sentinel "${WIRE_SENTINEL}" \
            --pool "0=${WIRE_UPSTREAM}" \
            --pool "5=${WIRE_UPSTREAM}" \
            --pool "445=${WIRE_UPSTREAM}" \
            --pool "1059=${WIRE_UPSTREAM}" \
            --pool "10002=${WIRE_UPSTREAM}" \
            --pool "10050=${WIRE_UPSTREAM}" \
            --pool "30443=${WIRE_UPSTREAM}" \
            ${excl[@]+"${excl[@]}"} \
            ${mls_args[@]+"${mls_args[@]}"} \
            ${expect[@]+"${expect[@]}"} || rc=$?
          verdict "C5 correlation" "${rc}"
          fi

          # C6 — content canaries. The manifest of planted values is announced
          # by the scenario over the proxy's control channel and lands in the
          # per-role canary sidecar under /tmp/haven-soak/needles/ (JSON
          # lines, one manifest per line) — never in the drive log, which is
          # uploaded. The sidecar holds the planted VALUES: it is handed to the
          # oracle as an argument, exactly as the raw journal is, and is never
          # read into this log (check_wire_proxy_test_only.sh check 6). An
          # unmatched glob reaches the oracle as a literal and is reported
          # absent (rc 3); a sidecar that parses to no manifest is a
          # META-FLOOR (rc 4) — the oracle's own self-test pins both.
          rc=0
          dart tooling/e2e/ci/check-wire-canaries.dart \
            --journal "${WIRE_JOURNAL}" \
            --manifest /tmp/haven-soak/needles/*.canaries.json \
            --sentinel "${WIRE_SENTINEL}" || rc=$?
          verdict "C6 canaries" "${rc}"

          if [[ "${first_rc}" -ne 0 ]]; then
            echo "::error::wire oracles FAILED:${failures}" >&2
            exit "${first_rc}"
          fi
          echo "All three wire oracles read the journal and found it clean."

      # The RAW journal is a full traffic transcript and must die with the
      # runner (scripts/ci/check_wire_proxy_test_only.sh forbids uploading a
      # `.ndjson` from any workflow — CI artifacts live for days on a public
      # repo). This is the upload-safe form: counts, kinds, tag NAMES and
      # endpoints, no values, and the summariser runs its own output through
      # scan-logs-for-secrets.sh before it can become an artifact. Best-effort
      # so a diagnostics step can never be the thing that reds an already-red
      # lane; the summariser deletes its output rather than emit a leaky one.
      - name: Summarize wire journal
        if: failure()
        run: |
          bash tooling/e2e/ci/summarize-wire-journal.sh \
            "${WIRE_JOURNAL:-}" /tmp/wire-summary.log || true

      # Uploaded on EVERY outcome, unlike the failure-only artifact below.
      # Observe mode exists to accumulate a destination baseline from GREEN
      # runs, and an artifact that only appears on red would never produce one.
      # Contents are IP/transport headers only — see the disclosure review in
      # setup-network-guard.sh; the report has already run them through
      # scan-logs-for-secrets.sh.
      - name: Upload egress observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: egress-android${{ inputs.live_sync && '-live-sync' || '' }}-${{ github.run_id }}
          path: |
            /tmp/haven-egress/egress-raw.log
            /tmp/haven-egress/egress-summary.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect strfry logs
        if: always()
        run: |
          docker logs strfry > /tmp/strfry.log 2>&1 || true

      # Capture a snapshot of host + emulator state so a future "the
      # failure was caused by OOM at 22:17" hypothesis can be tested
      # from the artifact alone, without re-running. `|| true` on
      # each command so a partial failure doesn't mask the real
      # cause being uploaded above.
      # `if: always()` and `.log`, not `.txt`: the scan step below runs on every
      # outcome short of a cancellation and refuses an absent file, and the
      # scanner's directory walk only ever picks up `*.log` — a `.txt` here
      # would be the one uploaded path the guard cannot see.
      - name: Capture host + emulator diagnostics
        if: always()
        run: |
          # `adb` reaches PATH only through the emulator action's
          # core.addPath(<sdk>/platform-tools); when that action never ran the
          # slices below were `command not found`, and `|| true` kept it silent
          # (run 35536892150). Resolve it from the SDK instead, and say in
          # fixed words which case this diag is.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "${sdk}" ]; then PATH="${sdk}/platform-tools:${PATH}"; fi
          if command -v adb >/dev/null 2>&1; then adb_state=resolved; else adb_state=absent; fi
          devices=""
          if [ "${adb_state}" = resolved ]; then devices="$(adb devices 2>/dev/null || true)"; fi
          # Materialised: `adb devices | grep -q` reports the producer's
          # SIGPIPE under pipefail, not the match.
          if grep -qE '^[^[:space:]]+[[:space:]]+[a-z]+$' <<<"${devices}"; then device_state=present; else device_state=none; fi
          {
            echo "adb: ${adb_state}"
            echo "device: ${device_state}"
            echo
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l ==="
            adb devices -l || true
            echo
            echo "=== adb shell dumpsys meminfo com.oblivioustech.haven ==="
            adb shell dumpsys meminfo com.oblivioustech.haven || true
            echo
            echo "=== top (1 sample) ==="
            top -bn1 | head -40 || true
          } > /tmp/diag.log 2>&1

      # Where each uploaded log is scanned, and by what. The logcat and both
      # drive logs go through the runner's log-privacy gate (HAVEN_LOGSCAN
      # above): it seals the run's needle manifest from the proxy's declaration
      # sidecar, runs tooling/e2e/ci/scan-logs.sh — the key-material floor AND
      # the identifier scanner — and deletes them on a leak, before the drive
      # log is echoed. The wire summary is run through the key-material floor
      # by its producer. What is left is scanned HERE, against the SAME sealed
      # manifest, by the same wrapper: the relay log (structural rules off —
      # a relay legitimately holds pubkeys and event ids), the host
      # diagnostics, the proxy's own log (lengths, counts, fixed labels and its
      # loopback endpoints, which the manifest exempts by name), and the wire
      # summary again, this time for identifiers — as a `diag` sink, NOT a
      # `drive` one: it is a host-written digest the drive never planted a
      # positive control into, and the `drive` class demands the Dart
      # open/close plants and a hundred lines of every file, which the summary
      # would fail on every red run for a reason that is not a finding. `diag`
      # keeps the same term floor and structural rules with a one-line floor
      # and no plant requirement. The summary is named only when it exists: it
      # is produced `if: failure()`, so on a green run there is neither a file
      # to scan nor one to upload, and the two predicates are the same.
      # Scan-before-upload, as its OWN step on every outcome short of a
      # cancellation: a leak (rc 1) deletes every scanned file and fails the
      # lane even on an otherwise green run, so the upload finds nothing to
      # publish; an unscannable log (rc 3), a broken guard (rc 2) or an unmet
      # floor (rc 4) fails it and leaves the files as they are. The standard
      # guard condition (not `always()`) is what lets
      # docs/privacy/privacy_invariants.json cite this step as the runtime
      # scanner's enforcing run.
      - name: Scan captured logs for secrets before upload
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          summary=()
          if [[ -f /tmp/wire-summary.log ]]; then summary=(--sink diag=/tmp/wire-summary.log); fi
          rc=0
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest-dir /tmp/haven-soak/needles \
            --sink relay=/tmp/strfry.log \
            --sink diag=/tmp/diag.log \
            --sink proxy=/tmp/haven-wire-proxy.log \
            ${summary[@]+"${summary[@]}"} \
            --report /tmp/logscan-report-upload.ndjson || rc=$?
          exit "${rc}"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # Suffix the flag-on run so it never collides with the poll-path
          # e2e-android job's artifact when BOTH are called in one ci.yml run
          # (upload-artifact@v4+ rejects a duplicate name in the same run).
          name: e2e-android${{ inputs.live_sync && '-live-sync' || '' }}-${{ github.run_id }}
          # The scanner's findings reports (/tmp/logscan-report.ndjson from the
          # runner, /tmp/logscan-report-upload.ndjson from the step above) hold
          # sink:line, class, encoding and rule ids only — never a value — but
          # are NOT uploaded: check_wire_proxy_test_only.sh bans every .ndjson
          # from an upload path, keyed on the extension alone. The same
          # findings are printed as LEAK lines in the two scanning steps' logs.
          path: |
            /tmp/adb-logcat.log
            /tmp/flutter-drive.log
            /tmp/strfry.log
            /tmp/diag.log
            /tmp/scenario.apk
            # Redacted wire-journal summary only. The raw transcript stays on
            # the runner (check_wire_proxy_test_only.sh check 3).
            /tmp/wire-summary.log
            /tmp/haven-wire-proxy.log
          retention-days: 14
          if-no-files-found: ignore

      # The declaration sidecars, the sealed manifest and the wire-canary
      # manifest hold the run's identifiers verbatim. They are never uploaded
      # (check_wire_proxy_test_only.sh) and they do not outlive the job either:
      # removed on EVERY outcome, after every upload step, so a reused runner
      # never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      # Relay teardown (CI-1). Runs LAST and `if: always()` so the
      # strfry container + its host data dir are removed on every
      # outcome (pass, fail, or step timeout), leaving no stale events
      # for a later run on a reused runner. Placed AFTER "Collect
      # strfry logs" (which reads `docker logs strfry`) and the
      # artifact upload so neither is starved of the container. The
      # script is best-effort and always exits 0, so teardown can
      # never turn a green run red.
      - name: Tear down strfry relay
        if: always()
        run: bash tooling/e2e/ci/stop-strfry.sh
