# Reusable workflow: Dependency audit
# Checks for known vulnerabilities in Rust dependencies
#
# EVERY Rust lockfile is scanned. They are separate crates with separate
# `Cargo.lock`s, and `rust_builder`'s is the one whose resolution actually ships
# inside the app — auditing only `haven-core` let rust_builder drift unnoticed
# (it sat on rustls-webpki 0.103.9 with four cert/CRL-validation advisories, and
# time 0.3.46, long after haven-core had resolved past both). The two tooling
# crates never ship, but `haven-logscan` carries a secp256k1 implementation
# (`k256`, to derive the E2E identities it hunts for) and `haven-local-relay`
# sits in the app's socket path on every E2E lane, so an advisory against either
# is still a finding this repository must see.
#
# Every step runs from `haven-core` so cargo-audit picks up the single
# `haven-core/.cargo/audit.toml` policy: that file reads relative to the working
# directory, and it is where every ignored advisory is justified. Running the
# second scan from `haven/rust_builder` instead would silently apply NO ignore
# list, turning the documented-unreachable libcrux findings into hard failures.

name: Dependency Audit

on:
  workflow_call:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haven-core

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (haven-core)
        run: cargo audit

      # Separate step (not `&&`) so a failure names WHICH lockfile is affected.
      - name: Run cargo audit (rust_builder — the shipped FFI crate)
        if: always()
        run: cargo audit --file ../haven/rust_builder/Cargo.lock

      - name: Run cargo audit (haven-logscan — the runtime log scanner)
        if: always()
        run: cargo audit --file ../tooling/logscan/Cargo.lock

      - name: Run cargo audit (haven-local-relay — the hermetic relay and wire proxy)
        if: always()
        run: cargo audit --file ../tooling/e2e/local-relay/Cargo.lock
