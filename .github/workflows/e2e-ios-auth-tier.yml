# Reusable workflow: iOS CoreLocation authorization-tier lane (backlog B7).
#
# Runs ONE drive target (haven/integration_test/b7_ios_auth_tier_test.dart)
# TWICE on the same booted simulator — once after
# `xcrun simctl privacy <udid> grant location-always`, once after
# `... grant location` — and requires the two runs to have OBSERVED different
# CoreLocation tiers. See tooling/e2e/ci/run-b7-ios-auth-tier.sh for the full
# rationale; the short version:
#
#   * On iOS, background location publishing does NOT require "Always". A
#     foreground-started CLLocationManager session with
#     `allowsBackgroundLocationUpdates = true` keeps delivering under
#     "When In Use", with the blue status-bar indicator. Haven's
#     `MapShell._onPaused()` relies on exactly that and never consults the
#     tier. "Always" buys only the receive-only SLC relaunch after iOS
#     terminates the app (`HavenSLCHandler` refuses to arm without it).
#   * So the tier changes what the UI may CLAIM, not whether publishing
#     continues. This lane asserts the honest per-tier copy AND continued
#     background publishing in BOTH tiers.
#   * The lane refuses to pass unless the two grants demonstrably landed on
#     DIFFERENT tiers — otherwise every per-tier branch would still pass while
#     the lane discriminated nothing.
#
# The `location-always` simctl service is PROBED at runtime, never assumed: the
# harness reads `xcrun simctl help privacy` and stops with an attributable
# misconfiguration (exit 2) if this runner's Xcode does not offer it.
#
# What this lane does NOT prove: real background delivery on hardware. The
# simulator does not suspend a backgrounded app and does not run CoreLocation
# for real, and it can fire neither SLC nor BGTaskScheduler. Those stay on the
# physical-device pre-release checklist.

name: E2E iOS Auth Tier

on:
  workflow_call:

jobs:
  e2e_ios_auth_tier:
    name: e2e_ios_auth_tier
    runs-on: macos-latest # Apple Silicon; arm64 simulator (no Linux Docker).
    # The job cap must clear the SUM of the step caps: below it, a run whose
    # every step is still inside its own cap can die here, and a job-cap death
    # skips every `if: always()` diagnostic (e2e-android.yml states the rule).
    # So: Build the runtime log scanner 10 + Boot iOS simulator 15 + the drive
    # step 95 (2 x 45m retry + slack, derived there) + the most the work no
    # step cap bounds has taken (the host-native relay build included; since
    # 2026-09-12 the diagnostics step also runs two `log show` passes over the
    # archive and the secret scan, and since 0c the seal + identifier scan in
    # the runner and at the scan step, unmeasured yet: re-measure), 6.35 min
    # over 33 runs of this job (ci.yml, 2026-08-04..09-10; 1.7 of it Setup
    # Flutter, run 33182048610) = 126.35 -> 130. At 125 that sum did not fit.
    # job-uncapped-minutes: 6.35 (33 runs, worst 33182048610)
    timeout-minutes: 130
    env:
      HAVEN_E2E_RELAY: ws://localhost:7777
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      # Poll path, stated per JOB rather than inherited (S1 /
      # CI_HARDENING_BACKLOG.md A7). This lane's subject is the PUBLISH side
      # under two authorization tiers; the live-sync receive engine is an
      # unrelated axis, and running it here would only add flake surface.
      HAVEN_LIVE_SYNC: "false"
      # The runtime log scanner is wired into this lane: run-ios-sim-scenario.sh
      # reads the flag and, after the drive, seals the run's needle manifest —
      # the host-knowable needles alone, since no recording proxy is in front
      # of this relay — and runs the transcript through
      # tooling/e2e/ci/scan-logs.sh before the retry classification can see it.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Simulator triple for Apple-Silicon runners (mirrors e2e-ios.yml).
          targets: aarch64-apple-ios-sim

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/e2e/local-relay
            tooling/logscan
          key: e2e-ios-auth-tier

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # simulator are resident. The runner seals and scans with it after the
      # drive; the scan step at the bottom runs it over the exports and the
      # upload-only logs. Capped so a cargo stall fails fast; the cap is a term
      # of the job cap's sum above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build + start the relay BEFORE booting the simulator, so the two
      # multi-GB build peaks never coincide with a resident simulator (the same
      # build-before-boot discipline e2e-ios.yml and e2e-android.yml use).
      - name: Build and start host-native relay
        run: bash tooling/e2e/ci/start-local-relay.sh 7777

      - name: Boot iOS simulator
        id: sim
        # macos-* runners have no GNU `timeout`, so GitHub's step cap is the
        # only available bound on a boot that never reaches Booted. Measured
        # boots are 136-215 s; 15 min is ~4x the observed max.
        timeout-minutes: 15
        run: bash tooling/e2e/ci/boot-ios-sim.sh "iPhone 15"

      # `nick-fields/retry` is the inner bound on macOS (no coreutils
      # `timeout`), and it retries on ANY non-zero exit — it has no `retry_on`
      # predicate. The NARROWING therefore lives inside the command: each of the
      # two per-tier runs is delegated to run-ios-sim-scenario.sh, whose retry
      # gate refuses a second attempt unless the previous one was classified as
      # the single admitted infrastructure signature (a post-build,
      # pre-first-test launch/attach stall). A genuine assertion failure — or a
      # failed discrimination gate — stops on attempt 1 with its own exit code.
      #
      # 45 min/attempt covers a COLD run: one full Xcode+pods+aarch64-Rust build
      # (~15 min, done ONCE by the harness) plus two incremental builds and two
      # ~8 min drives. The step cap (95) must exceed max_attempts x
      # timeout_minutes (2 x 45 = 90) plus slack, or the step reaper fires
      # mid-second-attempt and the retry buys nothing.
      #
      # The relay is restarted first so a retried attempt runs against a CLEAN
      # in-memory store (start-local-relay.sh stops any prior instance); the
      # binary is already compiled by the build-before-boot step above.
      # The needle directory the runner seals into, rotated before the drive
      # and owner-only: a manifest left by an earlier run on a reused runner
      # would be reused as this run's (the host profile treats a manifest at
      # its out path as its own), and what lands there is every identifier the
      # run declares, verbatim.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Run the iOS auth-tier lane (Always, then When In Use)
        timeout-minutes: 95
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          command: >-
            bash tooling/e2e/ci/start-local-relay.sh 7777 &&
            bash tooling/e2e/ci/run-b7-ios-auth-tier.sh
            ${{ steps.sim.outputs.udid }}

      # The unified-log archive is a full-device capture (binary tracev3,
      # multi-GB) that the scanner cannot read, so it never leaves the runner:
      # two `log show` exports replace it — Haven's own lines (the Rust
      # `frb_user` oslog subsystem and the Runner process), uncapped, and the
      # whole device under SIM_LOG_FULL_CAP_BYTES. `log show` emits in
      # chronological order and the archive opens at BOOT, so a head cap kept
      # the boot storm and nothing else: in CI run 35280144455 every lane's
      # capped export ended 15-20 minutes BEFORE its app launched, because
      # 64 MiB is ~2 minutes of a booting simulator. `tail -c` keeps the bytes
      # nearest the archive's END, which is the `log collect` above and so the
      # scenario itself; the residual — a partial first line, and the start of
      # a run that logs more than the cap after boot — is discarded with the
      # archive, evidence lost and nothing published. Every log the upload step names is scanned by the next
      # step, before that step can see it.
      - name: Collect simulator diagnostics
        if: always()
        env:
          SIM_LOG_FULL_CAP_BYTES: "67108864"
        run: |
          xcrun simctl spawn booted log collect --output /tmp/sim.logarchive 2>/dev/null || true
          log show --archive /tmp/sim.logarchive --style syslog --info --debug \
            --predicate 'subsystem == "frb_user" OR process == "Runner"' \
            > /tmp/sim-unified.log 2>/dev/null || true
          log show --archive /tmp/sim.logarchive --style syslog 2>/dev/null \
            | tail -c "${SIM_LOG_FULL_CAP_BYTES}" > /tmp/sim-unified-full.log || true
          rm -rf /tmp/sim.logarchive
          cp /tmp/haven-local-relay.log /tmp/relay.log 2>/dev/null || true

      # Scan-before-upload, as its OWN step: every `.log` the upload step names
      # goes through tooling/e2e/ci/scan-logs.sh here — the key-material floor
      # AND the identifier scanner, against the manifest the runner sealed —
      # on every outcome short of a cancellation, so a leak (rc 1) deletes the
      # scanned files and fails the lane even on an otherwise green run, and an
      # unscannable log (rc 3), a broken guard (rc 2) or an unmet floor (rc 4)
      # fails it and leaves them as they are. The standard guard condition
      # (not `always()`) is what lets docs/privacy/privacy_invariants.json
      # cite this step as the runtime scanner's enforcing run. Typed sinks: the
      # two `log show` exports are `ios`, the transcripts are `drive`, the
      # relay's own log is `relay`.
      - name: Scan captured logs for secrets before upload
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          rc=0
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest-dir /tmp/haven-soak/needles \
            --sink ios=/tmp/sim-unified.log,/tmp/sim-unified-full.log \
            --sink drive=/tmp/b7-ios-always.log,/tmp/b7-ios-wheninuse.log,/tmp/flutter-ios-test.log \
            --sink relay=/tmp/relay.log \
            --report /tmp/logscan-report-upload.ndjson || rc=$?
          exit "${rc}"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-ios-auth-tier-${{ github.run_id }}
          path: |
            /tmp/b7-ios-always.log
            /tmp/b7-ios-wheninuse.log
            /tmp/flutter-ios-test.log
            /tmp/relay.log
            /tmp/sim-unified.log
            /tmp/sim-unified-full.log
          retention-days: 14
          if-no-files-found: ignore

      # The sealed manifest holds the run's identifiers verbatim. It is never
      # uploaded (check_wire_proxy_test_only.sh) and does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      # Relay teardown. Runs LAST and `if: always()` so the relay process is
      # killed on every outcome. The script always exits 0, so teardown can
      # never turn a green run red.
      - name: Tear down host-native relay
        if: always()
        run: bash tooling/e2e/ci/stop-local-relay.sh
