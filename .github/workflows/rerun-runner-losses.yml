# Re-run the jobs a hosted-runner loss killed — and nothing else.
#
# This file is the trigger and nothing more. Every decision — which signature is
# admitted, that each failed job is judged on its own, that an unreadable log is
# never re-run, that only a first attempt is ever considered — lives in
# scripts/ci/rerun_runner_losses.sh, whose `--self-test` runs in repo-guards.yml
# and whose fixtures are the proof. A gate restated here would be a gate that
# can disagree with itself, so nothing here restates one; not even the signature
# string, which the script writes into the run summary itself.
#
# Scope is the CI orchestrator and Soak Nightly, each a decision someone took,
# never a default that crept in. Soak Nightly was owner decision OD-C1: a slot
# the runner lost is re-run (a lost `prepare` re-runs the whole run, with the
# same seeds, because they come from the run's created_at), and a slot the rig
# itself failed never is. The classifier needed no change for it — it reads the
# runner's line, never a job name — and the script's header records what a
# re-run drags along (`file-issue` is the first dependent job in this repo).
# `workflow_run` fires for a scheduled run like any other: it keys on the run
# completing, not on how it started. Widening further is a one-line addition
# below, and should be taken the same way.

name: Re-run Runner Losses

on:
  workflow_run:
    workflows: [CI, "Soak Nightly"]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: Re-run runner losses
    # Pure cost control, NOT a safety gate: for a run with no failed jobs the
    # script is already a no-op, because it re-derives every candidate itself.
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The scope the re-run endpoint requires; write subsumes the read used to
      # list the run's jobs and download their logs.
      actions: write
      # For actions/checkout, and for nothing else.
      contents: read
    steps:
      # No `ref:` on purpose. A workflow_run job carries a write token even when
      # the run that triggered it did not, so it must execute the DEFAULT
      # branch's script and never a version proposed by that run. For this event
      # GITHUB_SHA is "last commit on default branch", so omitting `ref` is what
      # makes that true.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify failed jobs and re-run only runner losses
        env:
          GH_TOKEN: ${{ github.token }}
          HAVEN_RERUN_RUN_ID: ${{ github.event.workflow_run.id }}
          HAVEN_RERUN_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash scripts/ci/rerun_runner_losses.sh
