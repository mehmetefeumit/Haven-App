# Reusable workflow: Android relay-CUSTOMIZATION E2E lane.
#
# Drives the relay-customization integration tests under
# haven/integration_test/ against TWO hermetic strfry relays:
#
#   integration_test/relay_customization_publish_test.dart   (service-FFI wire proofs)
#   integration_test/relay_customization_trigger_test.dart   (provider bug-catcher)
#   integration_test/relay_resync_convergence_test.dart      (MIP-01 relay-update convergence)
#   integration_test/relay_two_plane_privacy_test.dart       (two-plane no-leak proof)
#
# # Why TWO relays
#
# These tests prove that when a user CUSTOMIZES their relay set, Haven
# actually honors the customization — events land on the chosen
# (custom) relay and not (only) on the default. A single relay can't
# prove that: with one relay, "published to the custom relay" and
# "published to the default relay" are indistinguishable. So a CUSTOM
# relay must be DISTINCT from the default. This lane therefore runs a
# SECOND relay (R2) standing in for the custom relay, distinct from R1
# (the default). The targets read two dart-defines:
#
#   HAVEN_E2E_RELAY    R1 = ws://10.0.2.2:7777  (default relay)
#   HAVEN_E2E_RELAY_2  R2 = ws://10.0.2.2:7778  (custom relay)
#
# BOTH are baked at BUILD time — `flutter drive` does NOT re-pass
# dart-defines, so the values are compiled into each APK by the
# pre-emulator build step below.
#
# # Distinct container / port / data-dir so R2 can't kill R1
#
# start-strfry.sh `docker rm -f`s its own container name on start and
# `rm -rf`s its own DATA_DIR. If R2 reused R1's name/port/dir, starting
# R2 would KILL R1 and wipe its LMDB env. R2 therefore uses a fully
# distinct identity: container `strfry2`, port `7778`, data dir
# `/tmp/strfry2-data` (R1 keeps the script defaults: `strfry`/`7777`/
# `/tmp/strfry-data`). run-relay-customization.sh resets BOTH relays
# per target for isolation.
#
# # Build-before-boot is MANDATORY (the OOM rule)
#
# `flutter build apk` peaks at several GB (Rust-NDK + Gradle). Building
# WHILE the emulator + two strfry containers are resident is the
# historical cause of the silently-lost runner (see
# docs/E2E_TROUBLESHOOTING.md). All three target APKs are therefore built
# in a dedicated step BEFORE the emulator boots and staged under
# /tmp/relay-custom-apks/; the on-emulator step then only installs +
# grants + drives, one target at a time, via run-relay-customization.sh.
#
# # Zero-risk separate workflow_call
#
# The e2e_android and e2e_integration jobs are intentionally left
# untouched: this is a SEPARATE workflow_call workflow so the proven
# functional + integration gates carry zero risk from this addition.

name: E2E Relay Customization

on:
  workflow_call:

jobs:
  e2e_relay_customization:
    name: e2e_relay_customization
    runs-on: ubuntu-latest
    # Four targets, each: reset BOTH relays + install + grant + drive. The job
    # cap must clear the SUM of the step caps: below it, a run whose every step
    # is still inside its own cap can die here, and a job-cap death skips every
    # `if: failure()` step (e2e-android.yml states the rule). So: Build the
    # runtime log scanner 10 + Build relay-customization test APKs 40 + Create
    # AVD snapshot (on an AVD-cache miss) 15 + the drive step 35 (derived
    # there) + the most the work no step cap bounds has taken, 4.4 min over all
    # 259 runs of this job (ci.yml and e2e-nightly.yml, 2026-06-09..09-11; 2.8
    # of it Free disk space, run 28105109440), taken as 5 = 105.
    # job-uncapped-minutes: 4.4 (259 runs, worst 28105109440)
    timeout-minutes: 105
    env:
      HAVEN_E2E_RELAY: ws://10.0.2.2:7777
      HAVEN_E2E_RELAY_2: ws://10.0.2.2:7778
      # Receive path, DECLARED — not inherited. `liveSyncEnabled` is
      # `bool.fromEnvironment('HAVEN_LIVE_SYNC', defaultValue: true)`, so an
      # omitted define compiles the engine ON regardless of what the lane name
      # implies (CI_HARDENING_BACKLOG.md A7). The relay-customization proofs are
      # about WHICH relay an event lands on, not which receive path reads it, so
      # this lane runs the production configuration — engine ON, the value it
      # has been running since the Phase-B flip. Baked into every target APK by
      # the build step below (`flutter drive` never re-passes dart-defines).
      HAVEN_LIVE_SYNC: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      # The runtime log scanner (tooling/logscan) is wired into this lane. The
      # runner reads the flag: it seals the run's needle manifest and runs every
      # captured log through tooling/e2e/ci/scan-logs.sh before echoing or
      # keeping any of it. No recording proxy runs here, so the needles are the
      # host-known constants of tooling/e2e/ci/host-needles.sh (the `host`
      # profile): the fixed role seeds, the role and canary coordinates and the
      # canary name stems.
      HAVEN_LOGSCAN: "true"
      HAVEN_LOGSCAN_PROFILE: host

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      # Reclaim runner disk BEFORE the Gradle/Rust build — the multi-GB
      # debug build + NDK strip has run a default runner out of space.
      # Runs after checkout because the script lives in the repo.
      - name: Free disk space
        run: bash tooling/e2e/ci/free-disk-space.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/logscan
          # Distinct cache key from the e2e_android and e2e_integration
          # jobs so the three jobs don't race on the same cache entry;
          # all build the same x86_64-linux-android target so the
          # savings are equivalent.
          key: e2e-relay-customization-x64

      # The runtime log scanner, release-built ONCE, before Flutter and the
      # emulator are resident (same reasoning as the APK build below). Capped
      # so a cargo stall fails fast; the cap is a term of the job cap's sum
      # above.
      - name: Build the runtime log scanner
        timeout-minutes: 10
        run: cargo build --release --manifest-path tooling/logscan/Cargo.toml

      # The needle directory is rotated BEFORE any drive: a manifest left by an
      # earlier run on a reused runner would be reused as this run's (the
      # host-profile gate reuses the manifest already at its out path).
      # Owner-only, because what lands there is every identifier the run
      # declares, verbatim.
      - name: Rotate the needle directory
        run: |
          mkdir -m 0700 -p /tmp/haven-soak/needles
          rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build all three target APKs BEFORE the emulator boots, for the same
      # reason every other E2E lane builds up front: the Rust-NDK +
      # Gradle peak must not coincide with a resident emulator + two
      # strfry containers (the historical lost-runner cause; see
      # docs/E2E_TROUBLESHOOTING.md). Each target is a separate
      # --target build (the Rust .so is cached after the first, so the
      # second build is mostly Dart/Gradle). Staged under
      # /tmp/relay-custom-apks/<basename>.apk; run-relay-customization.sh
      # copies each into place before driving.
      #
      # Both relay --dart-define values are baked here and MUST match the
      # relay URLs the emulator step uses (the values are compiled into
      # the APK; the drive step does not re-pass them). HAVEN_LIVE_SYNC rides
      # the same build for the same reason — it too is compile-time only, so
      # omitting it here is not "unset", it is "whatever the Dart default
      # happens to be" (A7). Unlike the
      # single-relay lanes, this lane bakes HAVEN_E2E_RELAY_2 too, so it
      # builds inline rather than via build-integration-apks.sh (which
      # only knows about the single default relay).
      - name: Build relay-customization test APKs
        working-directory: haven
        # Bounds a hung/stalled build so it fails fast rather than
        # burning toward the job timeout — symmetric with the build
        # bounds in the other E2E lanes.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p /tmp/relay-custom-apks
          for target in \
            integration_test/relay_customization_publish_test.dart \
            integration_test/relay_customization_trigger_test.dart \
            integration_test/relay_resync_convergence_test.dart \
            integration_test/relay_two_plane_privacy_test.dart
          do
            base="$(basename "${target}" .dart)"
            echo "Building ${target} -> /tmp/relay-custom-apks/${base}.apk"
            # --target-platform android-x64: the AVD is x86_64, so x64 is the
            # ONLY ABI the emulator can run. This MUST match every other E2E
            # lane (build-integration-apks.sh, run-single-avd-scenario.sh,
            # e2e-android.yml). Omitting it makes cargokit auto-add the arm/
            # arm64 Rust targets and build the heavy debug crypto lib for all
            # three ABIs — ~3x the native footprint, here multiplied across four
            # APKs — which exhausts runner disk before the emulator can install
            # its ~1.5 GB system image (observed: "No space left on device" ->
            # emulator never boots -> adb 5554 connection refused). It does NOT
            # change what is tested: the suite runs identically on the x64 AVD.
            flutter build apk \
              --debug \
              --target-platform android-x64 \
              --target="${target}" \
              --dart-define=HAVEN_E2E_RELAY="${HAVEN_E2E_RELAY}" \
              --dart-define=HAVEN_E2E_RELAY_2="${HAVEN_E2E_RELAY_2}" \
              --dart-define=HAVEN_LIVE_SYNC="${HAVEN_LIVE_SYNC}"
            cp build/app/outputs/flutter-apk/app-debug.apk \
              "/tmp/relay-custom-apks/${base}.apk"
            ls -lh "/tmp/relay-custom-apks/${base}.apk"
          done

          # The four APKs are now staged under /tmp; the emulator step installs
          # from there and never reads haven/build or the Gradle caches. Reclaim
          # them so the emulator's system-image install keeps comfortable
          # headroom regardless of future APK growth (defense-in-depth on top of
          # the x64-only constraint above). Best-effort; df printed as evidence.
          echo "=== Disk before post-build reclaim ==="; df -h /
          rm -rf build || true
          rm -rf "${HOME}/.gradle/caches" "${HOME}/.gradle/daemon" || true
          echo "=== Disk after post-build reclaim ==="; df -h /

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Shared with e2e-android.yml / e2e-integration.yml on
          # purpose: the AVD snapshot is byte-identical (same
          # api/arch/target/profile), so this lane restores the snapshot
          # those jobs created instead of rebuilding it. Cache writes
          # are first-writer-wins; a concurrent miss just means one save
          # is a no-op.
          key: avd-api34-x86_64-google_apis-single-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        # This step's entire job is booting an emulator, and until 2026-08-03 it
        # had no bound of any kind — a wedged boot here ran to the JOB cap,
        # which SIGKILLs the runner before any if: failure() step, so the lane
        # died slow and with no artifacts. Measured across 23 successful runs
        # (ci.yml, 2026-07/08) the snapshot takes 91-130 s; 15 min is ~7x the
        # observed max, so it can only ever fire on a genuine wedge. The
        # emulator-boot-timeout below is the action's own inner bound (7 min,
        # matching the drive steps) and fires first with the action's message.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Bound the boot itself (the only thing this step does) so a wedged
          # emulator fails inside the step rather than at the step cap above.
          emulator-boot-timeout: 420
          script: echo "Generated AVD snapshot for caching."

      # Start BOTH relays BEFORE the emulator boots. Starting them here
      # first surfaces an image-pull/startup failure as a clean step
      # failure before the emulator boots.
      # run-relay-customization.sh resets BOTH relays PER TARGET, so
      # these initial starts are just an early health gate.
      - name: Start strfry relay (R1)
        env:
          # Same immutable digest pin as e2e-android.yml; the
          # STRFRY_IMAGE repo variable wins when set.
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        run: bash tooling/e2e/ci/start-strfry.sh

      # The second (custom) relay. Distinct container/port/data-dir so
      # this start can't `docker rm -f` R1 or `rm -rf` R1's data dir.
      - name: Start strfry relay (R2)
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
          STRFRY_CONTAINER: strfry2
          STRFRY_PORT: "7778"
          STRFRY_DATA_DIR: /tmp/strfry2-data
        run: bash tooling/e2e/ci/start-strfry.sh

      # Install + grant + drive each target, ONE at a time, with BOTH
      # relays freshly wiped per target. The APKs were built in the
      # pre-emulator step, so no Gradle runs here and the emulator is
      # the dominant memory consumer.
      #
      # STRFRY_IMAGE is forwarded so the per-target relay resets inside
      # run-relay-customization.sh pull the same pinned image (for both
      # R1 and R2).
      #
      # BOUNDS. Three of them, innermost first:
      #   10m  per-target `flutter drive` (HAVEN_DRIVE_TIMEOUT, set in
      #        run-relay-customization.sh) — names the target that hung.
      #   25m  this step's inner deadline (run-with-deadline.sh below) — the
      #        AGGREGATE bound across all four targets, and the one that
      #        actually reaps.
      #   35m  this step's timeout-minutes = 25 + 1 (kill grace) + 7
      #        (emulator-boot-timeout) + 2 (the action's own setup and
      #        teardown, outside both: 45 s on run 34488512808), a belt over
      #        the deadline.
      # Sizing evidence: 34 successful runs (ci.yml, 2026-07/08) put the whole
      # step at p50 5.8 / p95 6.5 min. The MAX was 25.8 min — a green run in
      # which one target wedged on cold attach, burned the then-20m per-drive
      # default, and passed on the designed retry. That single number is why
      # the per-drive bound moved to 10m in run-relay-customization.sh: at 20m
      # the lane's own retry could not complete inside any deadline that also
      # sits under the step cap. With 10m the same shape costs ~16 min, plus
      # the Phase-2 install barrier's wait on each of its five installs (2.8 s
      # and 13.6 s observed in this harness, 34 s the longest recorded), so
      # ~19 min at that longest wait, which fits under 25 comfortably. It is
      # not a worst case: one invocation's own is 1750 s = 29m10s
      # (run-single-avd-scenario.sh's sum at this lane's 10m drive and the
      # default 300 s watchdog), already over this deadline, which reaps by
      # design.
      - name: Run relay-customization tests on the emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRFRY_IMAGE: ${{ vars.STRFRY_IMAGE || 'dockurr/strfry@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Bound the boot (which happens BEFORE `script:` runs, and is
          # therefore outside the deadline below).
          emulator-boot-timeout: 420
          # Single bash invocation — the action runs each line of a
          # multi-line script: in its own sh -c, which would drop the
          # loop's shell state. All real logic is in the checked-in
          # script.
          script: bash tooling/e2e/ci/run-with-deadline.sh 25m "e2e-relay-customization drive (4 targets)" -- bash tooling/e2e/ci/run-relay-customization.sh integration_test/relay_customization_publish_test.dart=/tmp/relay-custom-apks/relay_customization_publish_test.apk integration_test/relay_customization_trigger_test.dart=/tmp/relay-custom-apks/relay_customization_trigger_test.apk integration_test/relay_resync_convergence_test.dart=/tmp/relay-custom-apks/relay_resync_convergence_test.apk integration_test/relay_two_plane_privacy_test.dart=/tmp/relay-custom-apks/relay_two_plane_privacy_test.apk

      # Collect logs from BOTH relays so triage can confirm which relay
      # an event did (or didn't) land on — the whole point of the lane.
      - name: Collect strfry logs
        if: always()
        run: |
          docker logs strfry > /tmp/strfry.log 2>&1 || true
          docker logs strfry2 > /tmp/strfry2.log 2>&1 || true

      # `if: always()` and `.log`, not `.txt`: the scan step below runs on every
      # outcome short of a cancellation and refuses an absent file, and the
      # scanner's directory walk only ever picks up `*.log` — a `.txt` here
      # would be the one uploaded path the guard cannot see.
      - name: Capture host + emulator diagnostics
        if: always()
        run: |
          {
            echo "=== df -h ==="
            df -h || true
            echo
            echo "=== free -h ==="
            free -h || true
            echo
            echo "=== adb devices -l ==="
            adb devices -l || true
            echo
            echo "=== adb shell dumpsys meminfo com.oblivioustech.haven ==="
            adb shell dumpsys meminfo com.oblivioustech.haven || true
            echo
            echo "=== top (1 sample) ==="
            top -bn1 | head -40 || true
          } > /tmp/diag.log 2>&1

      # Where each uploaded log is scanned, and by what. The per-target logcat
      # and drive logs go through the runner's log-privacy gate (HAVEN_LOGSCAN
      # above): tooling/e2e/ci/scan-logs.sh — the key-material floor AND the
      # identifier scanner, against the manifest sealed from the host needles —
      # deleting them on a leak, before any drive log is echoed. What is left
      # is scanned HERE, against the SAME manifest, by the same wrapper: the
      # relay log(s) (structural rules off — a relay legitimately holds pubkeys
      # and event ids) and the host diagnostics as a `diag` sink (a one-line
      # floor, no plant requirement). Scan-before-upload, as its OWN step on
      # every outcome short of a cancellation: a leak (rc 1) deletes every
      # scanned file and fails the lane even on an otherwise green run, so the
      # upload finds nothing to publish; an unscannable log (rc 3), a broken
      # guard (rc 2) or an unmet floor (rc 4) fails it and leaves the files as
      # they are. The standard guard condition (not `always()`) is what lets
      # docs/privacy/privacy_invariants.json cite this step as the runtime
      # scanner's enforcing run.
      # /tmp/relay-custom-logs/ was gated by run-relay-customization.sh (typed
      # by name, against the same manifest).
      - name: Scan captured logs for secrets before upload
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          rc=0
          bash tooling/e2e/ci/scan-logs.sh \
            --manifest /tmp/haven-soak/needles/*.needles.json \
            --sink relay=/tmp/strfry.log,/tmp/strfry2.log \
            --sink diag=/tmp/diag.log \
            --report /tmp/logscan-report-upload.ndjson || rc=$?
          exit "${rc}"

      # Upload per-target logs (run-relay-customization.sh copies each
      # target's logcat + drive log under /tmp/relay-custom-logs/ so one
      # target can't clobber another's evidence) plus BOTH relay logs
      # and the shared diagnostics. if: always() so a green run still
      # surfaces skips.
      - name: Upload relay-customization artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-relay-customization-${{ github.run_id }}
          path: |
            /tmp/relay-custom-logs/
            /tmp/strfry.log
            /tmp/strfry2.log
            /tmp/diag.log
          retention-days: 14
          if-no-files-found: ignore

      # The sealed manifest holds the run's identifiers verbatim. It is never
      # uploaded (check_wire_proxy_test_only.sh) and does not outlive the job
      # either: removed on EVERY outcome, after every upload step, so a reused
      # runner never starts the next run holding the last run's needles.
      - name: Discard needle manifests
        if: always()
        run: rm -f /tmp/haven-soak/needles/*.needles.decl /tmp/haven-soak/needles/*.needles.json /tmp/haven-soak/needles/*.canaries.json

      # Relay teardown — runs LAST and if: always() so BOTH strfry
      # containers + their host data dirs are removed on every outcome,
      # after the log-collection step has read the containers. Each
      # teardown is best-effort (stop-strfry.sh always exits 0), so
      # teardown can't turn a green run red. R2 uses its distinct
      # container/data-dir so its teardown targets the right container.
      - name: Tear down strfry relays
        if: always()
        run: |
          bash tooling/e2e/ci/stop-strfry.sh
          STRFRY_CONTAINER=strfry2 STRFRY_DATA_DIR=/tmp/strfry2-data \
            bash tooling/e2e/ci/stop-strfry.sh
