# Reusable workflow: iOS-simulator E2E functional gate (Tier 1).
#
# Runs the SAME consolidated multi-user flow as e2e-android.yml
# (haven/integration_test/e2e/e2e_combined.dart) on a booted iOS simulator:
# a real iOS-"Alice" UI drives the production Flutter app while Bob/Carol/Dave
# participate as in-process `SyntheticUser` FFI peers. All actors coordinate
# through a host-native Nostr relay, reached via the RECORDING WIRE PROXY on
# ws://localhost:7788 (see "Wire recording" below).
#
# # Why macos-latest (Apple Silicon / arm64) works
#
# The QR-scanner plugin `mobile_scanner` is on 7.x, which migrated iOS/macOS
# from Google MLKit to Apple's Vision framework. Unlike MLKit (which shipped no
# arm64-simulator slice and forced `EXCLUDED_ARCHS[...]=arm64`, breaking the
# build on Apple-Silicon simulators), the Vision-based 7.x podspec excludes
# only the dead `i386` arch, so the app builds and runs on the arm64 simulator
# that macos-latest provides — the faster, longer-lived runner.
#
# # Why a host-native relay (not the strfry container)
#
# macOS GitHub runners have NO Linux Docker daemon, so the Android lane's
# `dockurr/strfry` container cannot run here. tooling/e2e/local-relay is a tiny
# standalone Rust binary built from the same nostr 0.44.x wire stack the app
# uses, reachable by the simulator at localhost (the simulator shares the host
# network namespace — no `10.0.2.2` alias).
#
# # What this lane covers — and what it does NOT
#
# It catches iOS-specific regressions in FFI/Rust dylib loading, SQLCipher +
# Keychain init, relay/WebSocket interop, and the MLS encrypt-publish-fetch-
# decrypt pipeline rendered into the UI — i.e. the FOREGROUND send/receive
# path the production iPhone bug lived in. It does NOT reproduce real-device
# background SUSPENSION: the simulator keeps the app alive and the
# integration_test VM-service stays attached, so a "background execution
# stops" bug will not surface here. That class needs a real device, which is
# out of scope for GitHub-hosted runners (see docs/E2E_TROUBLESHOOTING.md).
#
# # Wire recording (docs/WIRE_JOURNAL.md, backlog Workstream C)
#
# The relay keeps port 7777. The recording proxy listens on 7788, forwards
# there, and writes an NDJSON journal of every WebSocket message in both
# directions; the app and the harness are pointed at 7788 instead. Post-drive,
# `check-wire-journal.sh` reads that journal on the HOST and asserts the
# closed-world kind/tag/REQ-filter allow-list in tooling/e2e/wire_allowlist.json
# over the sample the drive's sentinel anchors.
#
# This is the FIRST lane to feed those oracles real traffic — until now all
# three were green solely from their own hermetic `--self-test` fixtures, the
# exact "written, reviewed, self-tested, executes nowhere" shape
# docs/CI_HARDENING_BACKLOG.md catalogues. `scripts/ci/
# check_wire_oracle_lane_reachable.sh` pins the chain from repo-guards.yml.
#
# Two iOS-specific notes, because the Android lane's reasoning does NOT carry
# over:
#
#   * This lane's relay is tooling/e2e/local-relay, NOT strfry, and it does not
#     implement NIP-40 — it retains everything for the process lifetime. The
#     "expired events are evicted before the assertion runs" argument that
#     motivates a wire transcript on the strfry lanes is simply FALSE here. The
#     reason to record on THIS lane is different and narrower: the journal is
#     the only place the iOS send path is observed as bytes rather than as the
#     app's own belief about what it sent.
#   * macos-latest has no iptables, so the C7 egress guard
#     (tooling/e2e/ci/setup-network-guard.sh) is deliberately NOT wired here.
#     The recorder is a send-side instrument only; it does not bound egress.
#
# All test-only Rust hooks are `#[cfg(debug_assertions)]` and `flutter test`
# builds debug, so the release pipeline is unaffected.

name: E2E iOS

on:
  workflow_call:
    inputs:
      live_sync:
        description: >-
          Set HAVEN_LIVE_SYNC on the e2e_combined step ONLY (S1: never on the
          shared ios_bg_mirror step, which must not start the engine). true
          exercises the live-sync engine path.
        type: boolean
        default: false
        required: false

jobs:
  e2e_ios:
    name: e2e_ios
    runs-on: macos-latest # Apple Silicon; arm64 simulator (no Linux Docker).
    # Envelope sized for a COLD first run. Poll path: setup (~10-15m) + the
    # e2e_combined step's 65m ceiling (2 × 30m) + the background-mirror step's
    # 45m ceiling — a loose backstop below that naive sum (the two steps rarely
    # both hit their ceilings). FLAG-ON widens the e2e_combined step to 95m
    # (2 × 45m, see below), so the flag-on envelope grows to 155 to cover the
    # PASSING serial case setup (~15) + e2e_combined (95) + the mirror (45)
    # — the mirror step is skipped when e2e_combined FAILS (no `if:`; default
    # step-on-failure semantics), so the failing path self-truncates well below
    # this. A flag-on run that burned its full drive budget must fail through
    # the step timeout with its diagnostics, never a blind outer-envelope
    # SIGKILL. Cached/typical runs finish in a fraction of this (macos-latest
    # allows up to 6h).
    #
    # The wire recorder adds a step with its OWN 20m ceiling (release cargo
    # build of the proxy + on-runner preflight), so the flag-on envelope is
    # resized to keep the rule above true rather than nudged by the recorder's
    # typical cost. Flag-on ceilings now sum to 15 (relay build) + 15 (boot) +
    # 20 (proxy) + 95 (e2e_combined) + 45 (mirror) = 190, so the envelope is
    # 195. Two earlier revisions got this wrong in the same direction: one
    # moved it 155->160 while inserting a 20m step, and one omitted the relay
    # build from the sum ENTIRELY because that step carried no ceiling at all.
    # Both left the admitted worst case ABOVE the envelope — the exact
    # blind-SIGKILL failure the paragraph above exists to prevent. Every step
    # in the sum is now bounded, which is what makes the sum checkable.
    #
    # The per-attempt restart inside the retry command is NOT in this sum: it
    # reuses the same warm target dir, so it is a cargo fingerprint check plus
    # the binary's own loopback preflight, and the setup term absorbs it.
    timeout-minutes: ${{ inputs.live_sync && 195 || 130 }}
    env:
      # 7788 is the RECORDING PROXY, not the relay. The relay stays on 7777 and
      # the proxy forwards to it, so this one line is what puts every byte the
      # app and the harness send through the journal. Point it back at 7777 and
      # the recorder sees nothing, the journal is empty-but-valid, and the
      # oracle below reports CLEAN over an empty sample — which is why
      # scripts/ci/check_wire_oracle_lane_reachable.sh cross-checks this port
      # against the proxy's own start invocation.
      HAVEN_E2E_RELAY: ws://localhost:7788
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Simulator triple for Apple-Silicon runners — NOT the device
          # `aarch64-apple-ios` that build-check.yml installs. cargokit builds
          # the haven-core dylib for this target for the `flutter test` device
          # build. (`nc`, used by start-local-relay.sh, is preinstalled.)
          targets: aarch64-apple-ios-sim

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            haven-core
            tooling/e2e/local-relay
          key: e2e-ios-sim

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: haven
        run: flutter pub get

      # Build + start the relay BEFORE booting the simulator so the two
      # multi-GB build peaks (relay/cargo, then the Flutter+Rust app build)
      # never coincide with a resident simulator — the same build-before-boot
      # discipline e2e-android.yml uses for the AVD.
      - name: Build and start host-native relay
        # BOUNDED, and counted in the envelope below. This is a release cargo
        # build, and it sat unbounded while the job envelope's arithmetic
        # omitted it entirely — so a cold run could reach the outer envelope
        # through a step nobody had budgeted, which is the blind-SIGKILL
        # outcome that arithmetic exists to prevent.
        timeout-minutes: 15
        run: bash tooling/e2e/ci/start-local-relay.sh 7777

      # Same build-before-boot discipline as the relay above: the proxy is
      # another release cargo build out of tooling/e2e/local-relay (already in
      # this job's rust-cache workspace list), and it runs its OWN --self-test
      # on this runner before it starts serving. Doing that here, once, keeps
      # the build peak and the ~seconds-long preflight away from a resident
      # simulator and makes the per-attempt restart below almost free.
      #
      # This start is NOT the one that matters for evidence — see the retry
      # command in the e2e_combined step, which restarts it per attempt.
      #
      # The upstream is bound to a shell variable ON THE START LINE and exported
      # from there, rather than written as a job-level `env:`. C5's `--pool`
      # arguments below need that URL, and
      # scripts/ci/check_wire_oracle_lane_reachable.sh reads every OTHER literal
      # relay URL in this job as an app-facing endpoint that must name the
      # PROXY's listen port — which a second copy of the upstream would fail,
      # correctly, since an app pointed at the relay port bypasses the recorder
      # entirely. Keeping the one literal where it is recognisable as an
      # upstream (the start invocation) is what makes that check meaningful.
      # The per-attempt restart inside the retry command passes the same
      # upstream, so this string stays true for the journal the oracles read.
      - name: Build and start recording wire proxy
        timeout-minutes: 20
        run: |
          set -euo pipefail
          upstream=ws://127.0.0.1:7777; bash tooling/e2e/ci/start-wire-proxy.sh 7788 "${upstream}"
          echo "WIRE_UPSTREAM=${upstream}" >> "${GITHUB_ENV}"

      # ONE token, minted ONCE, read by BOTH halves — the drive (as a
      # --dart-define, forwarded by run-ios-sim-scenario.sh) and the host oracle
      # (as --sentinel). Minting it in two places would yield two different
      # random strings and the resulting "no anchor" META-FLOOR would read as a
      # flake instead of as the wiring bug it is, which is precisely why
      # check_wire_oracle_lane_reachable.sh compares the two halves statically.
      #
      # It is not secret (docs/WIRE_JOURNAL.md: it is written to the journal
      # verbatim and echoed in the proxy's ack), but it MUST be unique per job:
      # the oracle anchors on the highest wire_seq carrying this exact token, so
      # a fixed token plus a stale journal on a reused runner would anchor the
      # read at a boundary from someone else's run.
      - name: Mint the wire-journal sentinel
        run: |
          token="HAVEN_WIRE_SENTINEL:$(openssl rand -hex 16)"
          printf 'HAVEN_WIRE_SENTINEL=%s\n' "${token}" >> "${GITHUB_ENV}"

      - name: Boot iOS simulator
        id: sim
        # The macos-* runners have no GNU coreutils `timeout`, so this step's
        # only available bound is GitHub's — and it had none, meaning a sim
        # that never reaches Booted ran to the JOB cap and skipped every
        # if: always() diagnostic. Measured across 32 successful runs (ci.yml,
        # 2026-07/08) the boot takes 136-215 s; 15 min is ~4x the observed max.
        timeout-minutes: 15
        run: bash tooling/e2e/ci/boot-ios-sim.sh "iPhone 15"

      # `nick-fields/retry` absorbs the well-documented iOS-simulator
      # launch/attach flake (which presents as a HANG, not a fast fail).
      #
      # The action itself retries on ANY non-zero exit — it has no `retry_on`
      # predicate — so the NARROWING lives in the command it re-runs.
      # run-ios-sim-scenario.sh classifies each failed attempt and leaves a
      # verdict; attempt 2 refuses to run unless that verdict is the one
      # admitted infrastructure signature (post-build, pre-first-test stall),
      # and fails immediately with the original exit code otherwise. It fails
      # CLOSED: an attempt that dies without classifying is not retried. That is
      # what stops a real, reproducible red from going green on the second roll
      # — measured over 156 attempts, 19 genuine test failures were retried here
      # and every one of them could have. See tooling/e2e/ci/ios-flake-lib.sh
      # (hermetic --self-test wired into repo-guards.yml).
      #
      # The same script also runs a first-test watchdog, so a stall is killed
      # and attributed ~5 min after the build instead of consuming the whole
      # per-attempt budget as an anonymous "Timeout of 1800000ms hit". The
      # timeouts below are unchanged and remain the backstop — they still have
      # to cover the HEALTHY worst case, which the watchdog does not shorten.
      #
      # The per-attempt timeout covers a COLD iOS build (Xcode + pod install +
      # aarch64 Rust, ~15 min) PLUS the inner test. On the POLL path the inner
      # test self-bounds at ~12 min, so 30 min/attempt is ample. FLAG-ON
      # (live_sync=true) runs the 10 live-sync scenarios instead — a ~25 min
      # inner suite (measured run 29262791698 attempt 2: full 12-test suite in
      # ~25.3 min). Cold build measured ~14 min (Xcode ~9.7 min + pods + aarch64
      # Rust), so a cold attempt is ~39 min — 30 min DID time out attempt 1 on
      # the cold build alone. The flag-on per-attempt is therefore widened to
      # 45 min (~39 min measured + slack; 40 would leave only ~1 min). The step
      # `timeout-minutes` MUST exceed max_attempts × timeout_minutes (flag-on:
      # 2 × 45 = 90) + slack, otherwise the outer step timeout fires mid-second
      # attempt and the retry buys nothing → flag-on step is 95 (poll keeps 65
      # over its 2 × 30 = 60). Each attempt restarts the relay first
      # (start-local-relay.sh stops any prior instance) so a retried attempt runs
      # against a CLEAN in-memory store — no leftover events from a failed prior
      # attempt (e.g. backdated NIP-59 gift-wraps) can leak across attempts. The
      # relay binary was already compiled in the build-before-boot step, so this
      # restart is fast.
      #
      # THE RECORDER RESTARTS WITH IT, IN THE SAME PLACE AND FOR THE SAME
      # REASON, and getting this wrong permanently reds a working lane:
      #
      #   * `wire_seq` is per-PROCESS and starts at 0, and the journal is opened
      #     in APPEND mode (a torn write must never truncate prior evidence). A
      #     second proxy process appending to attempt 1's file therefore
      #     restarts the counter — the journal comes out duplicated and
      #     non-monotonic, and check-wire-journal.sh's usability gate correctly
      #     returns UNUSABLE (rc 3) for every run thereafter. start-wire-proxy.sh
      #     closes this by ROTATING (`rm -f`) the journal on each start, which
      #     only happens if the start is inside this retry command.
      #   * Even a proxy left running across both attempts (one process, so no
      #     seq break) would be wrong here: the relay's store IS reset per
      #     attempt, so one journal would splice attempt 2's traffic onto the
      #     traffic of an attempt that failed against a different store. The
      #     oracle anchors on attempt 2's sentinel and would silently take the
      #     dead attempt's frames into its snapshot — the likeliest source of a
      #     finding no one can reproduce.
      #
      # So: the journal ROTATES PER ATTEMPT, in lockstep with the relay's clean
      # store. The proxy build is already cached from the build-before-boot step
      # above, so this restart costs a fingerprint check plus the proxy's own
      # few-second preflight.
      - name: Run e2e_combined on the simulator
        timeout-minutes: ${{ inputs.live_sync && 95 || 65 }}
        # S1: live-sync scoped to THIS step via the env the shared
        # run-ios-sim-scenario.sh reads — so it NEVER reaches the ios_bg_mirror
        # step below (which must not start the engine). That step now sets
        # HAVEN_LIVE_SYNC: "false" on itself rather than leaning on a built-in
        # script default: the script REQUIRES the env, so "poll-path safe" is a
        # stated per-step choice instead of a property of a default that a
        # future edit could change without either step noticing (A7).
        env:
          HAVEN_LIVE_SYNC: ${{ inputs.live_sync }}
          # Single-engine for the driver (see main.dart): e2e_combined does not
          # exercise the foreground service, so skip its init to avoid a second
          # Flutter engine colliding with `flutter drive`. NOT set on the
          # background-mirror step below, which tests the background system.
          HAVEN_E2E_NO_BACKGROUND: "true"
          # The drive half of the sentinel. Redundant on paper — the mint step
          # wrote it to $GITHUB_ENV, so every later step already inherits it —
          # and deliberately kept, for the same reason HAVEN_LIVE_SYNC is
          # spelled out above: it makes "the drive is handed the token" a
          # statement of THIS step rather than a property of a job-wide env a
          # future edit could rename without either half noticing. The define
          # itself is added by run-ios-sim-scenario.sh, which forwards this env
          # as --dart-define=HAVEN_WIRE_SENTINEL=… only when it is non-empty;
          # that is the chain check_wire_oracle_lane_reachable.sh follows.
          HAVEN_WIRE_SENTINEL: ${{ env.HAVEN_WIRE_SENTINEL }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: ${{ inputs.live_sync && 45 || 30 }}
          max_attempts: 2
          command: >-
            bash tooling/e2e/ci/start-local-relay.sh 7777 &&
            bash tooling/e2e/ci/start-wire-proxy.sh 7788 ws://127.0.0.1:7777 &&
            bash tooling/e2e/ci/run-ios-sim-scenario.sh
            integration_test/e2e/e2e_combined.dart
            ${{ steps.sim.outputs.udid }}

      # EVERYTHING THE ORACLES TAKE FROM THE DRIVE LOG, captured HERE and nowhere
      # later, because the next step destroys the evidence:
      # run-ios-sim-scenario.sh truncates (`: > "${log}"`) the single fixed
      # /tmp/flutter-ios-test.log at the start of every invocation, so once the
      # background-mirror scenario runs, e2e_combined's log — the sentinel ack
      # printed in it AND the running count of announced MLS group ids — is
      # gone. e2e-android.yml reads both straight from the drive log at its
      # oracle step because that lane runs ONE scenario into a log that is
      # appended across attempts; this lane cannot, and anything added to the
      # oracle step that greps this path reads the mirror check's log rather
      # than the flow's — which is empty of both, on every run.
      #
      # (1) THE HARNESS'S OWN SOCKET. `TestRelay` reaches the same proxied relay
      # the app does, so its probes are IN the journal and are NOT Haven's
      # privacy surface. The proxy returns the emitting `conn_id` in the
      # sentinel ack and the drive prints that ack; that print is the ONLY path
      # by which the host can learn the id.
      #
      # The oracles no longer DEPEND on it for exclusion — every harness socket
      # declares itself in the journal (`TestRelay._declareHarnessSocket`) — but
      # capturing it stays load-bearing as a liveness check on the recorder
      # chain: no ack means the drive never reached the proxy, and a journal
      # that describes some other run must be reported, not inferred.
      #
      # (2) HOW MANY MLS GROUP IDS THE DRIVE ANNOUNCED. C5.8's needle set itself
      # arrives by the proxy sidecar, which survives this step; this count is the
      # INDEPENDENT second source that says whether that set is complete (see the
      # oracle step). Counts only — a Rule-4 value never reaches this log.
      #
      # This step never fails the lane on its own. A missing capture is a real
      # problem, but it is REPORTED where the rest of the wire verdicts are
      # reported, under the same closed exit-code taxonomy — failing here would
      # skip the oracle step entirely and lose every other finding with it.
      # `tail -n 1` and `sort -n | tail -n 1` because a retried attempt appends
      # nothing to this file (it is truncated per attempt), so the last ack and
      # the highest count are always the surviving ones.
      - name: Capture the e2e_combined drive-log evidence
        run: |
          set -uo pipefail
          conn="$(LC_ALL=C grep -aoE 'wire-journal sentinel acked.*conn=[A-Za-z0-9_-]+' /tmp/flutter-ios-test.log 2>/dev/null | tail -n 1 | sed -E 's/.*conn=//' || true)"
          echo "HARNESS_CONN=${conn}" >> "${GITHUB_ENV}"
          if [[ -n "${conn}" ]]; then
            echo "::notice::harness conn_id ${conn} captured; it is excluded from wire attribution below."
          else
            echo "no '[e2e_combined] wire-journal sentinel acked … conn=<id>' line in /tmp/flutter-ios-test.log; the wire oracle step will report this."
          fi
          announced="$(LC_ALL=C grep -aoE 'announced MLS group id #[0-9]+' /tmp/flutter-ios-test.log 2>/dev/null | sed -E 's/.*#//' | sort -n | tail -n 1 || true)"
          echo "ANNOUNCED_MLS_GROUP_IDS=${announced}" >> "${GITHUB_ENV}"
          if [[ -n "${announced}" ]]; then
            echo "::notice::the drive announced ${announced} MLS group id(s); C5.8's needle set is held against that count below."
          else
            echo "no '[e2e_combined] announced MLS group id #<n>' line in /tmp/flutter-ios-test.log; the wire oracle step will report this."
          fi

      # Background-mirror check (docs/M7_BACKGROUND_SHARING.md D7): a SECOND,
      # cheap scenario on the SAME booted sim + relay. It proves the two iOS
      # wiring facts a host-side Dart unit test cannot see:
      # (a) writeCatchupEnabledMirror() reads back true, and (b) the Swift
      # teardown channels are registered + retained (no MissingPluginException).
      # Pods/Rust are cached from the e2e_combined build, so this incremental
      # build is bounded — 20 min/attempt is ample. Wrapped in nick-fields/retry
      # for the same sim launch/attach flake the first step absorbs, and under
      # the same narrowing: the retry gate in run-ios-sim-scenario.sh keys on a
      # verdict file named after the SCENARIO, so this step's decisions are
      # independent of e2e_combined's and neither can retry on the other's.
      #
      # It deliberately does NOT restart the wire proxy. The relay is shared and
      # already up; restarting the proxy here would ROTATE (`rm -f`) the journal
      # e2e_combined just filled, and the oracle two steps down would read a
      # file containing only this mirror check. This step's own traffic lands
      # ABOVE e2e_combined's sentinel, so it is recorded but sits outside the
      # anchored snapshot — which is the correct treatment for a scenario that
      # is not the flow under assertion.
      - name: Run iOS background-mirror scenario on the simulator
        timeout-minutes: 45
        # S1's other half, now explicit: this step must NOT start the live-sync
        # engine (a second engine alongside the M7 mirror check is pure flake
        # surface), and it says so rather than inheriting it. Deliberately NOT
        # `${{ inputs.live_sync }}` — this step is poll-path in BOTH lane
        # variants, which is precisely what S1 exists to guarantee.
        env:
          HAVEN_LIVE_SYNC: "false"
          # Same explicitness for the sentinel, and the same reason: the mint
          # step put it in $GITHUB_ENV, so without this line it would be
          # inherited here and silently add a --dart-define to a build that has
          # no TestRelay and emits no marker — a needless recompile of a
          # scenario whose compiled defines every other iOS lane relies on
          # staying byte-identical. Empty means "not instrumented".
          HAVEN_WIRE_SENTINEL: ""
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: >-
            bash tooling/e2e/ci/run-ios-sim-scenario.sh
            integration_test/ios_bg_mirror_test.dart
            ${{ steps.sim.outputs.udid }}

      # NOTE: the background mirror is asserted at the OS (NSUserDefaults) layer INSIDE
      # ios_bg_mirror_test.dart — it writes the mirror to REAL UserDefaults and,
      # after reload(), reads it back from the NSUserDefaults domain the Swift side
      # consumes (`UserDefaults.standard.bool(forKey:)`). An EXTERNAL post-test
      # plist read (the former assert-ios-catchup-mirror.sh step) is impossible on
      # this lane: `flutter test` removes the app + its data container on
      # completion (unlike Android's `flutter drive`), so it could never resolve
      # the container — it never once passed in CI. The in-app read-back is the
      # authoritative check.

      # Stop the recorder BEFORE anything reads its journal. Two reasons, and
      # the second is the one that would be missed:
      #   * the proxy prints its shutdown summary ("N connection(s), N
      #     record(s) observed, N line(s) written [— DEGRADED]") on SIGTERM, and
      #     that line is the only place a run says whether the instrument stayed
      #     healthy for its whole life;
      #   * it holds a CLAIM on its journal path in a sidecar next to its pid
      #     file, and refuses to start while another live instance holds the
      #     same path. A proxy leaked on the failure path therefore disables
      #     recording for every later run on a reused runner — the first red run
      #     silently switches the instrument off. `if: always()` is what closes
      #     that, since the failure path is exactly the path a plain step skips.
      # The script always exits 0, so this can never turn a green run red.
      - name: Stop the recording wire proxy
        if: always()
        run: bash tooling/e2e/ci/stop-wire-proxy.sh

      # THE assertion this lane's recording exists for. Runs on the HOST because
      # the journal is written by the proxy on the runner, not on the device —
      # so it cannot live inside the drive target — and it runs POST-drive, in
      # the same slot as the mandatory secret scan inside run-ios-sim-scenario.sh.
      #
      # `--sentinel` anchors the read at the marker the drive emitted, so the
      # snapshot is everything at or below that wire_seq and nothing appended
      # afterwards (the background-mirror step's traffic, say) can drift into
      # it. The two floors are the meta-check that the sample is not vacuous:
      # `--min-distinct-publishers 2` means two IDENTITY keys transmitted (445
      # and 1059 are excluded because their author is a fresh ephemeral key per
      # message, so they cannot stand in for a participant), and
      # `--min-distinct-conns 2` is the weaker companion that still catches a
      # client which never opened a socket.
      #
      # Read honestly, that floor is still weaker than it looks. Bob/Carol/Dave
      # are in-process SyntheticUser FFI peers publishing real 30443/1059/445
      # over their own Rust-side sockets, so two distinct publishers can be
      # reached with the production Flutter app having transmitted nothing at
      # all. What no longer inflates it is the harness itself: every TestRelay
      # now emits the proxy-intercepted sentinel VERB on every socket it opens and
      # re-emits it after each reconnect (`TestRelay._declareHarnessSocket`), so
      # all three of the drive's sockets — and any a strfry drop mints
      # mid-scenario — declare themselves in the journal and the oracles exclude
      # them without needing a captured id. `--exclude-conn` below is the
      # independent, host-side confirmation that the recorder chain ran at all.
      #
      # Attribution matters most to C5.1, which asks whether ONE device served
      # two circles in one second: a TestRelay multiplexes several simulated
      # peers, so counting it as a device turned two peers publishing 35 ms
      # apart into a co-membership finding against the app. See
      # check-wire-correlation.sh for the per-connection partition that
      # replaced the journal-wide reading.
      #
      # Exit codes are a CLOSED set {0,1,2,3,4} and each one fails the step,
      # which is the point: 3 (UNUSABLE — the recorder broke) and 4 (META-FLOOR
      # — the scenario proved too little) are NOT passes. A run whose instrument
      # was broken proves nothing about privacy and must not be reported as
      # though it did. Both oracles run in ONE step so a single red run reports
      # every finding, and the step exits on the WORST verdict rather than the
      # first: a C2-C4 META-FLOOR must never mask a C5 VIOLATION.
      #
      # C5 IS GATED ON live_sync, for a scenario-shape reason and nothing else.
      # C5.1 needs an APPLICATION kind-445 (one carrying `expiration`) from each
      # of TWO distinct groups. On the poll path every publishLocation in
      # e2e_combined targets the one family circle — the two-circle scenario
      # lives in the M11 group, whose bodies all self-guard on
      # `if (!liveSyncEnabled) return;` — so the precondition cannot be met and
      # the whole C5 arm would META-FLOOR for a reason that is not on the wire.
      # e2e-android.yml gates it identically; the two lanes agree.
      #
      # STILL NOT wired here: check-wire-canaries.dart (C6). Not for want of
      # canaries — e2e_combined.dart plants them (haven/integration_test/e2e/
      # _lib/wire_canaries.dart, announced at the end of the run) — but for want
      # of a manifest to read them from. C6's manifest source is the drive log,
      # and run-ios-sim-scenario.sh truncates the single fixed
      # /tmp/flutter-ios-test.log on every invocation, so by the time this step
      # runs the background-mirror scenario has overwritten e2e_combined's log.
      # Wiring C6 here needs a preserved COPY of that log taken in the same slot
      # as the drive-log capture step above (which extracts two values from it,
      # not the whole file); that is a separate change, and stating the real
      # obstacle is worth more than an out-of-date one.
      - name: Assert wire privacy invariants
        run: |
          set -uo pipefail
          first_rc=0
          failures=""

          verdict() { # verdict <label> <rc>
            case "$2" in
              0) echo "::notice::wire oracle $1: clean" ;;
              1) echo "::error::wire oracle $1: VIOLATION (rc=1) — a privacy finding on the wire." ;;
              2) echo "::error::wire oracle $1: USAGE (rc=2) — this lane invoked the oracle wrong; the wiring is broken, not the app." ;;
              3) echo "::error::wire oracle $1: UNUSABLE (rc=3) — the recorder or its inputs broke. This run proves NOTHING either way; do not read it as a pass." ;;
              4) echo "::error::wire oracle $1: META-FLOOR (rc=4) — the journal parsed but the scenario proved too little. Not a pass." ;;
              *) echo "::error::wire oracle $1: undocumented exit code $2 — the contract is a closed set {0,1,2,3,4}; treat the oracle itself as broken." ;;
            esac
            if [[ "$2" -ne 0 ]]; then
              failures="${failures} $1(rc=$2)"
              # Worst, not first. Severity order is 1 > 4 > 3 > 2, so a real
              # wire finding always names the exit code.
              case "$2" in
                1) first_rc=1 ;;
                4) [[ "${first_rc}" -eq 1 ]] || first_rc=4 ;;
                3) [[ "${first_rc}" -eq 1 || "${first_rc}" -eq 4 ]] || first_rc=3 ;;
                *) [[ "${first_rc}" -ne 0 ]] || first_rc="$2" ;;
              esac
            fi
          }

          # `${a[@]+"${a[@]}"}`, not `"${a[@]}"`: expanding an EMPTY array under
          # `set -u` is an unbound-variable error on the bash 3.2 that ships as
          # /bin/bash on the macOS runners.
          excl=()
          if [[ -n "${HARNESS_CONN:-}" ]]; then
            excl=(--exclude-conn "${HARNESS_CONN}")
          else
            echo "::error::the harness conn_id was never captured from the e2e_combined drive log, so --exclude-conn cannot be passed and TestRelay's own probes count toward every floor and every attribution below: a run in which the production Flutter app transmitted NOTHING could still satisfy --min-distinct-publishers 2. Either the sentinel ack never came back (the oracles will also report no anchor) or the drive's print of it changed shape; fix the channel rather than dropping the flag." >&2
            verdict "harness conn_id channel" 3
          fi

          rc=0
          bash tooling/e2e/ci/check-wire-journal.sh \
            --journal /tmp/haven-wire-journal.ndjson \
            --sentinel "${HAVEN_WIRE_SENTINEL}" \
            --min-distinct-publishers 2 \
            --min-distinct-conns 2 \
            ${excl[@]+"${excl[@]}"} || rc=$?
          verdict "C2-C4 structural" "${rc}"

          # C5 — correlation and containment. Each pool is the set of relays a
          # KIND may reach; this lane is hermetic, so every kind's pool is the
          # single upstream the proxy forwards to, exported by the proxy-start
          # step. The pool names that UPSTREAM and not the app-facing listen
          # alias because the journal records `relay_url` (the endpoint behind
          # the proxy) on every frame. Every kind the closed-world allow-list
          # admits gets a pool: a kind published with none is a META-FLOOR.
          #
          # C5.8 declares the real MLS group ids from the proxy SIDECAR. They
          # cannot be derived from the journal — their absence there is the
          # whole assertion — and they must not travel by the drive log, which
          # is uploaded as a failure artifact. The drive announces each id as a
          # proxy control frame; the proxy intercepts it (never forwarded, never
          # journalled) and appends the distinct ids to a host-side file next to
          # its pid file, which is read here and never uploaded. The VALUES are
          # never echoed into this step log either — a job log on a public repo
          # is as durable a disclosure as an artifact — so only the count is
          # printed. An absent or empty sidecar FAILS: it is deliberately not
          # downgraded to `--mls-group-id-not-asserted`, which would convert a
          # broken control channel into a permanently-skipped invariant that
          # reports green (and the oracle refuses both flags together anyway).
          if [[ "${{ inputs.live_sync }}" != "true" ]]; then
            echo "C5 correlation: SKIPPED on the poll path — C5.1 requires an application kind-445 from two distinct groups, which only the live-sync two-circle scenario produces. Run the live-sync variant for the C5 verdicts."
          else
          # Same precedence start-wire-proxy.sh resolves the path with, in the
          # same order, so an override set for the recorder is honoured here
          # instead of silently reading the default path it stopped writing.
          mls_claim="${HAVEN_WIRE_PROXY_RUN_DIR:-/tmp}/haven-wire-proxy.mlsgroupidpath"
          # Read the path the recorder CLAIMED, exactly as the journal path is
          # read above, instead of rebuilding the default instance's filename.
          # A guessed name reads the wrong file the day a lane runs two
          # recorders, and a stale sidecar is worse than a missing one: C5.8
          # would scan for a previous plane's ids, find none, and report clean.
          mls_sidecar="$(head -n 1 "${mls_claim}" 2>/dev/null || true)"
          if [[ -z "${mls_sidecar}" ]]; then
            echo "::error::the recorder claimed no MLS-group-id sidecar (${mls_claim} absent or empty). Without it C5.8 has no ground truth for Security Rule 4."
            verdict "C5.8 mls-group-id channel" 3
            mls_sidecar="/nonexistent"
          fi
          mls_args=()
          mls_count=0
          if [[ -r "${mls_sidecar}" ]]; then
            while IFS= read -r mls_id || [[ -n "${mls_id}" ]]; do
              mls_id="${mls_id//[[:space:]]/}"
              [[ -n "${mls_id}" ]] || continue
              mls_args+=(--mls-group-id "${mls_id}")
              mls_count=$((mls_count + 1))
            done < "${mls_sidecar}"
          fi
          if [[ "${mls_count}" -eq 0 ]]; then
            echo "::error::the MLS group-id sidecar ${mls_sidecar} is absent or empty, so the drive never announced a group id through the proxy control channel. C5.8 would then scan the wire against an EMPTY set of values and could not have failed — Security Rule 4 would be reported as holding by a check that looked for nothing. This is a broken control channel (drive announcement -> proxy interception -> sidecar), not a scenario finding." >&2
            verdict "C5.8 mls-group-id channel" 3
          else
            echo "::notice::C5.8: ${mls_count} MLS group id(s) declared from the proxy sidecar (values withheld — Security Rule 4)."
          fi
          # ...and a non-empty needle set is not a COMPLETE one. Nothing in the
          # journal can tell a set that shrank from a run that made fewer
          # circles, so a lost declaration leaves C5.8 looking exactly as busy
          # over fewer values while every verdict stays green. The drive prints a
          # running count as it announces each circle (`_announceMlsGroupId`),
          # produced independently of the sidecar the ids themselves travel to —
          # holding the two against each other is what catches a declaration
          # that never landed, a sidecar rotated under the recorder, or a
          # scenario that stopped announcing. Counts only; the ids stay off this
          # log (Security Rule 4).
          #
          # READ FROM THE ENV THE CAPTURE STEP EXPORTED, NEVER BY GREPPING
          # /tmp/flutter-ios-test.log HERE: that path holds the BACKGROUND-MIRROR
          # scenario's log by now (run-ios-sim-scenario.sh truncates it per
          # invocation), which announces no group id at all — so a grep at this
          # point comes up empty on every run and fails the lane closed for a
          # reason that has nothing to do with the app or the recorder.
          expect=()
          if [[ -n "${ANNOUNCED_MLS_GROUP_IDS:-}" ]]; then
            expect=(--expect-mls-group-ids "${ANNOUNCED_MLS_GROUP_IDS}")
          else
            echo "::error::the count of MLS group ids this run announced was never captured, so the sidecar's ${mls_count} id(s) cannot be checked for COMPLETENESS. A needle set that lost entries scans fewer circles than the run created and still reports clean, which is the one failure mode C5.8 must not have. The count travels in \$GITHUB_ENV from the 'Capture the e2e_combined drive-log evidence' step, which reads the drive log while it is still e2e_combined's — so the break is in ONE of those two links: the scenario stopped announcing (or the drive's print changed shape), or that capture step no longer runs before the background-mirror scenario truncates /tmp/flutter-ios-test.log. Fix the channel rather than dropping the flag, and do not re-read the drive log here: by this point it belongs to the mirror check." >&2
            verdict "C5.8 announced-count channel" 3
          fi
          rc=0
          bash tooling/e2e/ci/check-wire-correlation.sh \
            --journal /tmp/haven-wire-journal.ndjson \
            --sentinel "${HAVEN_WIRE_SENTINEL}" \
            --pool "0=${WIRE_UPSTREAM}" \
            --pool "5=${WIRE_UPSTREAM}" \
            --pool "445=${WIRE_UPSTREAM}" \
            --pool "1059=${WIRE_UPSTREAM}" \
            --pool "10002=${WIRE_UPSTREAM}" \
            --pool "10050=${WIRE_UPSTREAM}" \
            --pool "30443=${WIRE_UPSTREAM}" \
            ${excl[@]+"${excl[@]}"} \
            ${mls_args[@]+"${mls_args[@]}"} \
            ${expect[@]+"${expect[@]}"} || rc=$?
          verdict "C5 correlation" "${rc}"
          fi

          if [[ "${first_rc}" -ne 0 ]]; then
            echo "::error::wire oracles FAILED:${failures}" >&2
            exit "${first_rc}"
          fi
          echo "The wire oracles read the journal and found it clean."

      - name: Collect simulator diagnostics
        if: always()
        run: |
          xcrun simctl spawn booted log collect --output /tmp/sim.logarchive 2>/dev/null || true
          cp /tmp/haven-local-relay.log /tmp/relay.log 2>/dev/null || true
          cp /tmp/haven-wire-proxy.log /tmp/wire-proxy.log 2>/dev/null || true
          # A REDACTED transcript, never the raw journal: the .ndjson is a
          # complete record of every event body, REQ filter and endpoint the run
          # touched, and CI artifacts outlive the runner on a public repo.
          # summarize-wire-journal.sh keeps kinds, tag NAMES and lengths and
          # drops ids, pubkeys, content and every tag VALUE, then runs the
          # result through the secret scanner and deletes it if anything trips.
          # `|| true` because this is triage material, not a gate — the gate is
          # the oracle step above, which has already had its say.
          bash tooling/e2e/ci/summarize-wire-journal.sh \
            /tmp/haven-wire-journal.ndjson /tmp/wire-summary.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # Suffix the flag-on run so it never collides with the poll-path
          # e2e-ios job's artifact when BOTH are called in one ci.yml run
          # (upload-artifact@v4+ rejects a duplicate name in the same run).
          name: e2e-ios${{ inputs.live_sync && '-live-sync' || '' }}-${{ github.run_id }}
          # The raw wire journal (/tmp/haven-wire-journal.ndjson) is NEVER
          # listed here — only the redacted summary. That boundary is enforced,
          # not merely documented: scripts/ci/check_wire_proxy_test_only.sh
          # fails CI if any workflow puts an .ndjson path in an upload-artifact
          # step.
          path: |
            /tmp/flutter-ios-test.log
            /tmp/relay.log
            /tmp/sim.logarchive
            /tmp/wire-proxy.log
            /tmp/wire-summary.log
          retention-days: 14
          if-no-files-found: ignore

      # Relay teardown. Runs LAST and `if: always()` so the relay process is
      # killed on every outcome. The script always exits 0, so teardown can
      # never turn a green run red.
      - name: Tear down host-native relay
        if: always()
        run: bash tooling/e2e/ci/stop-local-relay.sh
