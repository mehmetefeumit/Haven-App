reason = "owner-decision: 2026-09-19. instant 0.1.x is unmaintained (informational), reached via nostr 0.44 <- nostr-sdk 0.44.1; a thin wrapper over std::time with no CVE. Lift when nostr-sdk drops instant or moves to web-time through an MDK/nostr-sdk release. Mirrors haven-core/.cargo/audit.toml."

