# The acknowledgement ledger: every known advisory Haven ships with on purpose.
#
# osv-scanner reads this file (`--config osv-scanner.toml`, run_osv_gate.sh)
# and drops an entry's advisory, with all its aliases, until `effectiveUntil`;
# from that instant the advisory fails the gate again. The drop is the whole
# alias group, in every lockfile and ecosystem (RUSTSEC-2026-0459 also silences
# CVE-2026-119375, GHSA-72w2-rjgg-q729 and RUSTSEC-2026-0502 wherever they
# match), so a `reason` names the package and the use it covers. cargo-audit's ignores in
# haven-core/.cargo/audit.toml cannot expire, so each one is mirrored here and
# this file supplies its end date. Rules, held by scripts/ci/check_ledger.sh on
# every push and inside every release:
#
#   - `id`, `reason` and `effectiveUntil` (never the deprecated `ignoreUntil`).
#     osv-scanner refuses any other key, so the owner's decision is the token
#     `owner-decision: YYYY-MM-DD` inside `reason`, which also says why the
#     advisory is acceptable today and what lifts it.
#   - `effectiveUntil` lies in the future and at most 90 days out. Renewing is a
#     new decision, re-dated; 14 days before an expiry the nightly files an
#     issue.
#   - Every entry still matches an advisory the scanners report. A stale entry
#     would silence the advisory's return.
#
# Never acknowledge here what has a fix: update the lockfile. Never use pubspec
# `ignored_advisories` (no expiry) or acknowledge a retracted pub version.

[[IgnoredVulns]]
