# haven-logscan policy — what is a needle, where it is searched, and what the
# expander is allowed to produce.
#
# This file is COMPILED IN (`include_str!` in src/policy.rs). There is no
# `--policy` flag: an instrument whose own rules a caller can substitute at
# runtime is not an instrument, and `scripts/ci/check_wire_proxy_test_only.sh:180-191`
# records that lesson being learned twice. Editing the policy means editing this
# file, which means a reviewed diff.
#
# Policy is ALL-BLOCKING. There is no `deferred_until` and no class B: the owner
# rejected deferral classes (OD-L1/OD-L2) and Phase L0 landed the alias handles,
# so every class below is a leak on day one.
schema = 1

# Bits per character a base64-shaped run must exceed before S4 calls it a blob.
# 4.2 sits above a long camel-case identifier (~3.9) and far below random base64
# (~5.6). Both directions are fixture-asserted in src/rules.rs.
base64_entropy_bits = 4.2

# The floor of the floors: no sink may search a term shorter than this, and the
# seal drops anything below it with a recorded reason. Six characters is where a
# term stops being a needle and starts being furniture.
min_term_len = 6

# Terms identical to one of these are log furniture that every line carries
# anyway, so searching for them would redden every lane on nothing.
furniture = [
  "flutter", "haven", "debug", "release", "null", "true", "false", "none",
  "redacted", "unknown", "localhost", "127.0.0.1", "system", "default",
]

# ---------------------------------------------------------------------------
# Needle classes
# ---------------------------------------------------------------------------
# `scoped_out` = sink classes that legitimately hold the class, where a needle of
# it is NOT searched (a relay log holding pubkeys and event ids is not a Haven
# leak). `secret = true` = the raw value is committed (SHA-256) and never
# serialised.
[classes]
nsec = { kind = "bytes", secret = true, bech32 = ["nsec"] }
secret = { kind = "bytes", secret = true }
mls_group_id = { kind = "bytes" }
nostr_group_id = { kind = "bytes", scoped_out = ["relay"] }
pubkey = { kind = "bytes", bech32 = ["npub"], bech32_tlv_gap = ["nprofile"], scoped_out = ["relay"] }
event_id = { kind = "bytes", bech32 = ["note", "nevent"], bech32_tlv_gap = ["nevent"], scoped_out = ["relay"] }
kp_slot = { kind = "text", scoped_out = ["relay"] }
subscription_id = { kind = "text", scoped_out = ["relay"] }
relay_url = { kind = "url", scoped_out = ["relay", "proxy"] }
blossom_url = { kind = "url" }
circle_name = { kind = "text" }
display_name = { kind = "text" }
petname = { kind = "text" }
about = { kind = "text" }
device_id = { kind = "text" }
coordinate = { kind = "coordinate" }
geohash = { kind = "geohash" }
# Positive controls. Not expanded: a plant is matched literally and tallied.
plant = { kind = "plant" }

# ---------------------------------------------------------------------------
# Sink classes
# ---------------------------------------------------------------------------
# `term_floor` is 8 for the device-wide captures and 6 elsewhere, because a
# 6-character term in a logcat shared with every vendor daemon matches furniture.
# `owned_tags` are matched as PREFIXES: `android_logger` tags a record with its
# module path truncated to 23 characters, so `haven_core` has to cover
# `haven_core::relay::man`.
# `required_shape_plants` name the UNDECLARED plants (there is no native harness
# channel to declare through), each proving that emitter's log backend reached
# this capture.
[sinks]
logcat = { term_floor = 8, structural_rules = true, reassemble = true, min_lines = 2000, entry_format = "logcat", required_shape_plants = ["rust", "kotlin"], owned_tags = ["flutter", "haven_core", "rust_lib_haven", "RustStdoutStderr", "frb_user", "HavenApplication", "MainActivity", "PublishWakeLock", "com.oblivioustech.haven"] }
ios = { term_floor = 8, structural_rules = true, reassemble = false, min_lines = 2000, entry_format = "ios", required_shape_plants = ["rust", "swift"], owned_processes = ["Runner", "frb_user", "HavenSLC", "HavenBGTask", "haven_core"] }
drive = { term_floor = 6, structural_rules = true, reassemble = false, min_lines = 100, entry_format = "plain" }
rust-test = { term_floor = 6, structural_rules = true, reassemble = false, min_lines = 20, entry_format = "plain" }
proxy = { term_floor = 6, structural_rules = true, reassemble = false, min_lines = 5, entry_format = "plain" }
diag = { term_floor = 6, structural_rules = true, reassemble = false, min_lines = 1, entry_format = "plain" }
# A relay log legitimately holds pubkeys, event ids and `#h` tags: structural
# rules are OFF here and the public classes are scoped out. What is NOT scoped
# out is the real MLS group id, the secrets, the names and the coordinates —
# their presence in a relay log would be the violation itself.
relay = { term_floor = 6, structural_rules = false, reassemble = false, min_lines = 5, entry_format = "plain" }

# ---------------------------------------------------------------------------
# The coverage ledger
# ---------------------------------------------------------------------------
# One hand-written claim per (class, encoding), reconciled against the expander
# on every seal (src/ledger.rs). Four disagreements are rc 3: a `covered` label
# the expander does not search, a `gap` it does search, a label nothing here
# declares, and a gap with no reason.
#
# The boundaries are stated as LITERALS and never computed from the expander's
# constants. A ledger that recomputed its own bounds would follow a narrowing
# change instead of reporting it — which is the one thing it exists not to do.
#
# `not_gaps` are renderings deliberately out of scope entirely, each with the
# sentence why. They are not gaps, because nothing in this tree produces them;
# if the expander ever starts producing one, reconciliation reports it as a label
# the ledger does not declare.

[ledger.nsec]
# Secret class: the raw value is committed, never serialised, so every raw rendering is a declared gap and only the commitment's encodings are searchable.
covered = [
  "sha256-hex", "sha256-hex-prefix8", "sha256-hex-prefix16"
]
[ledger.nsec.gaps]
"hex-lower" = "secret-class raw never serialised"
"hex-upper" = "secret-class raw never serialised"
"hex-prefix8" = "secret-class raw never serialised"
"hex-prefix12" = "secret-class raw never serialised"
"hex-prefix16" = "secret-class raw never serialised"
"hex-spaced" = "secret-class raw never serialised"
