[ledger.mls_group_id]
# The REAL MLS group id (Security Rule 4). Searched in every sink, including the relay log, where its presence would be the violation itself.
covered = [
  "hex-lower", "hex-upper", "hex-prefix8", "hex-prefix12", "hex-prefix16", "hex-spaced",
