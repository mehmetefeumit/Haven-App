# haven-logscan policy — what is a needle, where it is searched, and what the
# expander is allowed to produce.
#
# This file is COMPILED IN (`include_str!` in src/policy.rs). There is no
# `--policy` flag: an instrument whose own rules a caller can substitute at
# runtime is not an instrument, and `scripts/ci/check_wire_proxy_test_only.sh:180-191`
# records that lesson being learned twice. Editing the policy means editing this
# file, which means a reviewed diff.
#
# Policy is ALL-BLOCKING. There is no `deferred_until` and no class B: the owner
# rejected deferral classes (OD-L1/OD-L2) and Phase L0 landed the alias handles,
# so every class below is a leak on day one.
schema = 1

# Bits per character a base64-shaped run must exceed before S4 calls it a blob.
# 4.2 sits above a long camel-case identifier (~3.9) and far below random base64
# (~5.6). Both directions are fixture-asserted in src/rules.rs.
base64_entropy_bits = 4.2

# The floor of the floors: no sink may search a term shorter than this, and the
# seal drops anything below it with a recorded reason. Six characters is where a
# term stops being a needle and starts being furniture.
min_term_len = 6

# Terms identical to one of these are log furniture that every line carries
# anyway, so searching for them would redden every lane on nothing.
furniture = [
  "flutter", "haven", "debug", "release", "null", "true", "false", "none",
  "redacted", "unknown", "localhost", "127.0.0.1", "system", "default",
]

# ---------------------------------------------------------------------------
# Needle classes
# ---------------------------------------------------------------------------
# `scoped_out` = sink classes that legitimately hold the class, where a needle of
# it is NOT searched (a relay log holding pubkeys and event ids is not a Haven
# leak). `secret = true` = the raw value is committed (SHA-256) and never
# serialised.
[classes]
nsec = { kind = "bytes", secret = true, bech32 = ["nsec"] }
secret = { kind = "bytes", secret = true }
mls_group_id = { kind = "bytes" }
nostr_group_id = { kind = "bytes", scoped_out = ["relay"] }
pubkey = { kind = "bytes", bech32 = ["npub"], bech32_tlv_gap = ["nprofile"], scoped_out = ["relay"] }
event_id = { kind = "bytes", bech32 = ["note", "nevent"], bech32_tlv_gap = ["nevent"], scoped_out = ["relay"] }
kp_slot = { kind = "text", scoped_out = ["relay"] }
subscription_id = { kind = "text", scoped_out = ["relay"] }
relay_url = { kind = "url", scoped_out = ["relay", "proxy"] }
blossom_url = { kind = "url" }
circle_name = { kind = "text" }
display_name = { kind = "text" }
petname = { kind = "text" }
about = { kind = "text" }
device_id = { kind = "text" }
coordinate = { kind = "coordinate" }
geohash = { kind = "geohash" }
# Positive controls. Not expanded: a plant is matched literally and tallied.
plant = { kind = "plant" }

# ---------------------------------------------------------------------------
# Sink classes
# ---------------------------------------------------------------------------
# `term_floor` is 8 for the device-wide captures and 6 elsewhere, because a
# 6-character term in a logcat shared with every vendor daemon matches furniture.
# `owned_tags` match a logcat tag EXACTLY, case included, or as that entry
# followed by `::` —
# `android_logger` tags a record with its module path, whole
# (`haven_core::relay::live_sync::session`) or truncated to logcat's 23-char
# limit (`haven_core::relay::man`), so `haven_core` has to cover both. Never a
# bare prefix: `flutter` would then own the five `Flutter*` plugin tags CI run
# 35280144455's logcats carry, and vendor text is not Haven's to answer for.
# `owned_emitters` is the `ios` twin, matched EXACTLY against the record's own
# emitter — its os_log subsystem, else the emitting library, else the process —
# because on iOS the process is `Runner` for Haven's records and for every Apple
# framework linked into the app alike (see `SinkSpec::owned_emitters`).
# `frb_user` is the subsystem the Rust core's oslog backend installs and
# `haven_ios` the one every Haven Swift log call names (`haven/ios/Runner/*.swift`;
# an `NSLog` record would carry Foundation's emitter instead, and `Foundation` is
# the library on tens of thousands of vendor lines per capture, so it can never
# be owned). `Flutter` is the engine's image, which carries Dart's own output as
# `flutter: <msg>`: not owning it would mean S1-S12 silently stop the day the
# engine routes Haven's Dart text there, and every `(Flutter)` line the real
# captures hold is clean once the lane's loopback is exempt. `rust_lib_haven`
# and `Runner` are Haven's own images — the latter a fallback for a record with
# no subsystem and no library, a shape no capture has yet produced.
# `emitter_scoped_out` is a class's `scoped_out` one rung finer: the classes NOT
# searched on one named PROGRAM's own records. `locationd` under
# `com.apple.locationd.Position` is the location daemon, and a lane that injects
# a fix (`simctl location set` — b4, the auth-tier lane, the background-publish
# lane) hands that daemon the coordinate itself, so the daemon logging it is the
# SOURCE of the value rather than a place it leaked to: CI run 35311161479's
# `e2e-ios-real-gps` was rc 1 on the b4 seed in several encodings, every hit
# under that one program. BOTH columns of the `locationd/com.apple.locationd.Position`
# the finding named are matched, because neither is a program by itself: an
# Apple framework logs under its own `com.apple.locationd.*` subsystem from
# INSIDE Haven's process (the `Runner[…]` record under `com.apple.locationd.Core`
# in fixtures/format.ios.log), so a subsystem-only scope would forgive the class
# exactly where a leak would be, while a process-only one would forgive every
# other subsystem that daemon carries. It touches needle matching only: the same
# value under any other program — Haven's own, `apsd`, the simulator bridge — is
# still rc 1, every other class is still searched on the daemon's records, and
# the structural rules are unaffected (the emitter is un-owned, so they never
# ran there). A Haven record's CONTINUATION line names no emitter, so it is
# scoped out of nothing — the safe direction.
# `required_shape_plants` name the UNDECLARED plants (there is no native harness
# channel to declare through), each proving that emitter's log backend reached
# this capture.
# `declared_plants_expected` says whether the DART tokens the harness declares
# must appear here. It is `false` for `ios` because NO CAPTURE HAS SHOWN ONE
# YET — not because the path cannot exist: the Flutter engine routes
# `debugPrint` through `vsyslog`, which does reach `log show` as
# `Runner(Flutter)[pid] … flutter: <msg>`, so the expectation is unproven rather
# than impossible, and the first iOS capture that carries a token flips this to
# `true` for good. Demanding an unproven control would make every iOS lane rc 3
# for a reason that is not a privacy fact. The SHAPE plants still apply, so a
# dead iOS capture is still caught. It is `false` for the sinks that carry no app output at all
# (`rust-test`, `proxy`, `diag`, `relay`). The day a capture proves the Dart
# token reaches `log show`, this flips to `true` and stays there.
# `owned_tags` deliberately does NOT list the app's package name: logcat
# truncates a process tag to its last 15 characters (`vioustech.haven`), and
# those lines are the ART runtime's and SELinux's own text about the process,
# not Haven's log calls — so the entry matched nothing and owning it would put
# platform-authored text under Haven's rules.
# `cargo_status` is `"exempt"` for `rust-test` alone: before a single test
# runs, cargo prints the public pinned git revision of every git dependency (40
# hex, which S2 reads as a truncated id) and the name of every crate
# (`geo-types`, which S6 reads as a cell next to a `geo` keyword). Neither is a
# Haven identifier, and both are in EVERY transcript of this repo. The exemption
# is as narrow as those two facts: ONLY the `Compiling|Checking|Downloaded
# <crate> v<semver> [(<source>)]` shape in `src/rules.rs`, and ONLY rules S2 and
# S6 on it. Every other rule still runs on that line, cargo's other status lines
# are not exempt at all (they trip nothing as cargo prints them), and the needle
# search reads all of them: a declared value cannot hide behind a cargo verb.
[sinks]
logcat = { term_floor = 8, declared_plants_expected = true, structural_rules = true, reassemble = true, min_lines = 2000, entry_format = "logcat", required_shape_plants = ["rust", "kotlin"], owned_tags = ["flutter", "haven_core", "rust_lib_haven", "RustStdoutStderr", "frb_user", "HavenApplication", "MainActivity", "PublishWakeLock"] }
ios = { term_floor = 8, declared_plants_expected = false, structural_rules = true, reassemble = false, min_lines = 2000, entry_format = "ios", required_shape_plants = ["rust", "swift"], owned_emitters = ["frb_user", "haven_ios", "rust_lib_haven", "Flutter", "Runner"], emitter_scoped_out = [{ process = "locationd", emitter = "com.apple.locationd.Position", classes = ["coordinate"] }] }
drive = { term_floor = 6, declared_plants_expected = true, structural_rules = true, reassemble = false, min_lines = 100, entry_format = "plain" }
rust-test = { term_floor = 6, declared_plants_expected = false, structural_rules = true, reassemble = false, min_lines = 20, entry_format = "plain", cargo_status = "exempt" }
proxy = { term_floor = 6, declared_plants_expected = false, structural_rules = true, reassemble = false, min_lines = 5, entry_format = "plain" }
diag = { term_floor = 6, declared_plants_expected = false, structural_rules = true, reassemble = false, min_lines = 1, entry_format = "plain" }
# A relay log legitimately holds pubkeys, event ids and `#h` tags: structural
# rules are OFF here and the public classes are scoped out. What is NOT scoped
# out is the real MLS group id, the secrets, the names and the coordinates —
# their presence in a relay log would be the violation itself.
# The line floor is what turns "the scan read an empty or truncated file and
# found nothing" into rc 4 instead of a green, so it is sized to the SMALLEST
# COMPLETE capture of the class and never to what makes a lane pass. Here that
# is ONE line: `tooling/e2e/local-relay` prints its listen line and nothing
# else for a whole run, so `relay.log` is 1 line in every iOS lane of run
# 35280144455. With the rules off and the public classes scoped out, existence
# and readability are all this class's floor can prove; a lane whose relay
# writes more (strfry's `docker logs` dump runs to 14-23 lines) carries its own
# `seal --floor relay=<n>`, which is where a truncated dump is caught.
relay = { term_floor = 6, declared_plants_expected = false, structural_rules = false, reassemble = false, min_lines = 1, entry_format = "plain" }

# ---------------------------------------------------------------------------
# The coverage ledger
# ---------------------------------------------------------------------------
# One hand-written claim per (class, encoding), reconciled against the expander
# on every seal (src/ledger.rs). Four disagreements are rc 3: a `covered` label
# the expander does not search, a `gap` it does search, a label nothing here
# declares, and a gap with no reason.
#
# The boundaries are stated as LITERALS and never computed from the expander's
# constants. A ledger that recomputed its own bounds would follow a narrowing
# change instead of reporting it — which is the one thing it exists not to do.
#
# `not_gaps` are renderings deliberately out of scope entirely, each with the
# sentence why. They are not gaps, because nothing in this tree produces them;
# if the expander ever starts producing one, reconciliation reports it as a label
# the ledger does not declare.

[ledger.nsec]
# Secret class: the raw value is committed, never serialised, so every raw rendering is a declared gap and only the commitment's encodings are searchable.
covered = [
  "sha256-hex", "sha256-hex-prefix8", "sha256-hex-prefix16"
]
[ledger.nsec.gaps]
"hex-lower" = "secret-class raw never serialised"
"hex-upper" = "secret-class raw never serialised"
"hex-prefix8" = "secret-class raw never serialised"
"hex-prefix12" = "secret-class raw never serialised"
"hex-prefix16" = "secret-class raw never serialised"
"hex-spaced" = "secret-class raw never serialised"
"hex-reversed-bytes" = "secret-class raw never serialised"
"rust-debug-x" = "secret-class raw never serialised"
"rust-debug-upper-x" = "secret-class raw never serialised"
"rust-debug-02x" = "secret-class raw never serialised"
"rust-debug-alt-x" = "secret-class raw never serialised"
"dart-radix16-unpadded" = "secret-class raw never serialised"
"base64-std-align0" = "secret-class raw never serialised"
"base64-std-align0-padded" = "secret-class raw never serialised"
"base64-std-align1" = "secret-class raw never serialised"
"base64-std-align1-padded" = "secret-class raw never serialised"
"base64-std-align2" = "secret-class raw never serialised"
