"bech32-nsec-upper" = "secret-class raw never serialised"

[ledger.secret]
# Exporter/epoch secrets, the SQLCipher passphrase, the assignment salt, KeyPackage private material. Same commitment rule as `nsec`.
covered = [
  "sha256-hex", "sha256-hex-prefix8", "sha256-hex-prefix16"
]
[ledger.secret.gaps]
