# The weekly soak profile: every scenario, every arm, the biggest world.
#
# Superset of `nightly`. Two of the arms that appear only here — S17's full
# intake and S03's unnamed strand — each wait out the 684-second
# delivery-silence window as an absence, and an absence cannot share a run
# with anything shorter. S08 `buried-past-the-cap` was the expected-red arm
# (C8) until R4's NIP-77 pass; it runs in the nightly too now. S05
# `kill-receive-auto-commit` was expected red (C9) until MDK v0.10.4 made it
# grade rc 0; it stays here until the owner returns it to the nightly
# (nightly.toml).
name = "weekly"
run_budget_secs = 16200
deadline_secs = 18000
margin_secs = 900
duration_secs = 3600
tick_ms = 250

[world]
members = 5
circles = 4
relays = 3

[[scenarios]]
id = "S01"
arms = ["single-relay-outage", "all-relay-outage", "rolling-outage"]

[[scenarios]]
id = "S02"
arms = ["partitioned-receiver", "commit-class-only"]

