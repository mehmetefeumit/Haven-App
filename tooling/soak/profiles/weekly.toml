# The weekly soak profile: every scenario, every arm, the biggest world.
#
# Superset of `nightly`. The one arm that appears only here is S17's full
# intake, whose bound starts at the 684-second delivery-silence window and so
# cannot share a run with anything shorter.
name = "weekly"
run_budget_secs = 16200
deadline_secs = 18000
margin_secs = 900
duration_secs = 3600
tick_ms = 250

[world]
members = 5
circles = 4
relays = 3

[[scenarios]]
id = "S01"
arms = ["single-relay-outage", "all-relay-outage", "rolling-outage"]

[[scenarios]]
id = "S04"
arms = ["offline-quiet", "offline-across-commits", "offline-past-retention",
        "offline-across-removal"]

[[scenarios]]
id = "S05"
arms = ["confirm-err-is-not-a-failure"]

[[scenarios]]
id = "S06"
arms = ["stuck-row-sweep"]

[[scenarios]]
id = "S09"
arms = ["standing-adversary", "rewrap-created-at-binding"]

[[scenarios]]
id = "S11"
arms = ["quiet-circle-resume"]

[[scenarios]]
id = "S12"
arms = ["kp-rotation-slot"]          # the day-85 rejection is a later sub-phase

[[scenarios]]
id = "S13"
arms = ["hydration-quarantine"]

[[scenarios]]
id = "S14"
arms = ["race-no-restart", "race-restart-after-confirm", "race-restart-before-confirm",
        "race-anchor-exhausted"]

[[scenarios]]
id = "S17"
arms = ["closed-prefixes", "notice", "full-intake"]

[[scenarios]]
id = "S18"
arms = ["swallowed-ok-create", "swallowed-ok-relay-update", "swallowed-ok-location-send"]

[[scenarios]]
id = "S19"
arms = ["duplicate-replay", "reordered-pages", "cross-sub-eose", "commit-gap"]

[[scenarios]]
id = "S22"
arms = ["oversized-commit", "refusal-is-relay-count-invariant", "oversized-welcome",
        "oversized-removal-wedges-the-circle"]
