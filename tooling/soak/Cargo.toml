# Tier-1 soak rig: an in-process Haven world (real MLS stores, real engines, a
# real relay) driven by a seeded nemesis schedule, graded by oracles.
#
# It is a separate Cargo project (NOT a member of haven-core) so it never enters
# the app build and never becomes a dependency of anything shipped. Its only
# door into the product is haven-core's `test-utils` feature.
[package]
name = "haven-soak"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tier-1 soak rig for Haven: seeded nemesis schedules over real MLS/Nostr state."
license = "MIT"

# Not a member of any workspace: the repository has no root Cargo.toml, and an
# empty `[workspace]` table keeps a future one from silently absorbing this
# crate into the app's dependency graph — which would also drop `[profile.soak]`
# on the floor, because only a workspace root may define a profile.
[workspace]

[lib]
name = "haven_soak"
path = "src/lib.rs"

[[bin]]
name = "haven-soak"
path = "src/main.rs"

[dependencies]
# The subject under test. `test-utils` is what makes the unencrypted-store
# constructors and the probe seams visible; haven-core turns a build with it
# into a compile error unless debug assertions are on, which is one of the two
# reasons `[profile.soak]` sets them (see below).
haven-core = { path = "../../haven-core", features = ["test-utils"] }
# The scanner runs IN-PROCESS over each scenario's captured lines, through the
# same expander the lanes use — two expanders would mean two coverage claims.
haven-logscan = { path = "../logscan" }
# The relay-plane judge O7 grades with: the one policy every layer of the
# relay-plane proof judges by.
haven-local-relay = { path = "../e2e/local-relay" }
# Every direct nostr-stack dependency is exact-pinned to the version
# haven-core/Cargo.lock resolves. A different 0.44.x would split the `nostr`
# type graph from MDK's pinned rev, and this is the one crate where haven-core's
# `nostr` types and the relay's must be the same universe.
nostr = { version = "=0.44.8", features = ["std", "nip44"] }
nostr-sdk = { version = "=0.44.1", default-features = false, features = ["nip44", "nip59"] }
nostr-relay-builder = "=0.44.1"
nostr-database = "=0.44.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# The product driver's transport trait (`FanoutSend`) is an `async_trait`, and
# the rig wraps it to read what the driver sent. Already resolved through
# haven-core at the same version, so this adds ZERO crates.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tempfile = "3.10"
hex = "0.4"
log = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The schedule digest. Same version haven-core and haven-logscan already resolve.
sha2 = "0.10"
# The checked-in profile declarations.
toml = "0.8"
# The engine's PUBLIC per-group caps, and nothing else from it: S16's
# `outsider-flood` grades `MAX_PEEL_DEFERRED_ROWS_PER_GROUP` and a bound written
# as a literal-plus-grep would restate the constant it is measuring (decision
# 0.36/0.37). Pinned to the rev haven-core pins, byte for byte. The one-universe
# hazard does not arise: this adds ZERO crates (the engine already resolves
# through haven-core), and `check_lockfile_universe.sh` holds this lockfile to
# haven-core's (version, source) for `cgka-engine` and its neighbours, on the
# rev in `scripts/ci/mdk_pins.env`. Nothing here may format a value of its (Rule 15,
# `check_soak_test_only.sh`'s `FOREIGN_RE`): the caps are matched and compared,
# never rendered.
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
# The routing component's encoder, for S24 alone: the arm commits a routing
# update onto another circle's id the way another client's admin can, and no
# haven-core surface builds one (Haven never would). Pinned as `cgka-engine` is
# and for the same reasons; ZERO new crates, the same universe guard.
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "fcc85edd8dbd07c8293c899ee52230f72c54c897" }
# `OpenMLS`, for S12's `kp-expired-rejected` and nothing else: the arm mints an
# expired KeyPackage in the device's own production shape (`KeyPackageBuilder`,
# `Lifetime`), which no haven-core or engine surface exposes. The provider and
# the basic-credential signer come with it, because `KeyPackageBuilder::build`
# takes both. Pinned to the exact fork rev and features MDK's workspace pins
# (`erskingardner/openmls@59e7d3b…`, `extensions-draft`), so this adds ZERO
# crates. `check_lockfile_universe.sh` requires every openmls crate to resolve
# to one (version, source) here, equal to haven-core's, so a `cargo update` in
# this crate alone cannot drift a sibling. The same rule as the engine's caps:
# a value of these crates is matched, never formatted.
openmls = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
openmls_rust_crypto = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_basic_credential = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
#
# NOT here, deliberately: `rusqlite`, and `transport-nostr-peeler`, EVER:
# `check_no_exporter_label_override.sh` roots at `haven-core/src` +
# `haven/rust_builder/src` and would not see a Rule-11 exporter-label downgrade
# written here. Adding it means extending that guard in the same change.

# MDK's SQLCipher 4.17 source (tracked exception T-LIBSQLITE-PATCH), repeated
# from haven-core: only a root's `[patch]` applies.
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "5ae7fdf83085c595fd54f977b3a56ccacabaf16b" }

[profile.soak]
inherits = "release"
# haven-core's `test-utils` + `not(debug_assertions)` is a compile_error!, and
# the `ws://` loopback opt-in the rig needs to dial its own relay is
# `cfg(debug_assertions)` with a release stub that always errs.
debug-assertions = true
# Cheap correctness, and the one thing that turns an epoch-arithmetic underflow
# into a loud failure instead of a wrapped number.
overflow-checks = true
# No `debug = 1`: the symbols inflate a CI cache that shares one LRU budget with
# four other crates' caches, and the timeline — not a backtrace — is the
# diagnostic this rig is built around.

[profile.test]
# Scenario worlds run real MLS under `cargo test`; the dev profile makes that
# roughly an order of magnitude slower for no diagnostic gain.
opt-level = 2

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Not `assert_eq!`: it prints the collection on failure, and a panic names no
# identifier (Security Rule 15).
assert_is_empty = "allow"
