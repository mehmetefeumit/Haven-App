org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Widen Gradle's OWN retry of a rate-limited dependency download.
#
# Hosted CI runners share egress IPs, so Maven Central 429s a runner nobody here
# provoked: CI run 35622556197 job 106414462454 lost a whole lane to
# "Received status code 429 from server: Too Many Requests" on the buildscript
# classpath, with no test run, while twelve sibling lanes built the same commit.
#
# Gradle 8.14 already treats 429 as transient (NetworkingIssueVerifier retries
# 408, 429 and every 5xx; it never retries 401/403), but its defaults are 3 TOTAL
# attempts with a 1000 ms backoff that doubles once — about 3 s of patience,
# which is why those attempts died in 16-44 s. These two properties are the only
# real levers in 8.14, verified present in the shipped distribution:
# `max.tentatives` counts TOTAL attempts (not retries) and `initial.backoff` is
# milliseconds, doubling each time. 5 and 2000 give 2+4+8+16 = 30 s of patience
# per failing repository operation.
#
# Note `org.gradle.internal.repository.max.retries` does NOT exist in Gradle —
# it appears in blog posts, in no release. Gradle also ignores `Retry-After`, so
# this fixed schedule is the whole of the wait.
#
# The real fix is the warm dependency cache CI restores, which makes these
# requests not happen; this is the in-process backstop, and the per-step
# wall-clock bound remains the build step's own `timeout-minutes`.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
