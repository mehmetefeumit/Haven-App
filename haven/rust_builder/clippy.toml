# The oldest compiler every build of this crate must accept: the pinned
# coverage toolchain (`scripts/ci/coverage_toolchain.env`). Without it a newer
# clippy suggests APIs that toolchain does not have.
msrv = "1.97.1"

disallowed-methods = [
    { path = "rand::thread_rng", reason = "use rand::rngs::OsRng directly; thread_rng's StdRng reseed path is not appropriate for jitter that must be unpredictable to relay observers" },
]
